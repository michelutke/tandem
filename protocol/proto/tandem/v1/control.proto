syntax = "proto3";

// E01-12: control.proto — VersionHello (E01-06, capability negotiation), Heartbeat (E01-07,
// liveness), CreditGrant (E01-04, flow-control credit replenishment), and MediaTicketGrant
// (E01-09, media-connection ticket issuance). All four ride the CONTROL channel and are embedded
// directly in envelope.proto's Envelope.payload oneof (E01-10), which reserves field numbers 4-9
// for this file.
package tandem.v1;

import "tandem/v1/channel.proto";

option java_package = "dev.tandem.protocol.v1";
option java_multiple_files = true;

// VersionHello: docs/protocol/SPEC.md #versioning-and-capability-negotiation
// (docs/planning/decisions.md D-63). Each side sends this as the first frame it transmits on
// CONTROL, without waiting for the peer's, then compares once both have been exchanged. A
// `major` difference is always VERSION_MISMATCH regardless of `minor`; a `minor` difference
// alone, with matching `major`, is never a mismatch.
message VersionHello {
  // Protocol major version. Two sides are compatible only if major values are numerically
  // equal. A proto3-default 0 (unset, or deliberately set to 0) MUST be treated as a genuine
  // mismatch against this protocol's major = 1, never as "no version stated".
  uint32 major = 1;
  // Protocol minor version, additive within major. A peer on a higher minor MUST remain
  // compatible with any lower minor of the same major.
  uint32 minor = 2;
  // Bitmask of optional capability flags. No bit is assigned in this version of the protocol:
  // every sender MUST set this to 0, and a receiver MUST NOT act on any bit, though it MAY
  // record or expose the raw value.
  uint64 capabilities = 3;
}

// Heartbeat: docs/protocol/SPEC.md #heartbeat. No fields: an ordinary CONTROL-channel Envelope
// like any other, subject to the usual seq/ack rules and CONTROL's own rate caps rather than
// credit-based flow control. The Mac sends this after 15 s of its own CONTROL idle-send time;
// the phone replies with exactly one Heartbeat within 1 s of receipt, dropping any that arrive
// faster than one per second (docs/planning/decisions.md D-60).
message Heartbeat {}

// CreditGrant: docs/protocol/SPEC.md #channels-and-flow-control-credits
// (docs/planning/decisions.md D-64). The replenishment message for the per-channel credit
// ledger: rides CONTROL itself, since it must never be subject to the credit system it manages.
// A CreditGrant naming CONTROL, CHANNEL_UNSPECIFIED, or any value outside the ten defined
// channels is rejected UNKNOWN_CHANNEL (MALFORMED_FRAME); CONTROL carries no credit ledger to
// grant against.
message CreditGrant {
  Channel channel = 1;
  // Credits restoring the peer's balance for `channel` to exactly that channel's cap, never
  // above it. A grant that would take the balance above the cap is a protocol violation
  // (CREDIT_VIOLATION), not a value to clamp. 0 is well-formed and MUST be treated as a no-op.
  uint32 amount = 2;
}

// MediaTicketGrant: docs/protocol/SPEC.md #media-ticket (docs/planning/decisions.md D-65). Sent
// over CONTROL by the issuing side when a media connection is requested; binds the (separately
// authenticated, full mTLS) media connection to this control session.
message MediaTicketGrant {
  // Exactly 32 bytes (256 bits), generated by a CSPRNG for every issuance. A receiver MUST
  // reject a presented ticket of any other length (MISSING) before comparing it to anything.
  bytes ticket = 1;
  // Milliseconds since the Unix epoch (UTC), 30 s after the moment of issuance, per the
  // issuer's own clock. The requesting side MUST NOT trust this value for its own deadline: it
  // computes its own deadline as the instant it received this message plus 30 s, measured on
  // its own monotonic clock, since this field accounts for neither delivery delay nor clock
  // skew between the two devices.
  int64 expires_at = 2;
}
