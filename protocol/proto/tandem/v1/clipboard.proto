syntax = "proto3";

// E31-01: clipboard.proto — ClipboardText, carried on the CLIPBOARD channel (Channel.CLIPBOARD,
// envelope.proto). The normative CLIPBOARD section of docs/protocol/SPEC.md is written by this
// issue. Field number 40 of envelope.proto's Envelope.payload oneof is used below; 41-49 are held
// for future CLIPBOARD extensions (see envelope.proto's reserved-range comment).
//
// `text` is untrusted peer input carrying clipboard content — potentially secrets, including a
// password-manager-originated clip flagged `sensitive` below: it MUST never be written to a log
// in a release build (invariant 7, docs/planning/decisions.md), regardless of the `sensitive`
// flag's value.
package tandem.v1;

option java_package = "dev.tandem.protocol.v1";
option java_multiple_files = true;

// ClipboardText: PRD F-6.1, F-6.2, F-6.3 — either side sends this when its clipboard/pasteboard
// text changes and qualifies to be forwarded. Sent directly as the Envelope payload (no wrapper
// message needed). Concealed/transient source items and items over the size cap are filtered out
// on the sending side before this message is ever built (E31-03, E31-04, E31-06) — this message
// type carries only content the sender has already decided qualifies.
message ClipboardText {
  // Identifies which side last wrote this clipboard content: "macos" or "android" (E31-04,
  // E31-06). A plain string rather than an enum (unlike NotificationDismiss.Origin/
  // RingStop.Origin) because it is only ever compared for equality by the E31-08/E31-14 loop
  // guard, never branched on by value. Used together with content_hash (below) for echo-loop
  // prevention (docs/protocol/SPEC.md #clipboard-channel).
  string origin_tag = 1;
  // SHA-256 digest (32 bytes) of `text`'s UTF-8 bytes (docs/protocol/SPEC.md #clipboard-channel).
  // Paired with origin_tag by the E31-08/E31-14 loop guard: a side that receives and writes a
  // clip records this pair, so when its own poller re-detects the same content it recognizes its
  // own just-written content and does not send it back.
  bytes content_hash = 2;
  // UTF-8 clipboard text. Hard cap: exactly 1,048,576 bytes (1 MiB;
  // docs/protocol/SPEC.md #timeouts-connection-limits-and-resource-caps "Feature caps" and
  // #clipboard-channel). Oversize text MUST be rejected, never truncated (E31-04, E31-06).
  string text = 3;
  // True when this content originated from a source the sender treats as sensitive (e.g. an
  // Android password manager setting EXTRA_IS_SENSITIVE; PRD F-6.2, F-6.3). A receiver writes a
  // sensitive clip with the org.nspasteboard.ConcealedType and org.nspasteboard.TransientType
  // markers (E31-13) so clipboard managers and this protocol's own poller skip it. `text` is
  // never written to a log in a release build (invariant 7) regardless of this flag's value.
  bool sensitive = 4;
}
