syntax = "proto3";

// E01-10: Envelope, the message every frame on every mTLS connection carries once the TLS
// handshake completes (docs/protocol/SPEC.md #framing-and-envelope, E01-03). Channel, the frozen
// enumeration of the nine F-3.2 channels, lives in channel.proto (E01-12): control.proto's
// CreditGrant also needs Channel, and this file's oneof below embeds control.proto's and
// pairing.proto's message types directly, so Channel could not stay in this file without
// envelope.proto and control.proto importing each other — a cyclic import protoc/buf reject.
package tandem.v1;

import "tandem/v1/calls.proto";
import "tandem/v1/channel.proto";
import "tandem/v1/clipboard.proto";
import "tandem/v1/contacts.proto";
import "tandem/v1/control.proto";
import "tandem/v1/files.proto";
import "tandem/v1/focus.proto";
import "tandem/v1/media.proto";
import "tandem/v1/media_control.proto";
import "tandem/v1/notify.proto";
import "tandem/v1/pairing.proto";
import "tandem/v1/photos.proto";
import "tandem/v1/rotation.proto";
import "tandem/v1/sms.proto";
import "tandem/v1/status.proto";

option java_package = "dev.tandem.protocol.v1";
option java_multiple_files = true;

// Envelope: docs/protocol/SPEC.md #framing-and-envelope. Every frame (length-prefixed per that
// section) on every mTLS connection carries exactly one Envelope.
message Envelope {
  Channel channel = 1;
  // Per-channel, per-direction counter maintained independently by each side. The first frame a
  // side sends on a channel carries seq = 1; seq = 0 is never valid on the wire
  // (#framing-and-envelope "Envelope fields").
  uint64 seq = 2;
  // Highest seq received in contiguous order from the peer on this channel; 0 before anything
  // has arrived on that channel in that direction (#framing-and-envelope "Envelope fields").
  uint64 ack = 3;

  // Payload field numbers are grouped into per-domain ranges below so every later issue that
  // adds a .proto file (mapping in E01-14's protocol/proto/tandem/v1/README.md) has a
  // pre-allocated, stable range and never collides with another domain's payload. None of these
  // ranges may ever hold a debug, echo, loopback or test-only message type
  // (docs/planning/decisions.md AC-11); an unset oneof, or a payload type this receiver's
  // protocol version does not define, is rejected UNKNOWN_PAYLOAD_TYPE (#errors-and-close-codes,
  // MALFORMED_FRAME).
  reserved 9;          // control.proto (E01-12): remaining CONTROL payload slot
  reserved 15 to 19;   // pairing.proto (E01-11): remaining CONTROL payload slots
  // 20-29: status.proto (E01-13). 22 is RingStop (E23-01); 23-29 held for future extensions.
  reserved 23 to 29;   // status.proto (E01-13): future STATUS channel extensions
  // 30-39: notify.proto (E30-01). 30-34 are NotificationPosted/IconData/NotificationAction/
  // NotificationDismiss/NotificationActionResult; 35-39 held for future extensions.
  reserved 35 to 39;   // notify.proto (E30-01): future NOTIFY channel extensions
  // 40-49: clipboard.proto (E31-01). 40 is ClipboardText; 41-49 held for future extensions.
  reserved 41 to 49;   // clipboard.proto (E31-01): future CLIPBOARD channel extensions
  // 50-59: files.proto (E40-01). 50-56 are FileOffer/FileAccept/FileReject/FileChunk/
  // FileComplete/FileCancel/FileResumeRequest; 57-59 held for future extensions.
  reserved 57 to 59;   // files.proto (E40-01): future FILES channel extensions
  // 60-69: photos.proto (E41-01) — FILES channel (no PHOTOS channel, E01-04 decision). 60-65 are
  // PhotoPage/PhotoPageResult/ThumbRequest/ThumbResult/OriginalRequest/PhotoError; 66-69 held for
  // future extensions.
  reserved 66 to 69;   // photos.proto (E41-01): future FILES channel (photos) extensions
  // 70-79: sms.proto (E50-01). 70-74 are SmsSyncRequest/SmsSyncResponse/SendSmsRequest/
  // SendSmsStatus/SimList; 75-79 held for future SMS extensions.
  reserved 75 to 79;   // sms.proto (E50-01): future SMS channel extensions
  // 80-89: contacts.proto (E51-01). 80-81 are ContactsSyncRequest/ContactsSyncResponse; 82-89
  // held for future CONTACTS extensions.
  reserved 82 to 89;   // contacts.proto (E51-01): future CONTACTS channel extensions
  // 90-99: calls.proto (E52-01). 90-93 are CallEvent/CallAction/PlaceCallRequest/
  // CallActionResult; 94-99 held for future CALLS extensions.
  reserved 94 to 99;   // calls.proto (E52-01): future CALLS channel extensions
  reserved 100 to 109; // input.proto (E62-01) — INPUT channel
  reserved 114 to 119; // rotation.proto (E70-01): remaining CONTROL payload slots
  // 120-129: focus.proto (E72-04). 120-121 are FocusState/FocusSyncCapability; 122-129 held for
  // future focus-sync extensions.
  reserved 122 to 129; // focus.proto (E72-04): future CONTROL focus-sync extensions
  // 130-139: media_control.proto (E72-02). 130-135 are NowPlaying/PlayPause/Next/Previous/Stop/
  // CapabilityUnavailable; 136-139 held for future media-control extensions.
  reserved 136 to 139; // media_control.proto (E72-02): future STATUS channel media-control extensions
  // media.proto (E60-01): RequestMediaTicket = 8 (CONTROL). MediaHello and E61-01 media frames ride
  // the separate media connection, which has no channel and therefore no Envelope payload slot
  // (E01-14).

  oneof payload {
    // control.proto (E01-12) — CONTROL channel.
    VersionHello version_hello = 4;
    Heartbeat heartbeat = 5;
    CreditGrant credit_grant = 6;
    MediaTicketGrant media_ticket_grant = 7;
    RequestMediaTicket request_media_ticket = 8;  // media.proto (E60-01)

    // pairing.proto (E01-11) — CONTROL channel, pairing-candidate connections only.
    PairChallenge pair_challenge = 10;
    PairRequest pair_request = 11;
    PairAccepted pair_accepted = 12;
    PairRejected pair_rejected = 13;
    Revoke revoke = 14;

    DeviceStatus device_status = 20;
    Ring ring = 21;
    RingStop ring_stop = 22;

    // notify.proto (E30-01) — NOTIFY channel.
    NotificationPosted notification_posted = 30;
    IconData icon_data = 31;
    NotificationAction notification_action = 32;
    NotificationDismiss notification_dismiss = 33;
    NotificationActionResult notification_action_result = 34;

    // clipboard.proto (E31-01) — CLIPBOARD channel.
    ClipboardText clipboard_text = 40;

    // files.proto (E40-01) — FILES channel.
    FileOffer file_offer = 50;
    FileAccept file_accept = 51;
    FileReject file_reject = 52;
    FileChunk file_chunk = 53;
    FileComplete file_complete = 54;
    FileCancel file_cancel = 55;
    FileResumeRequest file_resume_request = 56;

    // photos.proto (E41-01) — FILES channel (no PHOTOS channel, E01-04 decision).
    PhotoPage photo_page = 60;
    PhotoPageResult photo_page_result = 61;
    ThumbRequest thumb_request = 62;
    ThumbResult thumb_result = 63;
    OriginalRequest original_request = 64;
    PhotoError photo_error = 65;

    // sms.proto (E50-01) — SMS channel.
    SmsSyncRequest sms_sync_request = 70;
    SmsSyncResponse sms_sync_response = 71;
    SendSmsRequest send_sms_request = 72;
    SendSmsStatus send_sms_status = 73;
    SimList sim_list = 74;

    // contacts.proto (E51-01) — CONTACTS channel.
    ContactsSyncRequest contacts_sync_request = 80;
    ContactsSyncResponse contacts_sync_response = 81;

    // calls.proto (E52-01) — CALLS channel.
    CallEvent call_event = 90;
    CallAction call_action = 91;
    PlaceCallRequest place_call_request = 92;
    CallActionResult call_action_result = 93;

    // rotation.proto (E70-01) — CONTROL channel, authenticated control sessions only.
    RotationChallenge rotation_challenge = 110;
    KeyRotation key_rotation = 111;
    RotationAck rotation_ack = 112;
    RotationReject rotation_reject = 113;

    // focus.proto (E72-04) — CONTROL channel, authenticated control sessions only.
    FocusState focus_state = 120;
    FocusSyncCapability focus_sync_capability = 121;

    // media_control.proto (E72-02) — STATUS channel.
    NowPlaying now_playing = 130;
    PlayPause play_pause = 131;
    Next next = 132;
    Previous previous = 133;
    Stop stop = 134;
    CapabilityUnavailable capability_unavailable = 135;
  }
}
