syntax = "proto3";

// E60-01: media.proto — RequestMediaTicket and MediaHello, the ticket-issuance request and the
// required first frame of the media connection (docs/protocol/SPEC.md #media-ticket). The grant is
// control.proto's MediaTicketGrant (E01-12), reused and not redefined here. RequestMediaTicket is
// sent as the Envelope payload (field 8) on CHANNEL_CONTROL; MediaHello is not an Envelope payload:
// the media connection carries no Envelope and has no channel, so MediaHello is the serialized body
// of the first length-prefixed frame on that connection.
//
// `ticket` is a bearer secret binding the media connection to the control session that requested
// it: invariant 6 requires constant-time comparison and single use, invariant 7 forbids logging it.
package tandem.v1;

option java_package = "dev.tandem.protocol.v1";
option java_multiple_files = true;

// RequestMediaTicket: phone -> Mac over CONTROL. Asks the Mac to issue a media ticket for the
// requesting control session; answered with MediaTicketGrant (control.proto). Carries no fields:
// the Mac derives the session and peer identity from the authenticated control connection.
message RequestMediaTicket {}

// MediaHello: phone -> Mac, the first frame on the media connection. A receiver MUST reject a
// MediaHello whose `ticket` is absent or not exactly 32 bytes (TICKET_REJECTED, local reason
// MISSING) before comparing it against anything and before reading any further frame. A
// MediaHello whose `mirror_session_id` is not exactly 16 bytes is malformed (MALFORMED_FRAME).
message MediaHello {
  // Exactly 32 bytes (256 bits) as issued in MediaTicketGrant.ticket.
  bytes ticket = 1;
  // Exactly 16 bytes from a CSPRNG, minted by the phone when the user starts the mirror session
  // (Q19, D-77). The Mac echoes it in every input message of the session.
  bytes mirror_session_id = 2;
}

// E61-15: MirrorRequest and MirrorDeclined, the Mac's request to start a mirror session and the
// phone's refusal (docs/protocol/SPEC.md #mirror-request). Both ride CONTROL as Envelope payloads
// (fields 140-141). Neither carries fields: a MirrorRequest never starts capture, never requests a
// media ticket and never enables remote input (invariant 8).

// MirrorRequest: Mac -> phone over CONTROL. Asks the phone to show its on-phone start prompt.
message MirrorRequest {}

// MirrorDeclined: phone -> Mac over CONTROL. The phone declined or could not honour a MirrorRequest.
message MirrorDeclined {}

// E61-01: media-connection messages (docs/protocol/SPEC.md #media-frame-semantics). After the
// MediaHello first frame (above), every length-prefixed frame body on the media connection is one
// serialized MediaMessage: the connection carries no Envelope and has no channel, so the oneof is
// the only discriminator. A MediaMessage with no payload set is rejected UNKNOWN_PAYLOAD_TYPE
// (closing with MALFORMED_FRAME). MediaFormat, MediaFrame and RotationChanged flow phone -> Mac;
// KeyframeRequest flows Mac -> phone.
message MediaMessage {
  oneof payload {
    MediaFormat media_format = 1;
    MediaFrame media_frame = 2;
    KeyframeRequest keyframe_request = 3;
    RotationChanged rotation_changed = 4;
  }
}

enum MediaCodec {
  MEDIA_CODEC_UNSPECIFIED = 0;
  MEDIA_CODEC_H264 = 1;
  MEDIA_CODEC_HEVC = 2;
}

// MediaFormat: phone -> Mac, sent before the first MediaFrame and again whenever codec, size or
// frame rate changes. `width` and `height` are encoded-frame pixels; `fps` is the target frame rate.
message MediaFormat {
  MediaCodec codec = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 fps = 4;
}

// MediaFrame: phone -> Mac, one fragment of one encoded access unit. `pts` is the presentation time
// in microseconds on the phone's monotonic clock. `flags` is a bit set of MediaFrameFlags values,
// identical on every fragment of an access unit. An access unit larger than 960 KiB is split into
// `fragment_count` (1..8) fragments of at most 960 KiB sharing one `pts`; `fragment_index` is
// 0-based. Fragments of one access unit are contiguous and in index order. Any violation closes the
// media connection MALFORMED_FRAME (local reason FRAGMENT_VIOLATION).
message MediaFrame {
  uint64 pts = 1;
  uint32 flags = 2;
  bytes data = 3;
  uint32 fragment_index = 4;
  uint32 fragment_count = 5;
}

// Bit values for MediaFrame.flags. Not an enum field: flags combine, and proto3 enums are open.
// MEDIA_FRAME_FLAG_KEYFRAME = 0x1 (an IDR/sync access unit), MEDIA_FRAME_FLAG_CODEC_CONFIG = 0x2
// (codec-specific data such as SPS/PPS, not a displayable picture).

// KeyframeRequest: Mac -> phone, asks the encoder for a keyframe (decoder error, new viewer).
message KeyframeRequest {}

enum Orientation {
  ORIENTATION_UNSPECIFIED = 0;
  ORIENTATION_PORTRAIT = 1;
  ORIENTATION_LANDSCAPE = 2;
  ORIENTATION_REVERSE_PORTRAIT = 3;
  ORIENTATION_REVERSE_LANDSCAPE = 4;
}

// RotationChanged: phone -> Mac, the device display rotated; a MediaFormat with the new size
// follows before the next MediaFrame.
message RotationChanged {
  Orientation orientation = 1;
}
