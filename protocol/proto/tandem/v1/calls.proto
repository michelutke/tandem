syntax = "proto3";

// E52-01: calls.proto — CallEvent, CallAction, PlaceCallRequest and CallActionResult, carried on
// the CALLS channel (Channel.CHANNEL_CALLS, channel.proto). The normative Calls section of
// docs/protocol/SPEC.md is written by this issue. Field numbers 90-93 of envelope.proto's
// Envelope.payload oneof are used below; each message is sent directly as the Envelope payload.
//
// `address` and `normalized_e164` below are phone numbers, i.e. message content: invariant 7
// forbids logging them in release builds. The caller name is resolved on the Mac (E51-04) and is
// never sent.
package tandem.v1;

option java_package = "dev.tandem.protocol.v1";
option java_multiple_files = true;

// CallDirection: CallEvent.direction.
enum CallDirection {
  CALL_DIRECTION_UNSPECIFIED = 0;
  CALL_DIRECTION_INCOMING = 1;
  CALL_DIRECTION_OUTGOING = 2;
}

// CallState: CallEvent.state. An incoming call goes RINGING -> ACTIVE -> ENDED, an outgoing call
// DIALING -> ACTIVE -> ENDED; ENDED may follow RINGING or DIALING directly (missed, declined,
// cancelled, failed).
enum CallState {
  CALL_STATE_UNSPECIFIED = 0;
  CALL_STATE_RINGING = 1;
  CALL_STATE_DIALING = 2;
  CALL_STATE_ACTIVE = 3;
  CALL_STATE_ENDED = 4;
}

// CallActionType: CallAction.action. ANSWER and DECLINE apply to a RINGING call, HANGUP to a
// DIALING or ACTIVE call.
enum CallActionType {
  CALL_ACTION_TYPE_UNSPECIFIED = 0;
  CALL_ACTION_TYPE_ANSWER = 1;
  CALL_ACTION_TYPE_DECLINE = 2;
  CALL_ACTION_TYPE_HANGUP = 3;
}

// CallActionErrorCode: CallActionResult.error_code, set only when success = false.
// INVALID_NUMBER and RATE_LIMITED are PlaceCallRequest rejections (docs/protocol/SPEC.md
// #calls-channel "Place call"), made before any call is placed.
enum CallActionErrorCode {
  CALL_ACTION_ERROR_CODE_UNSPECIFIED = 0;
  CALL_ACTION_ERROR_CODE_UNKNOWN_CALL = 1;
  CALL_ACTION_ERROR_CODE_NOT_RINGING = 2;
  CALL_ACTION_ERROR_CODE_NO_ACTIVE_CALL = 3;
  CALL_ACTION_ERROR_CODE_PERMISSION_DENIED = 4;
  CALL_ACTION_ERROR_CODE_INVALID_SUBSCRIPTION = 5;
  CALL_ACTION_ERROR_CODE_NEEDS_PHONE_TAP = 6;
  CALL_ACTION_ERROR_CODE_INVALID_NUMBER = 7;
  CALL_ACTION_ERROR_CODE_RATE_LIMITED = 8;
}

// CallEvent: phone -> Mac, sent on every call state change. `call_id` is generated by the phone
// per RINGING/DIALING-to-ENDED cycle. `address` is the number as the phone saw it;
// `normalized_e164` is its E.164 form (empty when it cannot be normalized). `timestamp_ms` is Unix
// epoch milliseconds.
message CallEvent {
  string call_id = 1;
  CallDirection direction = 2;
  CallState state = 3;
  string address = 4;
  string normalized_e164 = 5;
  uint64 timestamp_ms = 6;
}

// CallAction: Mac -> phone, acts on an existing call. `request_id` is echoed by the matching
// CallActionResult.
message CallAction {
  string request_id = 1;
  string call_id = 2;
  CallActionType action = 3;
}

// PlaceCallRequest: Mac -> phone. `address` rules and the rate limit are in
// docs/protocol/SPEC.md #calls-channel "Place call". `subscription_id` selects a SIM from the
// latest SimList (sms.proto); 0 means the phone's default.
message PlaceCallRequest {
  string request_id = 1;
  string address = 2;
  int32 subscription_id = 3;
}

// CallActionResult: phone -> Mac, the outcome of one CallAction or PlaceCallRequest, matched by
// `request_id`. `call_id` is empty when no call is involved (e.g. UNKNOWN_CALL, INVALID_NUMBER).
message CallActionResult {
  string request_id = 1;
  string call_id = 2;
  bool success = 3;
  CallActionErrorCode error_code = 4;
}
