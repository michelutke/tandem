name: fuzz-libfuzzer

# E15-14: libFuzzer smoke run over TandemProtocol's frame/envelope parser (FrameDecoder). Runs in
# the official Swift Linux container, not macos-latest: Apple's Xcode toolchain does not ship the
# libFuzzer runtime, so only the Swift.org / Linux toolchain can build and run the real
# `-sanitize=fuzzer,address` target (see tools/fuzz/libfuzzer/README.md). `smoke.sh`'s `swift
# test` step still gates every PR even where the real target can't build.
on:
  push:
    branches: [main]
    paths: &paths
      - "macos/Packages/TandemProtocol/**"
      - "tools/fuzz/libfuzzer/**"
      - "protocol/vectors/frame-encoding.json"
      - "protocol/proto/tandem/v1/**"
      - "macos/Packages/FeatureMirror/Sources/FeatureMirror/FragmentReassembler.swift"
      - ".github/workflows/fuzz-libfuzzer.yml"
  pull_request:
    paths: *paths

# Cancel a PR's superseded runs (new push or merge-from-main) so stale runs never hold the scarce
# macOS/emulator runners; main and scheduled runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Install python3 (seed corpus generation)
        run: |
          command -v python3 >/dev/null || (apt-get update && apt-get install -y python3)
      - name: Registry check (E71-13, one libFuzzer entry per proto file)
        run: |
          tools/fuzz/libfuzzer/test/check_registry_test.sh
          tools/fuzz/libfuzzer/check_registry.sh
      - name: Fuzz smoke (seed corpus replay + 300s budgeted run, -max_total_time=300)
        run: tools/fuzz/libfuzzer/smoke.sh
      - name: Upload crash reproducer
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libfuzzer-crash-reproducer
          path: tools/fuzz/libfuzzer/artifacts/
          if-no-files-found: ignore
