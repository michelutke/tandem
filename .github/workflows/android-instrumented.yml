name: android-instrumented

# E00-21: runner for every `instrumented:` tdd entry, via Gradle Managed Devices (GMD) on
# ubuntu-latest with KVM. Required check on PRs touching android/**, plus nightly on main.
#
# Emulator limits (anything outside these is a `manual:` entry tracked by E00-23):
#   - No StrongBox; TEE is emulated (no hardware-backed attestation).
#   - No camera QR scan.
#   - Telephony via `adb emu` only (SMS inject works, real carrier delivery does not).
#   - MediaProjection consent needs UiAutomator.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-instrumented.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-instrumented.yml"]
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  instrumented:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          grep -Ec '(vmx|svm)' /proc/cpuinfo || true
      - name: Install emulator runtime libraries
        # Ubuntu 24.04 GH runner images drop libpulse0/libnss3 by default; the headless
        # emulator process links against them and otherwise exits before it can log why.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libnss3
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup "$ANDROID_HOME/ndk" && df -h /
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" "emulator" "system-images;android-29;google_apis;x86_64" > /dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Diagnose emulator boot
        continue-on-error: true
        run: |
          df -h
          ldd "$ANDROID_HOME/emulator/emulator" | grep "not found" || echo "all emulator shared libs resolved"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n diag29 -k "system-images;android-29;google_apis;x86_64" --force
          timeout 60 "$ANDROID_HOME/emulator/emulator" -avd diag29 -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim > /tmp/emulator-diag.log 2>&1 || true
          echo "----- emulator diagnostic output -----"
          cat /tmp/emulator-diag.log
          echo "----- end emulator diagnostic output -----"
      - name: Run instrumented tests on managed devices
        run: ./gradlew :core:crypto:ciGroupDebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
