name: android-instrumented

# E00-21: runner for every `instrumented:` tdd entry, via Gradle Managed Devices (GMD) on
# ubuntu-latest with KVM. Required check on PRs touching android/**, plus nightly on main.
#
# Emulator limits (anything outside these is a `manual:` entry tracked by E00-23):
#   - No StrongBox; TEE is emulated (no hardware-backed attestation).
#   - No camera QR scan.
#   - Telephony via `adb emu` only (SMS inject works, real carrier delivery does not).
#   - MediaProjection consent needs UiAutomator.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-instrumented.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-instrumented.yml"]
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          grep -Ec '(vmx|svm)' /proc/cpuinfo || true
      - name: Install emulator runtime libraries
        # Ubuntu 24.04 GH runner images drop libpulse0/libnss3 by default; the headless
        # emulator process links against them and otherwise exits before it can log why.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libnss3
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup "$ANDROID_HOME/ndk" && df -h /
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" "emulator" "system-images;android-29;google_apis;x86_64" > /dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      # E00-22: the companion notification-poster app is built and installed on the managed
      # devices before any other instrumented test runs (its own `companionApp_*` kind-coverage
      # tests double as that installation/build step).
      - name: Run companion app instrumented tests on managed devices
        run: ./gradlew :companion-app:ciGroupDebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload companion app test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-app-test-report
          path: |
            tools/companion-app/build/reports/androidTests/managedDevice
            tools/companion-app/build/outputs/androidTest-results
          if-no-files-found: ignore
      - name: Run instrumented tests on managed devices
        run: ./gradlew :core:crypto:ciGroupDebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload core:crypto test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-crypto-test-report
          path: |
            android/core/crypto/build/reports/androidTests/managedDevice
            android/core/crypto/build/outputs/androidTest-results
          if-no-files-found: ignore
      # Separate invocation: running both modules' device groups at once (4 emulators) exhausts
      # the runner's memory and the job is killed.
      - name: Run app instrumented tests on managed devices
        run: ./gradlew :app:ciGroupDebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload app test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-test-report
          path: |
            android/app/build/reports/androidTests/managedDevice
            android/app/build/outputs/androidTest-results
          if-no-files-found: ignore
      # E00-33: every remaining module applying `tandem.android.instrumented`. One invocation,
      # `--no-parallel` (gradle.properties enables parallel) so only one module's two devices boot
      # at a time. `:feature:notifications` bundles and installs the companion APK itself.
      - name: Run feature and discovery instrumented tests on managed devices
        # A hung emulator test otherwise blocks the runner for the 6 h default.
        timeout-minutes: 45
        run: >-
          ./gradlew --no-parallel --continue
          :core:discovery:ciGroupDebugAndroidTest
          :feature:pairing:ciGroupDebugAndroidTest
          :feature:contacts:ciGroupDebugAndroidTest
          :feature:notifications:ciGroupDebugAndroidTest
          :feature:messaging:ciGroupDebugAndroidTest
          :feature:files:ciGroupDebugAndroidTest
          :feature:mirror:ciGroupDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload feature and discovery test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-test-report
          path: |
            android/core/discovery/build/reports/androidTests/managedDevice
            android/core/discovery/build/outputs/androidTest-results
            android/feature/*/build/reports/androidTests/managedDevice
            android/feature/*/build/outputs/androidTest-results
          if-no-files-found: ignore
