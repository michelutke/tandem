name: macos

# E00-11: SwiftPM package tests, app build and lint for the macOS tree.
# E00-26: XCUITest run plus a Release-binary scan for the DEBUG-only scenario hook.
# E15-15: JVM harness client (android/harness/jvm-client, android/core/*) against the real Mac
# server app -- paths widened to cover the Android/JVM side the jvm-harness job also builds.
on:
  push:
    branches: [main]
    paths: ["macos/**", "protocol/**", "android/**", "tools/harness/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", "protocol/**", "android/**", "tools/harness/**", ".github/workflows/macos.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Package tests
        run: macos/test-packages.sh
      - name: App build
        # E00-29: fail if resolving the app's packages would change any Package.resolved.
        run: xcodebuild -project macos/Tandem.xcodeproj -scheme Tandem -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -quiet
      - name: App unit tests
        run: |
          xcodebuild -project macos/Tandem.xcodeproj -scheme TandemAppTests -destination 'platform=macOS' test \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM=
      - name: UI tests
        run: |
          xcodebuild -project macos/Tandem.xcodeproj -scheme TandemUITests -destination 'platform=macOS' test \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM=
      - name: Release build
        run: |
          xcodebuild -project macos/Tandem.xcodeproj -scheme Tandem -configuration Release -destination 'platform=macOS' \
            -derivedDataPath macos/build/release -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            build CODE_SIGNING_ALLOWED=NO -quiet
      - name: Release binary has no UI-test scenario hook
        run: ruby tools/ci/check_release_binary_no_ui_test_scenario.rb macos/build/release/Build/Products/Release/TandemApp.app/Contents/MacOS/TandemApp
      - name: macOS entitlements check (E22-04)
        run: tools/release-audit/check-macos-entitlements.sh
      - name: macOS entitlements check test
        run: bash tools/release-audit/test/macos_entitlements_check_test.sh
      - name: SwiftLint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          tools/lint/swiftlint-check.sh
      - name: Package graph rules
        run: ruby tools/lint/swift-package-rules.rb
      - name: Key material boundary check (E10-14)
        run: tools/lint/test/swiftlint_key_material_only_in_crypto_rule_test.sh
      - name: SwiftPM resolved-only fixture (E00-29)
        run: tools/lint/test/swiftpm_resolved_only_test.sh
      - name: Release log lint
        run: |
          tools/lint/release-log-check.sh
          ruby tools/lint/test/release_log_check_test.rb
      - name: Trust-store invariant (E13-11)
        run: bash tools/lint/test/trust_store_invariant_test.sh
      - name: Literal color lint
        run: |
          tools/lint/literal-color-check.sh
          ruby tools/lint/test/literal_color_check_test.rb
      - name: Release-artifact test-code scan
        run: tools/release-audit/test/macos_release_scan_test.sh

  jvm-harness:
    # E15-15: JVM client (android/harness/jvm-client, E15-21) against the real Mac server app
    # (mac-driver.sh, E15-22) -- no physical device or emulator, no Android SDK components beyond
    # the compileSdk platform the app modules already need to build.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: xcodebuild -version && swift --version
      # E00-29 (Android side): fails if any gradle-wrapper.jar in the repo isn't one of Gradle's
      # known-good binaries -- same check android.yml runs before trusting the wrapper.
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: JVM harness (E15-15)
        # Acceptance #4: no physical device/emulator, and a hard wall-clock budget -- `alarm`+`exec`
        # (not GNU coreutils `timeout`, which macOS runners don't ship) kills the whole harness
        # script, and everything it launched, if it runs past 15 minutes, failing this step rather
        # than hanging or soft-failing.
        run: time perl -e 'alarm shift; exec @ARGV' 900 tools/harness/integration/e15-15.sh
