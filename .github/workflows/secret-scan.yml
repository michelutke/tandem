name: secret-scan

# E00-16: dedicated workflow (E00-11 owns android.yml/macos.yml/protocol.yml/conformance.yml).
# fetch-depth: 0 gives gitleaks the full commit history so a secret added then removed in the
# same PR is still caught, not just the final diff. No secrets required: GITHUB_TOKEN is the
# token GitHub injects automatically, and gitleaks-action needs no license for a personal-account
# repo (see https://github.com/gitleaks/gitleaks-action#do-i-need-a-free-license-key).

on:
  push:
  pull_request:

# Least privilege; gitleaks-action lists the PR's commits via the API on pull_request events.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
