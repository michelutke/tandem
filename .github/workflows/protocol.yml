name: protocol

# E00-11: buf lint on every protocol change; breaking-change check against main on PRs.
# E01-15: proto schema scan (no debug-only names).
# E01-16: test-vector generator + schema checks on every protocol/vectors or tools/vectors change.
on:
  push:
    branches: [main]
    paths: ["protocol/**", "tools/vectors/**", ".github/workflows/protocol.yml"]
  pull_request:
    paths: ["protocol/**", "tools/vectors/**", ".github/workflows/protocol.yml"]

# Cancel a PR's superseded runs (new push or merge-from-main) so stale runs never hold the scarce
# macOS/emulator runners; main and scheduled runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
      - name: buf lint
        run: buf lint protocol
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: buf breaking protocol --against ".git#ref=refs/remotes/origin/main,subdir=protocol"
      - name: proto schema scan
        run: tools/protocol/proto-schema-scan.sh . .

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test-vector tooling
        run: pip install -r tools/vectors/requirements.txt
      - name: pytest
        run: pytest tools/vectors/tests -q
      - name: Schema validation
        run: python tools/vectors/generate.py --validate
      - name: Regeneration check
        run: python tools/vectors/generate.py --check
