[versions]
agp = "9.4.1"
kotlin = "2.4.20"
junit-jupiter = "6.1.3"
turbine = "1.2.1"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.7.3"
protobuf = "4.35.0"
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
detekt = "1.23.8"
# Kotlin version detekt 1.23.8 is built against; its tool classpath is pinned to it.
detekt-kotlin = "2.0.21"
androidx-test-runner = "1.7.0"
junit4 = "4.13.2"
robolectric = "4.17"
compose-bom = "2026.09.00"
androidx-test-espresso = "3.7.0"
androidx-test-ext-junit = "1.3.0"
# KSP 2.3.10 with Kotlin 2.4.20 verified in docs/spikes/trust-store-persistence.md (Finding 6).
ksp = "2.3.10"
# Dagger/Hilt 2.60.1: first Dagger release line with stable AGP 9 support in the Hilt Gradle
# plugin (dagger-2.59 added it, 2.59.1/2.59.2/2.60/2.60.1 fixed AGP-9-specific regressions) and
# stable KSP support (dagger.dev/dev-guide/ksp.html: "stable as of Dagger 2.60+ and KSP 2.3.9+").
hilt = "2.60.1"
androidx-activity = "1.13.0"
androidx-test-core = "1.7.0"
# Jazzer JUnit fuzz target for FrameDecoder/Envelope (E15-13); test-only, never on a release
# classpath. Latest on Maven Central as of the E15-13 spike (docs/dependencies.md).
jazzer = "0.30.0"
# Preferences DataStore for the E13-04 settings store. 1.2.1 matches the version verified in
# docs/spikes/trust-store-persistence.md; datastore-preferences-core is the pure Kotlin/JVM
# artifact (no Android Context dependency), so unit tests run on plain JUnit5, no Robolectric.
androidx-datastore = "1.2.1"

[libraries]
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-jupiter" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
protobuf-javalite = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "protobuf" }
protobuf-kotlin-lite = { group = "com.google.protobuf", name = "protobuf-kotlin-lite", version.ref = "protobuf" }
ktlint-gradlePlugin = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlint-gradle" }
detekt-gradlePlugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
detekt-api = { group = "io.gitlab.arturbosch.detekt", name = "detekt-api", version.ref = "detekt" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
kotlin-composeCompiler-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junit-jupiter" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-test-espresso" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
detekt-test = { group = "io.gitlab.arturbosch.detekt", name = "detekt-test", version.ref = "detekt" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "androidx-activity" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
jazzer-junit = { group = "com.code-intelligence", name = "jazzer-junit", version.ref = "jazzer" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "androidx-datastore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
