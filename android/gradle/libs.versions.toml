[versions]
agp = "9.4.1"
kotlin = "2.4.20"
junit-jupiter = "6.1.3"
turbine = "1.2.1"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.7.3"
protobuf = "4.35.0"
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
detekt = "1.23.8"
# Kotlin version detekt 1.23.8 is built against; its tool classpath is pinned to it.
detekt-kotlin = "2.0.21"
androidx-test-runner = "1.7.0"
junit4 = "4.13.2"
robolectric = "4.17"
compose-bom = "2026.09.00"
androidx-test-espresso = "3.7.0"
androidx-test-ext-junit = "1.3.0"
# KSP 2.3.10 with Kotlin 2.4.20 verified in docs/spikes/trust-store-persistence.md (Finding 6).
ksp = "2.3.10"
# Dagger/Hilt 2.60.1: first Dagger release line with stable AGP 9 support in the Hilt Gradle
# plugin (dagger-2.59 added it, 2.59.1/2.59.2/2.60/2.60.1 fixed AGP-9-specific regressions) and
# stable KSP support (dagger.dev/dev-guide/ksp.html: "stable as of Dagger 2.60+ and KSP 2.3.9+").
hilt = "2.60.1"
androidx-activity = "1.13.0"
androidx-test-core = "1.7.0"
conscrypt = "2.7.0"
# Room + sqlite-bundled: E13-01 spike (docs/spikes/trust-store-persistence.md), current stable as
# of Room's own release notes (developer.android.com/jetpack/androidx/releases/room, 2026-09-09).
room = "2.8.5"
sqlite = "2.7.1"
# Jazzer JUnit fuzz target for FrameDecoder/Envelope (E15-13); test-only, never on a release
# classpath. Latest on Maven Central as of the E15-13 spike (docs/dependencies.md).
jazzer = "0.30.0"
# Preferences DataStore for the E13-04 settings store. 1.2.1 matches the version verified in
# docs/spikes/trust-store-persistence.md; datastore-preferences-core is the pure Kotlin/JVM
# artifact (no Android Context dependency), so unit tests run on plain JUnit5, no Robolectric.
androidx-datastore = "1.2.1"
# CameraX for the E14-10 QR scanner preview + frame analysis. 1.6.2 is the current stable release
# (developer.android.com/jetpack/androidx/releases/camera, 2026-08-26); camera-core/camera-camera2/
# camera-lifecycle/camera-view are released in lockstep at the same version.
androidx-camera = "1.6.2"
# zxing-cpp (E14-23 spike decision, docs/spikes/qr-decoder.md): QR decoder with zero Google/
# Firebase/telemetry transitive dependencies (unlike ML Kit's bundled barcode-scanning artifact).
# 3.1.1 is the latest release on Maven Central as of the spike (2026-07-29).
zxingcpp = "3.1.1"
# Kover for aggregate coverage reporting across modules (E00-06); native Kotlin plugin integrates
# cleanly with JUnit5 / Turbine test infrastructure. 0.9.2 is latest stable on Maven Central.
kover = "0.9.2"
# androidx.core for ContextCompat.registerReceiver (E23-02): the only API that lets a receiver
# declare RECEIVER_NOT_EXPORTED correctly on every minSdk 29+ device in one call. 1.18.0 matches
# the version already resolved transitively elsewhere in this build (feature/pairing's lockfile).
androidx-core = "1.18.0"

[libraries]
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
