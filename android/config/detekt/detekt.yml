# Tandem detekt configuration (E00-05). Builds on detekt's default ruleset
# (buildUponDefaultConfig = true); only deviations from the defaults are listed here.
tandem:
  active: true
  InjectedClockOnly:
    active: true
    # The only places allowed to touch the system clock or pick dispatchers.
    excludes:
      - "**/core/testing/**"
      - "**/di/**"
      - "**/test/**"
      - "**/androidTest/**"
      - "**/dev/tandem/core/transport/time/ElapsedRealtimeSource.kt"
  NoSensitiveReleaseLog:
    active: true
    # tools/lint/sensitive-symbols.txt, resolved relative to the working directory `./gradlew`
    # is invoked from (always `android/`, per CLAUDE.md's command list and CI).
    sensitiveSymbolsFile: "../tools/lint/sensitive-symbols.txt"
    # Not release-visible, so not covered by invariant 7's release-log guarantee.
    excludes:
      - "**/src/debug/**"
      - "**/src/test/**"
      - "**/src/androidTest/**"
      - "**/src/testFixtures/**"
  SocketOnlyInTransport:
    active: true
    # Only core/transport may open raw sockets (PRD module rules; E00-14).
    excludes:
      - "**/core/transport/**"
