# Tandem detekt configuration (E00-05). Builds on detekt's default ruleset
# (buildUponDefaultConfig = true); only deviations from the defaults are listed here.
naming:
  FunctionNaming:
    # @Composable functions are PascalCase by Compose convention (E00-20).
    ignoreAnnotated: ["Composable"]

tandem:
  active: true
  InjectedClockOnly:
    active: true
    # The only places allowed to touch the system clock or pick dispatchers.
    excludes:
      - "**/core/testing/**"
      - "**/di/**"
      - "**/test/**"
      - "**/androidTest/**"
      - "**/dev/tandem/core/transport/time/ElapsedRealtimeSource.kt"
  NoSensitiveReleaseLog:
    active: true
    # tools/lint/sensitive-symbols.txt, resolved relative to the working directory `./gradlew`
    # is invoked from (always `android/`, per CLAUDE.md's command list and CI).
    sensitiveSymbolsFile: "../tools/lint/sensitive-symbols.txt"
    # Not release-visible, so not covered by invariant 7's release-log guarantee.
    excludes:
      - "**/src/debug/**"
      - "**/src/test/**"
      - "**/src/androidTest/**"
      - "**/src/testFixtures/**"
  SocketOnlyInTransport:
    active: true
    # Only core/transport may open raw sockets (PRD module rules; E00-14).
    excludes:
      - "**/core/transport/**"
  PendingIntentImmutable:
    active: true
    # tools/lint/pending-intent-mutable.allowlist: FLAG_MUTABLE exceptions, one per line
    # ("<file>#<function> — <issue> — <reason>"), resolved relative to the working directory
    # `./gradlew` is invoked from (always `android/`).
    mutableAllowlistFile: "../tools/lint/pending-intent-mutable.allowlist"
  ImplicitInternalIntent:
    active: true
  TandemActivityBase:
    active: true
  NoListenerSockets:
    active: true
    # Invariant 4: the Android app opens no listening sockets, anywhere — no module exclusion.
    # The E12-04 JVM test-only TLS server legitimately binds an SSLServerSocket in test sources.
    excludes:
      - "**/src/test/**"
      - "**/src/androidTest/**"
      - "**/src/testFixtures/**"
  DiscoveryTrustBoundary:
    active: true
    # Discovery is a hint only: core/discovery must not touch the trust store or pin verifier (E21-06).
    includes:
      - "**/core/discovery/**"
    excludes:
      - "**/src/test/**"
      - "**/src/androidTest/**"
      - "**/src/testFixtures/**"
  KeyMaterialOnlyInCrypto:
    active: true
    # Only core/crypto may reference AndroidKeyStore or compute HMAC-SHA256 directly (E10-14).
    excludes:
      - "**/core/crypto/**"
