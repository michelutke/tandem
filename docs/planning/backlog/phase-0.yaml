  - id: E01
    title: "Wire protocol: SPEC.md, .proto schema, test vectors"
    labels: [area:protocol]
    prd: [F-2.1, F-3.1, F-3.2, F-3.3, F-3.4, F-3.5]
    use_cases: [UC-03, UC-04, UC-05, AC-01, AC-02, AC-03, AC-04, AC-05, AC-07, AC-08]
    summary: |
      Produce the single normative source of truth for the wire protocol: `docs/protocol/SPEC.md`
      (RFC 2119 language, one issue per section), the phase-0 `.proto` schemas it describes, buf
      lint/breaking enforcement, and the cross-platform test-vector suite that later epics
      (E10-E14) implement against and E15 runs in CI. Nothing here writes Kotlin or Swift codec
      implementations; it defines what those implementations must do and proves it with vectors.
    scope:
      - "SPEC.md sections: handshake/TLS profile (AEAD suites, ALPN tandem/1, CertificateVerify + pin, RFC 9266 channel binding), pairing (length-prefixed channel-bound transcript, confirmation code, mutual confirmation, collapsed PairRejected), framing+envelope, channels+flow control, errors+close codes (incl. PROTOCOL_TIMEOUT, LIMIT_EXCEEDED), versioning/capability negotiation, heartbeat, discovery TXT, media ticket, timeouts/connection limits/resource caps (E01-22), untrusted peer strings (E01-23)."
      - "`protocol/proto/tandem/v1/{envelope,pairing,control,status}.proto` for phase-0 scope."
      - "A written placeholder plan for later-phase proto domains (notify, clipboard, files, photos, sms, contacts, calls, media, input, rotation, status extension) so E01 does not block on features not yet designed."
      - "`buf.yaml` lint configuration and `buf breaking` baseline against `main`."
      - "Test-vector file format, a Python reference generator, and vectors for SPKI fingerprint, pairing proof HMAC and confirmation code, frame encoding (valid and invalid), Bonjour rotating ID, QR payload parsing (valid and malformed), and display-string sanitization (E01-24)."
    out_of_scope:
      - Kotlin/Swift codec implementations that consume these vectors (E11).
      - The conformance runner that executes vectors in CI (E15).
      - Proto messages for any domain beyond envelope/pairing/control/status (deferred per the
        placeholder plan, owned by the epic that implements each feature).
    exit_criteria:
      - "`buf lint` and `buf breaking --against '.git#branch=main'` both pass on `protocol/`."
      - Every SPEC.md section referenced above exists, uses RFC 2119 keywords, and is cross-linked
        from the relevant `.proto` file's comments.
      - "All six vector categories (SPKI fingerprint, pairing proof + confirmation code, frames, rotating ID, QR payload, display strings) exist under protocol/vectors/, are regenerable from the reference generator, and have been reviewed (PR approval recorded)."
      - "The E01-22 section states every timeout, connection cap and feature cap as a MUST with its close code or typed error and implementing issue."
      - "The channel-binding derivation in E01-01 / E01-02 matches the E03-04 outcome (exporter or in-band challenge fallback)."
    issues:
      - id: E01-01
        title: "[docs] SPEC.md section: handshake & TLS profile"
        type: doc
        platforms: [docs]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [AC-01, AC-04, AC-13, AC-15]
        invariants: [1, 2, 5, 6]
        depends_on: [E03-04]
        description: |
          Normative section: TLS 1.3 only, no session resumption, no 0-RTT, client cert required,
          verify-callback semantics (pin against trust store; unknown key fails except inside an
          open pairing window per F-2.1), and the exact failure behavior (fail closed, visible
          error, invariant 5). Cite PRD F-3.1 verbatim behavior list as the normative baseline.
          Review cycle 4 (adversarial review) adds the TLS profile below; each item is a MUST in the section.
          - Cipher suites: TLS 1.3 AEAD suites only (TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384,
            TLS_CHACHA20_POLY1305_SHA256); key-exchange groups as offered by the platform (X25519,
            secp256r1, hybrid PQ groups allowed); certificate signature scheme ecdsa_secp256r1_sha256 only.
          - No PSK resumption (psk_ke / psk_dhe_ke), no early data, no post-handshake client auth. The
            Android client uses a fresh SSLContext per connection and `SSLSockets.setUseSessionTickets(socket,
            false)` so it never offers a PSK (E12-04); the Mac server issues no usable tickets (E12-03).
          - ALPN: the client MUST offer exactly `tandem/1` and the server MUST select it; a missing or other
            ALPN value fails the handshake. No SNI is sent (the phone dials literal IP addresses).
          - Certificates: only the leaf is examined; extra certificates are ignored and never used for trust.
            Validity dates, subject, SAN, EKU and key usage are NOT checked (self-signed identities; trust is
            the SPKI pin). The leaf key MUST be an uncompressed P-256 SubjectPublicKeyInfo (91-byte DER) or the
            handshake fails before the pin compare. The pin check never replaces the TLS stack's
            CertificateVerify validation: presenting a pinned certificate without its private key MUST fail
            (proved on both stacks by E03-01 / E03-03, attacked by E15-10).
          - Channel binding: after the handshake each side derives
            `cb = TLS-Exporter("EXPORTER-Channel-Binding", context = empty, 32)` (RFC 9266, RFC 8446 §7.5) and the
            transport session exposes it (`TandemSession.channelBinding`, E12-11 / E12-12). The pairing proof and
            confirmation code (E01-02) and KeyRotation signatures (E70-01) are bound to it. Platform APIs:
            Network.framework `sec_protocol_metadata_create_secret`, Android `android.net.ssl.SSLSockets.exportKeyingMaterial`
            (API 29), JVM harness Conscrypt `exportKeyingMaterial`; confirmed by E03-01 / E03-03 / E03-04.
          - Handshake / hello deadlines and connection caps live in the E01-22 section (TLS 10 s, VersionHello 5 s).
        acceptance:
          - "Section contains these MUST statements: both sides MUST negotiate TLS 1.3 only and MUST reject a TLS 1.2 or lower ClientHello/ServerHello; the server MUST NOT issue usable session tickets and both sides MUST NOT resume a session or send/accept 0-RTT early data; the Mac server MUST require a client certificate (no cert = handshake failure)."
          - "Section states the verify-callback algorithm as numbered steps: extract the peer leaf certificate, compute SHA-256 over its DER SubjectPublicKeyInfo, compare (constant time) against the trust store; on no match the handshake MUST fail inside the callback before any application data, except that the Mac MAY accept an unknown client key only while a pairing window (E01-02) is open, and then only for the pairing exchange."
          - "Section states the phone MUST pin the Mac SPKI (from the trust store, or from the QR `fp` during pairing) and MUST NOT accept any other server key, even inside a pairing window."
          - "Section states that every handshake failure MUST close the connection with no plaintext or reduced-security retry and MUST surface a visible error mapped to a close code from E01-05 (invariant 5)."
          - "Section states the cycle-4 TLS profile MUSTs: TLS 1.3 AEAD suites only, ecdsa_secp256r1_sha256 certificate signatures only, no PSK resumption / early data / post-handshake auth, ALPN exactly `tandem/1`, no SNI, and a leaf-only check requiring a 91-byte uncompressed P-256 SPKI while validity dates, names and key usage are ignored."
          - "Section states the pin check is in addition to, never instead of, the TLS stack CertificateVerify validation, and that a peer presenting a pinned certificate without the matching private key MUST fail the handshake."
          - "Section defines the channel-binding value `cb` (RFC 9266 exporter label `EXPORTER-Channel-Binding`, empty context, 32 bytes), requires both transport sessions to expose it, and names its consumers (E01-02 pairing proof and confirmation code, E70-01 KeyRotation)."
        tdd: []
        notes: |
          Cycle 4 decision: TLS-exporter channel binding was chosen over an in-band challenge because it binds
          proofs and signatures to the exact TLS session with no extra round trip. Fallback, only if a platform
          spike (E03-01 / E03-03 / E03-04) cannot export keying material: the verifier sends a 32-byte CSPRNG
          challenge in-band (`PairChallenge` from the Mac before PairRequest; `RotationChallenge` from the
          rotation receiver) and E01-02 / E70-01 use it in place of `cb`. Weaker than the exporter (binds to
          the nonce exchange, not the TLS keys) but acceptable because both ends are pinned. Cycle 5: this
          issue depends on E03-04, which records which variant applies.
      - id: E01-02
        title: "[docs] SPEC.md section: pairing"
        type: doc
        platforms: [docs]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03, AC-03, AC-14, AC-17, AC-20]
        invariants: [3, 5, 6]
        depends_on: [E03-04]
        description: |
          Normative section for the QR payload grammar (`tandem://pair?v=1&fp=...&s=...&a=...&p=...&n=...`),
          the pairing window (expiry 120 s, max 3 attempts, single use), the exact proof
          computation (`HMAC-SHA256(secret, "tandem-pair-v1" || macSpki || phoneSpki)`), constant-time
          comparison requirement, and PairAccepted/failure semantics per PRD F-2.1.
          Review cycle 4 decisions (normative in this section):
          - Encoding: length-prefixed transcript with `LP(x) = u16be(len(x)) || x`:
            `transcript = ASCII("tandem-pair-v1") || LP(macSpkiDer) || LP(phoneSpkiDer) || LP(cb)` and
            `proof = HMAC-SHA256(secret, transcript)`. Both SPKIs are 91-byte uncompressed P-256
            SubjectPublicKeyInfo DER: macSpkiDer is the SPKI of the pinned server certificate (its SHA-256
            equals the QR `fp`), phoneSpkiDer comes from the client certificate seen in the handshake, `cb` is
            the E01-01 channel binding of this TLS session (a PairRequest replayed on another session fails).
            This refines the PRD F-2.1 raw-concatenation formula; SPEC is normative.
          - Confirmation code: `code = u32be(first 4 bytes of HMAC-SHA256(secret, ASCII("tandem-pair-code-v1") ||
            LP(macSpkiDer) || LP(phoneSpkiDer) || LP(cb)))) mod 1000000`, zero-padded, shown as `123 456` on the
            Mac dialog and on the phone. Names and models in deviceInfo are attacker-controlled and never the
            basis of the decision.
          - Mutual confirmation: the Mac sends PairAccepted only after the owner clicks Pair (default and Escape
            action: Don't Pair). The phone commits the Mac pin only after PairAccepted AND the owner tapping
            "Codes match" on the phone (evil-QR defence, AC-20); on phone-side cancel or a 120 s timeout the
            phone sends Revoke over the now-trusted session and commits nothing.
          - Frame order on a pairing-candidate connection: both VersionHellos, then exactly one PairRequest from
            the phone within 10 s (E01-22). Any other payload, a second PairRequest or the timeout closes with
            `PAIRING_FAILED` and burns one attempt. After PairAccepted the connection is a normal trusted session.
          - Concurrency: at most one pairing-candidate connection at a time; another unknown client certificate
            while one is in flight is rejected in the verify callback without burning an attempt.
          - `PairRejected.reason` on the wire is collapsed to `REJECTED_BY_OWNER` or `PAIRING_UNAVAILABLE`
            (expired, exhausted, bad proof, malformed, timeout). Detailed reasons stay local (E01-05, category-only
            logs), so no response distinguishes a bad proof from an expired or exhausted window.
          - Secret handling: 16 bytes from the CSPRNG, never logged, persisted or put on a pasteboard, zeroed on
            window close; the QR window is excluded from screen capture where macOS allows it (E14-11).
          - QR grammar hardening: `a` holds 1..8 literal IPv4/IPv6 addresses (no hostnames, no unspecified,
            multicast or broadcast addresses); `n` is at most 64 UTF-8 bytes after percent-decoding and is
            sanitized before display (E01-23).
        acceptance:
          - "Section specifies the QR payload grammar in ABNF: fields `v`, `fp`, `s`, `a`, `p`, `n` in that order, base64url without padding for `fp` (32 bytes) and `s` (16 bytes), `p` a decimal port 1..65535, `a` a non-empty comma-separated address list; a parser MUST reject a payload with any field missing, duplicated, mis-encoded or out of range, and MUST reject `v` other than `1`."
          - "Section states that `phoneSpkiDer` in the proof transcript is taken from the certificate seen in the TLS handshake, never from the PairRequest body."
          - "Section contains these MUST statements: the window MUST expire 120 s after opening; the Mac MUST reject the 4th attempt without evaluating its proof; a successful pairing MUST close the window and destroy the secret (single use); proof comparison MUST be constant time; each failed attempt MUST burn one of the 3 attempts; the Mac MUST NOT send `PairAccepted` before the owner confirms on the Mac."
          - "Section states byte-for-byte the length-prefixed transcript, the proof formula and the confirmation-code formula, including the `LP` width and byte order, the 91-byte P-256 SPKI DER requirement and the `cb` input from E01-01, and states that it supersedes the raw concatenation in PRD F-2.1."
          - "Section contains these MUST statements: at most one pairing-candidate connection at a time; the only application payload accepted on it after the hellos is a single PairRequest within 10 s; PairRejected carries only `REJECTED_BY_OWNER` or `PAIRING_UNAVAILABLE`; the phone commits trust only after PairAccepted and an on-phone code confirmation; the Mac dialog default action is Don't Pair."
          - "Section restricts QR `a` to 1..8 literal IP addresses (no hostnames, unspecified, multicast or broadcast addresses) and `n` to at most 64 UTF-8 bytes, each violation a MUST-reject."
        tdd: []
        notes: |
          Cycle 5: depends on E03-04, the channel-binding outcome issue (`docs/spikes/channel-binding.md`).
          Cycle 4 fallback: if channel binding is infeasible on a platform (E03-01 / E03-03 / E03-04), `cb` is
          replaced by a 32-byte challenge the Mac sends in a `PairChallenge` CONTROL message before PairRequest;
          E01-11, E01-18, E10-12 / E10-13 and E14-06 / E14-07 change accordingly before Phase 1 starts.
      - id: E01-03
        title: "[docs] SPEC.md section: framing + envelope"
        type: doc
        platforms: [docs]
        priority: P0
        size: M
        prd: [F-3.2]
        use_cases: [AC-07]
        invariants: []
        depends_on: []
        description: |
          Normative section for the frame format (`u32 length big-endian | protobuf Envelope`),
          max frame size (1 MiB), and required rejection behavior for oversize, truncated, and
          malformed-length frames. Defines the `Envelope` fields (`channel`, `seq`, `ack`, `oneof`
          payload) at the wire-contract level (message shape lives in E01-10's `.proto`).
        acceptance:
          - "Section states the length prefix is an unsigned 32-bit big-endian count of Envelope bytes that follow (excluding the 4 prefix bytes), max 1 048 576, and that a receiver MUST check the length against the max before allocating any buffer for the payload."
          - "Section contains a MUST-close statement, with the single E01-05 close code `MALFORMED_FRAME` (sub-case = local reason only), for each rejection case: length > 1 MiB (oversize), length 0 (bad length), stream ends before `length` bytes arrive (truncated), payload fails protobuf decode (malformed), unknown `channel` value, unknown `oneof` payload type (AC-11)."
          - "Section defines `seq` as monotonically increasing per channel per direction and `ack` as the highest contiguous `seq` received on that channel (the E11 multiplexer contract), and states the required receiver behavior on a repeated or regressing `seq` as a MUST."
          - "Section states that on the control connection an Envelope is never split across frames (the only fragmentation mechanism in the protocol is the media-connection rule of E61-01) and that a receiver buffers at most one partial frame (<= 1 MiB + 4 bytes) per connection."
        tdd: []
        notes: ""
      - id: E01-04
        title: "[docs] SPEC.md section: channels + flow control credits"
        type: doc
        platforms: [docs]
        priority: P0
        size: M
        prd: [F-3.2]
        use_cases: [UC-08, UC-09, UC-14, UC-15, UC-17, AC-11, AC-19]
        invariants: [2]
        depends_on: []
        description: |
          Normative section enumerating the channel set (`CONTROL, NOTIFY, CLIPBOARD, FILES, SMS,
          CONTACTS, CALLS, INPUT, STATUS`) and the credit-based flow-control algorithm so a large
          file transfer cannot starve notifications: initial credit grant, credit replenishment
          trigger, and behavior when a sender exceeds its credit.
        acceptance:
          - "Section defines the credit unit (frames or bytes), the numeric initial grant per channel, the replenishment message name and the trigger (e.g. receiver consumed >= half the grant), and states a sender MUST NOT send on a channel with zero remaining credit."
          - "Section states as a MUST that a peer sending past its granted credit causes a connection close with the E01-05 `CREDIT_VIOLATION` close code (no silent drop)."
          - "Section states CONTROL is exempt from or has a reserved credit so heartbeats and credit updates cannot be starved (a MUST, with the chosen mechanism)."
          - "Section states the channel set is closed and exactly the nine F-3.2 channels; there is no PHOTOS channel: photo-browser messages (E41-01) ride FILES (decision recorded here and in E41-01)."
          - Section states, as a MUST NOT, that no debug, echo, loopback, or test-only message type or channel exists; debug and release builds speak an identical protocol, and an unknown payload type closes the connection (AC-11).
          - "Section states a numeric upper bound on the credit a receiver may grant per channel (and so on its per-channel receive buffer); a grant that would take the outstanding credit above that bound, or a peer exceeding it, closes the connection with `CREDIT_VIOLATION`."
        tdd: []
        notes: |
          Decision (cycle 2): PHOTOS is not added. PRD F-3.2 enumerates nine channels and the module map
          puts photos in feature/files, so photo listing/thumbnail messages are FILES payloads. Trade-off:
          thumbnails share FILES credits with an in-flight transfer; the sender MUST interleave FILES
          messages per stream (see E41-01) so a 4 GB transfer cannot block thumbnail responses. If that
          proves insufficient, adding a channel is an additive enum change owned by a new SPEC issue.
      - id: E01-05
        title: "[docs] SPEC.md section: errors + close codes"
        type: doc
        platforms: [docs]
        priority: P0
        size: S
        prd: [F-3.2]
        use_cases: [AC-04, AC-07, AC-13]
        invariants: [5]
        depends_on: []
        description: |
          Normative enumeration of protocol-level error/close codes with the required close
          behavior for each (invariant 5: fail closed with a visible error). Canonical names used
          by every issue, vector and test (review cycle 3): `VERSION_MISMATCH`, `PIN_MISMATCH`,
          `MALFORMED_FRAME`, `CREDIT_VIOLATION`, `PAIRING_FAILED`, `TICKET_REJECTED`, `REVOKED`.
          All malformed-frame sub-cases share the ONE wire code `MALFORMED_FRAME`; the sub-case is
          a local diagnostic reason only (`TOO_LARGE`, `BAD_LENGTH`, `TRUNCATED`, `DECODE_FAILED`,
          `UNKNOWN_CHANNEL`, `UNKNOWN_PAYLOAD_TYPE`), never sent on the wire and never a separate
          close code. Pairing sub-cases likewise share `PAIRING_FAILED` (local reasons `EXPIRED`,
          `ATTEMPTS_EXHAUSTED`, `BAD_PROOF`, `REJECTED_BY_OWNER`), and ticket sub-cases share
          `TICKET_REJECTED`.
          Cycle 4: adds `PROTOCOL_TIMEOUT` (TLS / VersionHello / MediaHello deadlines, E01-22; the
          PairRequest 10 s deadline on a pairing-candidate connection closes with `PAIRING_FAILED`
          / `TIMEOUT` instead, burning one pairing attempt like any other failed attempt, per
          E01-02/E14-02) and `LIMIT_EXCEEDED` (a peer exceeds a connection-level cap of E01-22);
          local pairing reasons gain `TIMEOUT` and `MALFORMED`. On the wire, `PairRejected.reason`
          is collapsed per E01-02.
        acceptance:
          - "Section has a table with, per close code, a stable numeric ID, a name and the required user-visible behavior, covering at least: version mismatch, pin mismatch, malformed frame (oversize/truncated/bad length/decode failure/unknown channel/unknown payload type), credit violation, pairing failure (expired, attempts exhausted, bad proof, rejected by owner), media ticket rejected (missing/reused/expired/other session), revoked peer."
          - "Section contains these MUST statements: a close code MUST NOT trigger a plaintext, reduced-security or unauthenticated retry (invariant 2, stated in the section intro); an implementation receiving an unknown close code MUST treat it as fatal and show a generic error; security-relevant closes (pin mismatch, version mismatch, revoked) MUST be shown in UI, not only logged (UC-05)."
