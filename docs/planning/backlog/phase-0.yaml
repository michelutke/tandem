        acceptance:
          - "At least 12 vectors covering: U+202E override, U+2066 isolate, zero-width joiner in a name, newline kept in a body but removed in a name, NFD input normalized to NFC, a C1 control, invalid UTF-8, an emoji ZWJ sequence straddling the cap (truncated on the grapheme boundary), whitespace-run collapse, and exact-cap input left unchanged."
          - "The manifest validates against the vector schema in CI."
        tdd:
          - "unit: displayStringVector_rightToLeftOverride_stripped"
          - "unit: displayStringVector_zeroWidthJoinerInName_removed"
          - "unit: displayStringVector_newlineInName_removedButKeptInBody"
          - "unit: displayStringVector_nfdInput_normalizedToNfc"
          - "unit: displayStringVector_emojiSequenceAtCap_truncatedOnGraphemeBoundary"
          - "unit: displayStringVector_invalidUtf8_replacedWithReplacementChar"
          - "ci: displayStringVectorManifest_committedFile_validatesAgainstSchema"
        notes: |
          Added in review cycle 4. Grapheme segmentation differs across ICU/Swift versions; if a vector diverges, the vector (not either platform) is the tie-breaker and the case is documented.

  - id: E02
    title: "Threat model and ADR-001…006"
    labels: [area:security, area:architecture]
    prd: []
    use_cases: [AC-01, AC-02, AC-03, AC-04, AC-05, AC-06, AC-07, AC-08, AC-09, AC-10]
    summary: |
      Write the STRIDE threat model for every data flow in the architecture diagram, and record
      ADR-001 through ADR-006 with the options and decision criteria from the PRD architecture
      section. ADR-006 (mirroring transport) is explicitly allowed to defer its final decision to
      Phase 6, but Phase 0 must record the options and criteria now.
    scope:
      - One STRIDE pass per data flow in PRD `<architecture>`'s data-flow diagram.
      - ADR-001 (native Swift+Kotlin vs KMP/CMP), ADR-002 (phone-client/Mac-server), ADR-003
        (mTLS vs Noise), ADR-004 (QR-only pairing v1), ADR-005 (two connections vs one
        multiplexed), ADR-006 (MediaProjection+Accessibility vs ADB/scrcpy, decision deferred).
      - "Threat model part 2 (E02-08): Android IPC, Mac local surfaces, storage, logs/crash reports, CI/release secrets and supply chain; one row per cycle-4 decision with its residual risk (E02-01)."
    out_of_scope:
      - Implementing any mitigation identified by the threat model (tracked back to the owning
        epic per finding).
      - The Phase 0 spikes that inform ADR-003/ADR-006 (E03); this epic records decision criteria,
        E03 supplies empirical input.
    exit_criteria:
      - "docs/threat-model.md covers every arrow in the PRD data-flow diagram (E02-01) and every local surface in E02-08 with STRIDE categories and at least one mitigation reference per threat; every cycle-4 decision has a row with its residual risk; AC-01..AC-20 are each referenced at least once."
      - Six ADR files exist under `docs/adr/`, each accepted (or, for ADR-006 only, explicitly
        marked "options recorded, decision deferred to Phase 6") via PR review.
    issues:
      - id: E02-01
        title: "[docs] STRIDE threat model per data flow"
        type: doc
        platforms: [docs]
        priority: P0
        size: L
        prd: []
        use_cases: [AC-01, AC-02, AC-03, AC-04, AC-05, AC-06, AC-07, AC-08, AC-09, AC-10, AC-11, AC-13, AC-14, AC-15, AC-19, AC-20]
        invariants: [1, 2, 3, 4, 5, 6, 7, 8]
        depends_on: []
        description: |
          `docs/threat-model.md`: for every arrow in the PRD `<architecture>` data-flow diagram
          (control mTLS, media mTLS, and each on-device data source feeding the mux), enumerate
          Spoofing/Tampering/Repudiation/Information disclosure/Denial of service/Elevation of
          privilege threats, map each to an existing abuse case (AC-01..AC-20) where one applies,
          and cite the invariant or future epic that mitigates it.
          Cycle 4 scope split: this document covers the network and protocol flows plus the on-device data
          sources feeding the mux; local platform surfaces, storage, logs, CI and supply chain are E02-08.
        acceptance:
          - Every arrow in the architecture diagram has at least one STRIDE row.
          - Every AC-01..AC-20 abuse case is referenced from at least one threat-model row (E02-01 or E02-08).
          - Any threat with no existing mitigation is flagged as an open risk and cross-referenced
            into PRD `<risks>` or a new backlog issue.
          - Every mitigation reference is an invariant number (1-8), a backlog issue ID or a tdd test name that exists in `docs/planning/backlog/*.yaml`.
          - "The data-flow inventory enumerates at least: control mTLS per channel (CONTROL, NOTIFY, CLIPBOARD, FILES incl. photos, SMS, CONTACTS, CALLS, INPUT, STATUS), media mTLS, Bonjour/mDNS discovery (including the residual SRV/A hostname leak noted in E21-02) and any BLE hint E20-13 may add, QR pairing (optical channel, pairing window, confirmation dialog and code), key rotation, and each on-device source feeding the mux (NotificationListener, clipboard, MediaStore/SAF, SMS provider, Contacts, Telecom, MediaProjection, AccessibilityService)."
          - "Rows exist for each cycle-4 decision with its residual risk: TLS-exporter channel binding (pairing proof, code, KeyRotation), CertificateVerify plus pin, ALPN, PairRejected oracle collapse, pre-auth DoS limits and pairing-attempt burning (E01-22, E12-18), untrusted peer strings and homoglyphs (E01-23), media fragment limits (E61-01), input rate/field limits and the indicator overlay (E62-06), rotation is not compromise recovery (stolen old key means unpair and re-pair), grace-pin TTL, evil QR (AC-20), and physical access during the pairing window."
          - "Every abuse case AC-01..AC-20 is referenced from at least one row of E02-01 or E02-08."
        tdd: []
        notes: ""
      - id: E02-02
        title: "[docs] ADR-001: native Swift + native Kotlin vs KMP/CMP"
        type: adr
        platforms: [docs]
        priority: P0
        size: S
        prd: []
        use_cases: []
        invariants: []
        depends_on: []
        description: |
          Options: (a) native Swift + native Kotlin with a shared Protobuf schema, (b) Kotlin
          Multiplatform sharing core/transport/crypto logic, (c) Compose Multiplatform for shared
          UI. Decision criteria: platform API dominance (Keystore/Keychain, Network.framework,
          MediaProjection/MediaCodec, AccessibilityService, VideoToolbox all platform-specific
          regardless), TLS must be platform-native anyway, Swift↔Kotlin/Native interop cost vs.
          the small shared surface (only the wire protocol is truly shared, and that's solved by
          Protobuf, not KMP). PRD records the answer as (a); this ADR documents why with the
          criteria above.
        acceptance:
          - "Deliverable: `docs/adr/ADR-001-native-swift-kotlin.md`, status Accepted, stating all three options, the criteria used and the decision (a) in Context/Decision/Consequences format."
          - Consequences section names what this rules out (no shared KMP `core/*` modules) and that cross-platform agreement is enforced by `protocol/vectors` + E15 conformance instead of shared code.
          - "Revisit trigger recorded with a number: reopen only if hand-duplicated non-generated logic that must stay byte-identical across platforms (outside vectors-covered codecs) exceeds 2 modules, or a conformance mismatch between codecs recurs in 3 consecutive releases."
        tdd: []
        notes: ""
      - id: E02-03
        title: "[docs] ADR-002: phone as TLS client, Mac as sole listening server"
        type: adr
        platforms: [docs]
        priority: P0
        size: S
        prd: []
        use_cases: [AC-04]
        invariants: [4]
        depends_on: []
        description: |
          Options: (a) phone always dials, Mac is the only listener (single port); (b) both sides
          can listen; (c) phone listens, Mac dials. Decision criteria: Android has no reliable
          way to keep a listening socket alive across Doze/OEM battery killers and store-adjacent
          scanners would flag a listening service; a single well-known Mac port is easier to
          firewall, audit (`nmap`), and reason about for invariant 4 (Android opens no listening
          sockets). PRD records (a).
        acceptance:
          - "Deliverable: `docs/adr/ADR-002-phone-client-mac-server.md`, status Accepted, stating the option set, criteria and decision (a); explicitly ties the decision to invariant 4 and to Appendix C open question 3 (Mac-initiated reconnect must not require a phone listener)."
          - "Go/no-go numbers the decision relies on: phone-dialled reconnect < 5 s p95 after network change or Mac wake (UC-04) and `nmap -p-` against the phone shows 0 open TCP ports (E15-12); the ADR states it is revisited if the E20-12 overnight Doze gate fails those numbers."
        tdd: []
        notes: ""
      - id: E02-04
        title: "[docs] ADR-003: mTLS 1.3 self-signed + SPKI pinning vs. Noise protocol"
        type: adr
        platforms: [docs]
        priority: P0
        size: M
        prd: []
        use_cases: [AC-01, AC-02]
        invariants: [1, 2, 3, 6]
        depends_on: [E03-01, E03-03, E03-04]
        description: |
          Options: (a) mTLS 1.3 with self-signed certs and SPKI pinning on both native TLS stacks;
          (b) a Noise protocol handshake (e.g. Noise_XX) over raw TCP. Decision criteria:
          first-class platform support and audited implementations on both sides (Network.framework
          + Secure Enclave, Android SSLSocket/Conscrypt + Keystore) vs. hand-rolled or third-party
          Noise library maintenance burden; certificate transport already carries the SPKI in a
          format both platform TLS stacks understand natively. Note that the Phase 0 spikes (E03)
          on Network.framework client-cert behavior are the primary empirical input to this
          decision; if a spike fails outright, this ADR must be revisited before Phase 1 exit.
        acceptance:
          - "Deliverable: `docs/adr/ADR-003-mtls-vs-noise.md`, stating both options, the platform-support criterion and the decision; status Accepted only after E03-01, E03-03 and E03-04 findings docs exist."
          - "Go criterion: E03-01 passes all its checks, E03-03 reports client-cert auth success on every device in `docs/testing/device-matrix.md`, and E03-04 completes 20/20 mutual-pin handshakes. Any failure is a no-go that triggers E03-05 and holds the ADR at Proposed."
          - Revisit condition references the trigger list in `docs/spikes/tls-stack-decision-criteria.md` (E03-06).
        tdd: []
        notes: ""
      - id: E02-05
        title: "[docs] ADR-004: QR-only pairing for v1; manual pairing only with a commitment-based SAS"
        type: adr
        platforms: [docs]
        priority: P0
        size: S
        prd: []
        use_cases: [UC-03, AC-03]
        invariants: [3, 6]
        depends_on: []
        description: |
          Options: (a) QR-only pairing in v1, manual/no-camera pairing deferred to v2+ and only
          ever implemented with a hash-commitment SAS (≥6 digits, never a fingerprint-prefix
          check); (b) support a fingerprint-prefix manual fallback in v1 for camera-less setups.
          Decision criteria: the reference app's 32-bit fingerprint-prefix check is a known
          brute-forceable weakness (PRD Appendix A); a commitment scheme is the only manual
          alternative that doesn't reintroduce that class of bug, and it is not needed for the v1
          target user (single owner, has a phone camera).
        acceptance:
          - "Deliverable: `docs/adr/ADR-004-qr-only-pairing.md`, status Accepted, stating both options and explicitly ruling out any fingerprint-prefix manual pairing design, citing the LinkMyMac 32-bit prefix finding as the negative example."
          - "States the numeric floor for any future manual pairing: hash-commitment SAS of >= 6 decimal digits (online guess probability <= 3 in 10^6 with the 3-attempt window), never a fingerprint prefix."
        tdd: []
        notes: ""
      - id: E02-06
        title: "[docs] ADR-005: two connections (control + media) vs. one multiplexed connection"
        type: adr
        platforms: [docs]
        priority: P0
        size: M
        prd: []
        use_cases: [UC-22]
        invariants: [1]
        depends_on: []
        description: |
          Options: (a) separate control and media mTLS connections, media bound to control via a
          single-use ticket (PRD F-3.3); (b) one multiplexed connection for everything, relying
          solely on channel-level flow control (F-3.2) to prevent media from starving control
          traffic. Decision criteria: head-of-line blocking risk on a single TCP/TLS connection
          when a large H.264 frame is in flight versus the added complexity of a second listener
          and ticket-issuance protocol. PRD records (a).
        acceptance:
          - "Deliverable: `docs/adr/ADR-005-two-connections.md`, status Accepted, stating both options, the head-of-line-blocking criterion and the decision (a); references F-3.2 flow control as the reason (a) is still needed even with credits."
          - "Records the numbers that would justify revisiting in Phase 6: if a single multiplexed connection kept control-message p95 latency < 100 ms while streaming 1080p30 on 5 GHz Wi-Fi, and mirroring still met < 120 ms end-to-end, option (b) is reconsidered."
        tdd: []
        notes: ""
      - id: E02-07
        title: "[docs] ADR-006: MediaProjection+Accessibility vs. ADB + scrcpy (decision in Phase 6)"
        type: adr
        platforms: [docs]
        priority: P0
        size: S
        prd: []
        use_cases: [UC-22, UC-23, AC-06]
        invariants: [8]
        depends_on: []
        description: |
          Options: (a) `MediaProjection`/`MediaCodec` capture with `AccessibilityService` remote
          input, no developer mode required, matches invariant 8's user-started-session model
          directly; (b) ADB wireless debugging + bundled scrcpy-server (Apache 2.0) for better
          input injection fidelity, at the cost of requiring developer mode and a different
          input-authorization model that must be independently checked against invariant 8.
          Phase 0 records both options and the criteria (input injection quality, developer-mode
          requirement, invariant-8 compatibility, licensing); the final decision is explicitly
          deferred to Phase 6 (see PRD Phase 6 tasks) once mirroring performance is measurable.
        acceptance:
          - "Deliverable: `docs/adr/ADR-006-mirroring-transport.md` recording both options and criteria without forcing a decision; status field reads \"deferred to Phase 6\" rather than \"accepted\" or \"rejected\"."
          - "Criteria have numeric thresholds for the Phase 6 decision: 1080p >= 30 fps and < 120 ms end-to-end latency on 5 GHz Wi-Fi (PRD targets), input-injection success rate on the device matrix, developer mode required yes/no, licence compatible yes/no."
          - ADR explicitly notes that whichever option is chosen must satisfy invariant 8
            independently (a scrcpy-based path does not inherit the accessibility session
            indicator for free).
        tdd: []
        notes: ""

      - id: E02-08
        title: "[docs] Threat model part 2: local platform surfaces, storage, logs, CI and supply chain"
        type: doc
        platforms: [docs]
        priority: P0
        size: M
        prd: []
        use_cases: [AC-09, AC-10, AC-11, AC-12, AC-16, AC-17, AC-18]
        invariants: [2, 3, 4, 7, 8]
        depends_on: [E02-01]
        description: |
          Added in review cycle 4. Second chapter of `docs/threat-model.md` (same STRIDE format and mitigation
          rules as E02-01) for the surfaces outside the wire protocol:
          - Android IPC: launcher, share target (text and files), PROCESS_TEXT, QS tile + capture activity,
            BOOT_COMPLETED receiver, NotificationListenerService, AccessibilityService, FileProvider; intent and
            URI validation (confused deputy via Tandem-own content URIs), PendingIntents Tandem creates and the
            third-party ones it fires (E30-09), tapjacking, backup/device-transfer extraction (E00-28).
          - Mac local: other users and processes reaching the listener (including loopback), QR capture during
            the pairing window, share extension + App Group queue + Darwin wake (E40-22), Finder Services,
            NSPasteboard writes (Concealed/Transient markers), UNUserNotificationCenter and the lock screen.
          - Storage: Keychain identity and trust items (data-protection keychain, own access group), GRDB
            SMS/contacts databases, thumbnail and icon caches, Downloads/Tandem, App Group container, Android
            trust store and transfer temp files; unpair purge (E14-12 / E14-13); lost/stolen phone (AC-09) and
            Mac (AC-12), including the residual that Mac at-rest data relies on FileVault.
          - Logs and crash reports: release logging rules (E00-17 / E00-27), runtime canaries (E15-17), and the
            decision that v1 ships no third-party crash or analytics SDK (OS-local crash reports only).
          - CI and release: signing keystore / Developer ID / CI keychain secrets (E71-11), secret scanning
            (E00-16), test-only code in release artifacts (E00-30), dependency supply chain and telemetry
            (E00-29, E14-23 QR decoder decision, E71-14 egress audit).
        acceptance:
          - "Every surface listed in the description has at least one STRIDE row with a mitigation reference (invariant number, backlog issue ID or existing tdd test name)."
          - "Residual risks are listed explicitly: mDNS hostname, Mac at-rest data protected only by FileVault/login, remote input can drive any phone UI during a session (FLAG_SECURE apps mirror black but still receive input), and macOS screen-capture exclusion of the QR window is best-effort."
          - "Abuse cases AC-09, AC-10, AC-11, AC-12, AC-16, AC-17 and AC-18 are each referenced from at least one row."
        tdd: []
        notes: |
          Added in review cycle 4 so E02-01 stays size L; both chapters must be accepted before Phase 0 exit.

  - id: E03
    title: "Phase 0 technical spikes (mTLS on both platforms, Secure Enclave)"
    labels: [area:spike, area:security]
    prd: [F-3.1, F-1.1]
    use_cases: [AC-01, AC-04]
    summary: |
      Time-boxed spikes to de-risk the two hardest platform-specific unknowns before Phase 1
      committed work starts: whether Network.framework's mTLS client-cert + verify-block model
      behaves as documented, whether a Secure-Enclave-backed key can serve as the Mac's TLS
      identity, and the Android-side equivalent with AndroidKeyStore across the StrongBox/TEE
      device matrix. Each spike ends in a written findings doc under `docs/spikes/`, never
      production code.
    scope:
      - Network.framework NWListener mTLS spike (client cert required, verify block, TLS 1.3-only,
        no resumption).
      - Secure Enclave key as `sec_identity` spike (PRD Appendix C.1).
      - Android SSLSocket client-auth spike via AndroidKeyStore P-256 custom X509KeyManager +
        pinning TrustManager, StrongBox vs. TEE device matrix.
      - End-to-end handshake Android↔Mac hello-world spike tying the two platform spikes together.
      - swift-nio-ssl fallback evaluation, only if the Network.framework spike fails its
        acceptance bar.
      - "Cycle-4 TLS profile checks on both stacks: RFC 9266 exporter (EXPORTER-Channel-Binding, 32 bytes) byte-equal to openssl and across stacks, CertificateVerify enforced for a pinned cert without its key, ALPN tandem/1, Android fresh SSLContext with no PSK offer, Mac pre-TLS cancel and 10 s handshake deadline (input to E12-18)."
    out_of_scope:
      - Production `core/transport` / `TandemTransport` implementations (E12).
      - Any UI.
    exit_criteria:
      - Each spike has a findings doc under `docs/spikes/` with a clear go/no-go recommendation.
      - The fallback decision criteria doc (E03-06) exists regardless of whether the fallback spike
        (E03-05) ran, so Phase 1 has an unambiguous trigger for revisiting ADR-003 if
        `core/transport`/`TandemTransport` hits the same wall in production code.
      - "docs/spikes/channel-binding.md (E03-04) records the channel-binding outcome: exporter on both stacks, or the in-band challenge fallback, which E01-01/E01-02/E01-11/E14-06/E14-07/E70-01 adopt before Phase 1 starts."
    issues:
      - id: E03-01
        title: "[macos] Spike: NWListener mTLS with client cert, verify block, TLS 1.3 only"
        type: spike
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [AC-01, AC-04, AC-13, AC-15]
        invariants: [1, 2, 5]
        depends_on: []
        description: |
          Build a throwaway `NWListener` with `NWProtocolTLS.Options` configured for TLS 1.3 only,
          client certificate required, and `sec_protocol_options_set_verify_block` performing an
          SPKI pin check against a hardcoded test fingerprint. Confirm: an unpinned client cert is
          rejected inside the verify block (not after), TLS 1.2 ClientHello is rejected at the
          protocol-options level, and no session ticket/resumption artifact is produced.
        acceptance:
          - Findings doc `docs/spikes/nwlistener-mtls.md` records pass/fail for each of TLS 1.2
            rejection, unpinned client cert rejection, no-resumption confirmation, plus any
            surprising API behavior (timing of verify-block invocation relative to full handshake
            completion).
          - "Go criteria (all required, each over 10 runs): `openssl s_client -tls1_2` fails 10/10; a client presenting an unpinned cert is rejected inside the verify block 10/10 with 0 application bytes delivered to the listener; `openssl s_client -sess_out`/`-sess_in` reconnect shows `Reused` 0/10 (full handshake every time); a client with no cert is rejected 10/10; the verify block runs before the connection reaches `.ready` in 10/10."
          - Explicit go/no-go recommendation for ADR-003 (E02-04); any failed criterion is a no-go that triggers E03-05.
          - "Findings record, over 10 runs each: (a) `sec_protocol_metadata_create_secret` with label `EXPORTER-Channel-Binding`, empty context and length 32 returns the same bytes as `openssl s_client -keymatexport EXPORTER-Channel-Binding -keymatexportlen 32`; (b) a client presenting the pinned certificate but signing CertificateVerify with a different key fails 10/10; (c) ALPN `tandem/1` is negotiated and a client offering no ALPN fails; (d) whether the listener can read the remote endpoint and cancel a connection before the TLS handshake and enforce a 10 s handshake deadline (inputs to E12-18)."
          - "If (a) fails, the findings say so explicitly and E01-01 / E01-02 / E70-01 switch to the in-band challenge fallback before Phase 1 starts."
        tdd: []
        notes: ""
      - id: E03-02
        title: "[macos] Spike: Secure Enclave key as sec_identity for the Mac TLS listener"
        type: spike
        platforms: [macos]
        priority: P0
        size: S
        prd: [F-1.1]
        use_cases: [AC-01]
        invariants: [1, 3]
        depends_on: []
        description: |
          Per PRD Appendix C.1 open question: attempt to back the Mac's long-term P-256 TLS
          identity with a Secure-Enclave-generated key exposed as a `sec_identity`, and use it in
          `NWProtocolTLS.Options` local identity. Confirm whether Network.framework accepts a
          Secure-Enclave `sec_identity` at all, and if so whether handshake latency is acceptable.
        acceptance:
          - Findings doc `docs/spikes/secure-enclave-identity.md` records whether a Secure Enclave
            key worked as a `sec_identity`, any API limitations found (e.g. certificate export
            restrictions), and a recommendation of Secure Enclave vs. Keychain-only key (the PRD
            default) for v1.
          - "Go criteria for Secure Enclave: 20/20 mTLS handshakes complete with the SE-backed identity against an `openssl s_client` peer, and SE handshake p95 is <= 50 ms slower than the Keychain-only key over the same 20 runs. Otherwise no-go: v1 keeps the Keychain-only key (PRD default)."
        tdd: []
        notes: ""
      - id: E03-03
        title: "[android] Spike: SSLSocket client auth with AndroidKeyStore P-256 (StrongBox/TEE)"
        type: spike
        platforms: [android]
        priority: P0
        size: M
        prd: [F-1.1, F-3.1]
        use_cases: [AC-01, AC-04, AC-15]
        invariants: [1, 4]
        depends_on: [E00-23]
        description: |
          Build a throwaway Android client using platform `SSLSocket` (Conscrypt) with a custom
          `X509KeyManager` backed by an AndroidKeyStore P-256 key (StrongBox if available, else
          TEE, never exportable) and a custom `X509TrustManager` doing an SPKI pin check. Run
          on the physical devices listed in `docs/testing/device-matrix.md` (E00-23; at minimum
          one StrongBox-capable device, one TEE-only device, one API 29 device) to confirm
          client-cert presentation actually works end-to-end on real hardware, not just an
          emulator. Peer for the spike is `openssl s_server -Verify 1 -tls1_3` (E03-04 covers the
          real Mac listener).
        acceptance:
          - Findings doc `docs/spikes/android-sslsocket-keystore.md` records, per device (identified by its `device-matrix.md` row), StrongBox
            vs. TEE availability (`KeyInfo.getSecurityLevel()`), whether client-cert auth succeeded, and any OEM-specific quirks.
          - "Go criteria per device: 10/10 TLS 1.3 handshakes with client-cert auth succeed; `KeyInfo` reports the key inside secure hardware and non-exportable; a server cert with a different SPKI is rejected by the pinning TrustManager 10/10; handshake p95 <= 1000 ms on StrongBox and <= 300 ms on TEE devices. A device failing any criterion is recorded as a no-go with the failure mode."
          - Explicit overall go/no-go recommendation feeding ADR-003 (E02-04) and the risk in PRD `<risks>` ("Keystore-backed keys with SSLSocket client auth behave differently across OEMs"); go requires every matrix device to pass.
          - The spike results column for each tested device is filled in `docs/testing/device-matrix.md`.
          - "Findings record per device, 10 runs each: `android.net.ssl.SSLSockets.exportKeyingMaterial(socket, \"EXPORTER-Channel-Binding\", empty context, 32)` equals the `openssl s_server -keymatexport` output; `SSLSockets.setUseSessionTickets(socket, false)` with a fresh SSLContext produces a second ClientHello without a pre_shared_key extension; ALPN `tandem/1` via `SSLParameters.setApplicationProtocols` is negotiated; a server presenting the pinned certificate without its private key fails."
        tdd: []
        notes: ""
      - id: E03-04
        title: "[cross] Spike: end-to-end handshake Android↔Mac hello-world"
        type: spike
        platforms: [android, macos]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [UC-03, UC-04]
        invariants: [1, 2, 3, 4, 5]
        depends_on: [E03-01, E03-03]
        description: |
          Wire the two platform spikes together: the Android throwaway client from E03-03 dials
          the macOS throwaway listener from E03-01 over a real Wi-Fi network, completes a full mTLS
          1.3 handshake with mutual pin verification, and exchanges a single hello-world byte
          payload. This is the first empirical proof the two native TLS stacks actually
          interoperate under the exact constraints both SPEC.md (E01-01) and ADR-003 assume.
        acceptance:
          - Findings doc `docs/spikes/e2e-handshake-hello-world.md` records a successful handshake
            capture (or the specific interop failure found, with enough detail to file a follow-up
            issue) plus measured handshake latency on the same Wi-Fi network.
          - "Go criteria: 20/20 handshakes from a StrongBox device and 20/20 from a TEE device complete with mutual pin verification and a round-tripped hello payload; handshake p95 <= 1000 ms (StrongBox) / <= 300 ms (TEE) on the same 5 GHz AP; the pcap shows only TLS 1.3 records after ClientHello and the hello payload never in cleartext; swapping either side's key makes 20/20 handshakes fail with 0 application bytes exchanged."
          - Explicit go/no-go recommendation for ADR-003 (E02-04).
          - "Both sides derive byte-identical channel-binding values in 20/20 handshakes (the findings doc records the SHA-256 of each value, never the value itself)."
          - "Channel-binding outcome recorded in `docs/spikes/channel-binding.md` as exactly one of: `exporter` (RFC 9266 on both platforms, E03-01 (a) and E03-03 pass and the values match here) or `fallback` (in-band challenge per E01-01 notes), naming the failing platform check. E01-01, E01-02, E01-11, E14-06, E14-07 and E70-01 depend on this issue."
        tdd: []
        notes: |
          Cycle 5: this is the single outcome issue for session binding. The Phase 1 pairing and rotation
          issues consume its decision, so the fallback switch (if any) happens before Phase 1 starts.
