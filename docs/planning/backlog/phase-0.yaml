phase: 0
epics:
  - id: E00
    title: Monorepo scaffolding and CI
    labels: [area:scaffolding, area:ci]
    prd: []
    use_cases: []
    summary: |
      Stand up the monorepo exactly as PRD `<structural-decomposition>` lays it out, with a
      working Gradle build, a working Xcode/SwiftPM build, generated-code hygiene, CI on both
      platforms with path filters, and the repo-level guardrails (CLAUDE.md, module dependency
      rules, secret scanning, release-log lint) that every later epic relies on. Nothing here
      implements a PRD feature; it makes every later issue buildable, testable, and reviewable.
    scope:
      - Directory layout matching the PRD tree (`android/`, `macos/`, `protocol/`, `tools/`, `docs/`).
      - Gradle convention plugins, version catalog, Hilt, JUnit5, Turbine, ktlint, detekt, Kover/Jacoco.
      - Xcode project + local SwiftPM packages, Swift 6 strict concurrency, Swift Testing, SwiftLint.
      - buf codegen wiring for protobuf-kotlin-lite and swift-protobuf, with a CI check that
        generated code is never hand-edited.
      - GitHub Actions workflows with path filters (android/ubuntu, macos/macos-runner, protocol, conformance).
      - CLAUDE.md per PRD Appendix D, PR template, CODEOWNERS-lite, issue templates.
      - Module dependency rule enforcement (features never depend on each other; only
        core/transport touches sockets) on both platforms.
      - Secret scanning; release-log lint rule (no content logging in release builds).
    out_of_scope:
      - The actual `.proto` schemas and buf lint/breaking rules (E01).
      - Any feature module implementation (Layer 4+ epics).
      - Threat model and ADR content (E02).
    exit_criteria:
      - Fresh checkout builds on ubuntu-latest (`./gradlew help`) and on a macos runner (`xcodebuild -list`).
      - CI runs android, macos, protocol, and conformance jobs, each triggered only by its path filter.
      - Editing a generated `*.pb.kt` or `*.pb.swift` file by hand fails CI.
      - A feature module depending on another feature module fails the build.
      - A non-transport module opening a raw socket fails the build.
      - "`CLAUDE.md` exists at repo root and contains the eight security invariants verbatim."
    issues:
      - id: E00-01
        title: "[docs] Create monorepo directory skeleton per PRD structural decomposition"
