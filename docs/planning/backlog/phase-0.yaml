  - id: E01
    title: "Wire protocol: SPEC.md, .proto schema, test vectors"
    labels: [area:protocol]
    prd: [F-2.1, F-3.1, F-3.2, F-3.3, F-3.4, F-3.5]
    use_cases: [UC-03, UC-04, UC-05, AC-01, AC-02, AC-03, AC-04, AC-05, AC-07, AC-08]
    summary: |
      Produce the single normative source of truth for the wire protocol: `docs/protocol/SPEC.md`
      (RFC 2119 language, one issue per section), the phase-0 `.proto` schemas it describes, buf
      lint/breaking enforcement, and the cross-platform test-vector suite that later epics
      (E10-E14) implement against and E15 runs in CI. Nothing here writes Kotlin or Swift codec
      implementations; it defines what those implementations must do and proves it with vectors.
    scope:
      - SPEC.md sections (handshake/TLS profile, pairing, framing+envelope, channels+flow control,
        errors+close codes, versioning/capability negotiation, heartbeat, discovery TXT, media ticket).
      - "`protocol/proto/tandem/v1/{envelope,pairing,control,status}.proto` for phase-0 scope."
      - A written placeholder plan for later-phase proto domains (notify, clipboard, files, sms,
        contacts, calls, input) so E01 does not block on features not yet designed.
      - "`buf.yaml` lint configuration and `buf breaking` baseline against `main`."
      - Test-vector file format, a Python reference generator, and vectors for SPKI fingerprint,
        pairing proof HMAC, frame encoding (valid and invalid), Bonjour rotating ID, and QR payload
        parsing (valid and malformed).
    out_of_scope:
      - Kotlin/Swift codec implementations that consume these vectors (E11).
      - The conformance runner that executes vectors in CI (E15).
      - Proto messages for any domain beyond envelope/pairing/control/status (deferred per the
        placeholder plan, owned by the epic that implements each feature).
    exit_criteria:
      - "`buf lint` and `buf breaking --against '.git#branch=main'` both pass on `protocol/`."
      - Every SPEC.md section referenced above exists, uses RFC 2119 keywords, and is cross-linked
        from the relevant `.proto` file's comments.
      - All five vector categories exist under `protocol/vectors/`, are regenerable from the
        reference generator, and have been reviewed (PR approval recorded).
    issues:
      - id: E01-01
        title: "[docs] SPEC.md section: handshake & TLS profile"
        type: doc
        platforms: [docs]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [AC-01, AC-04]
        invariants: [1, 2, 5, 6]
        depends_on: []
        description: |
          Normative section: TLS 1.3 only, no session resumption, no 0-RTT, client cert required,
          verify-callback semantics (pin against trust store; unknown key fails except inside an
          open pairing window per F-2.1), and the exact failure behavior (fail closed, visible
          error, invariant 5). Cite PRD F-3.1 verbatim behavior list as the normative baseline.
        acceptance:
          - "Section contains these MUST statements: both sides MUST negotiate TLS 1.3 only and MUST reject a TLS 1.2 or lower ClientHello/ServerHello; the server MUST NOT issue usable session tickets and both sides MUST NOT resume a session or send/accept 0-RTT early data; the Mac server MUST require a client certificate (no cert = handshake failure)."
          - "Section states the verify-callback algorithm as numbered steps: extract the peer leaf certificate, compute SHA-256 over its DER SubjectPublicKeyInfo, compare (constant time) against the trust store; on no match the handshake MUST fail inside the callback before any application data, except that the Mac MAY accept an unknown client key only while a pairing window (E01-02) is open, and then only for the pairing exchange."
          - "Section states the phone MUST pin the Mac SPKI (from the trust store, or from the QR `fp` during pairing) and MUST NOT accept any other server key, even inside a pairing window."
          - "Section states that every handshake failure MUST close the connection with no plaintext or reduced-security retry and MUST surface a visible error mapped to a close code from E01-05 (invariant 5)."
        tdd: []
        notes: ""
      - id: E01-02
        title: "[docs] SPEC.md section: pairing"
        type: doc
        platforms: [docs]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03, AC-03]
        invariants: [3, 5, 6]
        depends_on: []
        description: |
          Normative section for the QR payload grammar (`tandem://pair?v=1&fp=...&s=...&a=...&p=...&n=...`),
          the pairing window (expiry 120 s, max 3 attempts, single use), the exact proof
          computation (`HMAC-SHA256(secret, "tandem-pair-v1" || macSpki || phoneSpki)`), constant-time
          comparison requirement, and PairAccepted/failure semantics per PRD F-2.1.
        acceptance:
          - "Section specifies the QR payload grammar in ABNF: fields `v`, `fp`, `s`, `a`, `p`, `n` in that order, base64url without padding for `fp` (32 bytes) and `s` (16 bytes), `p` a decimal port 1..65535, `a` a non-empty comma-separated address list; a parser MUST reject a payload with any field missing, duplicated, mis-encoded or out of range, and MUST reject `v` other than `1`."
          - "Section states the proof formula byte-for-byte: `HMAC-SHA256(secret, ASCII(\"tandem-pair-v1\") || macSpkiDer || phoneSpkiDer)` stating explicitly whether the two SPKI DER values are raw-concatenated or length-prefixed (and the prefix width/byte order if so), where `phoneSpkiDer` is taken from the certificate seen in the TLS handshake, never from the PairRequest body."
          - "Section contains these MUST statements: the window MUST expire 120 s after opening; the Mac MUST reject the 4th attempt without evaluating its proof; a successful pairing MUST close the window and destroy the secret (single use); proof comparison MUST be constant time; each failed attempt MUST burn one of the 3 attempts; the Mac MUST NOT send `PairAccepted` before the owner confirms on the Mac."
        tdd: []
        notes: ""
      - id: E01-03
        title: "[docs] SPEC.md section: framing + envelope"
        type: doc
        platforms: [docs]
        priority: P0
        size: M
        prd: [F-3.2]
        use_cases: [AC-07]
        invariants: []
        depends_on: []
        description: |
          Normative section for the frame format (`u32 length big-endian | protobuf Envelope`),
          max frame size (1 MiB), and required rejection behavior for oversize, truncated, and
          malformed-length frames. Defines the `Envelope` fields (`channel`, `seq`, `ack`, `oneof`
          payload) at the wire-contract level (message shape lives in E01-10's `.proto`).
        acceptance:
          - "Section states the length prefix is an unsigned 32-bit big-endian count of Envelope bytes that follow (excluding the 4 prefix bytes), max 1 048 576, and that a receiver MUST check the length against the max before allocating any buffer for the payload."
          - "Section contains a MUST-close statement, with the single E01-05 close code `MALFORMED_FRAME` (sub-case = local reason only), for each rejection case: length > 1 MiB (oversize), length 0 (bad length), stream ends before `length` bytes arrive (truncated), payload fails protobuf decode (malformed), unknown `channel` value, unknown `oneof` payload type (AC-11)."
          - "Section defines `seq` as monotonically increasing per channel per direction and `ack` as the highest contiguous `seq` received on that channel (the E11 multiplexer contract), and states the required receiver behavior on a repeated or regressing `seq` as a MUST."
        tdd: []
        notes: ""
      - id: E01-04
        title: "[docs] SPEC.md section: channels + flow control credits"
        type: doc
        platforms: [docs]
        priority: P0
        size: M
        prd: [F-3.2]
        use_cases: [UC-08, UC-09, UC-14, UC-15, UC-17, AC-11]
        invariants: [2]
        depends_on: []
        description: |
          Normative section enumerating the channel set (`CONTROL, NOTIFY, CLIPBOARD, FILES, SMS,
          CONTACTS, CALLS, INPUT, STATUS`) and the credit-based flow-control algorithm so a large
          file transfer cannot starve notifications: initial credit grant, credit replenishment
          trigger, and behavior when a sender exceeds its credit.
        acceptance:
          - "Section defines the credit unit (frames or bytes), the numeric initial grant per channel, the replenishment message name and the trigger (e.g. receiver consumed >= half the grant), and states a sender MUST NOT send on a channel with zero remaining credit."
          - "Section states as a MUST that a peer sending past its granted credit causes a connection close with the E01-05 `CREDIT_VIOLATION` close code (no silent drop)."
          - "Section states CONTROL is exempt from or has a reserved credit so heartbeats and credit updates cannot be starved (a MUST, with the chosen mechanism)."
          - "Section states the channel set is closed and exactly the nine F-3.2 channels; there is no PHOTOS channel: photo-browser messages (E41-01) ride FILES (decision recorded here and in E41-01)."
          - Section states, as a MUST NOT, that no debug, echo, loopback, or test-only message type or channel exists; debug and release builds speak an identical protocol, and an unknown payload type closes the connection (AC-11).
        tdd: []
        notes: |
          Decision (cycle 2): PHOTOS is not added. PRD F-3.2 enumerates nine channels and the module map
          puts photos in feature/files, so photo listing/thumbnail messages are FILES payloads. Trade-off:
          thumbnails share FILES credits with an in-flight transfer; the sender MUST interleave FILES
          messages per stream (see E41-01) so a 4 GB transfer cannot block thumbnail responses. If that
          proves insufficient, adding a channel is an additive enum change owned by a new SPEC issue.
      - id: E01-05
        title: "[docs] SPEC.md section: errors + close codes"
        type: doc
        platforms: [docs]
        priority: P0
        size: S
        prd: [F-3.2]
        use_cases: [AC-04, AC-07]
        invariants: [5]
        depends_on: []
        description: |
          Normative enumeration of protocol-level error/close codes with the required close
          behavior for each (invariant 5: fail closed with a visible error). Canonical names used
          by every issue, vector and test (review cycle 3): `VERSION_MISMATCH`, `PIN_MISMATCH`,
          `MALFORMED_FRAME`, `CREDIT_VIOLATION`, `PAIRING_FAILED`, `TICKET_REJECTED`, `REVOKED`.
          All malformed-frame sub-cases share the ONE wire code `MALFORMED_FRAME`; the sub-case is
          a local diagnostic reason only (`TOO_LARGE`, `BAD_LENGTH`, `TRUNCATED`, `DECODE_FAILED`,
          `UNKNOWN_CHANNEL`, `UNKNOWN_PAYLOAD_TYPE`), never sent on the wire and never a separate
          close code. Pairing sub-cases likewise share `PAIRING_FAILED` (local reasons `EXPIRED`,
          `ATTEMPTS_EXHAUSTED`, `BAD_PROOF`, `REJECTED_BY_OWNER`), and ticket sub-cases share
          `TICKET_REJECTED`.
        acceptance:
          - "Section has a table with, per close code, a stable numeric ID, a name and the required user-visible behavior, covering at least: version mismatch, pin mismatch, malformed frame (oversize/truncated/bad length/decode failure/unknown channel/unknown payload type), credit violation, pairing failure (expired, attempts exhausted, bad proof, rejected by owner), media ticket rejected (missing/reused/expired/other session), revoked peer."
          - "Section contains these MUST statements: a close code MUST NOT trigger a plaintext, reduced-security or unauthenticated retry (invariant 2, stated in the section intro); an implementation receiving an unknown close code MUST treat it as fatal and show a generic error; security-relevant closes (pin mismatch, version mismatch, revoked) MUST be shown in UI, not only logged (UC-05)."
          - "Numeric IDs are frozen: the section states IDs MUST NOT be reused or renumbered once released."
        tdd: []
        notes: ""
