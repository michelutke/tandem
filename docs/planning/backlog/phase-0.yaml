      - id: E00-17
        title: "[android] Release-log lint rule + shared sensitive-symbol list: no content logging in release builds"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: []
        use_cases: [AC-10]
        invariants: [7]
        depends_on: [E00-05]
        description: |
          Shared list `tools/lint/sensitive-symbols.txt` (notification text, clipboard content,
          message bodies, secrets; one symbol name per line) consumed by both platforms' checks
          so the rule stays in sync (macOS half: E00-27). Android: detekt custom rule
          `NoSensitiveReleaseLog` failing on `Log.*`/`Timber.*` calls whose arguments reference a
          listed symbol in non-debug source sets. Rule fixtures live in the detekt rule module's
          test sources (detekt `lint()` test API).
        acceptance:
          - A `Log.d("clip", clipboardText)` call in a release-visible source set fails `./gradlew detekt` with rule id `NoSensitiveReleaseLog`.
          - The same call in `src/debug` passes.
          - The same log call using a redacted/length-only representation (`clipboardText.length`) passes.
          - Adding a symbol name to `sensitive-symbols.txt` makes a log call referencing it fail without changing rule code.
        tdd:
          - "ci: releaseLogLint_clipboardTextInReleaseSourceSet_detektFails"
          - "ci: releaseLogLint_clipboardTextInDebugSourceSet_detektPasses"
          - "ci: releaseLogLint_redactedLengthOnlyLog_detektPasses"
          - "ci: releaseLogLint_symbolAddedToSharedList_newCallFlagged"
        notes: |
          This is a static best-effort check (symbol-name based), not a runtime guarantee; the
          real guarantee comes from `tools/pcap-audit` canaries (E15) and `tools/log-audit`
          (E15-17). Split in review cycle 3: macOS half is E00-27.

