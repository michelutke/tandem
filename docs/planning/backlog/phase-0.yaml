        prd: []
        use_cases: []
        invariants: []
        depends_on: [E00-02, E00-07, E00-09]
        description: |
          Four workflows: `android.yml` (ubuntu-latest, triggered on `android/**` and `protocol/**`
          changes), `macos.yml` (macos-latest runner, triggered on `macos/**` and `protocol/**`),
          `protocol.yml` (buf lint/breaking, triggered on `protocol/**`), `conformance.yml` (runs
          `tools/conformance`, triggered on `protocol/**`, `android/core/protocol/**`,
          `macos/Packages/TandemProtocol/**`). All required as branch protection checks.
          The emulator job is a separate fifth workflow, `android-instrumented.yml` (E00-21,
          triggered on `android/**` plus nightly), so the fast `android.yml` JVM job stays free of
          KVM/emulator setup. Path filters are verified by a script that evaluates each workflow's
          `on.pull_request.paths` against fixture changed-file lists.
        acceptance:
          - A PR touching only `android/**` runs the android workflow and not the macos workflow.
          - A PR touching only `macos/**` runs the macos workflow and not the android workflow.
          - A PR touching `protocol/**` runs all four workflows.
          - A PR touching only `docs/**` triggers none of the four workflows.
        tdd:
