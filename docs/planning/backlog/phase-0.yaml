      - id: E00-14
        title: "[android] Module dependency rule enforcement (features never depend on each other; only core/transport touches sockets)"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: []
        use_cases: []
        invariants: [1, 4, 2]
        depends_on: [E00-02, E00-05]
        description: |
          Custom detekt rule (or Gradle `dependencies.all { }` inspection task) that fails the
          build if: (a) any `feature/*` module has a project dependency on another `feature/*`
          module, (b) any module other than `core/transport` references `java.net.Socket`,
          `javax.net.ssl.SSLSocket`, or `java.nio.channels.SocketChannel` in its source set.
        acceptance:
          - A deliberately introduced `feature/clipboard -> feature/files` dependency fails the build.
          - A deliberately introduced raw `Socket` usage in `feature/notifications` fails the build.
          - The same check passing is required for CI green (wired into E00-11's android workflow).
          - A dependency on an HTTP/WebDAV server library (e.g. NanoHTTPD, Ktor server, any artifact on the shared denylist) fails the build (invariant 2).
        tdd:
          - "ci: moduleDependencyRule_featureDependsOnFeatureFixture_buildFails"
          - "ci: socketUsageRule_socketInFeatureNotifications_buildFails"
          - "ci: socketUsageRule_sslSocketInCoreTransport_buildPasses"
