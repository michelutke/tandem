            a new dependency without an entry fails CI. Release SBOM and CVE scan stay E71-10.
        acceptance:
          - "Changing one byte of a cached artifact checksum in verification-metadata.xml fails the Gradle build, and adding a dependency without metadata fails."
          - "A fixture build file with a `+` version fails the check."
          - "A modified gradle-wrapper.jar fails wrapper validation."
          - "A CI resolve that would change Package.resolved fails the macOS job."
