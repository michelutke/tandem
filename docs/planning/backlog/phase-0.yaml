      - id: E00-28
        title: "[android] Platform-hardening baseline: backup, NSC, exports, PendingIntents, tapjacking"
        type: task
        platforms: [android]
        priority: P0
        lands_in_phase: 2
        size: M
        prd: []
        use_cases: [AC-16, AC-02]
        invariants: [1, 2, 4]
        depends_on: [E00-02, E00-05, E00-20]
        description: |
          Added in review cycle 4 so every Android component added later inherits the hardening instead of
          each feature re-deciding it (release-time audit stays E71-09).
          - `android:allowBackup="false"`, `android:fullBackupContent="false"` and `dataExtractionRules` that
            exclude every domain for cloud-backup and device-transfer (trust store, settings and transfer temp
            files never leave the device).
          - `usesCleartextTraffic="false"` and a `networkSecurityConfig` whose base-config sets
            `cleartextTrafficPermitted="false"` with system trust anchors only (no `user` anchors, no
            debug-overrides in release). Tandem's own TLS uses the pinning TrustManager (E12-05) regardless.
          - Every component is `exported="false"` unless listed in `tools/release-audit/android-exported.allowlist`
            with its guarding permission. Expected v1 set: launcher activity; share-target and PROCESS_TEXT
            activities; TileService (BIND_QUICK_SETTINGS_TILE); NotificationListenerService
            (BIND_NOTIFICATION_LISTENER_SERVICE); AccessibilityService (BIND_ACCESSIBILITY_SERVICE);
            BOOT_COMPLETED receiver (action-checked, E20-08).
          - Lint rules: `PendingIntentImmutable` (every PendingIntent.getActivity/getBroadcast/getService/
            getForegroundService passes FLAG_IMMUTABLE and an explicit-component Intent; FLAG_MUTABLE needs an
            allowlist entry naming the issue) and `ImplicitInternalIntent`.
          - Tapjacking: a `TandemActivity` base sets `window.decorView.filterTouchesWhenObscured = true`; a lint
            rule requires every activity to extend it.
          - Denied permissions (CI fails if merged): QUERY_ALL_PACKAGES, SYSTEM_ALERT_WINDOW, USE_FULL_SCREEN_INTENT,
            READ_CALL_LOG (unless E52-02 justifies it via an allowlist entry), MANAGE_EXTERNAL_STORAGE,
            REQUEST_INSTALL_PACKAGES, WRITE_SETTINGS, READ_LOGS, BIND_DEVICE_ADMIN.
          FLAG_SECURE decision: not applied, because no secret is rendered on the phone (the QR secret lives on the
          Mac) and it would blank Tandem's own screens in the mirror (E61); recorded in E02-08.
        acceptance:
          - "A fixture manifest with allowBackup=\"true\", or without dataExtractionRules excluding all domains, fails the check."
          - "A fixture network security config with `user` trust anchors, cleartext permitted, or release debug-overrides fails the check."
          - "A fixture exported activity not in the allowlist, or an allowlisted service without its BIND_* permission, fails the check naming the component."
          - "PendingIntent lint fails on a fixture using FLAG_MUTABLE without an allowlist entry and on a fixture wrapping an implicit Intent."
          - "A fixture declaring QUERY_ALL_PACKAGES fails the denied-permission check."
          - "Every Tandem activity root view has filterTouchesWhenObscured = true (Robolectric), and an activity not extending TandemActivity fails lint."
        tdd:
          - "ci: mergedManifest_allowBackupTrueFixture_checkFails"
          - "ci: networkSecurityConfig_userTrustAnchorsOrCleartextFixture_checkFails"
          - "ci: exportedComponentCheck_unlistedExportedActivityFixture_checkFails"
          - "ci: pendingIntentLint_mutableWithoutAllowlistFixture_lintFails"
          - "ci: pendingIntentLint_implicitIntentFixture_lintFails"
          - "ci: deniedPermissionCheck_queryAllPackagesFixture_checkFails"
          - "unit: tandemActivity_onCreate_decorViewFiltersTouchesWhenObscured"
          - "ci: activityBaseClassLint_activityNotExtendingTandemActivity_lintFails"
        notes: |
          Added in review cycle 4. Consumers that add components cite this issue: E20-08, E30-02, E31-06, E31-12, E40-11, E62-02.

      - id: E00-29
