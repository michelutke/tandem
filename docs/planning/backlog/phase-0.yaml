      - id: E01-22
        title: "[docs] SPEC.md section: timeouts, connection limits and resource caps"
        type: doc
        platforms: [docs]
        priority: P0
        size: M
        prd: [F-3.1, F-3.2, F-3.3]
        use_cases: [AC-04, AC-13, AC-19]
        invariants: [1, 3, 5]
        depends_on: [E01-01, E01-03, E01-04, E01-05]
        description: |
          Added in review cycle 4 (adversarial review). One normative section collecting every timeout,
          concurrency cap and size/rate limit so both platforms enforce the same numbers and E15-20 / E71-08
          can attack them. Over-cap input is rejected before any allocation or side effect; limits never relax
          TLS, pinning, pairing or ticket checks; a source IP is only ever a DoS-throttling key, never a trust
          input (invariant 3).
          Pre-auth (Mac listener, implemented by E12-18):
          - TLS handshake deadline 10 s from TCP accept (phone client: 10 s from connect, E12-08).
          - VersionHello deadline 5 s after TLS completion on both sides (E12-07 / E12-15).
          - PairRequest deadline 10 s after the hellos on a pairing-candidate connection; timeout burns one attempt (E14-02).
          - MediaHello deadline 5 s after TLS completion on a media connection (E60-03).
          - At most 8 concurrent connections that are not yet Ready, at most 2 per source IP; excess sockets are
            closed on accept, before the TLS handshake.
          - A source IP with >= 10 failed handshakes within 60 s is refused for 60 s; peers on other addresses are unaffected.
          - At most 1 in-flight pairing-candidate connection (E01-02).
          Post-auth:
          - 1 control session per peer SPKI (a newer Ready session replaces the older one); 1 media connection
            per control session (E60-04); per-channel credit cap (E01-04); frames <= 1 MiB (E01-03); media access
            units <= 8 fragments and <= 8 MiB reassembled (E61-01).
          - "CONTROL channel is exempt from the per-channel credit cap above (control/heartbeat traffic must never
            be backpressured) and instead has its own caps (cycle 5, D-60/D-61): the phone answers at most 1
            Heartbeat per second, replying to faster Heartbeats is skipped silently (no reply, no error, no close);
            non-Heartbeat CONTROL frames from a peer are capped at 60/s per session, exceeding the cap closes
            LIMIT_EXCEEDED (E20-05 / E20-15 / E20-20)."
          - "Ring/RingStop (cycle 5, D-62): Ring is idempotent while an alarm is already ringing (a second Ring is a
            no-op, not a second alarm); the alarm starts at most twice per rolling 10 s window (cooldown) regardless
            of how many Ring frames arrive (E23-06 / E23-08)."
          Feature caps (the owning issue implements; its SPEC section restates the number):
          - Notifications: title <= 256 and text <= 4096 characters, <= 25 sender names of <= 64 characters,
            icon PNG <= 64 KiB and <= 256 x 256 px, the Mac keeps <= 50 delivered Tandem notifications
            (E30-01 / E30-06 / E30-07); replyText <= 4096 characters (E30-09).
          - Files: raw name <= 1024 UTF-8 bytes, mime <= 255 bytes, size <= 64 GiB (TOO_LARGE), <= 4 unanswered
            offers and <= 2 active transfers per direction (BUSY), auto-accept only for offers <= 1 GiB
            (setting) (E40-01 / E40-07 / E40-18).
          - Photos: <= 8 outstanding ThumbRequests and <= 1 outstanding PhotoPage per peer (BUSY) (E41-01 / E41-04).
          - SMS: <= 1 SmsSyncRequest in flight (a new one supersedes); SendSmsRequest body <= 1600 characters
            (TOO_LONG) and <= 10 sends per 60 s (RATE_LIMITED) (E50-01 / E50-04 / E50-13).
          - Calls: PlaceCallRequest address must match `^\+?[0-9]{3,20}$` after removing spaces and dashes (no
            MMI/USSD `*` or `#`, no pause/wait `,` or `;`), <= 1 request per 5 s (E52-01 / E52-05).
          - Input: <= 120 InputEvents/s (burst 240, excess dropped and counted), SetText / TextEdit.insert <= 4096
            characters, Swipe durationMs 1..5000, coordinates within the reported window (E62-01 / E62-06).
          - Clipboard: <= 1 MiB (unchanged, E31).
        acceptance:
          - "Section lists every number above as an RFC 2119 MUST with the close code (`PROTOCOL_TIMEOUT`, `LIMIT_EXCEEDED`) or typed error returned on violation, and names the implementing issue for each row."
          - "Section states that limits are enforced before allocation or side effect, never relax TLS, pinning, pairing or ticket checks, and that a source IP is used only as a throttling key, never for trust (invariant 3)."
          - "Section records the pairing-window DoS trade-off: an attacker in range can burn the 3 attempts; this is visible on the Mac and recovered by regenerating the QR (E14-11)."
          - "Section states the CONTROL-channel row (cycle 5, D-60/D-61): the channel is exempt from the per-channel credit cap because control/heartbeat traffic must never be backpressured; Heartbeat replies are capped at 1/s (excess dropped silently, no close) and non-Heartbeat CONTROL frames are capped at 60/s per session (LIMIT_EXCEEDED beyond that), naming E20-05/E20-15/E20-20 as implementing issues."
          - "Section states the Ring/RingStop cooldown row (cycle 5, D-62): Ring is idempotent while already ringing and the alarm starts at most twice per rolling 10 s window regardless of Ring frame volume, naming E23-06/E23-08 as implementing issues."
        tdd: []
        notes: |
          Added in review cycle 4. Consumers: E12-07, E12-08, E12-09, E12-15, E12-18, E14-02, E30-*, E40-01, E41-01, E50-01, E52-01, E60-03, E61-01, E62-01, E62-06.
          Cycle 5: CONTROL-channel cap and Ring cooldown consumers add E20-05, E20-15, E20-20, E23-06, E23-08.

      - id: E01-23
        title: "[docs] SPEC.md section: untrusted peer strings (display sanitization)"
        type: doc
        platforms: [docs]
        priority: P0
        size: S
        prd: [F-2.1, F-5.1, F-7.1, F-8.1, F-8.4]
        use_cases: [AC-14]
        invariants: []
        depends_on: [E01-02]
        description: |
          Added in review cycle 4. Normative rule for every string one peer supplies and the other displays:
          PairRequest deviceInfo.displayName / model, QR `n`, trust-store displayName, notification app name /
          title / text / sender names, file names in prompts (after the E40-02 filename rule), SMS addresses,
          snippets and bodies, contact names, SIM display names and caller names.
          Order: decode UTF-8 (invalid sequences become U+FFFD); normalize to NFC; remove bidi controls
          U+202A..U+202E, U+2066..U+2069, U+200E, U+200F and U+061C; remove C0/C1 controls except U+000A in
          multi-line bodies; in single-line names also remove zero-width U+200B..U+200D, U+2060, U+FEFF and
          collapse whitespace runs; truncate on a grapheme boundary to the cap (names 64, titles 256, bodies
          4096 characters) appending U+2026. Strings render as plain text only: no Markdown or attributed-string
          parsing and no data detectors turning them into links or actions. Homoglyph/confusable detection is
          out of scope: no trust decision is ever based on a peer-supplied name (pairing relies on the E01-02
          confirmation code).
        acceptance:
          - "Section states the ordered rule above as a MUST for every display surface and lists the surfaces with their length caps."
          - "Section states that no trust decision depends on a peer-supplied name and that confusable detection is out of scope (residual risk row in E02-01)."
          - "Section references the E01-24 vector file as the conformance source for both platforms."
        tdd: []
        notes: |
          Added in review cycle 4. Implementations: E14-21 (Android), E14-22 (macOS).

