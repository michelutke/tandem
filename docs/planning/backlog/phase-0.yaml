      - id: E00-17
        title: "[android] Release-log lint + shared sensitive-symbol list"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: []
        use_cases: [AC-10]
        invariants: [7]
        depends_on: [E00-05]
        description: |
          Shared list `tools/lint/sensitive-symbols.txt` (notification text, clipboard content,
          message bodies, secrets; one symbol name per line) consumed by both platforms' checks
          so the rule stays in sync (macOS half: E00-27). Android: detekt custom rule
