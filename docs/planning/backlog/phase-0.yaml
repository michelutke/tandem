      - id: E01-07
        title: "[docs] SPEC.md section: heartbeat"
        type: doc
        platforms: [docs]
        priority: P0
        size: S
        prd: [F-3.4]
        use_cases: [UC-04]
        invariants: []
        depends_on: []
        description: |
          Normative section for the wire-level liveness contract (reconnect strategy itself is
          E20). Decision (review cycle 3, resolves "15 s heartbeat vs. phone Doze overnight"):
          the Mac drives liveness, the phone answers.
          - The Mac (server) MUST send `Heartbeat` on CONTROL after 15 s without sending any
            frame, and MUST treat the connection as dead after 45 s (3 intervals) without
            receiving any frame.
          - The phone (client) MUST reply with one `Heartbeat` to every `Heartbeat` it receives,
            within 1 s of receipt. The Mac MUST NOT reply to heartbeats (no ping-pong loop).
          - The phone MAY send unsolicited heartbeats after 15 s idle while the device is
            interactive; it MUST NOT hold wake locks or schedule alarms to do so while the
            device is in Doze (incoming Mac heartbeats wake it: foreground service + unrestricted
            battery keeps network access in Doze).
          - The phone MUST measure silence on a sleep-inclusive monotonic clock
            (`elapsedRealtime`) and treat > 45 s without any received frame as dead, evaluated on
            its timer, on Doze exit and on screen-on; it then reconnects per E20-06.
          - Any received frame, not only `Heartbeat`, resets the silence timer on both sides.
          No proto change: `Heartbeat` carries no role field; direction is implied by ADR-002
          (phone = client). Tested by E20-05 (Mac), E20-15 (Android), E20-12 (overnight gate).
        acceptance:
          - Section states interval (15 s), dead threshold (45 s of silence), reply deadline (1 s), who sends, who replies, and that the Mac never replies, in RFC 2119 terms.
          - Section references the `Heartbeat` message in control.proto (E01-12) and the elapsedRealtime requirement for the phone.
          - "Section states the Doze expectation used by the E20-12 overnight gate: while the phone is in Doze with the foreground service running and battery unrestricted, the connection either stays up or, if the Mac declared it dead, the phone reconnects within 5 s of the next Doze maintenance window or screen-on."
        tdd: []
        notes: |
          Decision recorded here and mirrored in E20-05/E20-15 notes. If device testing (E20-12)
          shows incoming packets do not wake the phone on some OEMs, revisit with cloud-free
          options only and record the outcome as an ADR.

