            fromOffset is > 0, re-sent bytes are ≤ 4 MiB, and the received SHA-256 equals the source
          - Manual, phone → Mac and Mac → phone, 4 GB; the transfer resumes without user action
            within 60 s of Wi-Fi returning, from an offset ≥ the bytes acknowledged before the
            disconnect minus 4 MiB, and `shasum -a 256` on both ends matches
          - Manual; peak memory during the transfer stays ≤ 64 MiB above the pre-transfer idle
            value (Android `dumpsys meminfo` total PSS; Mac `footprint` of the agent)
          - Manual; no `.part` file remains in either staging directory after completion
