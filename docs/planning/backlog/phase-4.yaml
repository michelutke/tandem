      - id: E41-09
        title: "[macos] 10k-library scroll test: visible-cell thumbnails, bounded cache and memory"
        type: test
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-7.4]
        use_cases: [UC-17]
        invariants: []
        depends_on: [E41-05, E41-06, E00-26]
        description: |
          Phase 4 checklist "photo browser pages a 10k library with bounded cache" and UC-17's
          acceptance. The grid view model and disk cache run against a fake `PhotoService`
          serving 10 000 items (page 100) with synthetic 256 px thumbnails; a scripted scroll goes
          top to bottom and back in viewport steps. The memory bound is an XCUITest with
          `XCTMemoryMetric` over a DEBUG-seeded 10 000-item scenario (E00-26). The Android side
          of the 10k run is E41-11.
        acceptance:
          - At every scroll step, outstanding ThumbRequests ≤ visible cells + one viewport each side
          - Decoded in-memory thumbnails never exceed 300 during the scroll
          - With a 4 MiB disk cap, on-disk cache bytes never exceed 4 MiB during the scroll
          - Top-to-bottom issues exactly 100 PhotoPage requests; scrolling back up issues none
          - Peak physical memory growth during the XCUITest scroll is < 150 MiB above the
            grid-open baseline
        tdd:
          - "unit: photoGrid10kScroll_everyStep_thumbRequestsAtMostVisiblePlusPrefetch"
          - "unit: photoGrid10kScroll_decodedThumbnails_neverExceed300"
          - "unit: photoGrid10kScroll_diskCache_neverExceedsFourMiBCap"
          - "unit: photoGrid10kScroll_downAndBackUp_exactly100PageRequests"
          - "ui: photoGrid10kScroll_xctMemoryMetric_peakGrowthUnder150MiB"
        notes: "Split in review cycle 3: Android 10k paging moved to E41-11; now macOS only."

      - id: E41-10
        title: "[macos] Download original from the photo grid"
        type: story
        platforms: [macos]
        priority: P0
        size: S
        prd: [F-7.4]
        use_cases: [UC-17]
        invariants: []
        depends_on: [E41-05, E40-06, E40-18, E15-15]
        description: |
          "Download" on a grid item sends OriginalRequest with a fresh transferId and records it
          as pending; a FileOffer whose id matches a pending OriginalRequest is accepted without
          a prompt (bypassing E40-18's prompt, still subject to its disk-space check) and saved
          via E40-06; unsolicited offers keep the normal prompt. Unit tests use the fake
          `PhotoService` and a recording accept-flow fake; the byte-identity check runs over the
          E15-15 harness with a JVM phone side serving a fixture photo.
        acceptance:
          - A FileOffer matching a pending transferId is accepted with no prompt
          - A FileOffer with an unknown id still prompts
          - A PhotoError for the transferId clears the pending entry and shows the item's
            download state as failed
          - Over the E15-15 harness, a 12 MiB fixture photo lands in the destination
            byte-identical to the source
        tdd:
          - "unit: originalDownload_offerMatchesPendingTransferId_acceptedWithoutPrompt"
          - "unit: originalDownload_unsolicitedOffer_stillPrompts"
          - "unit: originalDownload_photoErrorForTransferId_itemStateFailed"
          - "integration: originalDownload_jvmPhoneFixturePhoto_savedByteIdenticalOnMac"
        notes: "Split from E41-07 in review cycle 3."

      - id: E41-11
