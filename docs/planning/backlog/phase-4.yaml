      - id: E40-11
        title: "[android] Share target and SAF picker entry points"
        type: story
        platforms: [android]
        priority: P1
        size: M
        prd: [F-7.3]
        use_cases: [UC-15, AC-16]
        invariants: []
        depends_on: [E40-03, E00-20, E00-28]
        description: |
          Add a share-sheet target (ACTION_SEND / ACTION_SEND_MULTIPLE, `*/*`) for sending files
          to the Mac, and an in-app Storage Access Framework picker (OpenMultipleDocuments). Only
          `content://` URIs are accepted; `file://` URIs are rejected so another app cannot make
          Tandem send its own private files. Robolectric tests (E00-20) drive the activity with
          crafted intents and a test `ActivityResultRegistry`, with a recording transfer-service
