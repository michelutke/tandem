      - id: E40-05
        title: "[android] Receiver: temp file, verify, atomic move to MediaStore"
        type: task
        platforms: [android]
        priority: P0
        size: L
        prd: [F-7.3]
        use_cases: [UC-14, AC-12]
        invariants: []
        depends_on: [E40-01, E40-16, E12-11, E00-18, E00-20, E00-21, E14-12]
        description: |
          Write incoming chunks to `<transferDir>/<id>.part` (app-private `noBackupFilesDir`,
          injected so tests use `@TempDir`) behind a feature-local `TransferStore` seam, validate
          each chunk (offset equals current length, never beyond `size`), hash incrementally, and
          on FileComplete compare against FileOffer.sha256. On match, publish through a
          feature-local `DownloadsPublisher` seam whose MediaStore implementation inserts into
          `Download/Tandem/` with `IS_PENDING=1`, copies, then clears `IS_PENDING`, so no partial
          entry is ever visible; MediaStore resolves name collisions (never overwrites). On
          mismatch, delete the temp file and send FileCancel HASH_MISMATCH. Unit tests use
          `FakeTandemSession` (E12-11), a recording `DownloadsPublisher` fake and a
          `TransferStore` fake that can throw ENOSPC at a given offset; the MediaStore publisher is
          `instrumented:` (E00-21).
        acceptance:
          - A matching-hash transfer is published exactly once to Download/Tandem/ under the
            E40-16 sanitized name and the `.part` file is deleted
          - A mismatched-hash transfer is never published, the `.part` file is deleted, and
            FileCancel HASH_MISMATCH is sent
          - ENOSPC while writing deletes the `.part` file, publishes nothing, and sends FileCancel
            INSUFFICIENT_SPACE
          - A chunk whose offset differs from the current length, or whose end exceeds the offered
            size, aborts with FileCancel PROTOCOL_VIOLATION and deletes the `.part` file
          - On the emulator, a MediaStore query of Download/Tandem/ during an in-progress publish
            returns no row for the file (UC-14 partial files never visible)
          - On the emulator, publishing `report.pdf` when one exists leaves the original bytes
            unchanged and creates a second, suffixed entry
          - "The receiver registers with the Android PeerDataPurging registry (E14-12): unpairing the Mac deletes its retained `.part` files."
        tdd:
          - "unit: androidReceiver_matchingHash_publishedOnceAndPartFileDeleted"
          - "unit: androidReceiver_hashMismatch_partDeletedNothingPublishedAndCancelSent"
          - "unit: androidReceiver_enospcDuringWrite_partDeletedAndInsufficientSpaceCancelSent"
          - "unit: androidReceiver_chunkBeyondOfferedSize_protocolViolationCancelAndPartDeleted"
          - "unit: androidReceiver_chunkOffsetGap_protocolViolationCancelAndPartDeleted"
          - "instrumented: mediaStorePublisher_pendingPublish_invisibleToDownloadTandemQuery"
          - "instrumented: mediaStorePublisher_existingSameName_originalUntouchedAndSuffixedEntryAdded"
          - "unit: androidReceiver_macUnpaired_retainedPartFilesDeleted"

      - id: E40-06
        title: "[macos] Receiver: temp file, verify, atomic move to Downloads/Tandem"
        type: task
        platforms: [macos]
        priority: P0
        size: L
        prd: [F-7.2]
        use_cases: [UC-15]
        invariants: []
        depends_on: [E40-01, E40-17, E12-12, E00-24]
        description: |
          Mirror of E40-05 on macOS. Stage `<id>.part` in the directory returned by
          `FileManager.url(for: .itemReplacementDirectory, in: .userDomainMask,
          appropriateFor: destination)` (same volume, outside `~/Downloads/Tandem/`), validate
          each chunk, hash incrementally, and on a matching digest `rename` into
          `~/Downloads/Tandem/` under the E40-17 sanitized name, appending ` (1)`, ` (2)`, …
          before the extension on collision (never overwrite). Destination and staging roots are
          injected via a feature-local `TransferDirectories` value and writes go through a
          `FileSink` seam that can throw ENOSPC, so tests use per-test temporary directories with
          the `TandemSession` fake (E12-12).
        acceptance:
          - A matching-hash transfer appears in the destination under the sanitized name and the
            staging `.part` file no longer exists
          - While a transfer is in progress the destination directory contains no entry for it
            (UC-15 partial files never visible)
          - A mismatched-hash transfer leaves nothing in the destination, deletes the `.part`
            file, and sends FileCancel HASH_MISMATCH
          - ENOSPC while writing deletes the `.part` file, leaves nothing in the destination, and
            sends FileCancel INSUFFICIENT_SPACE
          - An existing `report.pdf` is left byte-identical and the new file is saved as
            `report (1).pdf`
          - A chunk whose end exceeds the offered size aborts with FileCancel PROTOCOL_VIOLATION
            and deletes the `.part` file
        tdd:
          - "unit: macosReceiver_matchingHash_fileInDestinationAndPartDeleted"
          - "unit: macosReceiver_midTransfer_destinationHasNoEntry"
          - "unit: macosReceiver_hashMismatch_destinationEmptyPartDeletedAndCancelSent"
          - "unit: macosReceiver_enospcDuringWrite_partDeletedAndInsufficientSpaceCancelSent"
          - "unit: macosReceiver_existingSameName_savedWithOneSuffixOriginalUntouched"
          - "unit: macosReceiver_chunkBeyondOfferedSize_protocolViolationCancelAndPartDeleted"

      - id: E40-07
        title: "[android] Accept, auto-accept, and disk-space pre-check"
        type: story
        platforms: [android]
        priority: P0
        size: M
        prd: [F-7.1]
        use_cases: [UC-14, AC-19]
        invariants: []
        depends_on: [E40-01, E12-11, E00-18, E00-20, E14-21]
        description: |
          On FileOffer, check free space (feature-local `FreeSpaceProvider` over `StatFs`) against
          `size + 64 MiB` before prompting; if short, send FileReject INSUFFICIENT_SPACE with no
          prompt. If the auto-accept setting is on, send FileAccept immediately; otherwise post an
          accept/reject prompt (heads-up notification with Accept and Decline actions, behind a
          feature-local `TransferPrompter` seam). An offer unanswered for 300 s is rejected with
          TIMEOUT and the prompt removed. Tests use `FakeTandemSession` (E12-11), fakes for both
          seams, and `TestClock` (E00-18) for the 300 s timeout; the notification rendering is a
          Robolectric `unit:` (E00-20).
        acceptance:
          - Free space below size + 64 MiB sends FileReject INSUFFICIENT_SPACE and shows no prompt
          - Auto-accept on sends FileAccept with no prompt
          - Auto-accept off shows the prompt; Accept sends FileAccept, Decline sends FileReject DECLINED
          - No answer after 300 s of virtual time sends FileReject TIMEOUT and cancels the prompt
          - The prompt notification shows the sanitized name and size and has exactly two actions
          - "Auto-accept is off by default (D-44) and applies only to offers <= 1 GiB (setting, default 1 GiB); larger offers always prompt."
          - "A 5th unanswered offer, or an offer while 2 transfers are active, is rejected BUSY with no prompt; an offer over 64 GiB is rejected TOO_LARGE."
          - "The prompt shows the E14-21-sanitized name."
        tdd:
          - "unit: androidAcceptFlow_freeSpaceBelowSizePlusReserve_insufficientSpaceRejectNoPrompt"
          - "unit: androidAcceptFlow_autoAcceptOn_fileAcceptSentWithoutPrompt"
          - "unit: androidAcceptFlow_declineTapped_fileRejectDeclinedSent"
          - "unit: androidAcceptFlow_noAnswerFor300s_timeoutRejectAndPromptCancelled"
          - "unit: androidAcceptPrompt_offerPosted_notificationHasAcceptAndDeclineActions"
          - "unit: androidAcceptFlow_autoAcceptOnOfferOver1GiB_promptShown"
          - "unit: androidAcceptFlow_fifthPendingOffer_busyRejectNoPrompt"
          - "unit: androidAcceptFlow_offerOver64GiB_tooLargeReject"
        notes: "Split from E40-07 in review cycle 3: macOS half is E40-18."

      - id: E40-08
        title: "[android] Resume by offset after disconnect"
        type: story
        platforms: [android]
        priority: P0
        size: L
        prd: [F-7.1]
        use_cases: [UC-16]
        invariants: []
        depends_on: [E40-03, E40-05, E12-11, E00-18, E00-19]
        description: |
          Receiver role: on reconnect, for each retained `.part` file not older than 24 h,
          truncate to a 256 KiB boundary, re-hash the retained prefix, and send
          FileResumeRequest{id, fromOffset}. Sender role: on FileResumeRequest for a known id,
          seek the source to fromOffset and continue with `seq = fromOffset / 262144`; unknown id
          replies FileReject UNKNOWN_TRANSFER; an unreadable source replies FileCancel
          SOURCE_UNAVAILABLE.
          Retained `.part` files older than 24 h are deleted on the next sweep. Tests wire a real
          Android sender and receiver over an `InMemoryDuplexPipe` (E00-19), sever it with
          `closeAbruptly()` mid-transfer, reconnect a new pipe, and use `TestClock` (E00-18) for
          the 24 h expiry; message-level cases use `FakeTandemSession` (E12-11).
        acceptance:
          - A 64 MiB transfer severed after 40 MiB resumes with fromOffset = 40 MiB (rounded down
            to 256 KiB) and the sender's first resumed chunk has seq fromOffset / 262144
          - After resume the published file's SHA-256 equals the source digest
          - Bytes re-sent after resume are at most the credit window plus 256 KiB
          - FileResumeRequest for an unknown id is answered with FileReject UNKNOWN_TRANSFER
          - A `.part` file whose last write is 24 h + 1 s old is deleted and no resume is requested
        tdd:
          - "unit: androidResume_severedAt40MiB_resumeRequestFromOffset40MiB"
          - "unit: androidResume_resumedTransfer_publishedSha256MatchesSource"
          - "unit: androidResume_afterResume_resentBytesAtMostCreditWindowPlusOneChunk"
          - "unit: androidResume_unknownTransferId_fileRejectUnknownTransfer"
          - "unit: androidResume_partOlderThan24h_deletedAndNoResumeRequest"
        notes: "Split from E40-08 in review cycle 3: macOS half is E40-19."

      - id: E40-09
        title: "[android] Cancel transfer cleanup"
        type: task
        platforms: [android]
        priority: P1
        size: S
        prd: [F-7.1]
        use_cases: [UC-14, UC-15]
        invariants: []
        depends_on: [E40-03, E40-05, E00-19]
        description: |
          A user-initiated cancel sends FileCancel USER_CANCELLED; as sender, stop reading and
          sending; as receiver, delete the `.part` file and publish nothing. A later
          FileResumeRequest for a cancelled id gets FileReject UNKNOWN_TRANSFER. Tests run sender
          and receiver over in-memory fake sessions with per-direction capture.
        acceptance:
          - After a sender-side cancel, the pipe capture shows no FileChunk after the FileCancel
            and the receiver's `.part` file is gone
          - After a receiver-side cancel, the sender emits no chunk beyond those already in flight
            (at most the credit window) and the transfer state is Cancelled
          - A resume request for a cancelled id is answered with FileReject UNKNOWN_TRANSFER
        tdd:
          - "unit: androidCancel_senderInitiated_noChunkAfterCancelAndReceiverPartDeleted"
          - "unit: androidCancel_receiverInitiated_senderStopsWithinCreditWindow"
          - "unit: androidCancel_resumeForCancelledId_unknownTransferCancel"
        notes: "Split from E40-09 in review cycle 3: macOS half is E40-20."

