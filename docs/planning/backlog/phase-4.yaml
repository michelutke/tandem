        description: |
          Two layers. Integration (every PR, macOS runner): via the E15-15 harness, the JVM client
          (linking the pure-Kotlin transfer engine with a temp-directory publisher in place of
          MediaStore) sends and receives a 256 MiB random file to/from the real Mac server; the
          harness closes the socket abruptly at 50 %, reconnects, and checks resume. Manual gate
          (phase exit, docs/testing/manual-gates.md via E00-23): a 4 GB file each direction on the
          same real Wi-Fi, Wi-Fi disabled on the phone at ~2 GB for 30 s, then re-enabled.
