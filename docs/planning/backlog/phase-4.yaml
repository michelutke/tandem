  - id: E41
    title: Photo browser
    labels: [area:photos]
    prd: [F-7.4]
    use_cases: [UC-17]
    summary: |
      Let the Mac browse the phone's photo library as a paged grid with cached thumbnails and
      download originals through the existing file-transfer machinery, respecting Android's
      scoped and partial media permissions.
    scope:
      - photos.proto messages and SPEC.md photo-browser section (messages ride the FILES channel; decision in E01-04)
      - Android media permission handling (full and partial access)
      - MediaStore cursor paging and thumbnail generation
      - Mac grid UI and LRU thumbnail disk cache
      - Original download reusing file transfer
      - "Outstanding-request caps: <= 8 ThumbRequests and <= 1 PhotoPage per peer (PhotoError BUSY); untrusted cursor -> INVALID_CURSOR; unpair deletes the phone's cached thumbnails; 10k-library tests (E41-09, E41-11)."
    out_of_scope:
      - File transfer mechanics themselves (E40)
      - Video playback (browsing lists videos, but no in-app video preview in v1)
    exit_criteria:
      - "A 10 000-item library pages in exactly 100 PhotoPage requests with <= 300 decoded thumbnails in memory, disk cache within its cap and < 150 MiB peak memory growth (E41-09); Android reads <= limit + 1 rows per page (E41-11)."
      - Selecting partial access on Android 14+ re-triggers a photo re-selection prompt when
        more photos are requested
      - An original download completes and matches the source file's hash via the E40 pipeline
    issues:
      - id: E41-01
        title: "[protocol] photos.proto: PhotoPage and Thumb messages"
        type: task
        platforms: [protocol]
        priority: P0
        size: S
        prd: [F-7.4]
        use_cases: [UC-17, AC-19]
        invariants: []
        depends_on: [E01-05, E01-10, E01-14, E01-16, E01-04, E15-01, E15-02, E15-03, E01-22]
        description: |
          Define `PhotoPage{cursor, limit}`, `PhotoPageResult{items: PhotoMeta{id, takenAt,
          width, height}, nextCursor, access: FULL|PARTIAL|NONE}`, `ThumbRequest{id, maxPx}`,
          `ThumbResult{id, pngBytes}`, `OriginalRequest{id, transferId}` (the phone answers with
          a FileOffer using `transferId`) and `PhotoError{kind: PAGE|THUMB|ORIGINAL, ref,
          reason: NOT_FOUND|ACCESS_DENIED|INVALID_CURSOR}` on FILES (no PHOTOS channel; decision
          recorded in E01-04). Document in SPEC.md: opaque stable cursor, `limit` clamped to
          1..200 (default 100), `maxPx` clamped to 32..384 so a worst-case RGB PNG fits one
          1 MiB frame, and that the FILES sender interleaves per stream (implemented in
          E40-03/E40-04). Provide vectors for a page response, a thumb response, an original
          request and each PhotoError reason.
          Cycle 4: PhotoError.reason gains BUSY (more than 8 outstanding ThumbRequests or more than 1 outstanding PhotoPage per peer, E01-22).
        acceptance:
          - photos.proto compiles on both codegens
          - SPEC.md documents cursor paging semantics, the 1..200 limit and 32..384 maxPx clamps,
            and the OriginalRequest → FileOffer(transferId) flow
          - Vectors cover a PhotoPageResult with access PARTIAL, a ThumbResult, an OriginalRequest
            and every PhotoError reason
          - SPEC.md states photo messages ride FILES and that the FILES sender interleaves per stream (round-robin between active transfers and thumbnail/page responses) so an in-flight transfer never blocks a ThumbResult for more than one chunk.
          - "PhotoError.reason includes BUSY and SPEC.md states the outstanding-request caps."
        tdd:
          - "conformance: photoPageResultVector_partialAccess_bothCodecsDecodeAccessPartial"
          - "conformance: thumbResultVector_bothCodecs_decodeIdenticalPngBytes"
          - "conformance: originalRequestVector_bothCodecs_decodeTransferId"
          - "conformance: photoErrorVectors_everyReason_roundTripOnBothCodecs"

      - id: E41-02
        title: "[android] Media permission handling (full and partial access)"
        type: story
        platforms: [android]
        priority: P0
        size: M
        prd: [F-7.4]
        use_cases: [UC-17]
        invariants: []
        depends_on: [E20-02, E41-01, E00-20, E00-21]
        description: |
          Request `READ_MEDIA_IMAGES`/`READ_MEDIA_VIDEO` (API 33+, plus
          `READ_MEDIA_VISUAL_USER_SELECTED` on API 34+) or `READ_EXTERNAL_STORAGE` below 33.
          A feature-local `MediaPermissionChecker` over `checkSelfPermission` and SDK_INT maps the
          grant state to FULL, PARTIAL (API 34+: only USER_SELECTED granted) or NONE, reported in
          every PhotoPageResult.access. When access is PARTIAL and the Mac asks for more, the
          phone posts a "Select more photos" notification that relaunches the permission request
          (system re-selection picker). Robolectric tests (E00-20) with `@Config(sdk = …)` cover
          the mapping; the partial-grant state on a real permission controller is
          `instrumented:` (E00-21, API 35 device, grants via `pm grant` / `pm revoke`).
        acceptance:
          - On API 33 the request contains READ_MEDIA_IMAGES and READ_MEDIA_VIDEO; on API 34+ it
            also contains READ_MEDIA_VISUAL_USER_SELECTED; on API 32 only READ_EXTERNAL_STORAGE
          - Only USER_SELECTED granted maps to PARTIAL; IMAGES granted maps to FULL; nothing
            granted maps to NONE and PhotoPage returns zero items with access NONE
          - With PARTIAL access, a Mac request for more posts exactly one "Select more photos"
            notification whose tap launches the permission request
        tdd:
          - "unit: mediaPermission_api34_requestIncludesVisualUserSelected"
          - "unit: mediaPermission_api32_requestsOnlyReadExternalStorage"
          - "unit: mediaPermission_onlyUserSelectedGranted_mapsToPartial"
          - "unit: mediaPermission_nothingGranted_pageReturnsZeroItemsAccessNone"
          - "unit: mediaPermission_partialAndMoreRequested_postsOneSelectMoreNotification"
          - "instrumented: mediaPermission_pmGrantUserSelectedOnlyApi35_reportsPartial"

      - id: E41-03
        title: "[android] MediaStore cursor-paged query"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-7.4]
        use_cases: [UC-17]
        invariants: []
        depends_on: [E41-01, E41-02, E00-20, E00-21]
        description: |
          Implement PhotoPage handling via a feature-local `MediaStoreSource` seam (keyset query
          ordered by `DATE_TAKEN DESC, _ID DESC`, cursor = last-seen (dateTaken, id), bound via
          selectionArgs only) so paging never re-scans from the start. JVM tests use an in-memory
          `MediaStoreSource` fake that counts rows read; the real ContentResolver implementation
          is `instrumented:` against a MediaStore seeded with 250 generated images (E00-21).
          The cursor comes from the Mac and is untrusted: anything that does not decode to
          (long, long) returns PhotoError INVALID_CURSOR.
        acceptance:
          - 250 items with limit 100 yield pages of 100, 100, 50; the last page has no nextCursor
          - Items sharing one dateTaken are split across pages without duplicates or gaps (id tie-break)
          - A photo inserted newer than the first page does not shift or duplicate later pages
          - limit 0 (unset) is served as 100 and limit 500 as 200
          - A cursor containing `') OR 1=1 --` returns PhotoError INVALID_CURSOR and no items
          - On the emulator with 250 seeded images, paging returns exactly 250 unique ids
        tdd:
          - "unit: photoPaging_items250Limit100_pagesOf100And100And50ThenNoCursor"
          - "unit: photoPaging_sameDateTakenAcrossBoundary_noDuplicatesOrGaps"
          - "unit: photoPaging_newerPhotoInsertedBetweenPages_laterPagesUnchanged"
          - "unit: photoPaging_limit500_clampedTo200"
          - "unit: photoPaging_sqlFragmentCursor_invalidCursorErrorNoItems"
          - "instrumented: mediaStoreSource_seeded250Images_pagesReturn250UniqueIds"

      - id: E41-04
        title: "[android] Thumbnail generation via ThumbRequest"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-7.4]
        use_cases: [UC-17, AC-19]
        invariants: []
        depends_on: [E41-01, E41-02, E00-21]
        description: |
          On ThumbRequest{id, maxPx}, clamp maxPx to 32..384, generate a thumbnail with
          `ContentResolver.loadThumbnail` behind a feature-local `ThumbnailLoader` seam, encode
          PNG (RGB, no alpha) and return ThumbResult; a missing or inaccessible id returns
          PhotoError NOT_FOUND / ACCESS_DENIED. JVM tests use a fake loader returning a known
          bitmap; the real loader is `instrumented:` on seeded MediaStore images (E00-21).
        acceptance:
          - A request with maxPx 256 for a 4000×3000 image returns a PNG whose longest edge is ≤ 256
          - maxPx 4096 is served as 384; maxPx 8 as 32
          - An id outside the current grant returns PhotoError ACCESS_DENIED and the handler keeps
            serving later requests
          - On the emulator, a seeded 4000×3000 JPEG yields a decodable PNG ≤ 384 px and ≤ 450 KiB
          - "A 9th outstanding ThumbRequest is answered with PhotoError BUSY without loading a thumbnail."
        tdd:
          - "unit: thumbGeneration_maxPx256_longestEdgeAtMost256"
          - "unit: thumbGeneration_maxPx4096_clampedTo384"
          - "unit: thumbGeneration_idOutsideGrant_accessDeniedErrorAndNextRequestServed"
          - "instrumented: thumbnailLoader_seeded4000x3000Jpeg_pngAtMost384pxAnd450KiB"
          - "unit: thumbGeneration_ninthOutstandingRequest_busyErrorNoLoad"

      - id: E41-05
        title: "[macos] Photo grid UI with paging"
        type: story
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-7.4]
        use_cases: [UC-17]
        invariants: []
        depends_on: [E41-01, E22-01, E12-12, E00-26]
        description: |
          A grid view that requests successive PhotoPage pages (limit 100) when the last visible
          index is within 50 of the loaded count, and ThumbRequests (maxPx 256) only for visible
          cells plus one viewport of prefetch above and below. The view model talks to a
          feature-local `PhotoService` over `TandemSession` (E12-12) and is tested with a fake
          service; rendered states are XCUITest with DEBUG scenario seeding (E00-26).
        acceptance:
          - With 100 items loaded, making index 50 visible issues one PhotoPage with the last
            nextCursor; index 49 issues none
          - While a page request is in flight, further scrolling issues no second request
          - ThumbRequests are issued only for visible cells plus one viewport each side
          - Access PARTIAL shows the limited-access banner with a "Select more on phone" button
            that sends the more-photos request (UC-17)
        tdd:
          - "unit: photoGridVm_lastVisibleIndexWithin50OfLoaded_requestsNextPage"
          - "unit: photoGridVm_pageInFlight_noDuplicateRequest"
          - "unit: photoGridVm_visibleRange_thumbRequestsOnlyVisiblePlusOneViewport"
          - "ui: photoGrid_seededPartialAccess_showsLimitedBannerWithSelectMoreButton"

      - id: E41-06
        title: "[macos] LRU disk thumbnail cache with size cap"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-7.4]
        use_cases: [UC-17, AC-12]
        invariants: []
        depends_on: [E41-05, E14-13]
        description: |
          Cache ThumbResult PNGs on disk keyed by (device, id, maxPx) with LRU eviction and a
          byte cap (default 256 MiB, configurable). The cache root is injected so tests use a
          temporary directory and a 1 MiB cap.
        acceptance:
          - A cached thumbnail is served with zero PhotoService calls on a repeat request
          - With a 1 MiB cap, inserting four 300 KiB entries evicts the oldest; total on-disk
            bytes are ≤ 1 MiB after every insert
          - Reading entry A before inserting a new entry evicts B instead of A
          - Re-opening the cache from the same directory serves previous entries as hits
          - A truncated/corrupt cached file is treated as a miss and deleted
          - "The cache registers with `PeerDataPurgeRegistry` (E14-13): unpairing a phone deletes all of its cached thumbnails."
        tdd:
          - "unit: thumbnailCache_repeatRequest_zeroServiceCalls"
          - "unit: thumbnailCache_fourEntriesOver1MiBCap_oldestEvictedTotalUnderCap"
          - "unit: thumbnailCache_readBeforeInsert_leastRecentlyUsedEvictedInstead"
          - "unit: thumbnailCache_reopenedFromSameDirectory_previousEntriesHit"
          - "unit: thumbnailCache_corruptFile_missAndFileDeleted"
          - "unit: thumbnailCache_peerUnpaired_entriesForPeerDeleted"

      - id: E41-07
        title: "[android] Serve original download via file transfer"
        type: story
