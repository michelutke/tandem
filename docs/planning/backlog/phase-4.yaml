phase: 4
epics:
  - id: E40
    title: File transfer (both directions, resumable)
    labels: [area:files]
    prd: [F-7.1, F-7.2, F-7.3, F-4.2]
    use_cases: [UC-14, UC-15, UC-16]
    summary: |
      Move files in either direction with an explicit offer/accept handshake, chunked and
      flow-controlled transfer, whole-file integrity verification, and resume after a dropped
      connection. Both platforms get native entry points (drag-drop, Share extension, Finder
      Services on the Mac; share target and SAF picker on Android) and a progress UI.
    scope:
      - files.proto messages and SPEC.md FILES channel section
      - Filename sanitization shared spec
      - Chunked sender/receiver on both platforms with SHA-256 verification
      - Accept/auto-accept and disk-space checks
      - Resume by offset and cancel
      - Platform entry points and destination folders
      - Progress UI and received-file notification
      - 4 GB forced-disconnect and flow-control tests
      - "Cycle-4 caps: size <= 64 GiB (TOO_LARGE), raw name <= 1024 bytes, <= 4 unanswered offers and <= 2 active transfers per direction (BUSY), auto-accept only for offers <= 1 GiB."
      - "Entry-point hardening: content:// only (no file:// or Tandem-own authority, <= 20 streams); share extension with no network or keychain entitlement, App Group queue entries validated, payload-free Darwin wake (E40-11, E40-22)."
      - "Sanitized names in prompts (E14-21/E14-22); unpair deletes retained .part files."
    out_of_scope:
      - Photo browser / thumbnails (E41, reuses this epic's transfer for originals)
      - Storage browser / WebDAV-free Finder integration (v2, F-7.5)
    exit_criteria:
      - A 4 GB file transfers successfully in both directions with a forced disconnect midway,
        and the SHA-256 matches after resume
      - "With a saturating FILES transfer, NOTIFY p95 < 100 ms and max < 500 ms over >= 200 frames on the E15-15 harness, and p95 < 500 ms on real Wi-Fi during a 4 GB transfer (E40-15)."
      - "During the 4 GB manual run peak memory stays <= 64 MiB above idle and no .part file remains (E40-14)."
      - "Over-cap offers are rejected BUSY / TOO_LARGE without a prompt on both platforms (E40-07, E40-18)."
    issues:
      - id: E40-01
        title: "[protocol] files.proto: offer/accept/chunk/complete/cancel/resume"
        type: task
        platforms: [protocol]
        priority: P0
        size: M
        prd: [F-7.1]
        use_cases: [UC-14, UC-15, UC-16, AC-19]
        invariants: []
        depends_on: [E01-05, E01-10, E01-14, E01-16, E15-01, E15-02, E15-03, E01-22]
        description: |
          Define `FileOffer{id, name, size, mime, sha256}`, `FileAccept{id}`,
          `FileReject{id, reason}`, `FileChunk{id, seq, offset, data}` (max 256 KiB payload),
          `FileComplete{id}`, `FileCancel{id, reason}`, `FileResumeRequest{id, fromOffset}` on
          FILES. `reason` is a shared `TransferReason` enum: DECLINED, TIMEOUT,
          INSUFFICIENT_SPACE, INVALID_NAME, HASH_MISMATCH, PROTOCOL_VIOLATION, USER_CANCELLED,
          UNKNOWN_TRANSFER, SOURCE_UNAVAILABLE, IO_ERROR. `sha256` in the offer is the digest of
          the whole source file (the sender hashes before offering). Document in SPEC.md: the
          handshake, chunk size, the rule `offset == seq * 262144`, that a chunk whose offset is
          not the receiver's current length or that would exceed `size` is a PROTOCOL_VIOLATION,
          the unanswered-offer timeout (300 s, receiver rejects with TIMEOUT), and resume semantics
          (receiver reports `fromOffset` = retained temp length rounded down to a 256 KiB
          boundary; retained temp files expire 24 h after the last write). Provide vectors
          including a malformed/oversized chunk.
          Cycle 4 caps (E01-22), restated in the SPEC FILES section: FileOffer.size <= 64 GiB (else FileReject
          TOO_LARGE), raw name <= 1024 UTF-8 bytes (INVALID_NAME), mime <= 255 bytes, at most 4 unanswered offers
          and 2 active transfers per direction (excess FileReject BUSY without prompting), auto-accept only for
          offers <= 1 GiB. `TransferReason` gains BUSY and TOO_LARGE.
        acceptance:
          - files.proto covers the full offer/accept/chunk/complete/cancel/resume set and
            compiles on both codegens
          - SPEC.md documents the handshake, chunk size, offset/seq rule, 300 s offer timeout,
            24 h resume retention and every TransferReason value
          - Vectors include a valid offer, accept, chunk, resume request, a reject per
            TransferReason value, and a chunk with a 262145-byte payload that both codecs reject
          - "TransferReason includes BUSY and TOO_LARGE, and SPEC.md states the E01-22 file caps."
        tdd:
          - "conformance: fileOfferAcceptVector_bothCodecs_decodeToIdenticalFields"
          - "conformance: fileResumeRequestVector_bothCodecs_decodeFromOffsetExactly"
          - "conformance: fileRejectVectors_everyTransferReason_roundTripOnBothCodecs"
          - "conformance: fileChunk262145BytePayload_bothCodecs_rejectedAsOversized"
          - "conformance: fileRejectVectors_busyAndTooLarge_roundTripOnBothCodecs"

      - id: E40-02
        title: "[protocol] Filename sanitization rule and shared vectors"
        type: task
        platforms: [protocol]
        priority: P0
        size: S
        prd: [F-7.1]
        use_cases: [UC-14, UC-15]
        invariants: []
        depends_on: [E40-01, E15-01, E15-02, E15-03]
        description: |
          Normative rule in SPEC.md for sanitizing an incoming FileOffer.name before use as a
          destination filename, enforced independently by each receiver (E40-16 Android, E40-17
          macOS), never trusting the sender. Order: reject if the name contains U+0000 (reason
          INVALID_NAME); take the last component after splitting on `/` and `\`; normalize to NFC;
          remove bidi controls U+202A–U+202E and U+2066–U+2069; replace other C0 controls, U+007F
          and `:` with `_`; strip leading dots; if the result is empty, all dots, `.` or `..`,
          use `file-<first 8 hex chars of transfer id>`; prefix `_` to a Windows-reserved stem
          (CON, PRN, AUX, NUL, COM1–COM9, LPT1–LPT9, case-insensitive); truncate the stem on a
          code-point boundary, keeping the extension, so the UTF-8 length is at most 255 bytes.
          Vectors live in `protocol/vectors/filenames.json` (input, transfer id, expected output
          or INVALID_NAME) and run on both platforms via the conformance runners (E15-01/E15-02).
          Required cases, transfer id `1a2b3c4d…`: `../../etc/passwd` → `passwd`;
          `/Users/x/secret.txt` → `secret.txt`; `C:\Windows\evil.exe` → `evil.exe`;
          `a<U+0000>b.txt` → INVALID_NAME; `.bashrc` → `bashrc`; `..` → `file-1a2b3c4d`;
          empty → `file-1a2b3c4d`; `CON` → `_CON`; `nul.txt` → `_nul.txt`;
          `e<U+0301>.txt` (NFD) → `é.txt` (NFC, U+00E9); `invoice<U+202E>fdp.exe` →
          `invoicefdp.exe`; 300 × `a` + `.pdf` → 251 × `a` + `.pdf`; 200 × `é` + `.jpg` →
          125 × `é` + `.jpg` (254 bytes).
        acceptance:
          - SPEC.md states the ordered rule above and marks it MUST for every receiver
          - filenames.json contains every required case with its expected output and validates
            against its JSON schema in CI
          - The conformance runners on both platforms execute every filenames.json case and fail
            on any mismatch
        tdd:
          - "ci: filenameVectors_schemaValidation_everyCaseHasInputAndExpected"
          - "conformance: filenameVectors_allCases_bothPlatformsProduceExpectedName"
          - "conformance: filenameVectors_nulByteCase_bothPlatformsReturnInvalidName"
        notes: "Split from E40-02 in review cycle 3: platform implementations moved to E40-16 (Android) and E40-17 (macOS)."

      - id: E40-03
        title: "[android] Sender: chunked read, hashing, flow control"
        type: task
        platforms: [android]
        priority: P0
        size: L
        prd: [F-7.1]
        use_cases: [UC-15]
        invariants: []
        depends_on: [E40-01, E40-02, E11-07, E12-11, E00-18, E00-19]
        description: |
          Hash the source (`ContentResolver` stream behind a feature-local `SourceFileReader`
          seam) in one streaming SHA-256 pass with a fixed 256 KiB buffer, send FileOffer with
          that digest, then on FileAccept stream 256 KiB chunks with seq 0..n-1 and
          `offset = seq * 262144`, gated on FILES credits (E11-07), then FileComplete. The FILES
          sender interleaves per stream (round-robin between active transfers and E41 page/thumb
          responses) so an in-flight transfer never delays a ThumbResult by more than one chunk.
          Message-level tests use `FakeTandemSession` (E12-11) and JUnit `@TempDir` fixture
          files; the credit test runs the real E11-07 multiplexer over an `InMemoryDuplexPipe`
          (E00-19); timing uses `TestClock` and test dispatchers (E00-18).
        acceptance:
          - A 10 MiB + 1 byte file is sent as exactly 41 chunks, seq 0..40 contiguous, offsets
            seq × 262144, last chunk 1 byte, followed by one FileComplete
          - The FileOffer for a fixture containing `abc` carries SHA-256
            ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
          - A 0-byte file sends FileOffer size 0, no FileChunk, then FileComplete
          - With zero FILES credits no FileChunk leaves the sender; one credit grant releases
            exactly the granted number of chunks
          - FileReject from the receiver results in zero chunks sent and sender state Rejected(reason)
          - A source read failing mid-transfer sends FileCancel IO_ERROR and no further chunks
          - With a transfer in flight, a queued ThumbResult is sent after at most one FileChunk
        tdd:
          - "unit: androidSender_tenMiBPlusOneByteFile_sends41ContiguousChunksThenComplete"
          - "unit: androidSender_abcFixture_offerCarriesKnownSha256"
          - "unit: androidSender_zeroByteFile_offerThenCompleteWithNoChunks"
          - "unit: androidSender_zeroFilesCredits_noChunkUntilGrant"
          - "unit: androidSender_fileRejectReceived_zeroChunksSentAndStateRejected"
          - "unit: androidSender_sourceReadFailsMidTransfer_sendsFileCancelIoError"
          - "unit: androidFilesScheduler_transferInFlight_thumbResultSentWithinOneChunk"

