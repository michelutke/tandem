          - A Mac SendSmsRequest reaches RecordingSmsSender with the composed body and address;
            fake sent+delivery results leave the Mac message in state DELIVERED within 2 s.
          - "Physical phone: an SMS from a second phone appears in the Mac thread list < 2 s in 10
            of 10 trials (UC-18)."
          - "Physical phone: a Mac-composed SMS reaches the recipient and the Mac shows DELIVERED."
          - "Physical phone in airplane mode with Wi-Fi re-enabled: a Mac send shows FAILED on the
            Mac within 10 s (UC-19)."
        tdd:
          - "integration: e2eSms_fiveThousandFixtureInitialSync_macStoreHas5000UniqueMessages"
          - "integration: e2eSms_disconnectAfterPageTen_macStoreEndsWithExactly5000"
          - "integration: e2eSms_fakeSourceInsert_visibleInMacStoreWithin2s"
