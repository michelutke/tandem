phase: 5
epics:
  - id: E50
    title: SMS read, sync, send
    labels: [area:messaging]
    prd: [F-8.1, F-8.2]
    use_cases: [UC-18, UC-19]
    summary: |
      Read-only sync of SMS threads and messages from the Android Telephony provider to the Mac
      (initial paged backfill + incremental _id-watermark sync via ContentObserver), and sending
      SMS from the Mac through SmsManager with sent/delivered status reported back, including
      multi-SIM subscription choice. Sync cursors are Mac-authoritative: the Mac persists
      highWatermarkId/backfillCursorId and sends them on every reconnect, so the phone keeps no
      per-Mac sync state. Includes the Mac conversation UI (thread list, message view, compose),
      the Mac GRDB/SQLite SMS store, and documents Android's non-default-SMS-app behaviour
      (system writes the Sent row; Tandem cannot update/delete provider rows). MMS and RCS are
      explicitly out of scope for v1.
    scope:
      - sms.proto messages and SPEC.md section for the SMS channel.
      - "Android: SmsSource provider read, paged initial sync session, incremental _id sync via
        ContentObserver, SmsManager.sendMultipartTextMessage with sent/delivered PendingIntent
        status, multi-SIM SubscriptionManager chooser + SimList."
      - "macOS: SMS sync client, thread list, message view, compose UI, GRDB SQLite SMS store
        (0600, backup-excluded, no app-level encryption in v1)."
      - Cross-platform end-to-end sync+send integration test and an invariant-7 log audit.
      - MMS/RCS scope spike resolving Appendix C.4 (E50-12).
      - "Cycle-4 caps: <= 1 SmsSyncRequest in flight (a new one supersedes), body <= 1600 chars (TOO_LONG), <= 10 sends per 60 s (RATE_LIMITED); Mac display strings through E14-22; unpair purges the SMS store (PeerDataPurging, E14-13)."
    out_of_scope:
      - MMS (images/attachments) -- v2 (PRD Capability 8, PRD Appendix C.4).
      - RCS -- not accessible to third-party apps on Android (PRD Appendix C.4).
      - Making Tandem the default SMS app (documented decision in E50-06, revisit v2).
      - Mark-as-read / delete on the phone from the Mac (needs default-SMS-app role, v2).
      - "Contacts sync (E51) and call control (E52); call log UI is v2 (PRD F-8.4 note)."
    exit_criteria:
      - Send and receive SMS from the Mac (roadmap Phase 5 exit criterion).
      - A 5k-message fixture completes initial sync in pages of <= 200 messages with no gaps or
        duplicates across a forced mid-sync disconnect (E50-10).
      - "A log audit (tools/log-audit, E15-17) over a canary SMS session finds zero occurrences of
        the canary body or number in logs (invariant 7)."
      - "A body over 1600 characters fails TOO_LONG and an 11th send within 60 s fails RATE_LIMITED, without calling SmsManager (E50-04)."
    issues:
      - id: E50-01
        title: "[protocol] sms.proto: threads, messages, sync cursors, send, SIM list"
        type: task
        platforms: [protocol]
        priority: P0
        size: M
        prd: [F-8.1, F-8.2]
        use_cases: [UC-18, UC-19, AC-19]
        invariants: [7]
        depends_on: [E01-10, E01-14, E01-16, E15-01, E15-02, E01-22]
        description: |
          protocol/proto/tandem/v1/sms.proto: SmsThread{threadId, address, snippet,
          lastMessageAtMs, unreadCount}, SmsMessage{id, threadId, address, body, timestampMs,
          type, subscriptionId, deliveryStatus}, SmsSyncRequest{sinceId, backfillBeforeId,
          pageSize}, SmsSyncResponse{status (OK | PERMISSION_REQUIRED), threads[], messages[],
          highWatermarkId, backfillCursorId, backfillComplete}, SendSmsRequest{clientMessageId,
          threadId, address, subscriptionId, body}, SendSmsStatus{clientMessageId, state
          (SENDING | SENT | DELIVERED | FAILED), errorCode, providerMessageId},
          SimList{subscriptions[]{subscriptionId, displayName, slotIndex}}. Cursor semantics
          (Mac-authoritative): sinceId=0 and backfillBeforeId=0 means fresh sync (phone snapshots
          max _id M, backfills descending from M, highWatermarkId=M); otherwise the phone first
          sends rows with _id > sinceId ascending, then continues backfill below
          backfillBeforeId. clientMessageId is a Mac-generated UUID echoed by every status so
          the optimistic bubble is matched without guessing. Adds the SMS channel oneof case to
          Envelope (F-3.2). Write docs/protocol/SPEC.md SMS section. Vectors: message round
          trip, all SendSmsStatus states, sync response with cursors, oversized-body frame
          rejected before allocation (mirrors E01-03's max-frame rule).
          Cycle 4: SendSmsStatus.errorCode gains TOO_LONG (body > 1600 characters) and RATE_LIMITED (> 10 sends per 60 s); SPEC states at most one SmsSyncRequest in flight (a new one supersedes) per E01-22.
        acceptance:
          - buf lint reports zero violations on sms.proto.
          - docs/protocol/SPEC.md documents the fresh / forward / backfill cursor rules above,
            clientMessageId echo, providerMessageId, and SimList publish-on-change.
          - protocol/vectors/sms/*.json committed; conformance passes on both codecs.
          - An envelope whose SMS body pushes the frame over the E01-03 max frame size is
            rejected before the body buffer is allocated, on both codecs.
        tdd:
          - "ci: smsProto_bufLint_zeroViolations"
          - "conformance: smsMessageVector_fullMessage_roundTripsToGoldenBytes"
          - "conformance: sendSmsStatusVector_everyState_decodesToSameEnumBothCodecs"
          - "conformance: smsSyncResponseVector_withBackfillCursor_roundTripsBothCodecs"
          - "conformance: smsEnvelope_bodyOverMaxFrame_rejectedBeforeAllocation"
          - "conformance: sendSmsStatusVector_tooLongAndRateLimited_decodeBothCodecs"
        notes: "Cycle 3: added sync cursors, clientMessageId, providerMessageId, SimList and SmsSyncResponse.status."
      - id: E50-02
        title: "[android] SMS provider read via SmsSource: paged query + row mapping"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-8.1]
        use_cases: [UC-18]
        invariants: [7]
        depends_on: [E50-01, E00-20, E00-21]
        description: |
          Feature-local seam `SmsSource` in android/feature/messaging: `threads()`,
          `newerThan(sinceId, limit)` (ascending), `olderThan(beforeId, limit)` (descending),
          `maxId()`, `changes(): Flow<Unit>` (ContentObserver-backed), plus `FakeSmsSource` in
          test fixtures. Production `ContentResolverSmsSource` queries content://sms and
          content://mms-sms/conversations (text-only; no MMS parts) with LIMIT = page size
          (default 200) and closes each cursor before returning; requires READ_SMS. Row mapping
          (provider type 1/2/4/5/6 to INBOX/SENT/OUTBOX/FAILED/QUEUED, address, body, date,
          sub_id) is a pure `SmsRowMapper`. The adapter is tested under Robolectric with a fake
          ContentProvider registered for the SMS authority (E00-20); real provider columns are
          checked on the emulator with `adb emu sms send` (E00-21).
        acceptance:
          - On a 5k-row fixture olderThan(5001, 200) returns ids 5000..4801 descending, and
            newerThan(4990, 200) returns ids 4991..5000 ascending.
          - Across a full 5k-row walk no call returns more than 200 rows and every cursor is
            closed before the call returns.
          - MMS rows present in the provider are never returned.
          - Provider types 1/2/4/5/6 map to INBOX/SENT/OUTBOX/FAILED/QUEUED.
          - READ_SMS not granted makes every call throw the typed `SmsPermissionMissing`, never
            a raw SecurityException.
          - A provider notifyChange on content://sms emits one element on changes().
          - "Emulator: a message injected with `adb emu sms send 5551234 <body>` is returned by
            newerThan as INBOX with the injected address and body."
        tdd:
          - "unit: smsSource_olderThanOnFiveThousandRows_returnsDescending200IdWindow"
          - "unit: smsSource_newerThanWatermark_returnsAscendingRowsAboveWatermarkOnly"
          - "unit: smsSource_fullFiveThousandRowWalk_noCallExceedsPageSizeAndCursorsClosed"
          - "unit: smsSource_mmsRowsInProvider_excludedFromResults"
          - "unit: smsRowMapper_providerTypeCodes_mapToInboxSentOutboxFailedQueued"
          - "unit: smsSource_readSmsNotGranted_throwsSmsPermissionMissing"
          - "unit: contentResolverSmsSource_providerNotifyChange_emitsOnChangesFlow"
          - "instrumented: smsSource_adbEmuSmsSend_returnsInboxRowWithInjectedAddressAndBody"
        notes: "Split in review cycle 3: provider read stays here; sync session streaming/resume moved to E50-13. Size L -> M."
      - id: E50-03
        title: "[android] Incremental SMS sync via _id watermark + ContentObserver"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-8.1]
        use_cases: [UC-18]
        invariants: [7]
        depends_on: [E50-13, E00-18, E00-21]
        description: |
          During a live session, `SmsSource.changes()` (subscribed before the session's first
          snapshot query) triggers `newerThan(lastSentId)`; lastSentId is held in memory per
          session and initialised from the Mac's sinceId / the fresh-sync snapshot max. Bursts of
          callbacks are debounced 250 ms using the injected dispatcher and `TestClock` (E00-18).
          No Android-persisted watermark: after process death the Mac's next SmsSyncRequest
          supplies sinceId (E50-14), which keeps one source of truth and is multi-Mac safe.
          Sent rows written by the system for Tandem sends (E50-06) arrive here as type SENT like
          any other row. The subscription is cancelled when the session closes.
        acceptance:
          - One inserted row after a change callback produces exactly one SmsSyncResponse
            containing only that row.
          - Five change callbacks within 250 ms cause one query and one push; already pushed
            rows are never re-pushed.
          - A row inserted between the snapshot query and the first change callback is
            delivered exactly once.
          - After a process restart, a new session with SmsSyncRequest{sinceId=N} pushes only
            rows with _id > N.
          - After session close no further provider query is issued.
          - "Emulator: `adb emu sms send` results in a push frame recorded on the session within
            1 s (phone-side share of UC-18's 2 s budget)."
        tdd:
          - "unit: incrementalSync_singleInsertedRow_pushesExactlyThatRow"
          - "unit: incrementalSync_fiveCallbacksWithin250ms_singleQueryAndPush"
          - "unit: incrementalSync_rowInsertedDuringSnapshot_deliveredExactlyOnce"
          - "unit: incrementalSync_newSessionAfterProcessRestart_pushesOnlyRowsAboveSinceId"
          - "unit: incrementalSync_sessionClosed_noFurtherProviderQuery"
          - "instrumented: smsObserver_adbEmuSmsSend_pushRecordedWithin1s"
        notes: "Cycle 3: Android-persisted watermark replaced by Mac-authoritative sinceId (E50-01/E50-14)."
      - id: E50-04
        title: "[android] SmsManager multipart send with delivery status"
        type: story
        platforms: [android]
        priority: P0
        size: L
        prd: [F-8.2]
        use_cases: [UC-19, AC-19]
        invariants: [7]
        depends_on: [E50-01, E50-02, E12-11, E00-20, E00-23]
        description: |
          Feature-local seam `SmsSender` (android/feature/messaging) wraps
          SmsManager.divideMessage + sendMultipartTextMessage(destination, null, parts,
          sentIntents, deliveryIntents); `RecordingSmsSender` in test fixtures. A
          `SendResultReceiver` feeds per-part PendingIntent results into a pure
          `SendStatusAggregator` that emits SendSmsStatus (echoing clientMessageId) on the SMS
          channel via TandemSession (E12-11; FakeTandemSession in tests). Result mapping:
          RESULT_OK, RESULT_ERROR_GENERIC_FAILURE, RESULT_ERROR_NO_SERVICE (UC-19 "no signal"),
          RESULT_ERROR_NULL_PDU, RESULT_ERROR_RADIO_OFF each to a distinct errorCode. Requires
          SEND_SMS (requested lazily per phase 2). After all parts are SENT, looks up the
          system-written provider row (E50-06) via SmsSource (newest SENT/OUTBOX row for the
          address after send start) and reports it as providerMessageId. Divide-message logic
          runs under Robolectric (E00-20). Failure logging carries the result code only, never
          the body or address (invariant 7).
        acceptance:
          - A 200-character GSM-7 body divides into 2 parts; a 100-character UCS-2 body divides
            into 2 parts (67 characters per part).
          - All parts RESULT_OK yields exactly one SendSmsStatus{SENT}; any failed part yields
            exactly one SendSmsStatus{FAILED} with that part's errorCode.
          - Each of the five SmsManager result codes above maps to a distinct errorCode;
            RESULT_ERROR_NO_SERVICE maps to NO_SERVICE.
          - Delivery reports for all parts yield SendSmsStatus{DELIVERED}.
          - SEND_SMS not granted yields FAILED/PERMISSION_DENIED without calling SmsSender.
          - The SENT status carries the providerMessageId of the system-written row, or 0 when
            none is found within 5 s.
          - Log lines emitted on failure contain the result code and clientMessageId only.
          - "Physical phone with SIM: a 2-part message to a second phone reaches DELIVERED within
            30 s, and the provider gains exactly one type SENT row written by the system."
          - "A body over 1600 characters yields FAILED/TOO_LONG, and an 11th send within 60 s yields FAILED/RATE_LIMITED, both without calling SmsSender."
        tdd:
          - "unit: smsSender_twoHundredCharGsm7Body_dividedIntoTwoParts"
          - "unit: smsSender_hundredCharUcs2Body_dividedIntoTwoParts"
          - "unit: sendStatusAggregator_allPartsResultOk_emitsSingleSentStatus"
          - "unit: sendStatusAggregator_secondPartNoService_emitsFailedNoService"
          - "unit: sendResultMapper_eachSmsManagerResultCode_mapsToDistinctErrorCode"
          - "unit: sendStatusAggregator_allDeliveryReportsOk_emitsDelivered"
          - "unit: sendSmsHandler_sendSmsNotGranted_failsPermissionDeniedWithoutSending"
          - "unit: sendSmsHandler_systemProviderRowPresent_reportsProviderMessageId"
          - "unit: sendFailureLogging_radioOffResult_logLinesOmitBodyAndAddress"
          - "manual: smsSender_realCarrierTwoPartSend_deliveredWithin30s"
          - "manual: smsSender_nonDefaultAppSend_systemWritesOneSentProviderRow"
          - "unit: sendSmsHandler_bodyOver1600Chars_failsTooLongWithoutSending"
          - "unit: sendSmsHandler_eleventhSendWithin60s_failsRateLimited"
        notes: "Cycle 3: size M -> L (send + status aggregation + provider-row reconciliation + permission path)."
      - id: E50-05
        title: "[android] Multi-SIM subscription chooser for send + SimList"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-8.2]
        use_cases: [UC-19]
        invariants: []
        depends_on: [E50-04, E00-23]
        description: |
          Feature-local seam `SubscriptionSource` over SubscriptionManager
          (`activeSubscriptions(): List<SimInfo>`, `defaultSmsSubscriptionId()`, `changes()`),
          `FakeSubscriptionSource` in test fixtures. SendSmsRequest.subscriptionId selects
          SmsManager.getSmsManagerForSubscriptionId; absent subscriptionId uses the default SMS
          subscription when valid, otherwise fails SUBSCRIPTION_REQUIRED (never guesses a SIM on
          dual-SIM with "ask every time"). Publishes SimList (E50-01) on the SMS channel at
          session start and on OnSubscriptionsChangedListener so the Mac only shows a SIM picker
          with 2+ active SIMs. Requires READ_PHONE_STATE for the subscription list; denied
          yields an empty SimList and default-manager sends.
        acceptance:
          - With two fake subscriptions, subscriptionId=2 sends through the subscription-2 sender.
          - With one active SIM and no subscriptionId, the default sender is used.
          - With two SIMs, no subscriptionId and no valid default SMS subscription, the status is
            FAILED/SUBSCRIPTION_REQUIRED and nothing is sent.
          - An unknown subscriptionId yields FAILED/INVALID_SUBSCRIPTION.
          - A subscription change publishes an updated SimList with the new entries.
          - "Physical dual-SIM phone: a send with SIM 2 selected is received by the recipient
            from SIM 2's number."
        tdd:
          - "unit: simChooser_explicitSubscriptionIdOnDualSim_usesThatSubscriptionSender"
          - "unit: simChooser_noSubscriptionIdOnSingleSim_usesDefaultSender"
          - "unit: simChooser_noSubscriptionIdOnDualSimNoDefault_failsSubscriptionRequired"
          - "unit: simChooser_unknownSubscriptionId_failsInvalidSubscription"
          - "unit: simListPublisher_subscriptionsChanged_sendsUpdatedSimList"
          - "manual: smsSend_dualSimSecondSimSelected_recipientSeesSecondSimNumber"
        notes: "Cycle 3: SIM list moved from DeviceStatus to sms.proto SimList (no cross-file change); size S -> M."
      - id: E50-06
        title: "[docs] Document non-default-SMS-app provider behavior"
        type: doc
        platforms: [docs]
        priority: P0
        size: S
        prd: [F-8.2]
        use_cases: [UC-19]
        invariants: []
        depends_on: [E50-04]
        description: |
          Since Android 4.4, only the default-SMS-app role holder may insert/update/delete rows
          in the SMS provider. For an app that is not the default, the system itself writes
          messages sent via SmsManager.sendTextMessage/sendMultipartTextMessage to the provider
          (SmsManager API docs), so Tandem-originated sends do appear as Sent rows and flow back
          through incremental sync (E50-03). Tandem cannot mark messages read, delete them, or fix
          a missing row. Tandem does not request the default-SMS-app role in v1 (revisit v2).
          The Mac reconciles its optimistic outbound message with the provider row via
          providerMessageId (E50-04/E50-14); if no provider row is reported (OEM deviation), the
          Mac keeps its own row as local-only history. The claim is verified on a physical phone
          by E50-04's manual gate.
        acceptance:
          - "docs/protocol/SPEC.md SMS section states: the system writes Sent rows for non-default
            apps, Tandem cannot update/delete provider rows, the v1 decision not to request the
            role, the providerMessageId reconciliation, and the local-only fallback."
          - The doc links the E50-04 manual gate result (device, Android version) as evidence.
        tdd: []
        notes: "Cycle 3: corrected description -- previous text claimed the provider gains no Sent row for Tandem sends."
