        notes: ""
      - id: E50-08
        title: "[macos] Message view + compose"
        type: story
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-8.1, F-8.2]
        use_cases: [UC-18, UC-19]
        invariants: []
        depends_on: [E50-07, E50-01, E50-14, E12-12, E00-08]
        description: |
          Message bubbles ordered by timestampMs and distinguished by direction; compose sends
          SendSmsRequest with a new clientMessageId through TandemSession (E12-12; fake in
          tests) and inserts an optimistic outbound row in SmsStore in state `.sending`; the
          matching SendSmsStatus (by clientMessageId) moves it to `.sent`, `.delivered` or
          `.failed(errorCode)`. SIM picker shown only when the latest SimList has 2+ entries.
        acceptance:
          - Tapping Send appends a `.sending` bubble before any status arrives.
          - SENT then DELIVERED statuses move the bubble to `.delivered`.
          - A FAILED/NO_SERVICE status shows `.failed(.noService)` with a Retry action (UC-19).
          - Retry sends a new SendSmsRequest with the same body and a new clientMessageId.
          - With 2 SIMs in SimList the picker is shown before sending; with 1 SIM the request
            omits subscriptionId.
          - Thread messages render ascending by timestampMs.
        tdd:
          - "unit: composeViewModel_sendTapped_appendsBubbleInSendingState"
          - "unit: composeViewModel_sentThenDeliveredStatus_bubbleStateDelivered"
          - "unit: composeViewModel_failedNoServiceStatus_bubbleFailedWithRetry"
          - "unit: composeViewModel_retryTapped_sendsSameBodyWithNewClientMessageId"
          - "unit: composeViewModel_twoSimsInSimList_showsSimPickerBeforeSend"
          - "unit: messageViewModel_threadMessages_orderedAscendingByTimestamp"
        notes: ""
      - id: E50-09
        title: "[macos] Local SMS store: GRDB SQLite persistence + at-rest decision"
        type: task
        platforms: [macos]
        priority: P0
        size: L
        prd: [F-8.1, F-2.3]
        use_cases: [UC-18, UC-07]
        invariants: [7]
        depends_on: [E50-01, E14-13, E00-08]
        description: |
          SQLite via GRDB in TandemStore: database file
          `Application Support/Tandem/sms.sqlite` inside the app sandbox container. A shared
          `TandemDatabaseFactory` (reused by the contacts cache, E51-04) opens GRDB
          DatabasePools with: file mode 0600 on the database and its -wal/-shm sidecars;
          `URLResourceValues.isExcludedFromBackup = true` on each file (no SMS copies in Time
          Machine); `FileProtectionType.completeUntilFirstUserAuthentication` set where the
          platform supports it; GRDB migrations for schema versioning. At-rest decision: no
          application-level encryption in v1 (FileVault assumed; single-user Mac per PRD target
          user) -- trade-off recorded in SPEC.md / an ADR note. Separation: the trust store stays
          in the Keychain (E13-06 via KeychainStore E10-16); the settings store is separate; this
          database holds only SMS data. API behind an `SmsStore` protocol (threads, messages by
          thread, upsert batch + cursors in one transaction, optimistic outbound rows,
          `purgeAll(peer:)`, diagnostics) with `GrdbSmsStore` and `InMemorySmsStore` (for
          view-model tests). Rows are keyed by peer fingerprint; `GrdbSmsStore` conforms to
          `PeerDataPurging` and registers with E14-13's `PeerDataPurgeRegistry` at app start, so
          unpair calls `purgeAll(peer:)` and no SMS of an unpaired phone remains. Never log contents
          (invariant 7): diagnostics expose only row counts and ids. Tests use a temp directory
          for the GRDB file.
        acceptance:
          - Rows written, the pool closed and reopened, returns every previously written row.
          - sms.sqlite, sms.sqlite-wal and sms.sqlite-shm all have POSIX mode 0600.
          - sms.sqlite reads back isExcludedFromBackup == true.
          - Where URLResourceValues.fileProtection is supported, sms.sqlite reads back
            completeUntilFirstUserAuthentication.
          - The default location resolves to Application Support/Tandem/sms.sqlite within the
            sandbox container.
          - Upserting the same message id twice leaves one row.
          - Unpairing peer A deletes all of A's threads, messages and cursors and leaves peer B's
            rows intact.
          - The diagnostics report contains counts and ids and no body or address string.
          - The at-rest decision, rationale and Keychain/settings separation are recorded in
            docs/protocol/SPEC.md or an ADR note referenced from it.
        tdd:
          - "unit: grdbSmsStore_reopenAfterClose_returnsAllPersistedRows"
          - "unit: smsDatabaseFile_created_hasPosixMode0600"
          - "unit: smsDatabaseWalSidecars_afterFirstWrite_havePosixMode0600"
          - "unit: smsDatabaseFile_created_isExcludedFromBackupTrue"
          - "unit: smsDatabaseFile_protectionSupported_readsBackCompleteUntilFirstUserAuth"
          - "unit: smsStore_upsertSameMessageIdTwice_leavesSingleRow"
          - "unit: smsStore_peerUnpaired_allRowsForPeerDeleted"
          - "unit: smsStoreDiagnostics_afterSync_containsCountsButNoBodies"
        notes: |
          Cycle 3: replaced "consistent with the trust store's storage technology" (Keychain --
          wrong for bulk message data) with GRDB SQLite. GRDB is a new third-party dependency --
          needs review (license MIT, maintenance, binary size). Size M -> L.
          Cycle 3 integration: E14-13 now defines the `PeerDataPurging` hook API and calls every
          registered purger on unpair; this store and the contacts cache (E51-04) register with it.
      - id: E50-10
        title: "[cross] End-to-end SMS sync + send integration test"
        type: test
        platforms: [android, macos]
        priority: P0
        size: M
        prd: [F-8.1, F-8.2]
        use_cases: [UC-18, UC-19]
        invariants: [7]
        depends_on: [E50-03, E50-04, E50-08, E50-13, E50-14, E15-15, E00-23]
        description: |
          Extends the E15-15 JVM harness: the JVM client links android/feature/messaging's sync
          session, incremental sync and send handler with `FakeSmsSource` (5k-message fixture)
          and `RecordingSmsSender`, against the real Mac server on the macOS runner. The harness
          can drop the TCP connection mid-sync. Real carrier behaviour is covered by manual gates
          on a physical phone with SIM (E00-23). Satisfies the roadmap Phase 5 exit criterion
          "send and receive SMS from the Mac".
        acceptance:
          - After initial sync of the 5k fixture the Mac store holds exactly 5000 unique messages.
          - A connection drop after page 10 followed by reconnect ends with exactly 5000 messages
