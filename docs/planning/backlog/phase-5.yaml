  - id: E52
    title: Calls control
    labels: [area:calls]
    prd: [F-8.4]
    use_cases: [UC-20, UC-21]
    summary: |
      Incoming-call detection with caller ID resolved via the contacts cache (E51), a Mac alert
      shown within 1 s with answer/decline actions, hang up of an active call, and placing
      outgoing calls from the Mac. Audio always stays on the phone (PRD non-goal: no Bluetooth
      HFP audio bridging). A spike first settles which Android call APIs to use so detection and
      control do not require becoming the default dialer or a call-screening app.
    scope:
      - calls.proto messages and SPEC.md section.
      - "Android: CallGateway seam over TelephonyCallback/TelecomManager -- incoming-call
        detection, answer/decline/hangup, outgoing placement with background-start handling."
      - "macOS: incoming-call alert UI, place-call UI with SIM picker."
      - Cross-platform / device-level latency and control test.
      - "PlaceCallRequest hardening: address must match ^\\+?[0-9]{3,20}$ after removing spaces and dashes (no MMI/USSD * #, no , ;) -> INVALID_NUMBER; <= 1 request per 5 s -> RATE_LIMITED; caller names sanitized (E14-22)."
    out_of_scope:
      - Call audio on the Mac (Bluetooth HFP) -- PRD non-goal.
      - Call log UI -- v2 (PRD F-8.4 note).
      - Becoming the default dialer or a CallScreeningService (decision recorded in E52-02).
    exit_criteria:
      - Incoming call shows on the Mac within 1 s p95 (roadmap Phase 5 exit criterion).
      - Answer, decline, hang up, and place-call all work from the Mac in a device-level test.
      - A log audit over a call-control session finds zero occurrences of canary caller identity
        (invariant 7).
      - "An MMI/USSD string (e.g. **21*123#) returns INVALID_NUMBER and a second PlaceCallRequest within 5 s returns RATE_LIMITED, with no call placed (E52-05)."
    issues:
      - id: E52-01
        title: "[protocol] calls.proto: call events, actions, place call"
        type: task
        platforms: [protocol]
        priority: P0
        size: M
        prd: [F-8.4]
        use_cases: [UC-20, UC-21, AC-19]
        invariants: [7]
        depends_on: [E01-10, E01-14, E01-16, E15-01, E15-02, E01-22]
        description: |
          protocol/proto/tandem/v1/calls.proto: CallEvent{callId, direction, state (RINGING |
          DIALING | ACTIVE | ENDED), address, normalizedE164, timestampMs},
          CallAction{requestId, callId, action (ANSWER | DECLINE | HANGUP)},
          PlaceCallRequest{requestId, address, subscriptionId}, CallActionResult{requestId,
          callId, success, errorCode (UNKNOWN_CALL | NOT_RINGING | NO_ACTIVE_CALL |
          PERMISSION_DENIED | INVALID_SUBSCRIPTION | NEEDS_PHONE_TAP)}. callId is generated by
          the phone per RINGING/DIALING-to-ENDED cycle. Caller name is resolved on the Mac
          (E51-04), not sent. Write docs/protocol/SPEC.md Calls section. Vectors: event round
          trip, call-state transition sequence, UNKNOWN_CALL result.
          Cycle 4: errorCode gains INVALID_NUMBER and RATE_LIMITED; SPEC Calls section states PlaceCallRequest.address MUST match `^\+?[0-9]{3,20}$` after removing spaces and dashes (no MMI/USSD `*` / `#`, no pause/wait `,` / `;`) and at most one request per 5 s (E01-22).
        acceptance:
          - buf lint reports zero violations on calls.proto.
          - protocol/vectors/calls/*.json pass conformance on both codecs.
          - "SPEC.md Calls section states the PlaceCallRequest address rule and rate limit, and errorCode includes INVALID_NUMBER and RATE_LIMITED."
        tdd:
          - "ci: callsProto_bufLint_zeroViolations"
          - "conformance: callEventVector_ringingIncoming_roundTripsToGoldenBytes"
          - "conformance: callStateSequenceVector_ringingActiveEnded_decodesIdenticallyBothCodecs"
          - "conformance: callActionResultVector_unknownCall_decodesSameErrorBothCodecs"
          - "conformance: callActionResultVector_invalidNumber_decodesSameErrorBothCodecs"
        notes: "Cycle 3: added requestId, error codes; unknown-callId rejection moved to E52-04 (receiver behaviour)."
      - id: E52-02
        title: "[android] Spike: choose call-detection and control APIs"
        type: spike
        platforms: [android]
        priority: P0
        size: S
        prd: [F-8.4]
        use_cases: [UC-20, UC-21]
        invariants: []
        depends_on: []
        description: |
          Compare TelephonyCallback (passive detection, READ_PHONE_STATE) versus registering
          as a CallScreeningService (requires the call-screening role) versus
          TelecomManager.acceptRingingCall()/endCall() (ANSWER_PHONE_CALLS, deprecated in API 29
          but functional) for answering, declining, and hanging up. Open points the spike must
          settle: (1) TelephonyCallback.CallStateListener does not deliver the incoming number on
          API 31+ -- candidates: ACTION_PHONE_STATE_CHANGED EXTRA_INCOMING_NUMBER (+READ_CALL_LOG),
          deprecated PhoneStateListener, call-screening role; (2) outgoing placement:
          TelecomManager.placeCall (CALL_PHONE) from the connectedDevice foreground service vs
          ACTION_CALL startActivity under background-activity-start (BAL) rules, including the
          CompanionDeviceManager BAL exemption and USE_FULL_SCREEN_INTENT restrictions on
          Android 14+; (3) Play policy for READ_CALL_LOG (connected-device companion exception).
          Default outcome: TelephonyCallback for detection and TelecomManager for control, no
          CallScreeningService or default dialer.
        acceptance:
          - docs/adr or docs/spikes/call-apis.md records the chosen API for detection, incoming
            number, answer/decline/hangup and placement, with the permission list per API level.
          - "Go/no-go: on an API 34+ physical phone the chosen path yields the incoming number
            for a ringing call and places a call from the backgrounded app with the screen
            locked (or documents why not and the user-visible fallback)."
          - Unblocks E52-03 through E52-05.
        tdd: []
        notes: ""
      - id: E52-03
        title: "[android] Incoming call detection via TelephonyCallback"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-8.4]
        use_cases: [UC-20]
        invariants: [7]
        depends_on: [E52-01, E52-02, E20-02, E51-03, E12-11, E00-18, E00-21]
        description: |
          Feature-local seam `CallGateway` (android/feature/calls) exposing
          `callStates: Flow<CallStateChange(state, incomingNumber?)>`, `acceptRingingCall()`,
          `endCall()`, `placeCall(uri, subscriptionId)`; production `TelecomCallGateway` uses
          TelephonyManager.registerTelephonyCallback (READ_PHONE_STATE) plus the incoming-number
          source chosen in E52-02; `FakeCallGateway` in test fixtures. `CallDetector` maps
          RINGING/OFFHOOK/IDLE to CallEvent (RINGING, ACTIVE, ENDED; IDLE->OFFHOOK as outgoing
          DIALING), assigns callId, normalizes the number (E51-03), and sends immediately on the
          CALLS channel via TandemSession (E12-11) without debounce. READ_PHONE_STATE denied: no
          registration and no event. Never logs the number (invariant 7). Emulator calls are
          simulated with `adb emu gsm call <number>` (E00-21).
        acceptance:
          - A RINGING change with number "079 123 45 67" (region CH) sends
            CallEvent{INCOMING, RINGING, normalizedE164="+41791234567"} at virtual time 0.
          - RINGING -> OFFHOOK -> IDLE sends RINGING, ACTIVE, ENDED with the same callId.
          - IDLE -> OFFHOOK sends an OUTGOING DIALING event with a new callId.
          - READ_PHONE_STATE denied registers no callback and sends no event.
          - A recording logger captures no incoming number.
          - "Emulator: `adb emu gsm call 5551234` produces a RINGING CallEvent carrying 5551234."
        tdd:
          - "unit: callDetector_ringingChange_sendsIncomingRingingEventImmediately"
          - "unit: callDetector_ringingOffhookIdle_sendsRingingActiveEndedSameCallId"
          - "unit: callDetector_idleToOffhook_sendsOutgoingDialingEvent"
          - "unit: callDetector_readPhoneStateDenied_registersNoCallback"
          - "unit: callDetector_ringingChange_logLinesOmitIncomingNumber"
          - "instrumented: callDetector_adbEmuGsmCall_emitsRingingEventWithIncomingNumber"
        notes: "Cycle 3: on-device PhoneLookup dropped; caller name resolved once on the Mac (E51-04/E52-06), avoiding READ_CONTACTS here."
      - id: E52-04
        title: "[android] Answer/decline/hangup via TelecomManager"
        type: story
        platforms: [android]
        priority: P0
        size: M
        prd: [F-8.4]
        use_cases: [UC-20]
        invariants: []
        depends_on: [E52-01, E52-03, E12-11, E00-21]
        description: |
          `CallActionHandler` handles CallAction via `CallGateway` (E52-03): ANSWER calls
          acceptRingingCall() on the ringing call; DECLINE calls endCall() on the ringing call
          (never accept); HANGUP calls endCall() on the active call. Requires
          ANSWER_PHONE_CALLS (explicit; denied yields PERMISSION_DENIED without a gateway call).
          Audio stays on the phone (no bridging). Replies CallActionResult with the request's
          requestId.
        acceptance:
          - ANSWER on a ringing call invokes acceptRingingCall once and returns success.
          - ANSWER when not ringing returns NOT_RINGING.
          - DECLINE on a ringing call invokes endCall and never acceptRingingCall.
          - HANGUP with no active call returns NO_ACTIVE_CALL without throwing.
          - A CallAction with a stale or unknown callId returns UNKNOWN_CALL.
          - ANSWER_PHONE_CALLS denied returns PERMISSION_DENIED and no gateway call is made.
          - "Emulator: ANSWER during `adb emu gsm call` moves the call state to OFFHOOK."
        tdd:
          - "unit: callActionHandler_answerWhileRinging_invokesAcceptOnce"
          - "unit: callActionHandler_answerNotRinging_returnsNotRinging"
          - "unit: callActionHandler_declineWhileRinging_endsCallWithoutAccept"
          - "unit: callActionHandler_hangupNoActiveCall_returnsNoActiveCall"
          - "unit: callActionHandler_unknownCallId_returnsUnknownCall"
          - "unit: callActionHandler_answerPhoneCallsDenied_returnsPermissionDenied"
          - "instrumented: callActionHandler_answerDuringEmulatorGsmCall_stateBecomesOffhook"
        notes: ""
      - id: E52-05
        title: "[android] Place outgoing call + background-start handling"
        type: story
        platforms: [android]
        priority: P0
        size: M
        prd: [F-8.4]
        use_cases: [UC-21, AC-19]
        invariants: [7]
        depends_on: [E52-01, E52-02, E52-03, E50-05, E12-11]
        description: |
          `PlaceCallHandler` handles PlaceCallRequest via `CallGateway.placeCall` using the path
          chosen in E52-02 (TelecomManager.placeCall or ACTION_CALL), requiring CALL_PHONE.
          Because the request usually arrives while the app is backgrounded, Android 10+
          background-activity-start restrictions may block a direct start; an
          `AppVisibilitySource` seam (fake in tests) plus the gateway's blocked signal select the
          fallback: a high-priority "Tap to call" notification whose tap starts the call, and the
          result NEEDS_PHONE_TAP so the Mac can explain why (UC-21). The SIM is selected via
          E50-05's SubscriptionSource (PhoneAccountHandle for the subscription). Logs which path
          was used, never the number.
        acceptance:
          - Foregrounded app places the call directly and returns success.
          - A blocked background start posts the tap-to-call notification and returns
            NEEDS_PHONE_TAP.
          - subscriptionId=2 on dual SIM passes subscription 2's PhoneAccountHandle.
          - An unknown subscriptionId returns INVALID_SUBSCRIPTION without placing a call.
          - CALL_PHONE denied returns PERMISSION_DENIED without placing a call.
          - A recording logger captures the path name and no number.
          - "An address containing `*`, `#`, `,` or `;` (e.g. the call-forwarding MMI code `**21*123#`) returns INVALID_NUMBER without placing a call; a second PlaceCallRequest within 5 s returns RATE_LIMITED."
        tdd:
          - "unit: placeCallHandler_appForegrounded_placesCallDirectly"
          - "unit: placeCallHandler_backgroundStartBlocked_postsTapToCallAndReturnsNeedsPhoneTap"
          - "unit: placeCallHandler_explicitSubscriptionId_passesMatchingPhoneAccountHandle"
          - "unit: placeCallHandler_unknownSubscriptionId_returnsInvalidSubscription"
          - "unit: placeCallHandler_callPhoneDenied_returnsPermissionDenied"
          - "unit: placeCallHandler_backgroundPath_logLinesOmitNumber"
          - "unit: placeCallHandler_mmiCodeAddress_returnsInvalidNumberWithoutCall"
          - "unit: placeCallHandler_secondRequestWithin5s_returnsRateLimited"
        notes: ""
