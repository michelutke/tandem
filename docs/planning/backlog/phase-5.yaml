      - id: E50-13
        title: "[android] Initial SMS sync session: paged streaming, credits, cursor resume"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-8.1]
        use_cases: [UC-18]
        invariants: [7]
        depends_on: [E50-02, E11-07, E12-11, E20-02]
        description: |
          Handles SmsSyncRequest (E50-01 cursor rules) inside the foreground service (E20-02):
          fresh request snapshots maxId and backfills descending pages of pageSize (default
          200); otherwise sends rows newer than sinceId ascending first, then continues backfill
          below backfillBeforeId. Each SmsSyncResponse carries highWatermarkId, backfillCursorId
          and backfillComplete; the Mac persists them (E50-14), so the phone keeps no resume
          state. Sends honour SMS-channel credits (E11-07) so a large history does not starve
          NOTIFY/STATUS. Tested with `FakeSmsSource` and FakeTandemSession (E12-11). READ_SMS
          revoked yields SmsSyncResponse{status=PERMISSION_REQUIRED}. No log line contains a
          body or address (invariant 7).
        acceptance:
          - A fresh request on a 5k fixture produces 25 responses of <= 200 messages, the first
            holding ids 5000..4801 and the last backfillComplete=true.
          - Disconnect after page 7 and reconnect with the Mac's cursors ends with the union of
            delivered ids equal to the fixture and at most one page re-sent.
          - With zero channel credits no further frame is sent until credits are replenished.
          - A request with sinceId=4990 after 10 new rows sends exactly ids 4991..5000 before any
            backfill page.
          - READ_SMS revoked yields one PERMISSION_REQUIRED response with no rows.
          - A recording logger captures no body or address during a full sync.
          - "A second SmsSyncRequest while one is in flight supersedes it: the first stops after its current page."
        tdd:
          - "unit: smsSyncSession_freshRequestOnFiveThousandRows_sends25PagesNewestFirst"
          - "unit: smsSyncSession_reconnectWithMacCursors_unionEqualsFixtureWithoutGaps"
          - "unit: smsSyncSession_zeroChannelCredits_sendsNoFurtherFrame"
          - "unit: smsSyncSession_sinceIdBelowMax_sendsForwardRowsBeforeBackfill"
          - "unit: smsSyncSession_readSmsRevoked_respondsPermissionRequiredWithoutRows"
          - "unit: smsSyncSession_fullSync_logLinesContainNoBodyOrAddress"
          - "unit: smsSyncSession_secondRequestWhileInFlight_firstStopsAfterCurrentPage"
        notes: "Split from E50-02 in review cycle 3."
      - id: E50-14
        title: "[macos] SMS sync client: request on connect, apply batches, reconcile sends"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-8.1, F-8.2]
        use_cases: [UC-18, UC-19]
        invariants: [7]
        depends_on: [E50-01, E50-09, E12-12, E00-08]
        description: |
          `SmsSyncClient` on the Mac: on session Ready sends SmsSyncRequest{sinceId =
          store.highWatermarkId, backfillBeforeId = store.backfillCursorId} (0/0 when empty);
          applies each SmsSyncResponse to SmsStore (E50-09) with rows and cursors committed in one
          transaction; applies SendSmsStatus to optimistic rows by clientMessageId and, when
          providerMessageId is set, merges the later-arriving provider row with that id into the
          optimistic row instead of duplicating it; exposes sync status (syncing / complete /
          permissionRequired) and the latest SimList to view models. Tested with the fake
          TandemSession (E12-12) and InMemorySmsStore plus an injected write failure.
        acceptance:
          - On Ready with stored cursors (4990, 3000) the first frame sent is
            SmsSyncRequest{sinceId=4990, backfillBeforeId=3000}.
          - A store write failure mid-batch leaves both cursors at their previous values.
          - A synced row whose id equals a SENT status's providerMessageId leaves one message,
            not two.
          - A PERMISSION_REQUIRED response sets sync status permissionRequired.
        tdd:
          - "unit: smsSyncClient_sessionReady_requestsStoredCursors"
          - "unit: smsSyncClient_storeWriteFailsMidBatch_cursorsNotAdvanced"
          - "unit: smsSyncClient_providerRowMatchingProviderMessageId_mergedIntoOptimisticRow"
          - "unit: smsSyncClient_permissionRequiredResponse_statusPermissionRequired"
        notes: "Added in review cycle 3: no issue owned the Mac-side request/apply/ack path that E50-13 resume relies on."

  - id: E51
    title: Contacts sync
    labels: [area:contacts]
    prd: [F-8.3]
    use_cases: [UC-18, UC-19, UC-20, UC-21]
    summary: |
      Read-only sync of contact name, phone numbers, emails, and a photo thumbnail from
      ContactsContract to a Mac-side cache, kept current via an updated-timestamp watermark and
      ContactsContract.DeletedContacts. Phone numbers are normalized to E.164 on both platforms
      (Android via Google's libphonenumber, macOS via a Swift port) so SMS senders and call
      caller IDs match cached contacts regardless of the number's original formatting. The Mac
      cache uses the same GRDB SQLite approach as the SMS store (E50-09). This epic has no UI of
      its own; it is a dependency of E50's thread list and E52's caller-ID alert.
    scope:
      - contacts.proto messages and SPEC.md section.
      - "Android: ContactsSource paged read, thumbnail downsampling, incremental sync via
        updated-timestamp watermark + deleted contacts, libphonenumber normalization."
      - "macOS: GRDB contacts cache + lookup API + sync client, Swift-side normalization for
        numbers that arrive without an exact cache match."
      - Cross-platform phone-number-normalization parity vectors.
      - "Unpair purges the contacts cache (PeerDataPurging, E14-13); thumbnails <= 96 px and <= 32768 bytes."
    out_of_scope:
      - Writing/editing contacts on the phone from the Mac.
      - Contact groups/labels beyond phone numbers and emails.
      - "Call log (v2, PRD F-8.4 note), call alerts (E52) and SMS thread UI (E50) themselves -- this epic only supplies lookups."
    exit_criteria:
      - "A 500-contact fixture's initial sync matches on the Mac; a subsequent edit and a delete are both reflected within 2 s, as one updated record plus one tombstone with no full resync (E51-07)."
      - Phone-number-normalization vectors produce identical E.164 output on both platforms.
      - A log audit over a full contacts sync session finds zero occurrences of canary contact
        PII (invariant 7).
    issues:
      - id: E51-01
        title: "[protocol] contacts.proto: contact record, sync, delete"
        type: task
        platforms: [protocol]
        priority: P0
        size: M
        prd: [F-8.3]
        use_cases: [UC-18, UC-19, UC-20, UC-21]
        invariants: [7]
        depends_on: [E01-10, E01-14, E01-16, E15-01, E15-02]
        description: |
          protocol/proto/tandem/v1/contacts.proto: Contact{contactId, displayName,
          phoneNumbers[]{number, normalizedE164, type}, emails[]{address, type}, photoThumbnail,
          updatedAtMs}, ContactsSyncRequest{sinceUpdatedAtMs}, ContactsSyncResponse{status (OK |
          PERMISSION_REQUIRED | FULL_RESYNC_REQUIRED), contacts[], deletedContactIds[],
          watermarkMs, complete}. photoThumbnail is JPEG, <= 96 px longest edge and <= 32768
          bytes; a larger thumbnail is rejected by the post-decode validator on both platforms.
          The watermark is Mac-authoritative (sent in every request). Write docs/protocol/SPEC.md
          Contacts section. Vectors: contact round trip, deleted-contact tombstones, oversized
          thumbnail rejected.
        acceptance:
          - buf lint reports zero violations on contacts.proto.
          - protocol/vectors/contacts/*.json pass conformance on both codecs.
          - A contact whose photoThumbnail exceeds 32768 bytes is rejected by both validators.
        tdd:
          - "ci: contactsProto_bufLint_zeroViolations"
          - "conformance: contactVector_fullRecord_roundTripsToGoldenBytes"
          - "conformance: contactsSyncResponseVector_threeDeletedIds_decodeIdenticallyBothCodecs"
          - "conformance: contactVector_thumbnailOver32KiB_rejectedByBothValidators"
        notes: "Cycle 3: thumbnail cap expressed in bytes (parser cannot check pixels); added status field."
      - id: E51-02
        title: "[android] ContactsContract read via ContactsSource + paged sync session"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-8.3]
        use_cases: [UC-18, UC-19, UC-20, UC-21]
        invariants: [7]
        depends_on: [E51-01, E20-02, E11-07, E12-11, E00-20, E00-21]
        description: |
          Feature-local seam `ContactsSource` (android/feature/contacts): pages
          ContactsContract.Contacts by _ID window (page size 200) and joins
          CommonDataKinds.Phone/Email rows for that window into Contact records; each cursor is
          closed before returning; requires READ_CONTACTS. `FakeContactsSource` in test
          fixtures; the ContentResolver adapter is tested under Robolectric with a fake
          ContactsContract provider (E00-20) and on the emulator with contacts inserted via
          ContentProviderOperation (E00-21). A sync session streams ContactsSyncResponse pages
          over the CONTACTS channel honouring credits (E11-07) via TandemSession (E12-11).
          Thumbnails come from E51-09.
        acceptance:
          - A contact with two phone numbers and one email maps to exactly one Contact with 2
            phoneNumbers and 1 email.
          - A 2k-contact fixture is read in 10 pages; no page exceeds 200 contacts and every
            cursor is closed before the next query.
          - With zero channel credits no further page is sent.
          - READ_CONTACTS not granted yields one ContactsSyncResponse{PERMISSION_REQUIRED}.
          - "Emulator: 3 contacts inserted via ContentProviderOperation are read back with their
            names, numbers and emails."
        tdd:
          - "unit: contactsSource_twoPhonesOneEmail_mapsToSingleContactRecord"
          - "unit: contactsSource_twoThousandContactFixture_tenPagesNoneOver200"
          - "unit: contactsSyncSession_zeroChannelCredits_sendsNoFurtherPage"
          - "unit: contactsSyncSession_readContactsNotGranted_respondsPermissionRequired"
          - "instrumented: contactsSource_emulatorInsertedContacts_readBackWithPhonesAndEmails"
        notes: "Split in review cycle 3: thumbnail downsampling moved to E51-09. Size L -> M."
      - id: E51-03
        title: "[android] Phone number normalization (libphonenumber)"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-8.3]
        use_cases: [UC-18, UC-19, UC-20, UC-21]
        invariants: []
        depends_on: [E51-02]
        description: |
          `PhoneNormalizer` (pure JVM) wraps Google's libphonenumber (Apache 2.0) to normalize
          every read number to E.164 using a `RegionSource` seam (SIM country, then network
          country, then Locale; fake in tests); stores normalizedE164 alongside the raw string
          for exact address matching in SMS (E50) and calls (E52). Unparsable input, short codes
          and alphanumeric sender IDs keep the raw string with normalizedE164 unset, never throw.
        acceptance:
          - With region CH, "079 123 45 67", "0791234567", "+41 79 123 45 67" and
            "0041791234567" all normalize to "+41791234567".
          - With region DE, "030 1234567" normalizes to "+49301234567".
          - "Unparsable input ('abc'), short code '1234' and sender ID 'Swisscom' return the raw
            string with null E.164 and do not throw."
        tdd:
          - "unit: phoneNormalizer_chRegionNationalVariants_allNormalizeToPlus41791234567"
          - "unit: phoneNormalizer_deRegionNationalNumber_normalizesToPlus49"
          - "unit: phoneNormalizer_unparsableInput_returnsRawWithNullE164"
          - "unit: phoneNormalizer_alphanumericSenderId_returnsRawWithNullE164"
        notes: "libphonenumber is a new Android dependency -- needs review (size, metadata update cadence)."
      - id: E51-04
        title: "[macos] Contacts cache (GRDB) + lookup API + sync client"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-8.3, F-2.3]
        use_cases: [UC-18, UC-19, UC-20, UC-21, UC-07]
        invariants: [7]
        depends_on: [E51-01, E50-09, E14-13, E12-12, E00-08]
        description: |
          Same GRDB database approach as the SMS store for consistency: `contacts.sqlite` in
          `Application Support/Tandem/` opened through E50-09's `TandemDatabaseFactory` (0600
          incl. WAL sidecars, isExcludedFromBackup, completeUntilFirstUserAuthentication where
          supported, no app-level encryption in v1). `ContactsStore` protocol with
          `GrdbContactsStore` and `InMemoryContactsStore` (used by E50-07/E52-06 tests). On
          session Ready the sync client sends ContactsSyncRequest{sinceUpdatedAtMs = stored
          watermark} over TandemSession (E12-12); applies ContactsSyncResponse as upsert plus
          tombstone-delete of deletedContactIds; FULL_RESYNC_REQUIRED replaces the cache with the
          fresh snapshot. Exposes lookup(number) -> Contact? consumed by E50-07 and E52-06/07;
          re-normalizes numbers lacking an exact match with PhoneNumberKit so formatting
          differences never cause a false miss. Rows keyed by peer; `GrdbContactsStore` conforms to
          `PeerDataPurging` and registers with E14-13's `PeerDataPurgeRegistry`, so unpair calls
          `purgeAll(peer:)`. Never logs names/numbers (invariant 7).
        acceptance:
          - Applying deletedContactIds [7] removes contact 7 and keeps others.
          - With +41791234567 cached, lookup("079 123 45 67") returns the same contact.
          - lookup of an uncached number returns nil.
          - On Ready with stored watermark 1700000000000 the first frame is
            ContactsSyncRequest{sinceUpdatedAtMs=1700000000000}.
          - FULL_RESYNC_REQUIRED followed by a snapshot leaves exactly the snapshot's contacts.
          - contacts.sqlite has POSIX mode 0600.
          - Unpairing peer A deletes all of A's cached contacts.
        tdd:
          - "unit: contactsCache_deletedContactId_removedFromStore"
          - "unit: contactsCache_lookupDifferentlyFormattedEquivalentNumber_resolvesSameContact"
          - "unit: contactsCache_lookupUncachedNumber_returnsNil"
          - "unit: contactsSyncClient_sessionReady_requestsSinceStoredWatermark"
          - "unit: contactsSyncClient_fullResyncRequired_cacheEqualsFreshSnapshot"
          - "unit: contactsDatabaseFile_created_hasPosixMode0600"
          - "unit: contactsStore_peerUnpaired_allRowsForPeerDeleted"
        notes: "Cycle 3: GRDB (shared factory with E50-09) replaces unspecified TandemStore table. PhoneNumberKit is a new macOS dependency -- needs review."
      - id: E51-05
        title: "[android] Incremental contacts sync via updated timestamp + deleted contacts"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-8.3]
        use_cases: [UC-18, UC-19, UC-20, UC-21]
        invariants: [7]
        depends_on: [E51-02, E00-18, E00-20, E00-21]
        description: |
          Uses ContactsContract.Contacts.CONTACT_LAST_UPDATED_TIMESTAMP > sinceUpdatedAtMs (from
          the Mac's request) as the watermark and ContactsContract.DeletedContacts
          (CONTACT_DELETED_TIMESTAMP > since) for tombstones. If since is older than
