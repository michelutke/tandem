        acceptance:
          - Editing one contact pushes exactly one updated Contact, not a full resync.
          - Deleting a contact yields its id in deletedContactIds.
          - since older than 30 days yields FULL_RESYNC_REQUIRED.
          - 50 change callbacks within 1 s cause one query.
