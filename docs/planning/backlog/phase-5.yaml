      - id: E52-02
        title: "[android] Spike: choose call-detection and control APIs"
        type: spike
        platforms: [android]
        priority: P0
        size: S
        prd: [F-8.4]
        use_cases: [UC-20, UC-21]
        invariants: []
        depends_on: []
        description: |
          Compare TelephonyCallback (passive detection, READ_PHONE_STATE) versus registering
          as a CallScreeningService (requires being the default call-screening app) versus
          TelecomManager.acceptRingingCall()/related APIs (ANSWER_PHONE_CALLS) for actually
          answering, declining, and hanging up. Output: a decision record -- v1 uses
          TelephonyCallback for detection and TelecomManager for control, and does not become
          a CallScreeningService or default dialer, avoiding default-app exclusivity and user
          friction; revisit in v2 if screening features are wanted.
        acceptance:
          - Decision documented with rationale, unblocking E52-03 through E52-05.
        tdd: []
        notes: ""
      - id: E52-03
        title: "[android] Incoming call detection via TelephonyCallback"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-8.4]
        use_cases: [UC-20]
        invariants: [7]
        depends_on: [E52-01, E52-02, E20-02, E51-03]
        description: |
          TelephonyManager.registerTelephonyCallback with a CallStateListener
          (READ_PHONE_STATE); maps RINGING/OFFHOOK/IDLE transitions to CallEvent;
          resolves caller number to a display name via an on-device ContactsContract.PhoneLookup (E51-03
          normalization) before sending. Pushed on the CALLS channel with priority so it is not
          delayed behind bulk traffic (target: Mac display within 1 s, UC-20).
        acceptance:
          - A simulated RINGING callback emits a CallEvent on the send path within a
            test-measurable bound; the real-device 1 s wall-clock bound is verified by E52-08's
            manual gate.
          - "A RINGING -> OFFHOOK -> IDLE sequence emits the matching CallEvent sequence."
        tdd:
          - callStateListener_ringingState_emitsIncomingCallEventWithResolvedCallerName
          - callStateListener_offhookThenIdle_emitsActiveThenDisconnectedEvents
        notes: ""
      - id: E52-04
        title: "[android] Answer/decline/hangup via TelecomManager"
        type: story
        platforms: [android]
        priority: P0
        size: M
        prd: [F-8.4]
        use_cases: [UC-20]
        invariants: []
        depends_on: [E52-01, E52-03]
        description: |
          Handle CallAction: ANSWER calls TelecomManager.acceptRingingCall(); DECLINE
          rejects the ringing call without answering; HANGUP ends the active call. Requires
          ANSWER_PHONE_CALLS. Audio stays on the phone (no bridging). Reports success/failure
          as CallActionResult.
        acceptance:
          - ANSWER invokes acceptRingingCall() on a ringing call.
          - DECLINE ends a ringing call without ever answering it.
          - HANGUP with no active call returns a failure CallActionResult rather than
            throwing.
        tdd:
          - callAction_answer_invokesAcceptRingingCall
          - callAction_decline_endsRingingCallWithoutAnswering
          - callAction_hangupNoActiveCall_returnsFailureResult
        notes: ""
      - id: E52-05
        title: "[android] Place outgoing call + background-start handling"
        type: story
        platforms: [android]
        priority: P0
        size: M
        prd: [F-8.4]
        use_cases: [UC-21]
        invariants: []
        depends_on: [E52-01, E52-02]
        description: |
          Handle PlaceCallRequest via startActivity(Intent(ACTION_CALL, tel:...)), requiring
          CALL_PHONE. Because the request can arrive while the app is not in the foreground,
          Android 10+ background-activity-start (BAL) restrictions block a bare startActivity
          from a non-visible service context; route through a high-priority full-screen-intent
          notification the user taps when a direct start is blocked, and log which path was used
          (never the phone number). Reuses the multi-SIM subscription selection pattern from
          E50-05.
        acceptance:
          - Placing a call while the app UI is foregrounded starts the call activity directly.
          - Placing a call while backgrounded falls back to a full-screen-intent notification
            whose tap starts the call.
          - A request with subscriptionId set selects the matching SIM for the outgoing call.
        tdd:
          - placeCall_appForegrounded_startsCallActivityDirectly
          - placeCall_appBackgrounded_fallsBackToFullScreenNotificationLaunch
          - placeCall_explicitSubscriptionId_usesMatchingSimForOutgoingCall
        notes: ""
