          - The add request carries kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly (recorded by the in-memory store; read back from the real Keychain in the hosted test)
          - In the hosted test, SecKeyCopyExternalRepresentation on the stored private key fails (non-extractable)
