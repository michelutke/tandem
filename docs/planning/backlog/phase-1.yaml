phase: 1
epics:
  - id: E10
    title: Device identity (keys, self-signed certs, SPKI fingerprints)
    labels: [area:crypto]
    prd: [F-1.1]
    use_cases: [UC-01, UC-02, UC-03, UC-05]
    summary: |
      Each device owns a long-term, non-exportable P-256 key pair and a self-signed X.509 certificate used
      purely as a TLS identity; the only thing ever trusted is the SHA-256 hash of the certificate's
      SubjectPublicKeyInfo (invariant 3). This epic generates and stores that identity on both platforms,
      computes and vector-tests the fingerprint, handles the lifecycle case where the key is missing or
      corrupted (a new identity is generated and the device must be re-paired), and provides the small
      crypto primitives (constant-time compare, HMAC-SHA256 pairing proof and 6-digit confirmation code)
      that transport (E12) and pairing (E14) build on. Only core/crypto (Android) / TandemCrypto (macOS)
      may touch key material.
    scope:
      - AndroidKeyStore P-256 key generation, StrongBox preferred, TEE fallback, never exportable
      - "macOS CryptoKit/Security P-256 key generation in Keychain (kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly), in the data-protection keychain, app's own access group only"
      - Self-signed X.509 certificate generation on both platforms (swift-certificates on macOS)
      - SecIdentity construction for Network.framework consumption
      - SPKI SHA-256 fingerprint computation, vector-tested against protocol/vectors
      - "Identity lifecycle: first-launch bootstrap; corrupted/missing-key recovery = new
        identity + requires re-pair"
      - Constant-time byte-compare helper
      - "HMAC-SHA256 pairing-proof and confirmation-code helpers over the E01-02 length-prefixed, channel-bound transcript (91-byte SPKI and 32-byte cb inputs enforced), vector-tested"
      - "Testability seams IdentityKeyStore/SoftwareIdentityKeyStore (E10-15) and KeychainStore/InMemoryKeychainStore (E10-16); key-material boundary check (E10-14)."
    out_of_scope:
      - Key rotation (F-1.3) — Phase 7, epic E70
      - Meaningful certificate subject/identity claims — never added, by design
      - Pairing protocol itself — E14
      - TLS handshake wiring and trust-store verify logic — E12 / E13
    exit_criteria:
      - Android identity generation succeeds on a StrongBox-capable and a StrongBox-unavailable
        device profile, never falling back to an exportable key
      - "macOS identity key is created in the Keychain with kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly, in the data-protection keychain and the app's own access group only, and is usable as a SecIdentity in Network.framework"
      - SPKI fingerprint vectors in protocol/vectors pass on both platforms
      - A corrupted or missing key on either platform yields a fresh identity and an explicit
        "re-pair required" state, never a crash or silent reuse of stale key material
      - "Pairing-proof and confirmation-code vectors (E01-18) pass on both platforms; a non-91-byte SPKI or non-32-byte cb is rejected before any HMAC is computed."
    issues:
      - id: E10-01
        title: "[android] AndroidKeyStore P-256 key generation (StrongBox, TEE fallback, non-exportable)"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-1.1]
        use_cases: [UC-01, UC-02]
        invariants: [3]
        depends_on: [E00-02, E01-01, E03-03, E10-15, E00-21, E00-23]
        description: |
          Generate a P-256 (secp256r1) key pair in AndroidKeyStore via KeyGenParameterSpec,
          requesting StrongBox (setIsStrongBoxBacked(true)) and retrying without it on
          StrongBoxUnavailableException (TEE). Purpose is signing only; the key is never
          exportable. Fixed alias `tandem.identity.v1`.
          Seams: the production `AndroidKeyStoreIdentityKeyStore` implements `IdentityKeyStore`
          (E10-15). The fallback policy lives in `IdentityKeyProvider` in core/crypto, written
          against the interface, so it is unit-tested with `SoftwareIdentityKeyStore`
          (`failNextGenerate(StrongBoxUnavailable)`). Hardware properties are asserted only
          against the real impl: `instrumented:` on the emulator (E00-21; TEE is emulated, there is
          no StrongBox, so the fallback path runs for real) and `manual:` on physical devices
          (E00-23) for StrongBox and `KeyInfo.isInsideSecureHardware`.
        acceptance:
          - "Key spec declares `setDigests(DIGEST_SHA256, DIGEST_NONE)`: Conscrypt signs TLS 1.3 CertificateVerify via NONEwithECDSA, and without DIGEST_NONE every client-cert handshake fails (spike E03-03, docs/spikes/android-sslsocket-keystore.md)."
          - With `failNextGenerate(StrongBoxUnavailable)`, the provider issues exactly one retry with preferStrongBox=false and returns that key.
          - If both the StrongBox and the TEE request fail, the provider throws `IdentityKeyError.GenerationFailed` and no key from any other source (software/exportable) is created.
          - The StrongBox fallback writes one log line naming the resulting security level and containing no key bytes, alias-independent handle or certificate bytes (UC-02 alternate).
          - A second getOrCreateIdentityKey() returns the key with the same alias and public key without calling generate again.
          - "On the emulator, the real impl generates the key after the StrongBox fallback and `privateKey.encoded` returns null."
          - On a StrongBox-capable physical device, KeyInfo reports security level STRONGBOX; on a TEE-only device, isInsideSecureHardware=true (manual gate).
        tdd:
          - "unit: identityKeyProvider_strongBoxUnavailable_retriesOnceWithoutStrongBox"
          - "unit: identityKeyProvider_bothGenerationsFail_throwsGenerationFailedNoSoftwareKey"
          - "unit: identityKeyProvider_strongBoxFallback_logsSecurityLevelWithoutKeyBytes"
          - "unit: identityKeyProvider_calledTwice_returnsSameKeyWithoutRegenerating"
          - "instrumented: androidKeyStoreIdentity_emulatorWithoutStrongBox_generatesViaTeeFallback"
          - "instrumented: androidKeyStoreIdentity_privateKey_encodedReturnsNull"
          - "manual: androidKeyStoreIdentity_strongBoxDevice_keyInfoSecurityLevelStrongBox"
          - "manual: androidKeyStoreIdentity_teeOnlyDevice_insideSecureHardwareTrue"

      - id: E10-02
        title: "[android] Self-signed X.509 certificate generation from Keystore key"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-1.1]
        use_cases: [UC-01]
        invariants: [3]
        depends_on: [E10-01, E10-15, E00-21]
        description: |
          Build a self-signed X.509v3 certificate over the Keystore P-256 key, issued at
          key-generation time via setCertificateSubject / setCertificateNotBefore etc. Subject
          is the fixed constant `IDENTITY_CERT_SUBJECT`; the cert carries no meaningful identity.
          Retrievable for the TLS KeyManager (E12-06).
          Seam: the certificate parameters live in one `IdentityCertSpec` used by both the real
          impl and `SoftwareIdentityKeyStore` (E10-15), so JVM tests exercise the same spec;
          persistence of the real cert is asserted `instrumented:` (E00-21).
        acceptance:
          - The cert's public key equals the KeyHandle's public key (fake on JVM, AndroidKeyStore on the emulator).
          - The cert subject equals `IDENTITY_CERT_SUBJECT` exactly and contains no Build.MODEL, device name, serial number or account name.
          - After a fresh `KeyStore.getInstance("AndroidKeyStore").load(null)` (process-restart proxy), the cert is returned for the alias with an identical encoding.
          - "The certificate has notBefore = generation time minus 1 day, notAfter = 9999-12-31T23:59:59Z (RFC 5280 no-expiry value), a random positive 16-byte serial, basicConstraints CA:false and keyUsage digitalSignature; peers never check these fields (E01-01)."
        tdd:
          - "unit: identityCertSpec_subject_equalsFixedConstantOnly"
          - "unit: selfSignedCert_softwareKeyStore_publicKeyEqualsKeyHandlePublicKey"
          - "unit: selfSignedCert_signature_verifiesWithOwnPublicKey"
          - "instrumented: selfSignedCert_androidKeyStore_publicKeyEqualsKeystoreKey"
          - "instrumented: selfSignedCert_freshKeyStoreLoad_sameEncodedCertForAlias"
          - "unit: identityCertSpec_validity_notAfterIs99991231AndCaFalse"

      - id: E10-03
        title: "[android] SPKI SHA-256 fingerprint computation (vector-tested)"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-1.1]
        use_cases: [UC-03, UC-05]
        invariants: [3]
        depends_on: [E10-02, E01-17]
        description: |
          Compute SHA-256 over the DER-encoded SubjectPublicKeyInfo of the identity cert.
          Expose as a base64url string (matches the QR `fp=` param, F-2.1) and as raw bytes for
          constant-time comparisons. Validate against protocol/vectors fingerprint vectors (the
          same category is re-run by the E15-01 conformance runner, which depends on this issue).
        acceptance:
          - fingerprint(cert) matches every protocol/vectors fingerprint test vector
          - Two separately decoded instances of the same certificate yield byte-identical 32-byte fingerprints (restart stability; alias persistence itself is E10-02)
          - The string form is 43 characters of base64url without padding (no `=`, `+` or `/`), matching the QR payload format (SPEC pairing section, E01-02)
        tdd:
          - "unit: spkiFingerprint_everyFingerprintVector_matchesExpectedSha256"
          - "unit: spkiFingerprint_twoDecodesOfSameCert_identical32Bytes"
          - "unit: spkiFingerprint_stringForm_is43CharsBase64UrlNoPadding"
          - "unit: spkiFingerprint_differentPublicKey_differentFingerprint"

      - id: E10-04
        title: "[android] Identity lifecycle: first-launch bootstrap and corrupted/missing key recovery"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-1.1]
        use_cases: [UC-01, UC-02]
        invariants: [3]
        depends_on: [E10-01, E10-02, E10-03, E10-15, E00-04]
        description: |
          On first launch, generate the identity eagerly before any pairing UI shows. On every
          subsequent launch, verify the Keystore alias is present and usable (sign+verify smoke
          test). On KeyPermanentlyInvalidatedException or a missing alias, emit an IdentityReset
          event, regenerate a new identity, and surface a requiresRePair app state until the next
          successful pairing.
          Seam: `IdentityBootstrapper` takes `IdentityKeyStore` (E10-15); tests use
          `SoftwareIdentityKeyStore` (delete the alias to simulate "missing") wrapped in a test
          decorator whose sign throws KeyPermanentlyInvalidatedException; events are asserted with
          Turbine (E00-04).
        acceptance:
          - First launch with no existing alias calls generate exactly once and returns a usable handle
          - A sign that throws KeyPermanentlyInvalidatedException emits exactly one IdentityReset and the next access returns a handle with a different public key
          - A missing alias emits IdentityReset and regenerates
          - After IdentityReset, requiresRePair=true until a pairing succeeds, then false
          - An existing usable key is reused with an unchanged public key and no IdentityReset event
        tdd:
          - "unit: bootstrapIdentity_noExistingAlias_generatesExactlyOnce"
          - "unit: bootstrapIdentity_signThrowsPermanentlyInvalidated_emitsIdentityResetAndNewPublicKey"
          - "unit: bootstrapIdentity_aliasMissing_emitsIdentityResetAndRegenerates"
          - "unit: bootstrapIdentity_afterReset_requiresRePairTrueUntilPairingSucceeds"
          - "unit: bootstrapIdentity_existingUsableKey_samePublicKeyNoResetEvent"

      - id: E10-05
        title: "[macos] CryptoKit/Security P-256 key generation in Keychain"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-1.1]
        use_cases: [UC-01, AC-17]
        invariants: [3]
        depends_on: [E00-07, E01-01, E03-02, E10-16]
        description: |
          Generate a P-256 SecKey via SecKeyCreateRandomKey, stored in the Keychain with
          kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly and marked non-extractable. Fold in
          findings from the E03-01 Network.framework mTLS spike (Secure Enclave availability per
          Appendix C). Expose an IdentityKeyProvider in TandemCrypto.
          Seam: `IdentityKeyProvider` takes `any KeychainStore` (E10-16) via init; unit tests use
          `InMemoryKeychainStore`, real Keychain behaviour is asserted by hosted `integration:`
          tests with `SecItemKeychainStore` on the macOS runner.
          Cycle 4: identity items use the data-protection keychain (`kSecUseDataProtectionKeychain = true`) in the app's own access group only; the share extension (E40-22) gets no keychain access group.
        acceptance:
          - The first call adds exactly one key item under the fixed application tag; the second call returns it without another add
          - The add request carries kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly (recorded by the in-memory store; read back from the real Keychain in the hosted test)
          - In the hosted test, SecKeyCopyExternalRepresentation on the stored private key fails (non-extractable)
          - The key persists across a new provider instance over the same store (relaunch proxy)
          - "The add request sets kSecUseDataProtectionKeychain and only the app's own access group."
        tdd:
          - "unit: getOrCreateIdentityKey_emptyKeychain_addsOneKeyItemWithFixedTag"
          - "unit: getOrCreateIdentityKey_secondCall_returnsExistingItemWithoutAdd"
          - "unit: getOrCreateIdentityKey_addRequest_recordsAfterFirstUnlockThisDeviceOnly"
          - "integration: identityKey_hostedKeychain_accessibilityReadsAfterFirstUnlockThisDeviceOnly"
          - "integration: identityKey_hostedKeychainExportPrivateKey_copyExternalRepresentationFails"
          - "unit: getOrCreateIdentityKey_addRequest_usesDataProtectionKeychainOwnGroup"
        notes: |
          Spike E03-02 (docs/spikes/secure-enclave-identity.md): the data-protection keychain
          (and any Secure Enclave key) needs the `keychain-access-groups` entitlement, which AMFI only
          allows in a provisioning-profile-signed app. Unit tests use the E10-16 in-memory KeychainStore;
          the real-keychain path needs a signed build (manual gate / E71-11 signing).

