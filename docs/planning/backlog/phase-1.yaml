      - id: E10-04
        title: "[android] Identity lifecycle: first-launch bootstrap and corrupted/missing key recovery"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-1.1]
        use_cases: [UC-01, UC-02]
        invariants: [3]
        depends_on: [E10-01, E10-02, E10-03]
        description: |
          On first launch, generate the identity eagerly before any pairing UI shows. On every
          subsequent launch, verify the Keystore alias is present and usable (sign+verify smoke
          test). On KeyPermanentlyInvalidatedException or a missing alias, emit an IdentityReset
          event, regenerate a new identity, and surface a requiresRePair app state until the next
          successful pairing.
        acceptance:
          - First launch with no existing alias generates a new identity in one call
          - A simulated KeyPermanentlyInvalidatedException triggers IdentityReset and a fresh
            identity is generated on next access
          - After IdentityReset, app state exposes requiresRePair=true until paired again
        tdd:
          - bootstrapIdentity_firstLaunch_generatesNewIdentity
          - bootstrapIdentity_permanentlyInvalidatedKey_emitsIdentityResetAndRegenerates
          - bootstrapIdentity_afterReset_requiresRePairUntilPaired

