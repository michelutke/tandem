      - id: E14-05
        title: "[android] Pairing state machine: connect, PairRequest, await result"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03, AC-20]
        invariants: [5]
        depends_on: [E14-04, E12-08, E12-11, E13-02, E00-18, E00-04, E10-12]
        description: |
          States: Idle -> Connecting -> AwaitingProofSent -> AwaitingAccept -> AwaitingUserConfirm -> Paired |
          Rejected | Failed(reason). Connecting dials the QR addresses in order with the
          per-address connect timeout from the SPEC pairing section (E01-02, D-68: 3 s per address).
          On TLS ready and after both VersionHellos, the machine receives `PairChallenge{challenge}`
          (E01-11) and holds its 32-byte `challenge` field as `cb` for this attempt — this state
          machine, not the transport session, is what carries `cb` from here on — then computes and
          sends PairRequest{deviceInfo, proof} (proof from E14-06), then waits up to
          120 s for PairAccepted or PairRejected (E01-02 §Frame order step 6).
          The pairing state machine takes an injected `Clock` and dispatcher (E00-18) so timeouts
          run in virtual time, and a feature-local `PairingConnector` returning a
          `FakeTandemSession` (E12-11 testFixtures) in tests.
          Cycle 4 (evil-QR defence, AC-20): after PairAccepted the machine enters `AwaitingUserConfirm(code,
          macName)` with the E01-02 confirmation code computed by the E10-12 helper from the `cb` this
          attempt received in `PairChallenge` (above) and the sanitized QR name. The Mac pin is
          committed only when the owner taps "Codes match"; Cancel or 120 s without a tap sends Revoke
          over the session, closes it and commits nothing.
          If the owner walks away the Mac keeps a record the phone never uses; it is listed with its last-seen
          time and can be revoked (E14-14). The code is already shown from AwaitingAccept on (it only
          needs the secret, both SPKIs and cb), so the owner can compare it before clicking Pair on the Mac.
          Cycle 8 (adversarial verifier / D-67 cleanup): `cb` was originally specified as
          `TandemSession.channelBinding`, a property read from the TLS session (RFC 9266 exporter).
          Per D-67 there is no exporter and `TandemSession` exposes no `channelBinding` property at
          all (E12-11); `cb` is exclusively the `PairChallenge.challenge` value this state machine
          itself received and stored, above.
        acceptance:
          - Every documented transition is exercised by a test
          - A timeout on the first QR address dials the next one; timeouts on all addresses yield Failed(AllAddressesUnreachable)
          - No PairAccepted within 120 s of virtual time yields Failed(Timeout); a session drop while awaiting yields Failed(ConnectionLost); never a silent return to Idle
          - On Paired, the Mac fingerprint from the invite is committed to the trust store (E13-02); Rejected or Failed leaves the trust store unchanged
          - "PairAccepted moves the machine to AwaitingUserConfirm carrying the 6-digit code; the trust store is unchanged until the owner confirms."
          - "Cancel, or 120 s of virtual time in AwaitingUserConfirm, sends Revoke, closes the session and leaves the trust store unchanged."
        tdd:
          - "unit: pairingSm_startPairingFromIdle_emitsConnecting"
          - "unit: pairingSm_firstAddressTimesOut_dialsNextQrAddress"
          - "unit: pairingSm_allQrAddressesTimeOut_emitsFailedAllAddressesUnreachable"
          - "unit: pairingSm_tlsReady_sendsPairRequestAndEmitsAwaitingAccept"
          - "unit: pairingSm_userConfirmsCodes_commitsMacFingerprintAndEmitsPaired"
          - "unit: pairingSm_pairRejectedReceived_emitsRejectedTrustStoreUnchanged"
          - "unit: pairingSm_noResponseWithin120s_emitsFailedTimeout"
          - "unit: pairingSm_sessionDropsWhileAwaiting_emitsFailedConnectionLost"
          - "unit: pairingSm_pairAcceptedReceived_emitsAwaitingUserConfirmWithCode"
          - "unit: pairingSm_userCancelsCodeConfirm_sendsRevokeTrustStoreUnchanged"
          - "unit: pairingSm_codeConfirmUnansweredFor120s_sendsRevokeTrustStoreUnchanged"
          - "unit: pairingSm_awaitingAccept_exposesConfirmationCodeBeforePairAccepted"

      - id: E14-06
        title: "[android] Compute pairing proof and attach to PairRequest"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: [6]
        depends_on: [E10-12, E10-03, E10-15, E14-05, E12-11, E03-04]
        description: |
          proof = HMAC-SHA256 over the E01-02 transcript (both SPKI DERs + `cb`) via the
          core/crypto helper (E10-12); macSpki comes from the scanned invite, phoneSpki from the
          local identity (E10-03), `cb` from the `PairChallenge.challenge` this pairing attempt
          received and stored (E14-05) — nothing here reads a session-level channel-binding property.
          Unit-tested with `SoftwareIdentityKeyStore` (E10-15) as the
          local identity. "No HMAC outside core/crypto" is enforced by E10-14.
        acceptance:
          - "PairRequest.proof equals pairingProof(invite.secret, macSpkiDer, localPhoneSpkiDer, cb), macSpkiDer being the handshake SPKI that matched invite.fp and cb being the PairChallenge value this attempt received (E14-05), from the E10-12 helper"
          - The phoneSpki input is the SPKI fingerprint of the local identity cert (a different local key changes the proof)
          - The macSpki input is the invite fp (a different invite fp changes the proof)
          - "A different cb (a different PairChallenge value) changes the proof."
          - "PairRequest.deviceInfo contains only displayName, model and appVersion (no ANDROID_ID, serial, IMEI or account)."
        tdd:
          - "unit: pairRequest_proofField_equalsCoreCryptoHelperOutput"
          - "unit: pairRequest_differentLocalIdentity_proofChanges"
          - "unit: pairRequest_differentInviteFp_proofChanges"
          - "unit: pairRequest_differentPairChallenge_proofChanges"
          - "unit: pairRequest_deviceInfo_containsNoHardwareIdentifiers"
        notes: |
          Cycle 5: depended on E03-04, the channel-binding outcome issue (`docs/spikes/channel-binding.md`).
          Cycle 8 (D-67, D-71): `cb` is the in-band `PairChallenge` value unconditionally, on every platform
          and API level — not a fallback, and never read from `TandemSession` (E12-11 exposes no
          `channelBinding` property). This issue's original "Cycle 4" text describing `cb` as
          `TandemSession.channelBinding` is superseded.

      - id: E14-07
        title: "[macos] Constant-time proof verification bound to handshake cert"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03, AC-03, AC-15]
        invariants: [6]
        depends_on: [E14-02, E10-11, E10-13, E12-02, E03-04]
        description: |
          On receiving PairRequest over a connection classified `.pairingCandidate` by E12-02,
          recompute the expected proof using the phoneSpki taken from the certificate actually
          presented in this TLS handshake, never from PairRequest.deviceInfo, and compare with the
          E10-11 constant-time helper (injected as a `ByteComparator` so a spy can count calls).
          Adversarial replay scenarios are E15-09 (depends on this issue).
          Cycle 8 (D-67, superseding the original Cycle 4 "session channel binding" text): recompute
          using the 32-byte `challenge` the Mac itself generated and sent as `PairChallenge` for this
          candidate connection (held by E14-02's pairing-window/candidate state), so a `PairRequest`
          computed against one candidate's challenge and replayed against another candidate — or on a
          later connection after this one closed — fails. Nothing here reads a channel-binding value
          from the transport session; `TandemSession`/`FakeTandemSession` (E12-12) expose no such
          property.
        acceptance:
          - A proof valid for the handshake cert's SPKI is accepted
          - A proof computed for a different phone key, while deviceInfo claims that key, is rejected
          - A proof computed with a wrong secret is rejected
          - Each verification calls the constant-time comparator exactly once
          - A PairRequest on a `.trusted` (already paired) connection is rejected without computing a proof
          - "A proof valid for the same keys and secret but computed with a different candidate's PairChallenge value is rejected."
        tdd:
          - "unit: verifyProof_validForHandshakeCertSpki_accepted"
          - "unit: verifyProof_proofForDeviceInfoClaimedKey_rejected"
          - "unit: verifyProof_wrongSecret_rejected"
          - "unit: verifyProof_comparison_invokesConstantTimeComparatorOnce"
          - "unit: verifyProof_trustedConnection_rejectedWithoutComputing"
          - "unit: verifyProof_otherCandidatesPairChallenge_rejected"
        notes: |
          Cycle 5: depended on E03-04, the channel-binding outcome issue (`docs/spikes/channel-binding.md`).
