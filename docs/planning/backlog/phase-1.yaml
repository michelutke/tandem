  - id: E14
    title: QR pairing, unpair, revoke
    labels: [area:pairing]
    prd: [F-2.1, F-2.3]
    use_cases: [UC-03, UC-04, UC-07, AC-03, AC-09]
    summary: |
      Implements F-2.1 QR pairing end to end and F-2.3 unpair/revoke: Mac-side QR generation and
      pairing-window state machine, Android-side scanner and pairing state machine, constant-time
      proof verification bound to the certificate actually seen in the TLS handshake, a
      confirmation dialog on the Mac, a scanning UI on Android, and the unpair/revoke flow on
      both sides culminating in the Phase 1 exit criterion: pair via QR, then reconnect after
      restarting both apps.
    scope:
      - Mac QR payload generation and pairing-window state machine (120 s expiry, 3 attempts,
        single use, secret regeneration)
      - Android QR parsing/validation and pairing state machine
      - PairRequest/PairAccepted flow, proof computation and verification
      - Mac confirmation dialog; Android CameraX + ML Kit scanner UI; Mac QR display UI
      - Unpair and Revoke on both sides; Mac paired-devices list with last-seen and revoke
      - End-to-end pairing-then-reconnect test (Phase 1 exit criterion)
    out_of_scope:
      - TLS transport mechanics themselves — E12
      - Trust store persistence mechanics — E13
      - Manual pairing (F-2.2) — Phase 7, epic E73
    exit_criteria:
      - A phone pairs with a Mac via QR and reconnects after restarting both apps
      - Every pairing failure path (bad proof, malformed message, window expiry) fails closed
        and burns exactly one attempt where applicable
      - Revoke removes trust on both sides when the peer is reachable; local unpair is immediate
        regardless of reachability
      - Every UC-03 alternate flow (declined, expired/used QR, Mac unreachable) shows a distinct phone message (E14-17)
    issues:
      - id: E14-01
        title: "[macos] QR payload generation: secret and payload encode"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: [6]
        depends_on: [E10-08, E01-02]
        description: |
          Generate a fresh 128-bit secret per pairing window; encode
          tandem://pair?v=1&fp=<b64url mac spki>&s=<b64url secret>&a=<addr1,addr2>&p=<port>
          &n=<mac name> per F-2.1. Addresses are the Mac's current local interface addresses;
          name is the Mac's display name.
        acceptance:
          - A generated payload round-trips through the Android parser (E14-03) in a
            cross-platform fixture test
          - Each call to start a pairing window generates a different secret
          - The payload never includes any private key material, only the fingerprint
        tdd:
          - qrPayload_generated_parsesBackToSameFields
          - qrPayload_eachWindowStart_differentSecret
          - qrPayload_neverContainsPrivateKeyMaterial

      - id: E14-02
        title: "[macos] Pairing window state machine"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03, AC-03]
        invariants: [6]
        depends_on: [E14-01]
        description: |
          States: Closed -> Open(secret, expiresAt, attemptsRemaining=3) -> Closed, on success,
          expiry, attempts exhausted, or explicit cancel. 120 s expiry timer; each failed
          PairRequest decrements attemptsRemaining; the window is single-use and closes
          immediately on a successful PairAccepted; regenerating (E14-01) always opens a fresh
          window with a new secret, invalidating the old one.
        acceptance:
          - Every documented transition is exercised by a test
          - A 4th attempt within the window is rejected without checking the proof
          - The window auto-closes at 120 s even with no attempts made
          - A successful pairing closes the window immediately (single use)
        tdd:
          - pairingWindow_open_startsWithThreeAttemptsAndExpiry
          - pairingWindow_failedAttempt_decrementsAttemptsRemaining
          - pairingWindow_fourthAttempt_rejectedWithoutCheckingProof
          - pairingWindow_after120s_autoClosesWithNoAttempts
          - pairingWindow_successfulPairing_closesImmediately
          - pairingWindow_regenerate_invalidatesOldSecret

      - id: E14-03
        title: "[android] QR payload parsing and validation"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: []
        depends_on: [E01-02, E01-21]
        description: |
          Parse tandem://pair?v=1&... into a typed PairingInvite(fp, secret, addresses, port,
          macName); reject unknown/missing v, malformed base64url fields, or missing required
          params.
        acceptance:
          - A valid F-2.1 payload parses to the expected PairingInvite
          - v != 1, a missing fp/s, or a malformed base64url field each yield a rejection with
            no partial/best-effort parse
        tdd:
          - parseInvite_validPayload_producesExpectedInvite
          - parseInvite_unsupportedVersion_rejected
          - parseInvite_malformedBase64Field_rejected
          - parseInvite_missingRequiredParam_rejected

      - id: E14-04
        title: "[android] Pin Mac fingerprint from QR before TLS connect"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: [1, 3]
        depends_on: [E14-03, E12-05]
        description: |
          Before dialing, register the scanned invite's fp as the expected pin for this
          connection attempt so the TrustManager (E12-05) accepts only that exact fingerprint
          for the duration of the pairing attempt, without writing a permanent trust-store entry
          until PairAccepted.
        acceptance:
          - A connection attempt succeeds only if the server presents exactly the scanned
            fingerprint
          - A server presenting a different fingerprint during this attempt is rejected and no
            PairRequest is sent
        tdd:
          - pinFromInvite_serverPresentsMatchingFingerprint_connectionProceeds
          - pinFromInvite_serverPresentsDifferentFingerprint_rejectedBeforePairRequest

      - id: E14-05
        title: "[android] Pairing state machine: connect, PairRequest, await result"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: []
        depends_on: [E14-04, E12-08]
        description: |
          States: Idle -> Connecting -> AwaitingProofSent -> AwaitingAccept -> Paired |
          Rejected | Failed(reason). On TLS ready, computes and sends PairRequest{deviceInfo,
          proof} (proof from E14-06), then waits for PairAccepted or an explicit
          rejection/timeout.
        acceptance:
          - Every documented transition is exercised by a test
          - Any failure (rejected, timeout, connection drop) leaves the app in a Failed/Rejected
            state, never silently Idle
          - On Paired, the Mac's fingerprint is committed to the local trust store (E13-02)
        tdd:
          - pairingSm_idleToConnecting_onStartPairing
          - pairingSm_connectingToAwaitingProofSent_onTlsReady
          - pairingSm_awaitingAcceptToPaired_onPairAccepted
          - pairingSm_awaitingAcceptToRejected_onExplicitReject
          - pairingSm_awaitingAcceptToFailed_onTimeout
          - pairingSm_onPaired_commitsFingerprintToTrustStore

      - id: E14-06
        title: "[android] Compute pairing proof and attach to PairRequest"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: [6]
        depends_on: [E10-12, E14-05]
        description: |
          proof = HMAC-SHA256(secret, "tandem-pair-v1" || macSpki || phoneSpki) via the
          core/crypto helper (E10-12); macSpki comes from the scanned invite, phoneSpki from the
          local identity (E10-03).
        acceptance:
          - PairRequest.proof matches the value computed by the E10-12 vector-tested helper for
            the same inputs
          - No ad-hoc HMAC implementation exists outside core/crypto (grep check)
        tdd:
          - pairRequest_proof_matchesCoreCryptoHelperOutput
          - codebaseScan_noAdHocHmacOutsideCoreCrypto

      - id: E14-07
        title: "[macos] Constant-time proof verification bound to handshake cert"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03, AC-03]
        invariants: [6]
        depends_on: [E14-02, E10-11, E10-13, E12-02]
        description: |
          On receiving PairRequest over a connection accepted during an open pairing window
          (E12-02), recompute the expected proof using the phoneSpki taken from the certificate
          actually presented in this TLS handshake, never from PairRequest.deviceInfo, and
          compare with the E10-11 constant-time helper.
        acceptance:
          - A proof valid for the connecting certificate is accepted
          - A proof computed for a different phone key while deviceInfo claims another identity
            is rejected, because verification uses the handshake cert, not the claimed one
          - The comparison uses the constant-time helper (verified via a spy/wrapper in test)
        tdd:
          - verifyProof_validForHandshakeCert_accepted
          - verifyProof_deviceInfoClaimsDifferentKeyThanHandshakeCert_rejected
          - verifyProof_comparison_usesConstantTimeHelper

      - id: E14-08
        title: "[macos] Pairing confirmation dialog and PairAccepted/reject"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: []
        depends_on: [E14-07]
        description: |
          On proof success, show "Pair <deviceInfo.name>?" with accept/deny; on accept, send
          PairAccepted and commit the phone's fingerprint to the trust store (E13-06); on deny
          or dismiss, close the connection and burn an attempt.
        acceptance:
          - Accepting the dialog sends PairAccepted and commits the fingerprint to the trust
            store
          - Denying or dismissing closes the connection without committing trust, and counts as
