  - id: E12
    title: Secure transport (mTLS 1.3 client/server, pinning)
    labels: [area:transport]
    prd: [F-3.1]
    use_cases: [UC-03, UC-04, UC-05, AC-01, AC-04, UC-02, UC-07]
    summary: |
      Establishes the mutually authenticated TLS 1.3 transport (F-3.1): a macOS NWListener as
      the sole listening endpoint on one port, an Android SSLSocket client that always dials,
      both pinned to the trust store (E13) with an open-pairing-window exception (E14), a
      CONTROL-channel Hello for version/capability negotiation, a connection state machine,
      fail-closed error surfacing (invariant 5), and a session abstraction over the multiplexer
      (E11) designed so a future USB transport (F-10.3) can implement the same interface.
    scope:
      - macOS NWListener, TLS 1.3-only, client-cert-required, single port
      - Android SSLSocket (Conscrypt) client, custom TrustManager/KeyManager
      - Verify-block / TrustManager pin check against trust store OR open pairing window
      - No session resumption, no 0-RTT
      - CONTROL channel Hello (version/capability handshake)
      - Connection state machine on both sides
      - Fail-closed error reporting surfaced to the UI
      - Session object / transport abstraction interface exposing channels
      - JVM-client-to-Mac-server integration test
    out_of_scope:
      - Trust store persistence itself — E13
      - Pairing window state machine and QR flow — E14
      - Heartbeat/reconnect strategy, Bonjour discovery — Phase 2 (E20/E21)
      - mitm-lab scenario automation — E15
    exit_criteria:
      - The macOS listener rejects TLS 1.2 (openssl s_client -tls1_2 fails) and rejects an
        unknown client certificate outside an open pairing window
      - The Android SSLSocket client completes a full handshake against the Mac listener using
        its Keystore identity
      - The JVM-test-client-to-Mac-server integration test passes in CI
      - A version-mismatched Hello fails closed with a visible error on both sides
    issues:
      - id: E12-01
        title: "[macos] NWListener: TLS 1.3-only mTLS options, single port"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [UC-01, UC-05]
        invariants: [1, 2, 4]
        depends_on: [E10-07, E03-01, E00-07, E01-01]
        description: |
          Configure NWListener with NWProtocolTLS.Options: min and max TLS version 1.3, local
          identity = the SecIdentity from E10-07, and
          sec_protocol_options_set_peer_authentication_required(true). Bind to a single fixed
          port per SPEC.md; no other listener exists anywhere in the app.
        acceptance:
          - openssl s_client -tls1_2 against the listener fails to complete a handshake
          - The listener requires a client certificate; a connection without one is rejected
          - Only one listening socket exists in the process (verified via lsof/netstat in test)
          - No listening socket is created until a usable identity exists; if identity bootstrap failed (E10-09) the listener never starts and the UI shows the identity error (UC-01).
        tdd:
          - listener_tls12ClientHello_handshakeFails
          - listener_noClientCert_handshakeRejected
          - listener_processSockets_onlyOneListeningPort
          - listener_noUsableIdentity_neverStartsListening

      - id: E12-02
        title: "[macos] Verify block: trust store check or open pairing window"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [UC-03, UC-04, AC-04]
        invariants: [1, 3, 5]
        depends_on: [E12-01, E13-06]
        description: |
          Implement the sec_protocol_verify_t block: compute the peer cert's SPKI fingerprint,
          accept if present in the trust store (E13-06), else accept only if a pairing window is
          currently open (E14-02 state), else reject before any application data is exchanged.
        acceptance:
          - An unknown fingerprint with no open pairing window fails the handshake before any
            data is exchanged
          - A known fingerprint from the trust store is accepted regardless of pairing-window
            state
          - An unknown fingerprint during an open pairing window is accepted (pairing continues
            in E14)
        tdd:
          - verifyBlock_unknownFingerprintNoWindow_handshakeFails
          - verifyBlock_knownFingerprint_handshakeSucceeds
          - verifyBlock_unknownFingerprintDuringOpenWindow_handshakeSucceeds

      - id: E12-03
        title: "[macos] Disable session resumption and 0-RTT"
        type: task
        platforms: [macos]
        priority: P0
        size: S
        prd: [F-3.1]
        use_cases: [AC-01]
        invariants: [1]
        depends_on: [E12-01]
        description: |
          Explicitly disable TLS session ticket resumption and early data (0-RTT) in
          NWProtocolTLS.Options.
        acceptance:
          - A client attempting session resumption with a previously issued ticket is forced
            into a full handshake
          - A client attempting 0-RTT early data has that data rejected/ignored until the full
            handshake completes
        tdd:
          - listener_sessionResumptionAttempt_forcesFullHandshake
          - listener_zeroRttEarlyData_rejectedUntilFullHandshake

      - id: E12-04
        title: "[android] SSLSocket (Conscrypt) TLS 1.3-only client"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [UC-01, UC-03, UC-04]
        invariants: [1, 2, 4]
        depends_on: [E10-02, E00-02, E03-03]
        description: |
          Configure an SSLContext using Conscrypt with enabled protocols restricted to
          ["TLSv1.3"], presenting the app's client certificate via a custom X509KeyManager
          (E12-06). The app never binds a ServerSocket anywhere (invariant 4).
        acceptance:
          - A client connecting to a TLS-1.2-only test server fails the handshake
          - The client presents its Keystore-backed certificate during the handshake
          - A static/lint check confirms no ServerSocket/bind call exists anywhere in the
            Android codebase
        tdd:
          - sslClient_serverTls12Only_handshakeFails
          - sslClient_handshake_presentsKeystoreCertificate
          - codebaseScan_noServerSocketBindCallsAnywhere

      - id: E12-05
        title: "[android] Custom X509TrustManager: pin check against trust store or pairing window"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [UC-03, UC-04, AC-04]
        invariants: [1, 3, 5]
        depends_on: [E12-04, E13-02]
        description: |
          Implement checkServerTrusted to compute the presented cert's SPKI fingerprint and
          accept only if it matches the pinned Mac fingerprint (from the trust store, or from
          the QR payload during an in-progress pairing attempt, E14-04). Any mismatch throws
          CertificateException, failing the handshake closed.
        acceptance:
          - A server cert fingerprint matching the pinned value is accepted
          - A mismatched server cert fingerprint (wrong or swapped cert) throws
            CertificateException with no data sent
          - The trust manager never consults an IP address or hostname
        tdd:
          - trustManager_matchingPinnedFingerprint_accepted
          - trustManager_mismatchedFingerprint_throwsCertificateException
          - trustManager_verification_neverUsesIpOrHostname

      - id: E12-06
        title: "[android] Custom X509KeyManager backed by Keystore identity"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-3.1]
        use_cases: [UC-03]
        invariants: [3]
        depends_on: [E10-02]
        description: |
          Implement chooseClientAlias/getCertificateChain/getPrivateKey returning the single
