  - id: E14
    title: QR pairing, unpair, revoke
    labels: [area:pairing]
    prd: [F-2.1, F-2.3]
    use_cases: [UC-03, UC-04, UC-07, AC-03, AC-09]
    summary: |
      Implements F-2.1 QR pairing end to end and F-2.3 unpair/revoke: Mac-side QR generation and
      pairing-window state machine, Android-side scanner and pairing state machine, constant-time
      proof verification bound to the certificate actually seen in the TLS handshake, a
      confirmation dialog on the Mac, a scanning UI on Android, and the unpair/revoke flow on
      both sides culminating in the Phase 1 exit criterion: pair via QR, then reconnect after
      restarting both apps.
    scope:
      - Mac QR payload generation and pairing-window state machine (120 s expiry, 3 attempts,
        single use, secret regeneration)
      - Android QR parsing/validation and pairing state machine
      - PairRequest/PairAccepted flow, proof computation and verification
      - Mac confirmation dialog; Android CameraX + ML Kit scanner UI; Mac QR display UI
      - Unpair and Revoke on both sides; Mac paired-devices list with last-seen and revoke
      - End-to-end pairing-then-reconnect test (Phase 1 exit criterion)
    out_of_scope:
      - TLS transport mechanics themselves — E12
      - Trust store persistence mechanics — E13
      - Manual pairing (F-2.2) — Phase 7, epic E73
    exit_criteria:
      - A phone pairs with a Mac via QR and reconnects after restarting both apps
      - Every pairing failure path (bad proof, malformed message, window expiry) fails closed
        and burns exactly one attempt where applicable
      - Revoke removes trust on both sides when the peer is reachable; local unpair is immediate
        regardless of reachability
      - Every UC-03 alternate flow (declined, expired/used QR, Mac unreachable) shows a distinct phone message (E14-17)
    issues:
      - id: E14-01
        title: "[macos] QR payload generation: secret and payload encode"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: [6]
        depends_on: [E10-08, E01-02, E01-21, E00-08]
        description: |
          Generate a fresh 128-bit secret per pairing window; encode
          tandem://pair?v=1&fp=<b64url mac spki>&s=<b64url secret>&a=<addr1,addr2>&p=<port>
          &n=<mac name> per F-2.1. Addresses are the Mac's current local interface addresses;
          name is the Mac's display name.
          Seams: a feature-local `LocalAddressSource` protocol over getifaddrs and a
          `SecretSource` (`SystemRandomNumberGenerator` in production) so the encoder is a pure
          function tested against the E01-21 QR vectors. Cross-platform agreement: the encoder must
          reproduce each valid vector string, which the Android parser (E14-03) is tested against.
        acceptance:
          - For each valid E01-21 vector's fields, the encoder output equals the vector payload string
          - Two consecutive window starts produce different secrets; the `s` param decodes to exactly 16 bytes
          - The `a` param lists exactly the addresses returned by the injected LocalAddressSource
          - The payload contains the fingerprint and no bytes of the private key or its external representation
        tdd:
          - "unit: qrPayloadEncoder_eachValidQrVectorFields_equalsVectorString"
          - "unit: qrPayload_twoWindowStarts_secretsDiffer"
          - "unit: qrPayload_secretParam_decodesTo16Bytes"
          - "unit: qrPayload_addressParam_equalsInjectedLocalAddresses"
          - "unit: qrPayload_generated_containsNoPrivateKeyBytes"

      - id: E14-02
        title: "[macos] Pairing window state machine"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03, AC-03]
        invariants: [6]
        depends_on: [E14-01, E00-24]
        description: |
          States: Closed -> Open(secret, expiresAt, attemptsRemaining=3) -> Closed(reason), on
          success, expiry, attempts exhausted, or explicit cancel. 120 s expiry timer; each failed
          PairRequest decrements attemptsRemaining; the window is single-use and closes
          immediately on a successful PairAccepted, zeroing the secret (UC-03 step 6);
          regenerating (E14-01) always opens a fresh window with a new secret, invalidating the
          old one. Conforms to the `PairingWindowState` protocol used by E12-02.
          The pairing window takes an injected `Clock` (E00-24) so the 120 s expiry is tested in
          virtual time with `ManualTestClock`.
        acceptance:
          - Opening yields attemptsRemaining=3 and expiresAt = now + 120 s
          - Each failed attempt decrements attemptsRemaining by exactly 1
          - A 4th attempt is rejected with `attemptsExhausted` without invoking the proof verifier (spy)
          - After advancing 119 s the window is Open; after 120 s it is Closed(expired) with no attempts made
          - A successful pairing closes the window (Closed(paired)) and the secret is no longer retrievable; a second PairRequest with the same secret is rejected (UC-03 same QR twice)
          - After regenerate, a proof computed with the old secret is rejected
          - Explicit cancel yields Closed(cancelled)
        tdd:
          - "unit: pairingWindow_open_threeAttemptsAndExpiresIn120s"
          - "unit: pairingWindow_failedAttempt_attemptsRemainingDecrementsByOne"
          - "unit: pairingWindow_fourthAttempt_rejectedWithoutProofCheck"
          - "unit: pairingWindow_advance119s_stillOpen"
          - "unit: pairingWindow_advance120sNoAttempts_closedExpired"
          - "unit: pairingWindow_successfulPairing_closedAndSecretCleared"
          - "unit: pairingWindow_sameSecretAfterSuccess_secondRequestRejected"
          - "unit: pairingWindow_regenerate_oldSecretProofRejected"
          - "unit: pairingWindow_explicitCancel_closedCancelled"

      - id: E14-03
        title: "[android] QR payload parsing and validation"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: [3]
        depends_on: [E01-02, E01-21, E00-04]
        description: |
          Parse tandem://pair?v=1&... into a typed PairingInvite(fp, secret, addresses, port,
          macName); reject unknown/missing v, malformed base64url fields, wrong-length fp/secret,
          or missing required params. Pure JVM; E01-21 vectors are re-run by the E15-01
          conformance runner (which depends on this issue).
        acceptance:
          - Every valid E01-21 vector parses to the expected PairingInvite
          - Every malformed vector is rejected with a typed `InviteError` and no partial invite
          - v=2 yields `UnsupportedVersion`; a missing fp or s yields `MissingParam`
          - An fp that does not decode to 32 bytes or an s that does not decode to 16 bytes is rejected
        tdd:
          - "unit: parseInvite_eachValidQrVector_producesExpectedInvite"
          - "unit: parseInvite_eachMalformedQrVector_rejectedNoPartialInvite"
          - "unit: parseInvite_versionTwo_rejectedUnsupportedVersion"
          - "unit: parseInvite_missingFpOrSecret_rejectedMissingParam"
          - "unit: parseInvite_fpNot32Bytes_rejectedBadFingerprint"

      - id: E14-04
        title: "[android] Pin Mac fingerprint from QR before TLS connect"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-2.1]
        use_cases: [UC-03, AC-01]
        invariants: [1, 3]
        depends_on: [E14-03, E12-05]
        description: |
          Before dialing, register the scanned invite's fp as the expected pin for this
          connection attempt so the TrustManager (E12-05) accepts only that exact fingerprint
          for the duration of the pairing attempt, without writing a permanent trust-store entry
          until PairAccepted. Tested with the real TrustManager and a feature-local
          `PairingConnector` fake that records whether a PairRequest was sent.
        acceptance:
          - With the invite pin registered, the TrustManager accepts exactly the invite SPKI and rejects any other
          - A server presenting a different SPKI fails the attempt and the connector records 0 PairRequests
          - Before PairAccepted, the trust store contains no record for the invite fingerprint
          - When the attempt ends (any outcome), the temporary pin is unregistered
        tdd:
          - "unit: pairingPin_inviteRegistered_trustManagerAcceptsOnlyInviteSpki"
          - "unit: pairingPin_serverPresentsDifferentSpki_noPairRequestSent"
          - "unit: pairingPin_beforePairAccepted_trustStoreHasNoRecord"
          - "unit: pairingPin_attemptEnded_pinUnregistered"

      - id: E14-05
        title: "[android] Pairing state machine: connect, PairRequest, await result"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: [5]
        depends_on: [E14-04, E12-08, E12-11, E13-02, E00-18, E00-04]
        description: |
          States: Idle -> Connecting -> AwaitingProofSent -> AwaitingAccept -> Paired |
          Rejected | Failed(reason). Connecting dials the QR addresses in order with the
          per-address connect timeout from the SPEC pairing section (E01-02). On TLS ready,
          computes and sends PairRequest{deviceInfo, proof} (proof from E14-06), then waits up to
          120 s for PairAccepted or PairRejected.
          The pairing state machine takes an injected `Clock` and dispatcher (E00-18) so timeouts
          run in virtual time, and a feature-local `PairingConnector` returning a
          `FakeTandemSession` (E12-11 testFixtures) in tests.
        acceptance:
          - Every documented transition is exercised by a test
          - A timeout on the first QR address dials the next one; timeouts on all addresses yield Failed(AllAddressesUnreachable)
          - No PairAccepted within 120 s of virtual time yields Failed(Timeout); a session drop while awaiting yields Failed(ConnectionLost); never a silent return to Idle
          - On Paired, the Mac fingerprint from the invite is committed to the trust store (E13-02); Rejected or Failed leaves the trust store unchanged
        tdd:
          - "unit: pairingSm_startPairingFromIdle_emitsConnecting"
          - "unit: pairingSm_firstAddressTimesOut_dialsNextQrAddress"
          - "unit: pairingSm_allQrAddressesTimeOut_emitsFailedAllAddressesUnreachable"
          - "unit: pairingSm_tlsReady_sendsPairRequestAndEmitsAwaitingAccept"
