      - id: E11-09
        title: "[android] Starvation regression test: FILES transfer must not delay NOTIFY"
        type: test
        platforms: [android]
        priority: P0
        size: M
        prd: [F-3.2]
        use_cases: [UC-08, UC-15]
        invariants: []
        depends_on: [E11-07, E00-18, E00-19]
        description: |
          Deterministic virtual-time test: two real multiplexer + flow-control stacks over an
          `InMemoryDuplexPipe` (E00-19) with 64 KiB capacity whose reader drains at a modelled
          10 MiB/s (a `delay` per 64 KiB in the `runTest` scheduler, E00-18). A 50 MiB FILES
          stream in 256 KiB chunks saturates the link while 100 NOTIFY frames are sent at 100 ms
          intervals. Latency = virtual time from NOTIFY send() call to emission on the peer's
          NOTIFY Flow. Bound derivation: one in-flight 256 KiB FILES frame (25 ms) + a full pipe
          buffer (6.25 ms) + scheduling slack, rounded to 50 ms.
        acceptance:
          - Every one of the 100 NOTIFY frames is delivered within 50 ms of virtual time while FILES is saturated (deterministic, not a percentile)
          - The FILES stream still delivers all 50 MiB, byte-identical, in order
          - The test completes in under 10 s of real time
        tdd:
          - "unit: starvation_files50MiBSaturating_everyNotifyWithin50msVirtual"
          - "unit: starvation_files50MiBSaturating_allFilesBytesDeliveredInOrder"

