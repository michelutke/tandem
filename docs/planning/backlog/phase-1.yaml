          - "unit: constantTimeEquals_mismatchAtFirstByte_returnsFalseAfterFullScan"
          - "unit: constantTimeEquals_mismatchAtLastByte_sameAccessCountAsFirstByte"
          - "unit: constantTimeEquals_differentLengths_returnsFalseWithoutThrowing"

