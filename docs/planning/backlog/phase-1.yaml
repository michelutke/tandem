        acceptance:
          - The key manager always returns the fixed identity alias regardless of requested key
            types (single-identity design)
          - getPrivateKey returns a Keystore-backed PrivateKey whose signing operation succeeds
            without exposing raw key material
        tdd:
          - keyManager_chooseClientAlias_returnsFixedIdentityAlias
          - keyManager_getPrivateKey_signsViaKeystoreWithoutExposingKeyMaterial

      - id: E12-07
        title: "[cross] CONTROL channel Hello: version/capability handshake"
        type: task
        platforms: [android, macos]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [UC-03, UC-04]
        invariants: [5]
        depends_on: [E12-01, E12-04, E11-05, E11-06]
        description: |
          Both sides send a Hello{protocolVersion, capabilities} on CONTROL immediately after TLS
          completes, before any other channel is used. A mismatched major version fails the
          connection closed and surfaces a visible error; a matching version continues.
        acceptance:
          - A compatible Hello exchange transitions the connection to Ready
          - A Hello with an unsupported major version on either side fails the connection closed
            and surfaces a visible error, not just a log line
          - No channel other than CONTROL sends data before the Hello exchange completes
        tdd:
          - hello_compatibleVersions_transitionsToReady
          - hello_incompatibleMajorVersion_failsClosedWithVisibleError
          - hello_beforeCompletion_otherChannelsBlocked

      - id: E12-08
        title: "[android] Connection state machine"
