  - id: E11
    title: Protocol codec, multiplexer, flow control
    labels: [area:protocol]
    prd: [F-3.2]
    use_cases: [UC-08, UC-12, UC-13, UC-14, UC-15]
    summary: |
      Implements the framed transport codec (F-3.2): a u32 big-endian length-prefixed protobuf
      Envelope, max 1 MiB, with fail-closed rejection of malformed input; a channel multiplexer
      routing CONTROL/NOTIFY/CLIPBOARD/FILES/SMS/CONTACTS/CALLS/INPUT/STATUS frames with seq/ack;
      and credit-based per-channel flow control so a large FILES transfer cannot starve NOTIFY.
      Both platforms implement independently against the same protocol/vectors fixtures and
      design, with conformance and starvation regression tests on each side.
    scope:
      - Envelope encode/decode on both platforms
      - Fail-closed handling of oversize (>1 MiB), truncated, and garbage frames
      - "Channel multiplexer: routing by channel, seq/ack bookkeeping"
      - Credit-based flow control per channel with a suspending backpressure API
        (Kotlin Flow / Swift AsyncSequence)
      - Starvation regression test (FILES must not delay NOTIFY)
      - Conformance against protocol/vectors frame fixtures
    out_of_scope:
      - TLS/session establishment — E12
      - Specific channel payload semantics (NOTIFY content, FILES chunking) — later phase epics
      - Building the tools/conformance runner itself — E15
    exit_criteria:
      - Both codecs pass every protocol/vectors frame vector, valid and invalid
      - Oversize, truncated, and garbage input close the connection with a defined close code
        on both platforms
      - The starvation test demonstrates a NOTIFY frame delivered within a fixed latency bound
        while a large FILES transfer is in-flight, on both platforms
    issues:
      - id: E11-01
        title: "[android] Envelope frame encode: u32 BE length plus protobuf"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-3.2]
        use_cases: [UC-08, UC-13]
        invariants: []
        depends_on: [E00-02, E00-04, E00-09, E01-03, E01-10]
        description: |
          Implement FrameEncoder writing a 4-byte big-endian length prefix followed by the
          serialized Envelope proto (protobuf-kotlin-lite). Enforce the 1 MiB max total frame
          size at encode time.
        acceptance:
          - Encoded bytes are a 4-byte BE length followed by exact protobuf bytes, matching
            protocol/vectors valid-frame fixtures
          - Encoding a payload that would produce a frame over 1 MiB throws before any bytes are
            written
        tdd:
          - encodeFrame_validEnvelope_matchesVectorBytes
          - encodeFrame_payloadExceeding1MiB_throwsBeforeWrite

      - id: E11-02
        title: "[android] Envelope frame decode and fail-closed rejection"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-3.2]
        use_cases: [AC-07]
        invariants: [1, 5]
        depends_on: [E11-01]
        description: |
          Implement FrameDecoder reading the 4-byte length then exactly that many bytes; close
          the connection (no partial parse) with a defined close code when the declared length
          exceeds 1 MiB, when the stream ends before the length bytes are read, or when the
          payload does not parse as a valid Envelope.
        acceptance:
          - Valid vectors decode to the expected Envelope
          - Declared length over 1 MiB closes the connection with FRAME_TOO_LARGE
          - A truncated stream (EOF mid-frame) closes with FRAME_TRUNCATED
          - Garbage bytes that do not parse as an Envelope close with FRAME_MALFORMED
        tdd:
          - decodeFrame_validVectors_decodeToExpectedEnvelope
          - decodeFrame_declaredLengthOver1MiB_closesWithFrameTooLarge
          - decodeFrame_truncatedStream_closesWithFrameTruncated
          - decodeFrame_garbageBytes_closesWithFrameMalformed

      - id: E11-03
        title: "[macos] Envelope frame encode: u32 BE length plus protobuf"
        type: task
        platforms: [macos]
        priority: P0
        size: S
        prd: [F-3.2]
        use_cases: [UC-08, UC-13]
        invariants: []
        depends_on: [E00-07, E00-08, E00-09, E01-03, E01-10]
        description: |
          Swift equivalent of E11-01 using swift-protobuf; FrameEncoder lives in TandemProtocol.
        acceptance:
          - Encoded bytes match protocol/vectors valid-frame fixtures
          - Encoding a payload that would produce a frame over 1 MiB throws before any bytes are
            written
        tdd:
          - encodeFrame_validEnvelope_matchesVectorBytes
          - encodeFrame_payloadExceeding1MiB_throwsBeforeWrite

      - id: E11-04
        title: "[macos] Envelope frame decode and fail-closed rejection"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.2]
        use_cases: [AC-07]
        invariants: [1, 5]
        depends_on: [E11-03]
        description: |
          Swift equivalent of E11-02 in TandemProtocol, using the same three close codes.
        acceptance:
          - Valid vectors decode to the expected Envelope
          - Declared length over 1 MiB closes with FRAME_TOO_LARGE
          - A truncated stream closes with FRAME_TRUNCATED
          - Garbage bytes close with FRAME_MALFORMED
        tdd:
          - decodeFrame_validVectors_decodeToExpectedEnvelope
          - decodeFrame_declaredLengthOver1MiB_closesWithFrameTooLarge
          - decodeFrame_truncatedStream_closesWithFrameTruncated
          - decodeFrame_garbageBytes_closesWithFrameMalformed

      - id: E11-05
        title: "[android] Channel multiplexer: routing plus seq/ack"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-3.2]
        use_cases: [UC-08, UC-12, UC-13, UC-14, UC-15]
        invariants: []
        depends_on: [E11-02, E01-04]
        description: |
          Route decoded Envelopes to per-channel Kotlin Flow sinks (CONTROL, NOTIFY, CLIPBOARD,
          FILES, SMS, CONTACTS, CALLS, INPUT, STATUS); track outgoing seq per channel and
          incoming ack. Expose send(channel, payload) and receive(channel): Flow<Envelope>.
        acceptance:
          - Frames sent on channel A are never delivered to channel B's Flow
          - seq increments monotonically per channel, independent of other channels
          - ack reflects the highest contiguous seq received per channel
        tdd:
          - multiplexer_frameOnChannelA_notDeliveredToChannelBFlow
          - multiplexer_send_seqIncrementsPerChannelIndependently
          - multiplexer_receive_ackReflectsHighestContiguousSeq

