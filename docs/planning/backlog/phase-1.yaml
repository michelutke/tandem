          - Against a localhost server presenting a wrong cert, the handshake fails and the server reads 0 application bytes
          - "A server leaf whose key is not a 91-byte uncompressed P-256 SPKI is rejected before the pin compare; validity dates are not checked (an expired but pinned certificate passes the TrustManager, CertificateVerify is still enforced by Conscrypt)."
