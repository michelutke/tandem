phase: 1
epics:
  - id: E10
    title: Device identity (keys, self-signed certs, SPKI fingerprints)
    labels: [area:crypto]
    prd: [F-1.1]
    use_cases: [UC-01, UC-02, UC-03, UC-05]
    summary: |
      Each device owns a long-term, non-exportable P-256 key pair and a self-signed X.509
      certificate used purely as a TLS identity; the only thing ever trusted is the SHA-256
      hash of the certificate's SubjectPublicKeyInfo (invariant 3). This epic generates and
      stores that identity on both platforms, computes and vector-tests the fingerprint,
      handles the lifecycle case where the key is missing or corrupted (a new identity is
      generated and the device must be re-paired), and provides the small crypto primitives
      (constant-time compare, HMAC-SHA256 pairing proof) that transport (E12) and pairing
      (E14) build on. Only core/crypto (Android) / TandemCrypto (macOS) may touch key material.
    scope:
      - AndroidKeyStore P-256 key generation, StrongBox preferred, TEE fallback, never exportable
      - macOS CryptoKit/Security P-256 key generation in Keychain
        (kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly)
      - Self-signed X.509 certificate generation on both platforms (swift-certificates on macOS)
      - SecIdentity construction for Network.framework consumption
      - SPKI SHA-256 fingerprint computation, vector-tested against protocol/vectors
      - "Identity lifecycle: first-launch bootstrap; corrupted/missing-key recovery = new
        identity + requires re-pair"
      - Constant-time byte-compare helper
      - HMAC-SHA256 pairing-proof helper, vector-tested
    out_of_scope:
      - Key rotation (F-1.3) — Phase 7, epic E70
      - Meaningful certificate subject/identity claims — never added, by design
      - Pairing protocol itself — E14
      - TLS handshake wiring and trust-store verify logic — E12 / E13
    exit_criteria:
      - Android identity generation succeeds on a StrongBox-capable and a StrongBox-unavailable
        device profile, never falling back to an exportable key
      - macOS identity key is created in the Keychain with
        kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly and is usable as a SecIdentity in
        Network.framework
      - SPKI fingerprint vectors in protocol/vectors pass on both platforms
      - A corrupted or missing key on either platform yields a fresh identity and an explicit
        "re-pair required" state, never a crash or silent reuse of stale key material
    issues:
      - id: E10-01
        title: "[android] AndroidKeyStore P-256 key generation (StrongBox to TEE fallback, non-exportable)"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-1.1]
        use_cases: [UC-01, UC-02]
        invariants: [3]
        depends_on: [E00-02, E01-01, E03-03, E10-15, E00-21, E00-23]
        description: |
          Generate a P-256 (secp256r1) key pair in AndroidKeyStore via KeyGenParameterSpec,
          requesting StrongBox (setIsStrongBoxBacked(true)) and retrying without it on
          StrongBoxUnavailableException (TEE). Purpose is signing only; the key is never
          exportable. Fixed alias `tandem.identity.v1`.
          Seams: the production `AndroidKeyStoreIdentityKeyStore` implements `IdentityKeyStore`
          (E10-15). The fallback policy lives in `IdentityKeyProvider` in core/crypto, written
          against the interface, so it is unit-tested with `SoftwareIdentityKeyStore`
          (`failNextGenerate(StrongBoxUnavailable)`). Hardware properties are asserted only
          against the real impl: `instrumented:` on the emulator (E00-21; TEE is emulated, there is
          no StrongBox, so the fallback path runs for real) and `manual:` on physical devices
          (E00-23) for StrongBox and `KeyInfo.isInsideSecureHardware`.
        acceptance:
          - With `failNextGenerate(StrongBoxUnavailable)`, the provider issues exactly one retry with preferStrongBox=false and returns that key.
          - If both the StrongBox and the TEE request fail, the provider throws `IdentityKeyError.GenerationFailed` and no key from any other source (software/exportable) is created.
          - The StrongBox fallback writes one log line naming the resulting security level and containing no key bytes, alias-independent handle or certificate bytes (UC-02 alternate).
          - A second getOrCreateIdentityKey() returns the key with the same alias and public key without calling generate again.
          - "On the emulator, the real impl generates the key after the StrongBox fallback and `privateKey.encoded` returns null."
          - On a StrongBox-capable physical device, KeyInfo reports security level STRONGBOX; on a TEE-only device, isInsideSecureHardware=true (manual gate).
        tdd:
          - "unit: identityKeyProvider_strongBoxUnavailable_retriesOnceWithoutStrongBox"
          - "unit: identityKeyProvider_bothGenerationsFail_throwsGenerationFailedNoSoftwareKey"
          - "unit: identityKeyProvider_strongBoxFallback_logsSecurityLevelWithoutKeyBytes"
          - "unit: identityKeyProvider_calledTwice_returnsSameKeyWithoutRegenerating"
          - "instrumented: androidKeyStoreIdentity_emulatorWithoutStrongBox_generatesViaTeeFallback"
          - "instrumented: androidKeyStoreIdentity_privateKey_encodedReturnsNull"
          - "manual: androidKeyStoreIdentity_strongBoxDevice_keyInfoSecurityLevelStrongBox"
          - "manual: androidKeyStoreIdentity_teeOnlyDevice_insideSecureHardwareTrue"

      - id: E10-02
        title: "[android] Self-signed X.509 certificate generation from Keystore key"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-1.1]
        use_cases: [UC-01]
        invariants: [3]
        depends_on: [E10-01, E10-15, E00-21]
        description: |
          Build a self-signed X.509v3 certificate over the Keystore P-256 key, issued at
          key-generation time via setCertificateSubject / setCertificateNotBefore etc. Subject
          is the fixed constant `IDENTITY_CERT_SUBJECT`; the cert carries no meaningful identity.
          Retrievable for the TLS KeyManager (E12-06).
          Seam: the certificate parameters live in one `IdentityCertSpec` used by both the real
          impl and `SoftwareIdentityKeyStore` (E10-15), so JVM tests exercise the same spec;
          persistence of the real cert is asserted `instrumented:` (E00-21).
        acceptance:
          - The cert's public key equals the KeyHandle's public key (fake on JVM, AndroidKeyStore on the emulator).
          - The cert subject equals `IDENTITY_CERT_SUBJECT` exactly and contains no Build.MODEL, device name, serial number or account name.
          - After a fresh `KeyStore.getInstance("AndroidKeyStore").load(null)` (process-restart proxy), the cert is returned for the alias with an identical encoding.
        tdd:
          - "unit: identityCertSpec_subject_equalsFixedConstantOnly"
          - "unit: selfSignedCert_softwareKeyStore_publicKeyEqualsKeyHandlePublicKey"
          - "unit: selfSignedCert_signature_verifiesWithOwnPublicKey"
          - "instrumented: selfSignedCert_androidKeyStore_publicKeyEqualsKeystoreKey"
          - "instrumented: selfSignedCert_freshKeyStoreLoad_sameEncodedCertForAlias"

