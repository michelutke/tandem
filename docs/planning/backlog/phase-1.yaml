  - id: E12
    title: Secure transport (mTLS 1.3 client/server, pinning)
    labels: [area:transport]
    prd: [F-3.1]
    use_cases: [UC-03, UC-04, UC-05, AC-01, AC-04, UC-02, UC-07]
    summary: |
      Establishes the mutually authenticated TLS 1.3 transport (F-3.1): a macOS NWListener as the sole
      listening endpoint on one port, an Android SSLSocket client that always dials, both pinned to the
      trust store (E13) with an open-pairing-window exception (E14), a CONTROL-channel Hello for
      version/capability negotiation, a connection state machine, fail-closed error surfacing (invariant
      5), and a session abstraction over the multiplexer (E11) designed so a future USB transport (F-10.3)
      can implement the same interface. It also enforces the cycle-4 TLS profile (ALPN tandem/1, no SNI,
      no PSK/0-RTT/post-handshake auth, leaf-only P-256 check, CertificateVerify always enforced) and
      applies pre-auth admission control on the Mac listener (E12-18). Per D-67, channel binding is not
      a transport-session property: `TandemSession` exposes no `channelBinding`/exporter API of any
      kind; `cb` is the in-band `PairChallenge`/`RotationChallenge` value generated and held entirely
      by the pairing (E14) and key-rotation (E70) layers.
    scope:
      - macOS NWListener, TLS 1.3-only, client-cert-required, single port
      - Android SSLSocket (Conscrypt) client, custom TrustManager/KeyManager
      - Verify-block / TrustManager pin check against trust store OR open pairing window
      - "No session resumption, PSK, 0-RTT or post-handshake auth on either side (Android: fresh SSLContext, session tickets off)"
      - CONTROL channel Hello (version/capability handshake)
      - Connection state machine on both sides
      - Fail-closed error reporting surfaced to the UI
      - Session object / transport abstraction interface exposing channels
      - JVM-client-to-Mac-server integration test
      - "TLS profile: AEAD suites, ecdsa_secp256r1_sha256, ALPN tandem/1, no SNI, leaf-only 91-byte P-256 SPKI check, validity/KU ignored."
      - "No channel-binding/exporter property anywhere on TandemSession (D-67); channel binding is owned entirely by E14 (pairing) / E70 (rotation) as the in-band PairChallenge/RotationChallenge value."
      - "Mac listener admission control: <= 8 pre-auth connections, <= 2 per IP, 10 s TLS deadline, per-IP throttle (>= 10 failures in 60 s -> 60 s refusal), never a trust input (E12-18)."
      - "VersionHello 5 s deadline (PROTOCOL_TIMEOUT); lastSeen/capabilities recorded on Ready (E12-14, E12-17)."
      - "One Ready control session per peer SPKI; a newer Ready session replaces (closes LIMIT_EXCEEDED) an older one for the same peer (E12-19)."
    out_of_scope:
      - Trust store persistence itself — E13
      - Pairing window state machine and QR flow — E14
      - Heartbeat/reconnect strategy, Bonjour discovery — Phase 2 (E20/E21)
      - mitm-lab scenario automation — E15
    exit_criteria:
      - The macOS listener rejects TLS 1.2 (openssl s_client -tls1_2 fails) and rejects an
        unknown client certificate outside an open pairing window
      - The Android SSLSocket client completes a full handshake against the Mac listener using
        its Keystore identity
      - The JVM-test-client-to-Mac-server integration test passes in CI
      - A version-mismatched Hello fails closed with a visible error on both sides
      - "A client without ALPN tandem/1, a leaf that is not a 91-byte P-256 SPKI, or a pinned certificate without its private key fails the handshake with 0 application bytes; the Android client's second ClientHello carries no pre_shared_key or early_data (E12-01, E12-02, E12-04, E12-05)."
      - "TandemSession (E12-11, E12-12) exposes no channel-binding/exporter property on either platform (D-67); `cb` is produced and consumed entirely within E14 (pairing) / E70 (rotation) as the PairChallenge/RotationChallenge value."
      - "With 8 pre-auth connections a 9th (or a 3rd from one IP) is closed before TLS, an idle TCP connection is closed within 11 s, and a throttled IP never affects a trusted peer from another IP (E12-18)."
      - "No peer VersionHello within 5 s closes with PROTOCOL_TIMEOUT on both sides (E12-07, E12-15)."
      - "A second connection reaching Ready for a peer SPKI that already has a Ready session closes the older one with LIMIT_EXCEEDED (E12-19)."
    issues:
      - id: E12-01
        title: "[macos] NWListener: TLS 1.3-only mTLS options, single port"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [UC-01, UC-05, AC-04]
        invariants: [1, 2, 4]
        depends_on: [E10-07, E03-01, E00-07, E01-01]
        description: |
          Configure NWListener with NWProtocolTLS.Options: min and max TLS version 1.3, local
          identity = the SecIdentity from E10-07, and
          sec_protocol_options_set_peer_authentication_required(true). Bind to a single fixed
          port per SPEC.md; no other listener exists anywhere in the app.
          Seams: `ListenerController` takes an `IdentityState` input (ready / missing / error; protocol declared here, E10-09 conforms) and a
          feature-local `ListenerFactory` protocol (recording fake in tests) so "never listens
          without identity" is a `unit:` test. Real TLS behaviour is an `integration:` test: the
          listener on 127.0.0.1 and an in-process NWConnection client with real Network.framework
          TLS. The `openssl s_client -tls1_2` probe is the E15-11 mitm-lab scenario (E15-11
          depends on this issue).
          Cycle 4: ALPN `tandem/1` is required (`sec_protocol_options_add_tls_application_protocol`).
          Admission control (pre-auth caps, deadlines, per-IP throttle) is E12-18.
          Cycle 8 (D-67): this listener/session exposes no channel-binding or exporter API of any
          kind (no `sec_protocol_metadata_create_secret` call, no `TandemSession.channelBinding`
          property) — channel binding is not a transport concern; see E14-02 (which generates and
          sends `PairChallenge`) and E70 for where `cb` actually lives.
        acceptance:
          - A loopback NWConnection client restricted to max TLS 1.2 fails the handshake; no application byte reaches the listener
          - A loopback client presenting no certificate fails the handshake
          - While the listener runs, `lsof -a -p <pid> -iTCP -sTCP:LISTEN` reports exactly one socket, on the SPEC port
          - With identity state `identityError` (E10-09), `ListenerFactory` is never invoked and no socket is listening (UC-01)
          - "A loopback client offering no ALPN, or an ALPN other than `tandem/1`, fails the handshake with 0 application bytes."
          - "No public API of the listener, its session type, or ConnectionState exposes a channel-binding or exporter value (reflection/symbol check)."
        tdd:
          - "integration: listener_loopbackClientMaxTls12_handshakeFailsNoAppBytes"
          - "integration: listener_loopbackClientWithoutCertificate_handshakeFails"
          - "integration: listener_running_exactlyOneListeningTcpSocket"
          - "unit: listenerController_identityErrorState_listenerFactoryNeverInvoked"
          - "integration: listener_loopbackClientWithoutTandemAlpn_handshakeFails"
          - "unit: tandemSession_publicSurface_noChannelBindingOrExporterProperty"

      - id: E12-02
        title: "[macos] Verify block: trust store check or open pairing window"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [UC-03, UC-04, AC-04, AC-13]
        invariants: [1, 3, 5]
        depends_on: [E12-01, E13-06, E10-08]
        description: |
          Implement the sec_protocol_verify_t block: compute the peer cert's SPKI fingerprint,
          accept if present in the trust store (E13-06), else accept only if a pairing window is
          currently open (E14-02 state), else reject before any application data is exchanged.
          Seams: the decision is a pure `PeerAuthorizer.decide(spki, trustStore, window)` returning
          `.trusted`, `.pairingCandidate` or `.rejected`, unit-tested with the trust store over
          `InMemoryKeychainStore` and a feature-local `PairingWindowState` protocol (fake here;
          E14-02 conforms). The verify block itself is exercised by `integration:` loopback TLS on
          127.0.0.1. Adversarial coverage (unknown cert, swapped cert) is E15-10, which depends on
          this issue.
        acceptance:
          - Unknown fingerprint with the window closed returns `.rejected`; over loopback the handshake fails and the server records 0 application bytes
          - Known fingerprint returns `.trusted` whether the window is open or closed; over loopback the handshake completes
          - Unknown fingerprint with the window open returns `.pairingCandidate` (E14-07 only accepts PairRequest on such connections)
          - A trust-store read error (e.g. `KeychainError.locked`) returns `.rejected`, never `.trusted`
          - "A peer whose leaf key is not a 91-byte uncompressed P-256 SPKI returns `.rejected`; extra chain certificates are ignored and only the leaf is pinned."
          - "With a pairing window open and a candidate already in flight (`PairingWindowState.candidateInFlight`), a second unknown fingerprint returns `.rejected` and no attempt is burned."
        tdd:
          - "unit: peerAuthorizer_unknownFingerprintWindowClosed_rejected"
          - "unit: peerAuthorizer_knownFingerprintAnyWindowState_trusted"
          - "unit: peerAuthorizer_unknownFingerprintWindowOpen_pairingCandidate"
          - "unit: peerAuthorizer_trustStoreLocked_rejected"
          - "integration: verifyBlock_loopbackUnknownCertNoWindow_handshakeFailsZeroAppBytes"
          - "integration: verifyBlock_loopbackTrustedCert_handshakeCompletes"
          - "unit: peerAuthorizer_nonP256LeafKey_rejected"
          - "unit: peerAuthorizer_extraChainCertificates_onlyLeafPinned"
          - "unit: peerAuthorizer_secondUnknownCertWhileCandidateInFlight_rejected"

