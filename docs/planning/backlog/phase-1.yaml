          - Flipping one bit of the secret changes the output
          - Swapping macSpki and phoneSpki changes the output (argument order is bound)
          - "pairingCode matches every confirmation-code vector (E01-18), and a 65-byte raw point or a 31-byte cb is rejected with a typed error before any HMAC is computed."
