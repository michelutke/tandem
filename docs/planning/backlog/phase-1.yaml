      - id: E10-10
        title: "[android] Constant-time byte-array compare helper"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-2.1]
        use_cases: []
        invariants: [6]
        depends_on: [E00-02, E00-04]
        description: |
          Implement constantTimeEquals(a: ByteArray, b: ByteArray): Boolean with no data-dependent
          branching or early exit. Used by the fingerprint pin comparison (E12-05) and any future
          secret comparison in core/crypto (Mac-side proof verification is E10-11/E14-07).
          Full-scan is asserted through an internal overload taking a byte-access counter (test
          seam, not exported from core/crypto).
        acceptance:
          - Returns true only for exactly equal arrays
          - Returns false for different-length inputs without throwing
          - For equal-length inputs, the access counter reads 2 x length whether the first mismatch is at index 0 or at the last index
        tdd:
