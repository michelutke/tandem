          - Two separately decoded instances of the same certificate yield byte-identical 32-byte fingerprints (restart stability; alias persistence itself is E10-02)
          - The string form is 43 characters of base64url without padding (no `=`, `+` or `/`), matching the QR payload format (SPEC pairing section, E01-02)
        tdd:
          - "unit: spkiFingerprint_everyFingerprintVector_matchesExpectedSha256"
          - "unit: spkiFingerprint_twoDecodesOfSameCert_identical32Bytes"
          - "unit: spkiFingerprint_stringForm_is43CharsBase64UrlNoPadding"
          - "unit: spkiFingerprint_differentPublicKey_differentFingerprint"

      - id: E10-04
        title: "[android] Identity lifecycle: first-launch bootstrap and corrupted/missing key recovery"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-1.1]
        use_cases: [UC-01, UC-02]
        invariants: [3]
        depends_on: [E10-01, E10-02, E10-03, E10-15, E00-04]
        description: |
          On first launch, generate the identity eagerly before any pairing UI shows. On every
          subsequent launch, verify the Keystore alias is present and usable (sign+verify smoke
          test). On KeyPermanentlyInvalidatedException or a missing alias, emit an IdentityReset
          event, regenerate a new identity, and surface a requiresRePair app state until the next
          successful pairing.
          Seam: `IdentityBootstrapper` takes `IdentityKeyStore` (E10-15); tests use
          `SoftwareIdentityKeyStore` (delete the alias to simulate "missing") wrapped in a test
          decorator whose sign throws KeyPermanentlyInvalidatedException; events are asserted with
          Turbine (E00-04).
        acceptance:
          - First launch with no existing alias calls generate exactly once and returns a usable handle
          - A sign that throws KeyPermanentlyInvalidatedException emits exactly one IdentityReset and the next access returns a handle with a different public key
          - A missing alias emits IdentityReset and regenerates
          - After IdentityReset, requiresRePair=true until a pairing succeeds, then false
          - An existing usable key is reused with an unchanged public key and no IdentityReset event
        tdd:
          - "unit: bootstrapIdentity_noExistingAlias_generatesExactlyOnce"
          - "unit: bootstrapIdentity_signThrowsPermanentlyInvalidated_emitsIdentityResetAndNewPublicKey"
          - "unit: bootstrapIdentity_aliasMissing_emitsIdentityResetAndRegenerates"
          - "unit: bootstrapIdentity_afterReset_requiresRePairTrueUntilPairingSucceeds"
          - "unit: bootstrapIdentity_existingUsableKey_samePublicKeyNoResetEvent"

