      - id: E14-08
        title: "[macos] Pairing confirmation dialog and PairAccepted/reject"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03, AC-14, AC-17, AC-20]
        invariants: []
        depends_on: [E14-07, E13-06, E12-12, E14-22, E10-13]
        description: |
          On proof success, show "Pair <deviceInfo.name>?" with accept/deny; on accept, send
          PairAccepted and commit the phone's fingerprint (from the handshake cert) to the trust
          store (E13-06); on deny, send PairRejected and close the connection; on dismiss, close the
          connection. `PairConfirmationViewModel` is unit-tested with `FakeTandemSession` (E12-12) and
          the trust store over `InMemoryKeychainStore`.
          Cycle 4: the dialog shows the sanitized (E14-22) displayName in the title, and the sanitized model plus
          the E01-02 confirmation code (E10-13 helper, fed the candidate's `PairChallenge` value held by
          E14-02 — not read from the session, D-67) in the body, e.g.
          "Google Pixel 8 · Make sure your phone shows 123 456". The default button and Escape map to Don't Pair;
          Pair needs an explicit click. Deny sends PairRejected(REJECTED_BY_OWNER).
          Cycle 8 (adversarial verifier, M2/M3/N4, D-70/D-73): Deny and an **owner-initiated** Dismiss
          (the owner closes the dialog window/button while its connection is still open) both close the
          *entire* pairing window (secret destroyed, E14-02 `Closed(declined)`), not merely decrement
          attemptsRemaining — the owner has made a deliberate terminal decision, the same as declining
          reveals the shown device is not theirs. This is distinct from the candidate connection closing
          on its own first (peer disconnect, transport error, or the window/attempt budget expiring) while
          this dialog is still showing: that case already ran the D-70 attempt-burn in E14-02 (the window
          stays `Open` with the reduced budget, unless attempts are now exhausted) before this view model
          ever gets a chance to act, so the view model MUST instead dismiss the dialog itself as a no-op —
          MUST NOT send PairAccepted, MUST NOT commit a trust record, and MUST NOT decrement
          attemptsRemaining a second time — even if the owner then clicks Pair or Deny on the now-stale
          dialog.
        acceptance:
          - For deviceInfo.name "Pixel 8", the dialog title is exactly "Pair Pixel 8?"
          - Accept sends PairAccepted and commits exactly one record with the handshake SPKI
          - "Deny sends PairRejected, closes the connection, commits nothing and closes the entire pairing window (Closed(declined), secret destroyed) rather than only decrementing attemptsRemaining (UC-03 alternate, D-73)."
          - "An owner-initiated Dismiss, while the connection is still open, closes the connection, commits nothing and closes the entire pairing window the same way as Deny (D-73)."
          - "The dialog body shows the model and the 6-digit code computed from this candidate's PairChallenge value (held by E14-02, not the session)."
          - "The default button and the Escape key both map to Don't Pair."
          - "A displayName containing a bidi override or control characters is displayed sanitized, and a name over 64 characters is truncated with an ellipsis."
          - "If the candidate connection closes on its own (not an owner action) while the dialog is pending, that close already burned one attempt and left the window Open (D-70, E14-02); the dialog is dismissed automatically as a no-op, and a subsequent Pair or Deny click sends nothing and commits/decrements nothing further."
        tdd:
          - "unit: pairConfirmation_phoneNamePixel8_titleIsPairPixel8Question"
          - "unit: pairConfirmation_accept_sendsPairAcceptedAndCommitsHandshakeSpki"
          - "unit: pairConfirmation_deny_sendsPairRejectedAndClosesEntireWindow"
          - "unit: pairConfirmation_ownerInitiatedDismissConnectionStillOpen_closesEntireWindow"
          - "unit: pairConfirmation_body_showsModelAndSixDigitCode"
          - "unit: pairConfirmation_defaultAndEscapeAction_isDontPair"
          - "unit: pairConfirmation_nameWithBidiOverride_displayedSanitized"
          - "unit: pairConfirmation_connectionClosedBeforePair_commitsNothing"

      - id: E14-09
        title: "[macos] Failure handling: any pairing failure closes connection and burns attempt"
        type: task
        platforms: [macos]
        priority: P0
        size: S
        prd: [F-2.1]
        use_cases: [AC-03]
        invariants: [5, 6]
        depends_on: [E14-07, E14-02, E00-24, E12-12]
        description: |
          Centralize failure handling for the pairing receive path (bad proof, malformed
          PairRequest, window closed/expired mid-flight) so every failure path closes the
          connection with the E01-05 `PAIRING_FAILED` close code and decrements attemptsRemaining
          exactly once. Mid-flight expiry is driven with `ManualTestClock` (E00-24);
          connections are `FakeTandemSession` (E12-12).
          Cycle 8 (adversarial verifier, M6, D-72): this issue's failure paths (bad proof, malformed
          PairRequest, mid-flight expiry) all send `PairRejected(PAIRING_UNAVAILABLE)` before closing.
          The `PairRequest` 10 s deadline (local reason `TIMEOUT`) is explicitly **not** one of this
          issue's failure paths and sends no `PairRejected` at all — no `PairRequest` was ever received
          for the Mac to reject — that case is owned by E14-02's silent-candidate handling, not this
          issue; see SPEC.md §2 `PairRejected` wire collapse and §5 Local reason vs. wire code.
        acceptance:
          - Bad proof closes with pairing-failure and decrements attemptsRemaining by exactly 1
          - A malformed PairRequest closes with pairing-failure and decrements by exactly 1
          - Window expiry while the confirmation is pending closes the connection and commits no trust
          - A bad proof followed by the connection dropping decrements exactly once in total
          - "Every failure path this issue covers (bad proof, malformed PairRequest, mid-flight expiry) sends PairRejected(PAIRING_UNAVAILABLE), never a detailed reason, before closing; only an owner deny sends REJECTED_BY_OWNER. The PairRequest-deadline TIMEOUT case sends no PairRejected at all and is E14-02's concern, not this issue's (D-72)."
        tdd:
          - "unit: pairingFailure_badProof_closesAndDecrementsByOne"
          - "unit: pairingFailure_malformedPairRequest_closesAndDecrementsByOne"
          - "unit: pairingFailure_windowExpiresBeforeAccept_closesAndNoTrustCommitted"
          - "unit: pairingFailure_badProofThenDrop_decrementsExactlyOnce"
          - "unit: pairingFailure_badProof_wireReasonPairingUnavailableOnly"

