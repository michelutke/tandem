      - id: E12-04
        title: "[android] SSLSocket (Conscrypt) TLS 1.3-only client"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [UC-01, UC-03, UC-04, UC-02]
        invariants: [1, 2, 4]
        depends_on: [E10-02, E12-06, E00-02, E03-03, E00-19, E10-15, E00-05]
        description: |
          Configure an SSLContext using Conscrypt with enabled protocols restricted to
          ["TLSv1.3"], presenting the app's client certificate via a custom X509KeyManager
          (E12-06). The SSLSocket session implements `ByteStream` (E00-19). The app never binds a
          ServerSocket anywhere in main source sets (invariant 4).
          Tests: `integration:` on the JVM with Conscrypt-openjdk against a test-only Conscrypt
          SSLServerSocket on 127.0.0.1 (test source sets are exempt from the no-listener lint),
          identity from `SoftwareIdentityKeyStore` (E10-15). The empirical nmap check is E15-12.
          Cycle 4: a fresh SSLContext per connection with no shared client session cache and
          `SSLSockets.setUseSessionTickets(socket, false)` (JVM harness: Conscrypt equivalents) so the client never
          offers a PSK; ALPN `tandem/1` via `SSLParameters.setApplicationProtocols`; no SNI.
          Cycle 8 (D-67): this client and its `ByteStream`-backed session call no exporter API
          (`SSLSockets.exportKeyingMaterial` is never invoked anywhere in this issue) and expose no
          `channelBinding` property — channel binding is not a transport concern; see E14-05/E14-06
          (which receive and hold `PairChallenge`) and E70 for where `cb` actually lives.
        acceptance:
          - A created client socket's enabledProtocols is exactly ["TLSv1.3"]
          - Against a localhost server limited to TLSv1.2, connect fails with SSLHandshakeException and 0 application bytes are sent
          - A localhost server requiring client auth receives the certificate returned by the E12-06 key manager
          - The no-listener lint fails on a fixture that calls ServerSocket/bind in a main source set and passes on the current tree
          - "Against a localhost server that issues session tickets, the second connection offers no pre_shared_key or early_data extension and the server reports a full handshake."
          - "A server that does not select ALPN `tandem/1` fails the handshake."
          - "No public API of this client or its ByteStream session exposes a channel-binding or exporter value (reflection/symbol check)."
        tdd:
          - "unit: sslClientFactory_createdSocket_enabledProtocolsExactlyTls13"
          - "integration: sslClient_localhostServerTls12Only_handshakeFailsNoAppBytes"
          - "integration: sslClient_localhostServerRequiresClientAuth_receivesKeyManagerCert"
          - "ci: noListenerLint_serverSocketInMainSourceFixture_fails"
          - "ci: noListenerLint_currentTree_passes"
