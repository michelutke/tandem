      - id: E11-07
        title: "[android] Credit-based per-channel flow control and backpressure API"
        type: task
        platforms: [android]
        priority: P0
        size: L
        prd: [F-3.2]
        use_cases: [UC-14, UC-15]
        invariants: []
        depends_on: [E11-05]
        description: |
          Each channel gets a credit window sized per SPEC.md; the sender suspends when credits
          are exhausted until a credit-replenish control message arrives. Expose as a suspending
          Flow-based API so a slow collector on one channel does not block other channels.
        acceptance:
          - The sender suspends when a channel's credit reaches zero and resumes on replenishment
          - A slow Flow collector on one channel does not block sends on other channels
          - Credits never go negative; replenishment is additive up to a configured max
        tdd:
          - flowControl_creditsExhausted_senderSuspendsUntilReplenished
          - flowControl_slowCollectorOnOneChannel_doesNotBlockOtherChannels
          - flowControl_replenish_neverExceedsConfiguredMax

