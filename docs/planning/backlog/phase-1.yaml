        use_cases: [UC-03, UC-04, AC-04]
        invariants: [1, 5]
        depends_on: [E12-01, E11-06, E01-06, E00-25]
        description: |
          Mac side of E01-06: the first CONTROL frame each side sends after TLS is VersionHello
          {protocolVersion, capabilities}; no other channel sends before both hellos are
          exchanged. A mismatched major version closes with the E01-05 version-mismatch code and
          raises a visible error event (mapped to text by E12-10); an unknown capability bit is
          ignored. Tests drive a real Mac session against a scripted peer over
          `InMemoryConnectionPair` (E00-25). Android side is E12-15; cross-stack compatibility is
          proven by E12-13.
        acceptance:
          - Peer hello with the same major and a higher minor version moves the connection to Ready
          - Peer hello with a different major version closes with version-mismatch and emits `Failed(.versionMismatch)`
          - A NOTIFY send issued before the peer hello arrives puts 0 NOTIFY bytes on the wire until Ready
          - The peer's capabilities (unknown bits ignored) are exposed on the Ready state
        tdd:
          - "unit: hello_peerSameMajorHigherMinor_stateBecomesReady"
          - "unit: hello_peerDifferentMajor_closesVersionMismatchAndFailedState"
