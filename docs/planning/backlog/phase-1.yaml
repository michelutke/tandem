      - id: E14-23
        title: "[android] Spike: QR decoder choice (ML Kit bundled telemetry vs. zxing-cpp)"
        type: spike
        platforms: [android]
        priority: P0
        size: S
        prd: [F-2.1]
        use_cases: [UC-03, AC-18]
        invariants: []
        depends_on: [E00-23]
        description: |
          Added in review cycle 4. The PRD names ML Kit barcode scanning; ML Kit's terms allow it to send usage
          metrics to Google and the bundled artifact pulls Google data-transport libraries, which conflicts with
          Tandem's "the apps talk only to each other" posture (AC-18). Compare (a) `com.google.mlkit:barcode-scanning`
          (bundled model, never the Play-services unbundled variant), (b) zxing-cpp Android wrapper (Apache-2.0,
          native, no network code), (c) ZXing core (Java, Apache-2.0) behind the E14-10 `QrDecoder` seam.
        acceptance:
          - "Deliverable: `docs/spikes/qr-decoder.md` recording, per option: transitive dependencies (datatransport / Firebase / Play services), network connections observed during 20 scans and 24 h idle (per-app capture on a physical device, e.g. PCAPdroid, plus emulator `/proc/net` check), any documented opt-out, decode time at 30-60 cm (median and p95 over 20 scans), APK size delta, license and maintenance status."
          - "Go criteria for the chosen decoder: 0 network connections, p95 decode <= 3 s, license on the E00-29 allowlist. If ML Kit egress cannot be proven zero, the decision is zxing-cpp."
          - "The decision is recorded in `docs/dependencies.md` (E00-29) and E14-10 implements it."
        tdd: []
        notes: |
          Added in review cycle 4. Egress is re-checked for the whole app at release by E71-14.

