        title: "[android] SPKI SHA-256 fingerprint computation (vector-tested)"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-1.1]
        use_cases: [UC-03, UC-05]
        invariants: [3]
        depends_on: [E10-02, E01-17]
        description: |
          Compute SHA-256 over the DER-encoded SubjectPublicKeyInfo of the identity cert.
          Expose as a base64url string (matches the QR `fp=` param, F-2.1) and as raw bytes for
