      - id: E14-12
        title: "[android] Unpair action: local deletion and Revoke if connected"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-2.3]
        use_cases: [UC-07, AC-09]
        invariants: [3]
        depends_on: [E13-05, E12-11, E00-18]
        description: |
          A user-triggered unpair calls the local trust-store delete (E13-05) synchronously,
          then, only if a Ready session currently exists to that peer, best-effort sends Revoke
          on CONTROL (bounded by a 2 s timeout) before closing the session. Tested with
          `FakeTandemSession` (E12-11) and the injected dispatcher/Clock (E00-18).
        acceptance:
          - With a Ready session, the order is local delete, then Revoke sent, then session closed
          - With no session, the local record is deleted and nothing is sent
          - If the Revoke send throws, the local record is still deleted and the session is closed
          - If the Revoke send never completes, the session is closed after 2 s of virtual time
        tdd:
          - "unit: unpairAction_readySession_deleteThenRevokeThenClose"
          - "unit: unpairAction_noSession_deletesLocallySendsNothing"
          - "unit: unpairAction_revokeSendThrows_recordDeletedAndSessionClosed"
          - "unit: unpairAction_revokeSendHangs_sessionClosedAfter2sVirtual"

      - id: E14-13
        title: "[macos] Unpair action: local deletion and Revoke if connected"
        type: task
        platforms: [macos]
        priority: P0
        size: S
        prd: [F-2.3]
        use_cases: [UC-07, AC-09]
        invariants: [3]
        depends_on: [E13-09, E12-12, E00-24]
        description: |
          Swift equivalent of E14-12, triggered from the paired-devices list (E14-14). Tested with
          `FakeTandemSession` (E12-12) and `ManualTestClock` (E00-24).
          Defines the per-peer data purge hook API in TandemStore: `PeerDataPurging` protocol
          (`func purgeAll(peer: SpkiFingerprint) async throws`) and a `PeerDataPurgeRegistry`
          that later-phase stores register with at app start (SMS store E50-09, contacts cache
          E51-04; phase 1 cannot depend on phase 5, so the dependency points from those issues to
          this one). Unpair runs every registered purger after the trust record is deleted; a
          purger failure is logged (category only) and retried on next launch, and never
          restores trust.
        acceptance:
          - With a Ready session, the order is local delete, then Revoke sent, then session closed
          - With no session, the local record is deleted and nothing is sent
          - If the Revoke send throws, the local record is still deleted and the session is closed
          - If the Revoke send never completes, the session is closed after 2 s of virtual time
          - Every purger registered in `PeerDataPurgeRegistry` is called exactly once with the unpaired peer's fingerprint; a throwing purger does not stop the others and is recorded for retry on next launch
        tdd:
          - "unit: unpairAction_twoRegisteredPurgers_eachCalledOnceWithPeerFingerprint"
          - "unit: unpairAction_purgerThrows_otherPurgersRunAndRetryRecorded"
          - "unit: unpairAction_readySession_deleteThenRevokeThenClose"
          - "unit: unpairAction_noSession_deletesLocallySendsNothing"
          - "unit: unpairAction_revokeSendThrows_recordDeletedAndSessionClosed"
          - "unit: unpairAction_revokeSendHangs_sessionClosedAfter2sVirtual"

