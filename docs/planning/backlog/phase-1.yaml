        prd: [F-2.1]
        use_cases: [UC-03, AC-20]
        invariants: [6]
        depends_on: [E10-03, E01-18]
        description: |
          Implement pairingProof(secret, macSpkiDer, phoneSpkiDer, cb) =
          HMAC-SHA256 over the E01-02 length-prefixed, channel-bound transcript (cycle 4; supersedes the raw F-2.1 step 3 concatenation), in
          core/crypto only. Validate against protocol/vectors pairing-proof vectors (re-run by
          E15-01). Consumed by E14-06. "No HMAC outside core/crypto" is enforced by the E10-14
          boundary check.
