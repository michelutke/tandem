      - id: E14-16
        title: "[cross] End-to-end: QR pair then reconnect after restarting both apps"
        type: test
        platforms: [android, macos]
        priority: P0
        size: L
        prd: [F-2.1]
        use_cases: [UC-03, UC-04]
        invariants: [1, 3, 5, 6]
        depends_on: [E15-15, E14-05, E14-08, E14-10, E14-11, E12-13]
        description: |
          Phase 1 exit-criterion test: display a QR on a macOS test instance, scan/parse it on
          an Android test client (or the E15-15 JVM harness reusing core/pairing),
          complete pairing, kill and restart both processes, and verify the connection
          re-establishes to Ready using only the persisted trust store, with no new pairing.
        acceptance:
          - The full QR pairing flow completes to Paired/Ready on both sides
          - After restarting both processes, the connection reaches Ready again without any user
            pairing action
          - No pairing window is open during the restart-reconnect path (trust-store path only)
          - After pairing, each trust store contains exactly one new record and the stored fingerprints match the other side's identity (UC-03).
          - Harness pairing completes in < 10 s from QR payload injection to Paired (UC-03 proxy; on-device scan timing is recorded by E14-18).
        tdd:
