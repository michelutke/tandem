      - id: E12-07
        title: "[macos] CONTROL channel VersionHello: version/capability handshake"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [UC-03, UC-04, AC-04]
        invariants: [1, 5]
        depends_on: [E12-01, E11-06, E01-06, E00-25, E01-22, E00-24]
        description: |
          Mac side of E01-06: the first CONTROL frame each side sends after TLS is VersionHello
          {major, minor, capabilities}; no other channel sends before both hellos are
          exchanged. A mismatched major version closes with the E01-05 version-mismatch code and
          raises a visible error event (mapped to text by E12-10); a differing minor version with a
          matching major is compatible, not a mismatch; an unknown capability bit is ignored (the
          raw capabilities value MAY still be recorded, E12-14). Tests drive a real Mac session
          against a scripted peer over `InMemoryConnectionPair` (E00-25). Android side is E12-15;
          cross-stack compatibility is proven by E12-13.
        acceptance:
          - Peer hello with the same major and a higher minor version moves the connection to Ready
          - Peer hello with a different major version closes with version-mismatch and emits `Failed(.versionMismatch)`
          - A NOTIFY send issued before the peer hello arrives puts 0 NOTIFY bytes on the wire until Ready
          - The peer's capabilities (unknown bits ignored) are exposed on the Ready state
          - "No peer VersionHello within 5 s of TLS completion closes with `PROTOCOL_TIMEOUT` (E01-22)."
        tdd:
          - "unit: hello_peerSameMajorHigherMinor_stateBecomesReady"
          - "unit: hello_peerDifferentMajor_closesVersionMismatchAndFailedState"
          - "unit: hello_notifySendBeforePeerHello_zeroNotifyBytesOnWire"
          - "unit: hello_peerUnknownCapabilityBit_ignoredAndOthersExposed"
          - "unit: hello_noPeerHelloWithin5s_closesProtocolTimeout"
        notes: "Split from E12-07 in review cycle 3: was [cross]; Android half is E12-15."

