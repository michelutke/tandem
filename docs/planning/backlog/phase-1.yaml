          - e2e_restartBothProcesses_reconnectsToReadyViaTrustStoreOnly
          - e2e_restartReconnect_doesNotRequireOpenPairingWindow
          - e2e_afterPairing_eachTrustStoreHasExactlyOneMatchingRecord
          - e2e_qrInjectionToPaired_under10s
      - id: E14-17
        title: "[android] Pairing failure messages: expired/used QR, declined, Mac unreachable (network hint)"
        type: story
        platforms: [android]
        priority: P0
        size: S
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: [5]
        depends_on: [E14-05, E12-10]
        description: |
          UC-03 alternate flows and the PRD client-isolation risk ("detect and explain") had no owner.
          Map the pairing state machine's failure reasons (E14-05) to distinct, secret-free phone
          messages: Mac rejected our certificate during a pairing attempt (window expired, exhausted,
          or QR already used) → "QR expired or already used, refresh on Mac"; PairRejected → "Pairing
          declined on Mac"; every QR address timed out → network hint (guest/office Wi-Fi client
          isolation, different network, try phone hotspot or USB later). No failure path retries with
          a relaxed pin or a non-QR address.
        acceptance:
          - A pairing handshake rejected by the Mac shows the QR-expired message
          - An explicit PairRejected shows the declined message
          - Connect timeouts on every QR address show the network-isolation hint, not a generic error
          - No failure path retries with a different pin or an address not in the QR
        tdd:
          - pairingError_macRejectsHandshake_showsQrExpiredOrUsedMessage
          - pairingError_pairRejected_showsDeclinedMessage
          - pairingError_allQrAddressesUnreachable_showsNetworkIsolationHint
          - pairingError_anyFailure_neverRetriesWithRelaxedPinOrForeignAddress
      - id: E14-18
