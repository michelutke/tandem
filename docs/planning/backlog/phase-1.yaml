      - id: E14-15
        title: "[macos] Revoke message handling: receiver drops session and trust"
        type: task
        platforms: [macos]
        priority: P0
        size: S
        prd: [F-2.3]
        use_cases: [UC-07, AC-09]
        invariants: [3]
        depends_on: [E14-13, E12-02, E12-12]
        description: |
          On receiving Revoke on CONTROL from an authenticated peer (a `.trusted` connection in
          Ready), the Mac deletes that peer's trust-store record (located by the handshake SPKI)
          and closes the session. Revoke on a pairing-candidate connection or before Ready is
          ignored. Tested with `FakeTandemSession` (E12-12); the "revoked peer cannot reconnect"
          check is an `integration:` loopback TLS test with the real verify block. Android
          receiver is E14-19; the cross-stack scenario is E14-20.
        acceptance:
          - Revoke from a Ready trusted peer deletes exactly that peer's record and closes the session
          - Revoke on a pairing-candidate connection or before Ready leaves every record unchanged
          - After the revoke, a loopback reconnect with the revoked cert and no pairing window fails the handshake with 0 application bytes
        tdd:
          - "unit: revokeHandler_revokeFromReadyTrustedPeer_deletesRecordAndClosesSession"
          - "unit: revokeHandler_revokeOnPairingCandidateConnection_ignoredRecordsUnchanged"
          - "integration: revokedPeer_loopbackReconnectNoWindow_handshakeFailsZeroAppBytes"
        notes: "Split from E14-15 in review cycle 3: was [cross]; Android receiver is E14-19, cross-stack integration is E14-20."

      - id: E14-19
        title: "[android] Revoke message handling: receiver drops session and trust"
