      - id: E11-05
        title: "[android] Channel multiplexer: routing plus seq/ack"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-3.2]
        use_cases: [UC-08, UC-12, UC-13, UC-14, UC-15]
        invariants: []
        depends_on: [E11-02, E01-04, E00-04, E00-19]
        description: |
          Route decoded Envelopes to per-channel Kotlin Flow sinks (CONTROL, NOTIFY, CLIPBOARD,
          FILES, SMS, CONTACTS, CALLS, INPUT, STATUS); track outgoing seq per channel and
          incoming ack. Expose send(channel, payload) and receive(channel): Flow<Envelope>.
          A repeated or regressing incoming seq is handled per the E01-03 MUST rule.
          Tests wire two multiplexers over `InMemoryDuplexPipe` (E00-19) and collect with
          Turbine (E00-04).
        acceptance:
          - A frame sent on NOTIFY is emitted on the peer's NOTIFY Flow and never on any other channel's Flow
          - Three sends on NOTIFY and one on FILES carry seq 1, 2, 3 and 1 respectively (per-channel counters)
          - After receiving seq 1 and 3 on a channel, ack is 1; after seq 2 arrives, ack is 3
          - A repeated or regressing seq triggers the E01-03-defined behaviour (asserted against the SPEC outcome)
