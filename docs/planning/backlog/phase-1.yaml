      - id: E11-07
        title: "[android] Flow control: suspending per-channel send, fair frame writer, credit grants"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-3.2]
        use_cases: [UC-14, UC-15]
        invariants: []
        depends_on: [E11-05, E11-13, E00-18, E00-19]
        description: |
          Wires the credit ledger (E11-13) into the multiplexer. send(channel, payload) suspends
          when that channel's ledger has no credit and resumes when the peer's credit grant
          (E01-04 replenishment message) arrives. Outgoing frames go to per-channel queues drained
          by a single writer that round-robins across channels with pending frames, so a newly
          queued NOTIFY frame waits behind at most one FILES frame. The receive side grants
          credit back per the E01-04 trigger as frames are consumed, and closes with the E01-05
          credit-violation code if the peer sends past its grant. CONTROL uses the E01-04
          exemption/reserved credit.
          Tests run in `runTest` virtual time with the injected dispatcher (E00-18) over
          `InMemoryDuplexPipe` (E00-19).
        acceptance:
          - With 0 FILES credit, a FILES send is still suspended after advanceTimeBy(10.seconds) and completes within one scheduler tick of the grant being delivered
          - With FILES credit exhausted and 10 FILES frames queued, a NOTIFY send completes and is written within the next 2 frames on the wire
          - A NOTIFY collector that stops collecting does not delay FILES frames beyond that channel's own credit window
          - Consuming frames past the E01-04 trigger causes exactly one credit grant to be sent to the peer
          - A peer frame sent beyond granted credit closes the connection with the `CREDIT_VIOLATION` close code
          - CONTROL sends never suspend on credit
        tdd:
          - "unit: flowControl_zeroCredit_sendSuspendedUntilGrantDelivered"
          - "unit: frameWriter_tenFilesQueuedThenNotify_notifyWrittenWithinTwoFrames"
          - "unit: flowControl_stalledNotifyCollector_filesFramesStillDelivered"
          - "unit: flowControl_consumedPastTrigger_sendsExactlyOneCreditGrant"
          - "unit: flowControl_peerSendsBeyondGrant_closesWithCreditViolation"
          - "unit: flowControl_controlChannel_neverSuspendsOnCredit"
        notes: "Split from E11-07 in review cycle 3: credit accounting moved to E11-13; size L -> M."

