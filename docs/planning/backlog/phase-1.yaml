      - id: E14-24
        title: "[macos] PairingWindow: whole-window-expiry race can leave a candidate socket open"
        type: test
        platforms: [macos]
        priority: P2
        size: S
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: [5]
        depends_on: [E14-16]
        description: |
          Follow-up from E14-16's second security-review round (Fable verifier, non-blocking LOW
          finding). The fix committed for E14-16 records which token `settleLocked()` lazily burned
          via `deadlineBurnedToken` so `PairingCandidateFlow.requestDeadlineElapsed()` can still report
          success when the candidate's own 10 s sub-deadline is what `settleLocked()` processes first.
          A second, narrower race in the same class remains: if the window's own 120 s *whole-window*
          expiry (not the candidate's 10 s sub-deadline) is what `settleLocked()` happens to process
          first — e.g. `PairingViewModel.tick()`'s 1 Hz UI poll reading `closedReason` right around the
          same instant — `deadlineBurnedToken` is never set (that branch of `settleLocked()` returns
          before reaching the candidate-deadline check), `open()`/regenerate then nils it, and the
          watcher's `requestDeadlineElapsed(_:)` reports `false` — same class of leaked-open socket,
          via the window-expiry path instead of the candidate-deadline path. Self-heals if the phone
          ever sends a non-heartbeat frame or disconnects, and does not block new pairing (the slot is
          free), so this is LOW severity, not a blocking finding.
          Suggested fix (from the verifier): have `PairingCandidateFlow.requestDeadlineElapsed()` close
          whenever the window no longer reports `token` as in-flight at all (idempotent close;
          `claimFailure` already prevents a second `PairRejected`), rather than only trusting
          `PairingWindow`'s own return value.
        acceptance:
          - "Candidate reaches awaitingRequest, the window's own 120 s whole-window expiry fires first (not the candidate's 10 s sub-deadline), and the watcher still closes the stale connection."
        tdd:
          - "unit: pairingCandidateFlow_windowExpiresBeforeCandidateDeadlineCheck_connectionClosed"

      - id: E14-25
        title: "[macos] PairingCandidateFlow deadline watcher: atomic tri-state check + .paired exclusion"
        type: test
        platforms: [macos]
        priority: P2
        size: S
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: [5]
        depends_on: [E14-24]
        description: |
          Follow-up from E14-24's Fable verifier pass (two narrow gaps, both fail-closed-direction,
          neither an invariant-5 violation, neither blocking that fix's commit).
          (1) `wrongPayloadReceived()`/`pairRequestReceived()` call `window.releaseCandidate(token)`
          (freeing the slot) before `fail()`'s `claimFailure()`. If the deadline watcher's
          `requestDeadlineElapsed()` runs in that microsecond-scale gap, it can win `claimFailure()`
          first and close without ever sending `PairRejected` — the connection still closes and the
          attempt is still burned exactly once, so this is a skipped wire message (indistinguishable
          from the sanctioned D-72 TIMEOUT close), not a leaked-open socket. Fix: reorder
          `wrongPayloadReceived()` (and `pairRequestReceived()` if it has the same shape) to call
          `claimFailure()` before `releaseCandidate`.
          (2) The new `candidateInFlight(_:)` check has no `.paired` exclusion, unlike
          `heartbeatReceived()` (E14-16 finding #4's fix). A TOCTOU across
          `requestDeadlineElapsed(token)` and `candidateInFlight(token)`'s two separate lock
          acquisitions can — if a `PairRequest` is accepted between them — close a connection whose
          window already reached `.closed(.paired)`. Trust is already committed by that point (the
          phone simply reconnects as a trusted peer), so this is not a security regression, but it's
          the same bug class as E14-16 finding #4. Fix: make `PairingWindow.requestDeadlineElapsed(_:)`
          return an atomic tri-state (`.burned` / `.gone` / `.stillInFlight`, with `.gone` excluding
          `.paired`) resolved under one lock, replacing the current two-call sequence.
        acceptance:
          - A deadline watcher racing `wrongPayloadReceived()`'s claim-then-release sequence never skips `PairRejected` when it wins the race to claim the failure first
          - "A deadline watcher whose window has already reached .closed(.paired) is a no-op (does not close a just-paired session)."
        tdd:
          - "unit: requestDeadlineElapsed_staleWatcherAfterFreshCandidateAdmitted_closesStaleOnlyNotFresh"
          - "unit: requestDeadlineElapsed_windowAlreadyPaired_noOp"

      - id: E14-26
        title: "[macos] Wire RevokeHandler + UnpairAction into the production composition root"
        type: task
        platforms: [macos]
        priority: P1
        size: M
        prd: [F-2.3]
        use_cases: [UC-07, AC-09]
        invariants: [3, 5]
        depends_on: [E14-13, E14-15, E14-14]
        description: |
          Found by E14-20's Fable verifier pass: `RevokeHandler`/`UnpairAction` (E14-13/E14-15) are
          fully implemented and unit-tested, but nothing in `AppComposition`/`ListenerFactory` ever
          consumes CONTROL on a registered trusted session, so the production Mac app silently
          ignores an incoming `Revoke` (the frame sits in the session's buffer forever) and cannot
          itself revoke a phone at all -- `PairedDevicesViewModel` (E14-14, the Devices screen with
          the revoke button) is never composed anywhere outside its own tests either. E14-20's
          `HarnessRevokeAwareSessionRegistry` (DEBUG-only) proves the correct behavior but is a
          parallel reimplementation for test purposes only, not the real path.
          Wire a live CONTROL consumer into every registered trusted session in
          `AppComposition`/`ListenerFactory` that dispatches an incoming `Revoke` to `RevokeHandler`;
          compose `PairedDevicesViewModel` with a real `UnpairAction`. `RevokeHandler`/`UnpairAction`
          are currently `internal` to `TandemStore` -- either make them public or add a
          `TandemStore`-level facade `AppComposition` can call. Once this lands, retire
          `HarnessRevokeAwareSessionRegistry` in favor of the harness exercising the real production
          wiring directly (E14-20's own script should keep passing unmodified against the real path).
        acceptance:
          - A real Revoke frame arriving on a registered trusted session's CONTROL channel deletes that peer's trust record and closes the session
          - Selecting "Unpair" in the real Devices screen (E14-14) sends Revoke, closes the session, and deletes the local trust record
          - This E14-20 exit criterion ("both trust stores lack the peer within 2s") holds against the real production listener, not only the harness's parallel wrapper
        tdd:
          - "integration: appComposition_revokeFrameOnRegisteredSession_trustDeletedAndSessionClosed"
          - "unit: pairedDevicesViewModel_unpairSelected_sendsRevokeAndDeletesLocalTrust"

      - id: E14-17
        title: "[android] Pairing failure messages: expired/used QR, declined, Mac unreachable"
        type: story
        platforms: [android]
        priority: P0
        size: S
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: [2, 5]
        depends_on: [E14-05, E12-16, E00-20, E00-31]
        description: |
          UC-03 alternate flows and the PRD client-isolation risk ("detect and explain") had no owner.
          `PairingErrorMapper` maps the pairing state machine's failure reasons (E14-05) to distinct,
          secret-free string resources:
          - Mac rejected our certificate during a pairing attempt (window expired, exhausted, or QR
            already used) -> `pairing_error_qr_expired`: "QR expired, refresh on Mac" (UC-03 wording)
          - PairRejected(REJECTED_BY_OWNER) -> `pairing_error_declined`: "Pairing declined on Mac"; PairRejected(PAIRING_UNAVAILABLE) -> `pairing_error_qr_expired`: "QR expired, refresh on Mac"
          - Failed(AllAddressesUnreachable) -> `pairing_error_network`: "Can't reach your Mac. Make sure both devices are on the same Wi-Fi. Guest and office networks often block devices from reaching each other (client isolation)."
          - Pin mismatch during pairing -> the E12-16 `error_pin_mismatch` text
          No failure path retries with a relaxed pin or an address not in the QR (invariant 2).
          Mapper is `unit:`; the rendered error screen is Compose `ui:` under Robolectric (E00-20).
        acceptance:
          - A pairing handshake rejected by the Mac shows exactly "QR expired, refresh on Mac"
          - An explicit PairRejected(REJECTED_BY_OWNER) shows exactly "Pairing declined on Mac"
          - Connect timeouts on every QR address show the `pairing_error_network` text quoted above, not a generic error
          - A pin mismatch during pairing shows the pin-mismatch text, not the QR-expired text
          - After any failure, the connector fake records only QR addresses and only the invite pin
          - "PairRejected(PAIRING_UNAVAILABLE) shows \"QR expired, refresh on Mac\"."
          - "The code-confirm screen shows \"Check that your Mac shows 123 456\" with the sanitized Mac name and the buttons \"Codes match\" and \"Cancel\"."
        tdd:
          - "unit: pairingErrorMapper_macRejectsPairingHandshake_qrExpiredRefreshOnMac"
          - "unit: pairingErrorMapper_pairRejectedByOwner_pairingDeclinedOnMac"
          - "unit: pairingErrorMapper_allQrAddressesUnreachable_networkIsolationHint"
          - "unit: pairingErrorMapper_pinMismatchDuringPairing_pinMismatchNotQrExpired"
          - "unit: pairingSm_anyFailure_onlyQrAddressesAndInvitePinUsed"
          - "ui: pairingErrorScreen_allAddressesUnreachable_showsNetworkHintText"
          - "unit: pairingErrorMapper_pairRejectedUnavailable_qrExpiredRefreshOnMac"
          - "ui: pairingConfirmScreen_awaitingUserConfirm_showsCodeAndBothButtons"

      - id: E14-18
        title: "[android] Keystore client-auth device matrix test (StrongBox, TEE-only, API 29, OEM)"
        type: test
        platforms: [android]
        priority: P0
        size: M
        prd: [F-1.1, F-3.1, F-2.1]
        use_cases: [UC-02, UC-03]
        invariants: [1, 3]
        depends_on: [E10-01, E10-15, E12-04, E12-06, E14-10, E00-21, E00-23, E14-05, E14-06, E14-08, E14-11]
        description: |
          PRD risk "Keystore-backed keys with SSLSocket client auth behave differently across OEMs"
          requires an early device-matrix test in Phase 1 (E03-03 only covered the throwaway spike).
          Physical-device `manual:` gates (procedure in docs/testing/manual-gates.md, E00-23) on at
          minimum one StrongBox device, one TEE-only device, one API 29 device and one Samsung,
          each completing the production mTLS handshake and VersionHello against a real Mac
          listener, plus one timed real QR scan-to-Paired run (UC-03 < 10 s). The "never falls back
          to an exportable key" rule is also automated: `unit:` via
          `SoftwareIdentityKeyStore.failNextGenerate` (E10-15) and `instrumented:` on the emulator
          (E00-21). Results table in `docs/testing/device-matrix.md`.
        acceptance:
          - Every matrix device reaches Ready (handshake + VersionHello) against the real Mac using its Keystore identity, 5 of 5 attempts
          - A StrongBox generation failure falls back to TEE only; no software or exportable key is ever created (unit + emulator)
          - One real scan-to-Paired run on the same Wi-Fi completes in < 10 s and is recorded
          - Results are committed in docs/testing/device-matrix.md with device, API level, backing (StrongBox/TEE), and outcome
        tdd:
          - "manual: keystoreClientAuth_strongBoxDevice_readyFiveOfFiveAttempts"
          - "manual: keystoreClientAuth_teeOnlyDevice_readyFiveOfFiveAttempts"
          - "manual: keystoreClientAuth_api29Device_readyFiveOfFiveAttempts"
          - "manual: keystoreClientAuth_samsungDevice_readyFiveOfFiveAttempts"
          - "unit: identityKeyProvider_strongBoxGenerateFails_neverFallsBackToExportableKey"
          - "instrumented: identityKeyProvider_emulatorStrongBoxUnavailable_privateKeyNotExportable"
          - "manual: qrPairing_realScanSameWifi_pairedUnder10s"

