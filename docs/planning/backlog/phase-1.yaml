      - id: E12-11
        title: "[android] Transport session abstraction exposing channels"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [UC-08, UC-12, UC-13, UC-14, UC-15]
        invariants: []
        depends_on: [E12-08, E11-07, E00-19, E00-04]
        description: |
          Define a TandemSession interface (send(channel, payload), receive(channel):
          Flow<Envelope>, state: Flow<ConnectionState>, close()) implemented by the
          `ByteStream`-backed session (SSLSocket in production, `InMemoryDuplexPipe` E00-19 in
          tests). Keep the interface transport-agnostic (no SSLSocket/Conscrypt types leak
          through it) so a future USB transport (F-10.3) can implement it without touching
          feature code. `FakeTandemSession` (records sent frames, lets tests emit incoming frames
          and states) lives in the core/transport `testFixtures` source set and is the seam every
          feature test uses.
          Cycle 8 (D-67; supersedes the original Cycle 4 `channelBinding` property below):
          `TandemSession` exposes no `channelBinding` property and no exporter API of any kind —
          channel binding is not a transport concern. `cb` is the in-band `PairChallenge`/
          `RotationChallenge` value, generated, sent and held entirely by the pairing (E14-02,
          E14-05/E14-06) and key-rotation (E70) layers, which read it from an ordinary received
          `Envelope` like any other CONTROL message, never from this session interface.
        acceptance:
          - No public signature of TandemSession references a javax.net.ssl or org.conscrypt type (reflection test)
          - Two real sessions over an in-memory pipe round-trip a NOTIFY frame byte-identically
          - close() moves state to Disconnected and completes every receive Flow
          - FakeTandemSession records each send(channel, payload) in order and emits injected frames on receive(channel)
          - "No public member of TandemSession or FakeTandemSession is named or typed as a channel-binding/exporter value (reflection test)."
        tdd:
          - "unit: tandemSessionInterface_reflectedSignatures_noSslOrConscryptTypes"
          - "unit: byteStreamSession_notifySendOverPipe_peerReceivesIdenticalEnvelope"
          - "unit: byteStreamSession_close_stateDisconnectedAndReceiveCompletes"
          - "unit: fakeTandemSession_sendCalls_recordedInOrder"
          - "unit: fakeTandemSession_injectedIncomingFrame_emittedOnReceiveFlow"
          - "unit: tandemSessionInterface_reflectedSignatures_noChannelBindingOrExporterMember"

