  - id: E14
    title: QR pairing, unpair, revoke
    labels: [area:pairing]
    prd: [F-2.1, F-2.3]
    use_cases: [UC-03, UC-04, UC-07, AC-03, AC-09]
    summary: |
      Implements F-2.1 QR pairing end to end and F-2.3 unpair/revoke: Mac-side QR generation and
      pairing-window state machine (one in-flight candidate, 10 s PairRequest deadline), Android-side
      scanner (decoder chosen by spike E14-23) and pairing state machine, constant-time proof
      verification bound to the handshake certificate and the in-band `PairChallenge` value (`cb`,
      D-67 — not a TLS/session property), a 6-digit
      confirmation code with mutual confirmation (Mac defaults to Don't Pair; phone commits only after
      "Codes match", AC-20), wire PairRejected collapsed to REJECTED_BY_OWNER / PAIRING_UNAVAILABLE,
      vector-tested DisplayStringSanitizer on both platforms, and unpair/revoke with per-peer data purge
      hooks, culminating in the Phase 1 exit criterion: pair via QR, then reconnect after restarting
      both apps.
    scope:
      - "Mac QR payload generation and pairing-window state machine (120 s expiry, 3 attempts, single use, secret regeneration), one in-flight candidate, 10 s PairRequest deadline burns an attempt, no key rotation while open"
      - Android QR parsing/validation and pairing state machine
      - "PairRequest/PairAccepted flow; proof over the length-prefixed channel-bound transcript; phone AwaitingUserConfirm (Codes match / Cancel -> Revoke); PairRejected reasons collapsed on the wire"
      - "Mac confirmation dialog with sanitized name, model and 6-digit code (default and Escape = Don't Pair); Android CameraX scanner UI with the QR decoder chosen by spike E14-23 (ML Kit only if zero egress is proven, else zxing-cpp); Mac QR display UI (sharingType none, no copy/save, attempts-used-up state)."
      - Unpair and Revoke on both sides; Mac paired-devices list with last-seen and revoke
      - End-to-end pairing-then-reconnect test (Phase 1 exit criterion)
      - "DisplayStringSanitizer (E14-21, E14-22); QR decoder spike (E14-23); Keystore client-auth device matrix (E14-18); PeerDataPurging registries on both platforms; revoke integration on the JVM harness (E14-20)."
    out_of_scope:
      - TLS transport mechanics themselves — E12
      - Trust store persistence mechanics — E13
      - Manual pairing (F-2.2) — Phase 7, epic E73
    exit_criteria:
      - A phone pairs with a Mac via QR and reconnects after restarting both apps
      - "Every pairing failure path (bad proof, malformed message, window expiry, candidate idle > 10 s) fails closed, burns exactly one attempt where applicable and sends only PairRejected(PAIRING_UNAVAILABLE) (owner deny: REJECTED_BY_OWNER); a second concurrent candidate is rejected without burning an attempt."
      - Revoke removes trust on both sides when the peer is reachable; local unpair is immediate
        regardless of reachability
      - Every UC-03 alternate flow (declined, expired/used QR, Mac unreachable) shows a distinct phone message (E14-17)
      - "The phone commits the Mac pin only after PairAccepted and \"Codes match\"; Cancel or 120 s sends Revoke and commits nothing; the Mac dialog defaults to Don't Pair and both sides show the same code (E14-05, E14-08, E14-16)."
      - "Both DisplayStringSanitizers pass every E01-24 vector (E14-21, E14-22)."
      - "E14-23 selects a decoder with 0 observed network connections and p95 decode <= 3 s."
    issues:
      - id: E14-01
        title: "[macos] QR payload generation: secret and payload encode"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03]
        invariants: [6]
        depends_on: [E10-08, E01-02, E01-21, E00-08]
        description: |
          Generate a fresh 128-bit secret per pairing window; encode
          tandem://pair?v=1&fp=<b64url mac spki>&s=<b64url secret>&a=<addr1,addr2>&p=<port>
          &n=<mac name> per F-2.1. Addresses are the Mac's current local interface addresses;
          name is the Mac's display name.
          Seams: a feature-local `LocalAddressSource` protocol over getifaddrs and a
          `SecretSource` (`SystemRandomNumberGenerator` in production) so the encoder is a pure
          function tested against the E01-21 QR vectors. Cross-platform agreement: the encoder must
          reproduce each valid vector string, which the Android parser (E14-03) is tested against.
        acceptance:
          - For each valid E01-21 vector's fields, the encoder output equals the vector payload string
          - Two consecutive window starts produce different secrets; the `s` param decodes to exactly 16 bytes
          - The `a` param lists exactly the addresses returned by the injected LocalAddressSource
          - The payload contains the fingerprint and no bytes of the private key or its external representation
          - "`a` lists at most 8 literal addresses (loopback, IPv6 link-local and unspecified excluded) and `n` is truncated to 64 UTF-8 bytes on a code-point boundary (E01-02)."
        tdd:
          - "unit: qrPayloadEncoder_eachValidQrVectorFields_equalsVectorString"
          - "unit: qrPayload_twoWindowStarts_secretsDiffer"
          - "unit: qrPayload_secretParam_decodesTo16Bytes"
          - "unit: qrPayload_addressParam_equalsInjectedLocalAddresses"
          - "unit: qrPayload_generated_containsNoPrivateKeyBytes"
          - "unit: qrPayload_moreThanEightInterfaces_firstEightRoutableAddressesOnly"
          - "unit: qrPayload_macNameOver64Bytes_truncatedOnCodePointBoundary"

      - id: E14-02
        title: "[macos] Pairing window state machine"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [UC-03, AC-03, AC-13]
        invariants: [6]
        depends_on: [E14-01, E00-24, E01-22]
        description: |
          States: Closed -> Open(secret, expiresAt, attemptsRemaining=3) -> Closed(reason), on
          success, expiry, attempts exhausted, or explicit cancel. 120 s expiry timer; each failed
          PairRequest decrements attemptsRemaining; the window is single-use and closes
          immediately on a successful PairAccepted, zeroing the secret (UC-03 step 6);
          regenerating (E14-01) always opens a fresh window with a new secret, invalidating the
          old one. Conforms to the `PairingWindowState` protocol used by E12-02.
          The pairing window takes an injected `Clock` (E00-24) so the 120 s expiry is tested in
          virtual time with `ManualTestClock`.
          Cycle 8 (D-67): once a candidate connection completes its `VersionHello` exchange, this
          state machine generates a fresh 32-byte CSPRNG `challenge`, sends it as `PairChallenge` on
          that connection (E01-11), and holds it for the lifetime of that one candidate — `cb` for
          this pairing attempt is exactly this value; it is never read from or exposed by the
          transport session (E12-12 exposes no `channelBinding` property). E14-07 reads this stored
          challenge to verify the resulting `PairRequest.proof`.
          Cycle 4: the window tracks at most one in-flight pairing candidate (`candidateInFlight`, read by E12-02)
          and frees the slot when that connection closes. A candidate that sends no PairRequest within 10 s
          (E01-22) is closed and burns one attempt. While the window is open the Mac neither starts nor accepts a
          key rotation (E70-03 / E70-05).
          Cycle 8 (adversarial verifier, D-69/D-70/D-73): a `Heartbeat` received on a pairing-candidate
          connection, at any point including while a confirmation dialog is pending, is never treated as a
          wrong payload and never decrements attemptsRemaining (D-69). Any candidate connection that closes
          before `PairAccepted` for *any* reason — not only the 10 s silent-candidate case above — decrements
          attemptsRemaining by exactly 1 and frees the candidate slot (D-70): this includes a candidate that
          disconnects before completing its own `VersionHello` exchange, one that disconnects after
          `PairChallenge` but before ever sending a `PairRequest`, and one that disconnects while its
          confirmation dialog (E14-08) is still pending — in every one of these cases the *window itself*
          stays `Open` with the reduced `attemptsRemaining` (unless that was the 3rd, which closes it per the
          existing rule above), it is only the one candidate connection/slot that closes. An **owner-initiated**
          decline (Deny) or dismiss of a confirmation dialog whose connection is still open closes the
          *entire* window (`Closed(declined)`, secret destroyed) — the same outcome as a successful pairing,
          not a mere attempt decrement (D-73). These two cases are mutually exclusive: if the candidate
          connection has already closed before the dialog is resolved, that closure already ran the D-70
          attempt-burn above (window stays `Open` unless attempts are now exhausted), and the dialog's own
          auto-dismissal — along with any subsequent, now-stale Accept/Deny click on it — commits nothing and
          decrements nothing a second time (E14-08).
        acceptance:
          - Opening yields attemptsRemaining=3 and expiresAt = now + 120 s
          - Each failed attempt decrements attemptsRemaining by exactly 1
          - A 4th attempt is rejected with `attemptsExhausted` without invoking the proof verifier (spy)
          - After advancing 119 s the window is Open; after 120 s it is Closed(expired) with no attempts made
          - A successful pairing closes the window (Closed(paired)) and the secret is no longer retrievable; a second PairRequest with the same secret is rejected (UC-03 same QR twice)
          - After regenerate, a proof computed with the old secret is rejected
          - Explicit cancel yields Closed(cancelled)
          - "While a candidate is in flight `candidateInFlight` is true, so a second unknown certificate is rejected by E12-02 without decrementing attemptsRemaining."
          - "A candidate that sends no PairRequest within 10 s of virtual time is closed with PAIRING_FAILED and burns exactly one attempt."
          - "A Heartbeat received on a pairing-candidate connection, including while a confirmation dialog is pending, is accepted and never decrements attemptsRemaining (D-69)."
          - "A candidate connection that disconnects before its own VersionHello exchange completes, or after PairChallenge but before any PairRequest, decrements attemptsRemaining by exactly 1 and frees candidateInFlight (D-70)."
          - "A candidate connection that disconnects while its confirmation dialog is pending decrements attemptsRemaining by exactly 1 and leaves the window Open (not Closed) with the reduced budget, unless that was the 3rd attempt (D-70)."
          - "An owner-initiated decline (Deny) or dismiss of a confirmation dialog whose connection is still open closes the entire window (Closed(declined)) with the secret destroyed, rather than only decrementing attemptsRemaining (D-73); this is distinct from a connection dropping first, which is the D-70 attempt-burn case above."
        tdd:
          - "unit: pairingWindow_open_threeAttemptsAndExpiresIn120s"
          - "unit: pairingWindow_failedAttempt_attemptsRemainingDecrementsByOne"
          - "unit: pairingWindow_fourthAttempt_rejectedWithoutProofCheck"
          - "unit: pairingWindow_advance119s_stillOpen"
          - "unit: pairingWindow_advance120sNoAttempts_closedExpired"
          - "unit: pairingWindow_successfulPairing_closedAndSecretCleared"
          - "unit: pairingWindow_sameSecretAfterSuccess_secondRequestRejected"
          - "unit: pairingWindow_regenerate_oldSecretProofRejected"
          - "unit: pairingWindow_explicitCancel_closedCancelled"
          - "unit: pairingWindow_candidateInFlight_secondCandidateRejectedNoAttemptBurned"
          - "unit: pairingWindow_candidateSilentFor10s_closedAndOneAttemptBurned"
          - "unit: pairingCandidate_heartbeatWhileConfirmationPending_notAPairingFailure"
          - "unit: pairingWindow_candidateClosesBeforeHellos_burnsOneAttempt"
          - "unit: pairingWindow_peerClosesAfterChallenge_burnsOneAttempt"
          - "unit: pairingWindow_candidateDropsWhileDialogPending_attemptBurnedWindowStaysOpen"
          - "unit: pairingWindow_ownerDeclinesConfirmation_closedDeclinedSecretDestroyed"

