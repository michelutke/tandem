          `instrumented:`/`manual:` tests against the real impl.
        acceptance:
          - E10-01, E10-02, E12-06 and E14-06 depend only on `IdentityKeyStore`, never on `java.security.KeyStore.getInstance("AndroidKeyStore")` directly (grep check outside the real impl).
          - "`SoftwareIdentityKeyStore` is absent from the release APK (dex class check)."
        tdd:
          - "unit: softwareKeyStore_generateP256_publicKeyIsSecp256r1"
          - "unit: softwareKeyStore_signThenVerifyWithPublicKey_verifies"
          - "unit: softwareKeyStore_failNextGenerateStrongBox_throwsStrongBoxUnavailable"
          - "ci: releaseApk_softwareKeyStoreClass_absentFromDex"
        notes: |
          Added in review cycle 3 (TDD readiness): the JVM harness (E15-15) cannot reach
