  - id: E11
    title: Protocol codec, multiplexer, flow control
    labels: [area:protocol]
    prd: [F-3.2]
    use_cases: [UC-08, UC-12, UC-13, UC-14, UC-15]
    summary: |
      Implements the framed transport codec (F-3.2): a u32 big-endian length-prefixed protobuf
      Envelope, max 1 MiB, with fail-closed rejection of malformed input; a channel multiplexer
      routing CONTROL/NOTIFY/CLIPBOARD/FILES/SMS/CONTACTS/CALLS/INPUT/STATUS frames with seq/ack;
      and credit-based per-channel flow control so a large FILES transfer cannot starve NOTIFY.
      Both platforms implement independently against the same protocol/vectors fixtures and
      design, with conformance and starvation regression tests on each side.
    scope:
      - Envelope encode/decode on both platforms
      - "Fail-closed handling of oversize (>1 MiB), zero-length, truncated, undecodable, unknown-channel and unknown-payload frames (single MALFORMED_FRAME close code, local reason only)"
      - "Channel multiplexer: routing by channel, seq/ack bookkeeping"
      - "Credit-based flow control per channel with a suspending backpressure API (Kotlin Flow / Swift AsyncSequence), per-channel credit cap, CREDIT_VIOLATION close on over-grant"
      - Starvation regression test (FILES must not delay NOTIFY)
      - Conformance against protocol/vectors frame fixtures
    out_of_scope:
      - TLS/session establishment — E12
      - Specific channel payload semantics (NOTIFY content, FILES chunking) — later phase epics
      - Building the tools/conformance runner itself — E15
    exit_criteria:
      - Both codecs pass every protocol/vectors frame vector, valid and invalid
      - Oversize, truncated, and garbage input close the connection with close code `MALFORMED_FRAME` (E01-05)
        on both platforms
      - "Every one of 100 NOTIFY frames is delivered within 50 ms of virtual time while a 50 MiB FILES stream saturates a 10 MiB/s link, on both platforms (E11-09, E11-10)."
      - "A peer sending past its granted credit is closed with CREDIT_VIOLATION on both platforms (E11-07, E11-08)."
    issues:
      - id: E11-01
        title: "[android] Envelope frame encode: u32 BE length plus protobuf"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-3.2]
        use_cases: [UC-08, UC-13]
        invariants: []
        depends_on: [E00-02, E00-04, E00-09, E01-03, E01-10, E00-19]
        description: |
          Implement FrameEncoder writing a 4-byte big-endian length prefix followed by the
          serialized Envelope proto (protobuf-kotlin-lite). Enforce the 1 MiB (1 048 576 bytes)
          max Envelope length (length field, excluding the prefix, per E01-03) at encode time.
          Tests write into `InMemoryDuplexPipe` (E00-19) and read the per-direction capture.
        acceptance:
          - Encoded bytes equal every protocol/vectors valid-frame fixture byte for byte
          - The prefix is the unsigned 32-bit big-endian Envelope byte count
          - An Envelope of exactly 1 048 576 bytes is written; one of 1 048 577 bytes throws `FrameTooLargeException` and the pipe capture shows 0 bytes written
        tdd:
          - "unit: encodeFrame_everyValidFrameVector_bytesEqualExpected"
          - "unit: encodeFrame_lengthPrefix_isBigEndianEnvelopeByteCount"
          - "unit: encodeFrame_envelopeExactly1MiB_written"
          - "unit: encodeFrame_envelopeOneByteOver1MiB_throwsWithZeroBytesWritten"

      - id: E11-02
        title: "[android] Envelope frame decode and fail-closed rejection"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-3.2]
        use_cases: [AC-07]
        invariants: [1, 5]
        depends_on: [E11-01, E00-19, E01-05]
        description: |
          Implement FrameDecoder reading the 4-byte length then exactly that many bytes; the
          length is checked against the max before any payload buffer is allocated. Every
          rejection closes the connection (no partial parse, nothing emitted downstream) with the
          E01-05 `MALFORMED_FRAME` close code plus a local diagnostic reason: TOO_LARGE (length >
          1 048 576, including 0xFFFFFFFF), BAD_LENGTH (length 0), TRUNCATED (EOF before the
          prefix or payload completes), DECODE_FAILED (protobuf parse error), UNKNOWN_CHANNEL,
          UNKNOWN_PAYLOAD_TYPE (E01-03). Tests drive bytes with `InMemoryDuplexPipe.inject` (E00-19).
        acceptance:
          - Every valid vector decodes to the expected Envelope
          - Declared length 1 048 577 or 0xFFFFFFFF closes with malformed-frame/TOO_LARGE after reading only the 4 prefix bytes
          - Declared length 0 closes with malformed-frame/BAD_LENGTH
          - EOF after 2 prefix bytes, or mid-payload, closes with malformed-frame/TRUNCATED
          - Non-protobuf payload bytes close with malformed-frame/DECODE_FAILED and no Envelope is emitted
          - An unknown channel value or unknown payload type closes with UNKNOWN_CHANNEL / UNKNOWN_PAYLOAD_TYPE
        tdd:
          - "unit: decodeFrame_everyValidFrameVector_decodesToExpectedEnvelope"
          - "unit: decodeFrame_declaredLengthOver1MiB_closesTooLargeAfterPrefixOnly"
          - "unit: decodeFrame_declaredLengthZero_closesBadLength"
          - "unit: decodeFrame_eofMidPrefixOrPayload_closesTruncated"
          - "unit: decodeFrame_garbagePayload_closesDecodeFailedNoEnvelopeEmitted"
          - "unit: decodeFrame_unknownChannelValue_closesUnknownChannel"

