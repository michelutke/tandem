      - id: E10-14
        title: "[cross] Module boundary check: only core/crypto and TandemCrypto touch key material"
        type: test
        platforms: [android, macos]
        priority: P1
        size: S
        prd: [F-1.1]
        use_cases: []
        invariants: [3, 6]
        depends_on: [E10-01, E10-05, E10-15, E10-16, E00-11]
        description: |
          Add a CI check (grep-based lint or per-platform static analysis rule) that fails if
          AndroidKeyStore / `KeyStore.getInstance("AndroidKeyStore")` / SecKey / SecItem
          key-material APIs, or HMAC-SHA256 (`Mac.getInstance("HmacSHA256")`, `HMAC<SHA256>`), are
          referenced outside core/crypto (Android) or TandemCrypto (macOS). Allowlist: the real
          `IdentityKeyStore` impl (E10-15) and `SecItemKeychainStore` (E10-16). TandemStore's trust
          store (E13-06) reaches the Keychain only through the `KeychainStore` protocol, which the
          check permits. Violations are proven with permanent fixture files under
          `tools/lint-fixtures/key-material/` that the check's self-test runs against (no
          add-and-revert).
        acceptance:
          - The check exits non-zero and names the file when a fixture feature-module source references AndroidKeyStore
          - The check exits non-zero when a fixture source outside TandemCrypto references SecKey or SecItem
          - The check exits non-zero when a fixture source outside the crypto modules computes HMAC-SHA256
          - The check exits zero on the current tree, including TandemStore code that calls `KeychainStore`
        tdd:
          - "ci: keyMaterialCheck_androidKeyStoreInFeatureFixture_exitsNonZero"
          - "ci: keyMaterialCheck_secKeyOutsideTandemCryptoFixture_exitsNonZero"
          - "ci: keyMaterialCheck_hmacOutsideCryptoModuleFixture_exitsNonZero"
          - "ci: keyMaterialCheck_keychainStoreUsageFromTandemStore_exitsZero"
          - "ci: keyMaterialCheck_currentTree_exitsZero"
        notes: |
          Cycle 3: tdd filled with `ci:` fixture entries; HMAC boundary (formerly grep bullets in
          E10-12/E10-13/E14-06) folded in here.

      - id: E10-15
