      - id: E12-18
        title: "[macos] Listener admission control: pre-auth connection caps, deadlines, per-IP throttle"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [AC-04, AC-13, AC-17]
        invariants: [1, 3, 5]
        depends_on: [E12-01, E12-02, E12-09, E01-22, E00-24, E00-25, E03-01]
        description: |
          Added in review cycle 4 (slowloris / flood on the single Mac port). A pure `ConnectionAdmission`
          policy (injected `Clock<Duration>`, E00-24) consulted by the listener on every accept and state
          change, implementing the E01-22 pre-auth numbers: at most 8 not-yet-Ready connections and 2 per
          source IP (excess closed on accept, before TLS), 10 s TLS deadline, per-IP throttle (>= 10 failed
          handshakes in 60 s refuses that IP for 60 s). The source address is a throttling key only:
          `PeerAuthorizer` (E12-02) takes no address or admission input, so admission can refuse but never grant
          trust (invariant 3). Loopback connections get no exemption (the E15-15 harness uses per-test loopback
          aliases 127.0.0.2..127.0.0.9 where it needs several sources). Refusals are logged as category plus
          counters, never certificate bytes. VersionHello / PairRequest / MediaHello deadlines stay with their
          owners (E12-07, E14-02, E60-03).
        acceptance:
          - "With 8 connections not yet Ready, a 9th accepted connection is closed before its TLS handshake starts; a 3rd concurrent pre-auth connection from one source IP is closed likewise."
          - "A connection that has not completed TLS 10 s after accept is closed (virtual time)."
          - "After 10 failed handshakes within 60 s from IP A, new connections from A are closed on accept for 60 s while a trusted peer from IP B still reaches Ready."
          - "`PeerAuthorizer.decide` has no address or admission parameter (compile-time check), so the throttle can never mark a peer trusted."
          - "Over loopback, a TCP connection that never sends a ClientHello is closed within 11 s and a burst of 10 idle connections has the 9th and 10th closed on accept."
        tdd:
          - "unit: connectionAdmission_ninthPreAuthConnection_refused"
          - "unit: connectionAdmission_thirdPreAuthFromSameIp_refused"
          - "unit: connectionAdmission_handshakeNotDoneIn10s_closed"
          - "unit: connectionAdmission_tenFailuresIn60sFromIp_ipRefusedFor60s"
          - "unit: connectionAdmission_throttledIp_otherIpStillAdmitted"
          - "unit: peerAuthorizer_signature_takesNoAddressOrAdmissionInput"
          - "integration: listener_loopbackStalledTcpConnection_closedWithin11s"
          - "integration: listener_tenIdleLoopbackConnections_ninthAndTenthClosedOnAccept"
        notes: |
          Added in review cycle 4. Attacked end to end by E15-20. E03-01 finding (d) confirms the Network.framework hooks; if the listener cannot cancel before TLS, the cap is enforced at the first verify-block call instead and E01-22 is updated.

      - id: E12-19
        title: "[macos] Control-session registry: one Ready session per peer SPKI, newer replaces older"
        type: task
        platforms: [macos]
        priority: P0
        size: S
        prd: [F-3.1]
        use_cases: [AC-04, AC-13]
        invariants: [3, 5]
        depends_on: [E12-09, E12-14, E01-22]
        description: |
          Added in review cycle 8 (adversarial verifier on E01-22, L5: the SPEC.md rule "1 control
          session per peer SPKI; a newer Ready session replaces — closes — the older one" had no
          implementing issue). A `ControlSessionRegistry`, keyed strictly by the handshake SPKI
          fingerprint (invariant 3, never an IP/deviceId), tracked by E12-09's connection state
          machine: when a second connection for the same peer SPKI reaches Ready, the registry closes
          the previously-registered Ready session for that same SPKI with `LIMIT_EXCEEDED` (E01-05
          row 9) before registering the new one. A peer whose SPKI has no existing Ready entry simply
          registers. Registration/replacement is a pure function of (current registry, new Ready
          session's SPKI) so it is testable without a real socket.
        acceptance:
          - "A first connection for a given peer SPKI reaching Ready registers with no other session closed."
          - "A second connection for the same peer SPKI reaching Ready closes the first (already-registered) session with LIMIT_EXCEEDED and registers the second as that SPKI's current session."
          - "Two connections for two different peer SPKIs both remain registered and open (no cross-peer interference)."
          - "The registry is keyed only by SPKI fingerprint; no lookup or registration path accepts an IP address, hostname, or deviceId (invariant 3)."
        tdd:
          - "unit: sessionRegistry_firstReadyForSpki_registeredNoneClosed"
          - "unit: sessionRegistry_secondReadyForSameSpki_firstClosedLimitExceeded"
          - "unit: sessionRegistry_readyForDifferentSpkis_bothRemainRegistered"
          - "unit: sessionRegistry_lookupSignature_takesOnlySpkiFingerprint"
        notes: |
          Added in review cycle 8. Closes the gap the adversarial verifier found in E01-22/E01-05:
          "Control sessions per peer SPKI" had a stated rule but no owning issue anywhere in the
          backlog (`grep` across `docs/planning/backlog/*.yaml` found none before this issue).

  - id: E13
    title: Trust store and settings storage
    labels: [area:storage]
    prd: [F-1.2]
    use_cases: [UC-03, UC-05, UC-07, AC-09]
    summary: |
      Persists the trust store (F-1.2): the peer table keyed strictly by SPKI fingerprint
      (invariant 3) that E12's TLS verify logic and E14's pairing flow read and write, plus a
      small settings store for user preferences. Both platforms choose a concrete persistence
      technology, define migrations, and guarantee that unpair deletes locally and immediately
      regardless of connectivity.
    scope:
      - Peer record schema {deviceId, displayName, spkiSha256, pairedAt, lastSeen, capabilities}
      - CRUD keyed by fingerprint only
      - Schema migrations
      - Settings store for non-trust user preferences
      - Immediate local deletion on unpair
      - "macOS trust records in the data-protection keychain, app's own access group, via KeychainStore (E10-16); a locked keychain surfaces as KeychainError.locked, never \"unknown\"."
    out_of_scope:
      - Sending or receiving the Revoke wire message — E14
      - Consuming the trust store inside the TLS verify block — E12 (depends on this epic)
      - Paired-devices list UI — E14
      - "Grace-pin and pending-pin fields for key rotation -- added by E70-04/E70-05 through the E13-03/E13-07 migration runners."
    exit_criteria:
      - CRUD operations on both platforms are keyed only by spkiSha256; no API accepts an IP
        address, hostname, or bare deviceId as a trust key
      - Unpair removes the record and a subsequent read in the same process returns nothing,
        with no network round-trip required
      - A schema migration test proves a v1-to-v2 change (simulated) does not lose existing
        peer records
      - "macOS trust items are written with kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly to the data-protection keychain in the app's own access group, and a locked keychain makes get throw KeychainError.locked (E13-06)."
    issues:
