        description: |
          UC-25 had no owner. `tools/audit/run.sh` is the runner framework: it discovers audit steps by
          convention (each tool ships `tools/<tool>/audit-step.sh` with `--subset ci|full` and a
          `manual` marker) and runs conformance, pcap-audit (+ canary), mitm-lab (incl. the E15-20 DoS
          scenarios), nmap, downgrade checks, fuzz smoke and log-audit as they land, each also
          invocable alone (`run.sh --only <tool>`), writing a single pass/fail report (`report.json` +
          `report.md`). Device-only steps (nmap, live canary) appear as "manual gate: pending" and are
          required at every phase exit from Phase 1 (PRD "required per phase"). Runner self-tests use
          stub tools that exit 0/1, so the framework has no dependencies and lands early. CI wiring of
          the automatable subset is E15-19; the Phase 1 gate that every expected step is registered and
          green is E15-23.
        acceptance:
          - A stub tool dropped in as `tools/<stub>/audit-step.sh` is run without editing the runner.
          - With one stub tool exiting 1, `run.sh` exits non-zero and both reports mark overall FAIL
            naming that tool.
          - With all stubs exiting 0, `report.json` and `report.md` are both written and list the same
            per-tool results.
          - "`run.sh --only <tool>` runs exactly that tool (other stubs record 0 invocations)."
          - Manual-gate steps appear as `pending`, never `passed`, in both reports.
        tdd:
          - "unit: auditRunner_oneStubToolFails_overallExitNonZeroNamingTool"
          - "unit: auditRunner_allStubsPass_jsonAndMarkdownReportsAgree"
          - "unit: auditRunner_onlyFlag_invokesExactlyOneTool"
          - "unit: auditReport_manualGateSteps_listedPendingNotPassed"
          - "unit: auditRunner_stepDiscovery_runsEveryAuditStepScript"
        notes: |
