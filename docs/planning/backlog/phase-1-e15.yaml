      - id: E15-04
        title: "[tools] pcap-audit: tshark capture harness for the Tandem port"
        type: task
        platforms: [tools]
        priority: P0
        size: M
        prd: []
        use_cases: [AC-02]
        invariants: [2]
        depends_on: []
        description: |
          `tools/pcap-audit/capture.sh` starts a `tshark` capture filtered to the configured Tandem
          port(s) for the duration of a scripted session (or a fixed timeout), and
          `tools/pcap-audit/analyze.py` parses the resulting pcap into a structured record list
          (protocol, TLS version if present, payload bytes) for the two assertion tools (E15-05,
          E15-06) to consume.
        acceptance:
          - "`capture.sh` produces a valid pcap file covering exactly the configured port range."
          - "`analyze.py` correctly classifies at least: TLS 1.3 record, TLS 1.2 record, plaintext
            TCP payload, on a set of hand-crafted test pcaps."
        tdd:
          - "`pcapCapture_configuredPortRange_capturesOnlyThatRange`"
          - "`pcapAnalyze_mixedRecordTypes_classifiesEachCorrectly`"
        notes: ""
      - id: E15-05
        title: "[tools] pcap-audit: \"only TLS 1.3 records\" assertion"
        type: task
        platforms: [tools]
        priority: P0
        size: S
        prd: []
        use_cases: [AC-02, AC-04]
        invariants: [2]
        depends_on: [E15-04]
        description: |
          Assertion pass over `analyze.py`'s classified record list: fail if any record on the
          Tandem port is not a TLS 1.3 record (catches plaintext, TLS 1.2 downgrade, or any
          non-TLS protocol on the port).
        acceptance:
          - A capture containing a single injected plaintext TCP payload on the Tandem port fails
            the assertion with the byte offset reported.
          - A capture containing only TLS 1.3 records passes.
        tdd:
          - "`pcapAudit_plaintextPayloadOnTandemPort_assertionFailsWithOffset`"
          - "`pcapAudit_onlyTls13Records_assertionPasses`"
        notes: ""
      - id: E15-06
        title: "[tools] pcap-audit: canary string scan across full capture"
        type: task
        platforms: [tools]
        priority: P0
        size: S
        prd: []
        use_cases: [AC-02]
        invariants: [7]
        depends_on: [E15-04]
        description: |
          Scan the raw capture bytes (not just parsed payloads, to catch canaries leaking in
          unexpected framing) for a supplied canary string (`TANDEM-CANARY-<random>`) and fail if
          found anywhere.
        acceptance:
          - A capture with the canary string embedded (simulating a plaintext leak) fails the scan.
          - A capture with only encrypted TLS application data (no plaintext canary) passes.
        tdd:
          - "`pcapAudit_canaryStringPresentInCapture_scanFails`"
          - "`pcapAudit_canaryOnlyInsideTlsCiphertext_scanPasses`"
        notes: ""
      - id: E15-07
        title: "[tools] Canary procedure script (clipboard, file, notification, mirror injection)"
        type: task
        platforms: [tools]
        priority: P0
        size: M
        prd: []
        use_cases: [AC-02, AC-11]
        invariants: [7, 1, 2]
        depends_on: [E15-04, E15-06, E14-16]
        description: |
          `tools/pcap-audit/canary.sh` automates the PRD test-strategy canary procedure: generate a
          fresh `TANDEM-CANARY-<random>`, sync it to the clipboard, send it as a file's contents,
          trigger a notification containing it, and display it on the mirrored screen (each step
          is skipped with a warning until its feature lands: notification E30, clipboard E31, file
          E40; the mirror step is owned by E61-09) — all while E15-04's capture
          runs, then hand the capture to E15-06.
        acceptance:
          - Running the script against a live paired phone+Mac produces one capture file and a
            pass/fail result from the canary scan.
          - Script is idempotent and generates a new random canary every run (no reuse across runs).
          - The Phase 1 run injects the canary only through PairRequest.deviceInfo.displayName during a real pairing (no test-only message type exists; verified by grep over protocol/proto for Debug/Echo/Test messages returning nothing).
          - Each later-phase step is enabled by a flag naming the owning feature issue and fails (not skips) once that feature is marked done.
        tdd:
          - "`canaryProcedure_freshRun_generatesUniqueCanaryEveryTime`"
          - "`canaryProcedure_endToEndAgainstLiveDevices_producesPassFailResult`"
          - canaryProcedure_phase1Run_injectsOnlyViaPairRequestDisplayName
          - protoSchemaScan_debugEchoOrTestMessage_absent
        notes: |
          Decision (cycle 2): there is NO test-only wire payload, debug channel, or debug build flag
          for canary injection (SPEC E01-04, AC-11); every step uses a production feature path with
          test input. Phase 1 (no feature channels yet): the canary is set as the phone display name
          (on device: Settings > About > Device name; in the E15-15 JVM harness: the production
          DeviceInfo provider fed the canary) so it travels in PairRequest.deviceInfo during a fresh
          pairing, followed by a restart-reconnect in the same capture. Later phases: clipboard via
          E31-06 share target, file via E40-11 share target, notification posted by a separate
          companion test APK (not Tandem, which filters its own notifications), mirror step = the
          same notification/clipboard canary visible on the mirrored screen (E61-09). E71-07 runs all
          steps in one capture. Invariants 1/2 are therefore exercised, not bypassed.
      - id: E15-08
        title: "[tools] mitm-lab: scenario harness scaffolding + scripted-scenario runner"
        type: task
        platforms: [tools]
        priority: P0
        size: M
        prd: []
        use_cases: [AC-01, AC-03, AC-04]
        invariants: [1, 5, 6]
        depends_on: []
        description: |
          `tools/mitm-lab/` scaffolding: a scenario definition format (one scenario = a script that
          acts as a malicious or malformed peer against the real Mac listener or phone client), a
          runner that executes a directory of scenarios and reports pass (connection/handshake
          rejected as expected) or fail (anything accepted that should not have been) per scenario.
          The concrete scenarios (E15-09/10/11, plus E60-05 media-ticket, E62-08 input, E70-09 rotation) are separate issues built on this scaffold.
        acceptance:
          - Runner discovers and executes every scenario file under `tools/mitm-lab/scenarios/`.
          - A scenario that expects rejection but observes acceptance is reported as a hard failure
            with the scenario name in the output.
        tdd:
          - "`mitmLabRunner_scenarioDirectory_discoversAndExecutesAllScenarios`"
          - "`mitmLabRunner_unexpectedAcceptance_reportsHardFailureWithScenarioName`"
        notes: ""
      - id: E15-09
        title: "[tools] mitm-lab: pairing-abuse scenarios (replayed PairRequest, expired secret, 4th attempt, proof for different phone key)"
        type: test
        platforms: [tools]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [AC-03]
        invariants: [6]
        depends_on: [E15-08, E14-07, E14-09, E01-18, E01-21]
        description: |
          Four scenarios on the E15-08 scaffold, using vectors from E01-18/E01-21 where
          applicable: (1) replay a previously valid `PairRequest` after the original pairing
          completed; (2) attempt pairing after the secret's 120 s expiry; (3) a 4th pairing attempt
          after 3 failures within the same window; (4) a `PairRequest` whose proof was computed
          for a different phone's key than the one presented in the TLS handshake.
        acceptance:
          - All four scenarios result in a rejected connection and a burned/expired attempt state,
            never a `PairAccepted`.
          - Scenario (3) confirms the window is closed/exhausted after the 4th attempt, not merely
            that the 4th attempt itself fails.
        tdd:
          - "`mitmLab_replayedPairRequest_rejected`"
          - "`mitmLab_expiredSecretPairRequest_rejected`"
          - "`mitmLab_fourthPairingAttempt_windowExhaustedAndRejected`"
          - "`mitmLab_proofForDifferentPhoneKey_rejected`"
        notes: ""
      - id: E15-10
        title: "[tools] mitm-lab: certificate-abuse scenarios (unknown client cert, wrong server cert, swapped cert)"
        type: test
        platforms: [tools]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [AC-01, AC-09, UC-07]
        invariants: [1, 3, 5]
        depends_on: [E15-08, E12-02, E12-05, E14-13]
        description: |
          Three scenarios: (1) a client presenting a certificate whose SPKI fingerprint is not in
          the Mac's trust store and no pairing window is open; (2) a client that pins a
          server-certificate fingerprint different from the Mac's real one (wrong server cert);
          (3) a client and server pair where the certificates have been swapped between two
          otherwise-legitimate paired devices (fingerprint collision test).
        acceptance:
          - All three scenarios fail the handshake with no application data exchanged (verified via
            a companion pcap capture showing zero bytes past the TLS handshake).
          - A phone revoked on the Mac while offline (Mac-side local delete, E14-13) fails its next handshake with no application data exchanged (AC-09).
        tdd:
          - "`mitmLab_unknownClientCertOutsidePairingWindow_handshakeRejectedNoAppData`"
          - "`mitmLab_wrongServerCertFingerprint_handshakeRejectedNoAppData`"
          - "`mitmLab_swappedCertsBetweenPairedDevices_handshakeRejectedNoAppData`"
          - mitmLab_phoneRevokedWhileOffline_nextHandshakeRejectedNoAppData
        notes: ""
      - id: E15-11
        title: "[tools] mitm-lab: downgrade, resumption, 0-RTT and protocol-version scenarios"
        type: test
        platforms: [tools]
        priority: P0
        size: S
        prd: [F-3.1]
        use_cases: [AC-04]
        invariants: [1, 5]
        depends_on: [E15-08, E12-01, E12-03, E12-07, E12-10, E15-15]
        description: |
          Two scenarios using `openssl s_client -tls1_2` (or equivalent scripted client) against
          the Mac listener: (1) a TLS 1.2-only ClientHello; (2) a client attempting session
          resumption (ticket reuse or session-ID reuse) against a listener configured for no
          resumption.
        acceptance:
          - Both scenarios are rejected at the handshake layer; the resumption attempt confirms no
            session ticket was issued in the first place (not merely that reuse fails).
          - A client sending 0-RTT early data has it rejected; no early-data byte reaches the application layer.
          - A peer completing mTLS but sending a Hello with an unsupported major version is closed with the VERSION_MISMATCH close code and the Mac records a user-visible error event (invariant 5), observed via the E15-15 harness state API.
        tdd:
          - "`mitmLab_tls12OnlyClientHello_rejected`"
          - "`mitmLab_sessionResumptionAttempt_noTicketIssuedAndReuseRejected`"
          - mitmLab_zeroRttEarlyData_rejectedNoAppDataDelivered
          - mitmLab_helloUnsupportedMajorVersion_closedWithVersionMismatchAndVisibleError
        notes: ""
      - id: E15-12
        title: "[tools] nmap phone-listener check script"
        type: task
        platforms: [tools]
        priority: P0
        size: S
        prd: []
        use_cases: [UC-05, AC-04]
