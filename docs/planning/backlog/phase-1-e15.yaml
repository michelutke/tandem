      - id: E15-04
        title: "[tools] pcap-audit: tshark capture harness for the Tandem port"
        type: task
        platforms: [tools]
        priority: P0
        size: M
        prd: []
        use_cases: [AC-02]
        invariants: [2]
        depends_on: []
        description: |
          `tools/pcap-audit/capture.sh` starts a `tshark` capture filtered to the configured Tandem
          port(s) for the duration of a scripted session (or a fixed timeout), and
          `tools/pcap-audit/analyze.py` parses the resulting pcap into a structured record list
          (frame number, TCP stream, protocol, TLS record content type, negotiated TLS version if
          present, payload bytes) for the two assertion tools (E15-05, E15-06) to consume. TLS 1.3 is
          identified by the ServerHello `supported_versions` extension = 0x0304 (the record-layer
          legacy version is 0x0303 in TLS 1.3 and cannot be used). Self-tests run against
          hand-crafted fixture pcaps in `tools/pcap-audit/fixtures/` and a localhost capture of
          scripted traffic.
        acceptance:
          - With scripted localhost traffic on the Tandem port and on one other port, `capture.sh`
            writes a pcap containing 100 % of the Tandem-port frames and 0 frames from the other port.
          - "`analyze.py` classifies the fixture pcaps as: TLS 1.3 session, TLS 1.2 session, plaintext
            TCP payload (with byte offset of first payload byte)."
        tdd:
          - "unit: pcapCapture_localhostTrafficOnTwoPorts_recordsOnlyTandemPort"
          - "unit: pcapAnalyze_tls13Fixture_classifiedAsTls13ViaSupportedVersions"
          - "unit: pcapAnalyze_tls12Fixture_classifiedAsTls12"
          - "unit: pcapAnalyze_plaintextTcpFixture_classifiedAsPlaintextWithOffset"
        notes: ""
      - id: E15-05
        title: "[tools] pcap-audit: \"only TLS 1.3 records\" assertion"
        type: task
        platforms: [tools]
        priority: P0
        size: S
        prd: []
        use_cases: [AC-02, AC-04]
        invariants: [2]
        depends_on: [E15-04, E15-15]
        description: |
          Assertion pass over `analyze.py`'s classified record list: fail if any record on the
          Tandem port is not part of a TLS 1.3 session (catches plaintext, TLS 1.2 downgrade, or any
          non-TLS protocol on the port). The real-app run captures a pairing + restart-reconnect
          session between the E15-15 JVM harness client and the real Mac server on the macOS runner.
        acceptance:
          - A fixture capture containing a single plaintext TCP payload on the Tandem port exits 1
            and reports frame number and byte offset.
          - A fixture capture containing a TLS 1.2 session exits 1 naming the negotiated version.
          - A fixture capture containing only TLS 1.3 records exits 0.
          - A capture of the E15-15 harness pairing + reconnect session exits 0 (0 non-TLS-1.3 records).
        tdd:
          - "unit: tls13Assertion_singlePlaintextPayload_exitsOneWithFrameAndOffset"
          - "unit: tls13Assertion_tls12SessionFixture_exitsOneNamingVersion"
          - "unit: tls13Assertion_onlyTls13Records_exitsZero"
          - "security: pcapAudit_jvmHarnessPairAndReconnect_zeroNonTls13Records"
        notes: ""
      - id: E15-06
        title: "[tools] pcap-audit: canary string scan across full capture"
        type: task
        platforms: [tools]
        priority: P0
        size: S
        prd: []
        use_cases: [AC-02]
        invariants: [7]
        depends_on: [E15-04]
        description: |
          Scan for a supplied canary string (`TANDEM-CANARY-<random>`, ASCII) over (a) the raw bytes
          of every frame in the capture, any port, headers included, and (b) every reassembled TCP
          stream (so a canary split across two segments is still found). Fail if found anywhere.
          Capture filter for canary runs is the whole interface, not only the Tandem port.
        acceptance:
          - Any single occurrence of the canary bytes in any frame or any reassembled TCP stream exits
            1 and reports occurrence count plus frame number(s).
          - A fixture with the canary split across two TCP segments is detected.
          - A fixture with the canary only on a non-Tandem port is detected.
          - A TLS 1.3 fixture with 0 occurrences exits 0.
        tdd:
          - "unit: canaryScan_canaryInSingleTcpPayload_exitsOneWithFrameNumber"
          - "unit: canaryScan_canarySplitAcrossTwoSegments_detectedInReassembledStream"
          - "unit: canaryScan_canaryOnNonTandemPort_exitsOne"
          - "unit: canaryScan_tls13FixtureWithoutCanary_exitsZero"
        notes: ""
      - id: E15-07
        title: "[tools] Canary procedure script (clipboard, file, notification, mirror injection)"
        type: task
        platforms: [tools]
        priority: P0
        size: M
        prd: []
        use_cases: [AC-02, AC-11]
        invariants: [7, 1, 2]
        depends_on: [E15-04, E15-06, E15-15, E00-23, E14-05, E14-06, E14-08]
        description: |
          `tools/pcap-audit/canary.sh` automates the PRD test-strategy canary procedure: generate a
          fresh `TANDEM-CANARY-<random>` (128-bit random suffix), run the enabled injection steps
          while E15-04's capture runs, then hand the capture to E15-06. `--dry-run` prints the
          planned steps and exact commands without touching devices (used by the unit self-tests).
          Steps and how they are driven:
          - Phase 1 display-name step: automated. In CI the E15-15 JVM harness client's production
            DeviceInfo provider is fed the canary, pairs with the real Mac app, and restart-reconnects
            in the same capture. On a live phone the display name is set manually
            (Settings > About > Device name) — manual gate.
          - Notification step (enabled once E30 lands): the script posts the canary through the
            companion app (E00-22) via
            `adb shell am broadcast -a dev.tandem.companion.POST --es kind canary --es nonce <n>`;
            Tandem filters its own notifications, so the companion app is required.
          - Clipboard (E31-06 share target) and file (E40-11 share target) steps: the script fires
            `adb shell am start -a android.intent.action.SEND` with the canary as text / file.
          - Steps needing a live phone paired with a Mac cannot run in CI (no emulator<->Mac path);
            they run in the manual gate procedure (E00-23).
          - Mirror step: not automatable before Phase 6; E61-09 extends this script, E71-07 runs all
            steps in one capture.
        acceptance:
          - Two consecutive runs generate two distinct canaries (no reuse; suffix has 128 random bits).
          - The Phase 1 run injects the canary only through PairRequest.deviceInfo.displayName during a
            real pairing (no test-only message type exists).
          - "`grep` over `protocol/proto/**` for message names containing Debug, Echo or Test returns 0
            matches (CI check)."
          - Each later-phase step is enabled by a flag naming the owning feature issue; once that
            issue is marked done, running with the step disabled exits non-zero (fails, not skips).
          - The notification step's dry-run output contains the companion broadcast with kind
            `canary` and the generated nonce.
          - The automated Phase 1 run (JVM harness + real Mac app) and the live phone+Mac run both end
            with 0 canary occurrences in the capture and exit 0; later phases extend the live run
            (E61-09 mirror, E71-07 all steps).
        tdd:
          - "unit: canaryScript_twoConsecutiveDryRuns_generateDistinctCanaries"
          - "unit: canaryScript_phase1DryRun_plansOnlyDisplayNameStep"
          - "unit: canaryScript_notificationStepDryRun_issuesCompanionCanaryBroadcast"
          - "unit: canaryScript_featureDoneButStepDisabled_exitsNonZero"
          - "ci: protoSchema_debugEchoOrTestMessageName_absent"
          - "security: canaryProcedure_jvmHarnessPairingWithCanaryName_zeroOccurrencesInCapture"
          - "manual: canaryProcedure_livePhoneMacPairingWithCanaryName_zeroOccurrencesInCapture"
        notes: |
          Decision (cycle 2): there is NO test-only wire payload, debug channel, or debug build flag
          for canary injection (SPEC E01-04, AC-11); every step uses a production feature path with
          test input. Phase 1 (no feature channels yet): the canary is set as the phone display name
          so it travels in PairRequest.deviceInfo during a fresh pairing, followed by a
          restart-reconnect in the same capture. Invariants 1/2 are therefore exercised, not bypassed.
          Cycle 3: automated vs manual split made explicit; notification injection via E00-22.
          Cycle 5: depends on the pairing implementation (E14-05/E14-06/E14-08), not on the E14-16 test, and
          not on E00-22 (lands Phase 3): the notification step is enabled and exercised by E30-13, which
          depends on E00-22.
      - id: E15-08
        title: "[tools] mitm-lab: scenario harness scaffolding + scripted-scenario runner"
        type: task
        platforms: [tools]
        priority: P0
        size: M
        prd: []
        use_cases: [AC-01, AC-03, AC-04]
        invariants: [1, 5, 6]
        depends_on: []
        description: |
          `tools/mitm-lab/` scaffolding: a scenario definition format (one scenario = a script that
          acts as a malicious or malformed peer against the real Mac listener or phone client, and
          declares one expected outcome: `handshakeRejected`, `closedWithCode(<code>)` or
          `noPairAccepted`), and a runner that executes a directory of scenarios and reports pass
          (observed outcome == expected) or fail (anything accepted that should not have been,
          outcome mismatch, or timeout) per scenario. Default per-scenario timeout 30 s.
          The concrete scenarios (E15-09/10/11, plus E60-05 media-ticket, E62-08 input, E70-09
          rotation) are separate issues built on this scaffold. Runner self-tests use fixture
          scenarios against a local stub peer.
        acceptance:
          - Runner executes every scenario file under the given directory (fixture with 3 scenarios ->
            3 results in the report).
          - A scenario that expects rejection but observes acceptance makes the runner exit non-zero
            and prints the scenario name.
          - A scenario exceeding its timeout is reported as failed, never passed.
          - An empty scenario directory exits non-zero (no silent pass).
        tdd:
          - "unit: mitmLabRunner_fixtureDirWithThreeScenarios_reportsThreeResults"
          - "unit: mitmLabRunner_unexpectedAcceptance_exitsNonZeroNamingScenario"
          - "unit: mitmLabRunner_scenarioExceedsTimeout_reportedAsFailed"
          - "unit: mitmLabRunner_emptyScenarioDirectory_exitsNonZero"
        notes: ""
      - id: E15-09
        title: "[tools] mitm-lab: pairing-abuse scenarios (replay, expiry, 4th attempt, wrong key)"
        type: test
        platforms: [tools]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [AC-03, AC-13]
        invariants: [6]
        depends_on: [E15-08, E15-15, E14-07, E14-09, E01-18, E01-21, E14-15, E14-02]
        description: |
          Eight scenarios (four base, four cycle 4) on the E15-08 scaffold against the real Mac app launched by the E15-15
          harness, using vectors from E01-18/E01-21 where applicable: (1) replay a previously valid
          `PairRequest` after the original pairing completed; (2) attempt pairing after the secret's
          120 s expiry (real wall-clock wait of 121 s, since the real app runs on the system clock);
          (3) a 4th pairing attempt after 3 failures within the same window, followed by a correct
          proof; (4) a `PairRequest` whose proof was computed for a different phone's key than the
          one presented in the TLS handshake.
          Cycle 4 adds four scenarios: (5) Revoke sent on a pairing-candidate connection before PairAccepted;
          (6) a PairRequest valid on a completed earlier session replayed on a new TLS session with the same
          phone key (channel binding); (7) a second concurrent pairing candidate; (8) a bad proof, asserting the
          wire reason is PAIRING_UNAVAILABLE only.
        acceptance:
          - All eight scenarios end without a `PairAccepted` and with the Mac trust-store record count
            unchanged.
          - Scenario (3) confirms the window is exhausted after the 4th attempt — a subsequent correct
            proof in the same window is also rejected.
          - "Scenario (5) leaves the trust store unchanged; (6) gets no PairAccepted; (7) fails in the handshake without burning an attempt; (8) observes PairRejected(PAIRING_UNAVAILABLE) and no other reason value."
        tdd:
          - "security: mitmLab_replayedPairRequestAfterCompletion_noPairAccepted"
          - "security: mitmLab_pairRequestAfterSecretExpiry_noPairAccepted"
          - "security: mitmLab_fourthAttemptAfterThreeFailures_rejected"
          - "security: mitmLab_correctProofAfterWindowExhausted_rejected"
          - "security: mitmLab_proofForDifferentPhoneKey_noPairAccepted"
          - "security: mitmLab_revokeOnPairingCandidateConnection_trustStoreUnchanged"
          - "security: mitmLab_pairRequestReplayedOnNewTlsSession_noPairAccepted"
          - "security: mitmLab_secondConcurrentPairingCandidate_rejectedInHandshake"
          - "security: mitmLab_badProofRejection_wireReasonPairingUnavailableOnly"
        notes: ""
      - id: E15-10
        title: "[tools] mitm-lab: certificate-abuse scenarios (unknown, wrong, swapped cert)"
        type: test
        platforms: [tools]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [AC-01, AC-09, UC-07]
        invariants: [1, 3, 5]
        depends_on: [E15-08, E15-15, E12-02, E12-05, E14-13]
        description: |
          Scenarios against the real Mac app and the real Android core/transport client (both via the
          E15-15 harness): (1) a client presenting a certificate whose SPKI fingerprint is not in
          the Mac's trust store and no pairing window is open; (2) an impostor server whose
          certificate fingerprint differs from the one the JVM client pinned (wrong server cert);
          (3) certificates swapped between two otherwise-legitimate paired devices; (4) a phone
          whose trust record was deleted on the Mac while it was offline (E14-13 local delete).
          "No application data" is observed at the peer under test: zero decrypted application
          bytes delivered to its session layer (harness byte counter) and the TCP connection closed
          within 5 s of the ClientHello.
          Cycle 4 adds: (5) a client presenting the paired phone's genuine certificate while signing CertificateVerify with another key; (6) an impostor server presenting the Mac's genuine certificate without its key, against the JVM client.
        acceptance:
          - Scenarios (1)-(4) fail the handshake; the peer under test receives 0 decrypted
            application bytes and the connection is closed within 5 s.
          - Scenario (4) covers AC-09 (revoked while offline).
          - "Scenarios (5) and (6) fail the handshake with 0 application bytes delivered (pin alone never authenticates)."
        tdd:
          - "security: mitmLab_unknownClientCertOutsidePairingWindow_zeroAppBytesDelivered"
          - "security: mitmLab_wrongServerCertFingerprint_zeroAppBytesDelivered"
          - "security: mitmLab_swappedCertsBetweenPairedDevices_zeroAppBytesDelivered"
          - "security: mitmLab_phoneRevokedWhileOffline_zeroAppBytesDelivered"
          - "security: mitmLab_pairedPhoneCertWithoutPrivateKey_handshakeFails"
          - "security: mitmLab_macCertWithoutPrivateKey_phoneHandshakeFails"
        notes: |
          Cycle 3: replaced "zero bytes past the TLS handshake in a pcap" — in TLS 1.3 encrypted
          handshake messages are also application_data (0x17) records, so a pcap cannot distinguish
          them; the peer-side byte counter is the falsifiable observable.
      - id: E15-11
        title: "[tools] mitm-lab: downgrade, resumption, 0-RTT and protocol-version scenarios"
        type: test
        platforms: [tools]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [AC-04, UC-05]
        invariants: [1, 5]
        depends_on: [E15-08, E12-01, E12-03, E12-07, E12-10, E15-15]
        description: |
          Six scenarios (four base, two cycle 4) using `openssl s_client` (or an equivalent scripted client) against the real
          Mac listener launched by the E15-15 harness: (1) a TLS 1.2-only ClientHello; (2) a full
          handshake followed by a resumption attempt (saved session / forged PSK identity); (3) a
          client sending 0-RTT early data; (4) a peer completing mTLS but sending a Hello with an
          unsupported major version. The user-visible error for (4) is read from the real app's
          menu-bar status item via the accessibility tree (no debug API).
          Cycle 4 adds: (5) a scripted server that issues a NewSessionTicket to the JVM (Android core) client, then inspects its next ClientHello; (6) a client offering no ALPN or an ALPN other than `tandem/1`.
        acceptance:
          - (1) fails the handshake with a `protocol_version` alert.
          - (2) the first full handshake issues 0 NewSessionTicket messages, and the resumption attempt
            falls back to a full handshake or is rejected (never resumed).
          - (3) 0 early-data bytes reach the application layer.
          - (4) the connection closes with the `VERSION_MISMATCH` close code and the Mac menu shows a
            version-mismatch error within 2 s (invariant 5, UC-05).
          - "(5) the next ClientHello carries no pre_shared_key or early_data extension; (6) a wrong-ALPN
            ClientHello fails the real Mac's TLS stack (Apple's Network/Security framework) with a
