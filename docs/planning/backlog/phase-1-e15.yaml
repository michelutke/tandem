      - id: E15-15
        title: "[cross] JVM integration-test harness: Android core/* modules against the real Mac server on macOS CI"
        type: task
        platforms: [android, macos]
        priority: P0
        size: M
        prd: [F-3.1]
        use_cases: [UC-03, UC-04]
        invariants: [1, 3, 5]
        depends_on: [E12-01, E12-02, E12-04, E12-05, E12-06]
        description: |
          Reusable harness (owner of the JVM-client infrastructure): a JVM test client that links the
          real Android `core/protocol`, `core/crypto`, `core/transport`, and `core/pairing` modules
          (not a reimplementation), plus macOS CI plumbing that builds, launches, stops, and restarts
          the real macOS server app, seeds or clears its trust store, and injects a simulated QR
          payload. It removes the need for a physical Android device in CI. Concrete scenarios live
          with the epics that own the behavior: E12-13 (handshake + Hello + frame round trip) and
          E14-16 (QR pairing, restart both processes, reconnect — the Phase 1 exit criterion).
        acceptance:
          - The harness launches the real Mac server app on a macOS CI runner and a JVM client
            completes an mTLS handshake against it using a pre-seeded trust store.
          - The harness can kill and relaunch both the server app and the client process
            unattended, with trust-store state preserved across restarts.
          - Runs as part of the macos workflow with no physical device or emulator.
        tdd:
          - "`jvmHarness_realMacServerLaunched_clientCompletesHandshakeWithSeededTrust`"
          - "`jvmHarness_restartBothProcesses_trustStorePreservedAndServerReachable`"
        notes: |
          Scenario tests E12-13 and E14-16 depend on this issue.
      - id: E15-17
        title: "[tools] log-audit: canary scan over captured app logs (logcat + macOS unified log)"
        type: task
        platforms: [tools]
        priority: P0
        size: S
        prd: []
        use_cases: [AC-10]
        invariants: [7]
        depends_on: [E15-06]
        description: |
          Runtime complement to the static release-log lint (E00-17): `tools/pcap-audit/log-audit.sh`
          collects `adb logcat` from the phone and `log show --predicate 'subsystem == "…tandem…"'`
          from the Mac for a scripted session window and fails if any supplied canary string (message
