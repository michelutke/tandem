          - The harness launches the real Mac server app on a macOS CI runner and a JVM client
            completes an mTLS handshake against it using a seeded trust record.
          - After the trust store is cleared, the same client's handshake is rejected (proves seeding
            is what grants access).
          - The harness kills and relaunches both the server app and the client process unattended;
            the trust record and client identity key are identical after restart and the handshake
            succeeds again.
          - The harness job runs in the macos workflow with no physical device or emulator and
            completes in < 15 min wall time.
