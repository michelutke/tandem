      - id: E15-15
        title: "[cross] JVM integration-test harness: Android core/* modules against the real Mac server on macOS CI"
        type: task
        platforms: [android, macos]
        priority: P0
        size: L
        prd: [F-3.1]
        use_cases: [UC-03, UC-04]
        invariants: [1, 3, 5]
        depends_on: [E12-01, E12-02, E12-04, E12-05, E12-06, E10-15, E13-06]
        description: |
          Reusable harness (owner of the JVM-client infrastructure): a JVM test client that links the
          real Android `core/protocol`, `core/crypto`, `core/transport`, and `core/pairing` modules
          (not a reimplementation), and is built so later phases can add pure-Kotlin/JVM
          `feature/*` source sets to its classpath (protocol mapping + sync logic of e.g.
          feature/files, feature/messaging behind their framework seams) for the E40/E50/E51
          `integration:` tests — a `jvmIntegrationTest` convention that any module may opt into
          (Android-framework code stays behind interfaces with JVM fakes), plus macOS CI plumbing that builds, launches, stops, and restarts
          the real macOS server app, seeds or clears its trust store, and injects a simulated QR
          payload. It removes the need for a physical Android device in CI. Concrete scenarios live
          with the epics that own the behavior: E12-13 (handshake + Hello + frame round trip) and
          E14-16 (QR pairing, restart both processes, reconnect — the Phase 1 exit criterion).
          The JVM client's phone identity uses `SoftwareIdentityKeyStore` (E10-15), since
          AndroidKeyStore does not exist on the JVM; the key is persisted to a harness temp file so
          it survives a client-process restart.
          The Mac side runs the real app with its real `SecItemKeychainStore` against a dedicated,
          throwaway CI keychain; trust records are seeded/cleared by a small harness helper that
          links TandemStore's trust-store API (E13-06). It deliberately does not use
          `InMemoryKeychainStore` (E10-16) or `ManualTestClock` (E00-24): those are unit-test fakes,
          and the harness exists to exercise the real app.
        acceptance:
          - The harness launches the real Mac server app on a macOS CI runner and a JVM client
            completes an mTLS handshake against it using a seeded trust record.
          - After the trust store is cleared, the same client's handshake is rejected (proves seeding
            is what grants access).
          - The harness kills and relaunches both the server app and the client process unattended;
            the trust record and client identity key are identical after restart and the handshake
            succeeds again.
          - The harness job runs in the macos workflow with no physical device or emulator and
            completes in < 15 min wall time.
          - A sample `feature/*` module applying the `jvmIntegrationTest` convention compiles into the harness classpath with no Android framework classes on it.
        tdd:
          - "integration: jvmHarness_seededTrustRecord_clientCompletesHandshake"
          - "integration: jvmHarness_clearedTrustStore_handshakeRejected"
          - "integration: jvmHarness_restartBothProcesses_sameIdentityAndHandshakeSucceeds"
          - "ci: jvmHarnessJob_macosRunner_completesUnderFifteenMinutes"
          - "ci: jvmIntegrationConvention_sampleFeatureModuleOptIn_compilesIntoHarnessClasspath"
        notes: |
          Scenario tests E12-13 and E14-16 depend on this issue. Size M -> L in cycle 3 (JVM client
          assembly + app lifecycle driver + CI keychain seeding).
