phase: 1
epics:
  - id: E15
    title: "Security test harness (conformance, pcap-audit, log-audit, mitm-lab, fuzz scaffolding)"
    labels: [area:security, area:testing, area:tools]
    prd: [F-3.1, F-3.2]
    use_cases: [UC-03, UC-04, UC-05, AC-01, AC-02, AC-03, AC-04, AC-07, AC-10, AC-09, AC-11, UC-25]
    summary: |
      Build the security and interoperability test harness that Phase 1's exit criteria depend on,
      and that stays in continuous use through every later phase: a conformance runner executing
      `protocol/vectors/` (E01) against both the Kotlin and Swift codecs, a pcap-audit tool that
      fails a build if anything but TLS 1.3 (or a canary string) appears on the wire, a scripted
      MITM lab covering every fail-closed scenario the PRD lists, an `nmap` check proving the
      phone opens no listener, short-running fuzz scaffolding for the frame/envelope parsers on
      both platforms, and a JVM integration client that runs Android's real `core/*` modules
      against the real macOS server. This epic does not implement any protocol or transport
      behavior itself; it proves the behavior other epics (E10-E14) implement is correct and fails
      closed.
    scope:
      - "tools/conformance runner (Kotlin + Swift codecs, incl. display-string and confirmation-code vectors), CI-blocking."
      - tools/pcap-audit (tshark-based), covering the TLS-1.3-only assertion, canary-string scan, and
        canary injection procedure script.
      - "tools/mitm-lab scripted scenarios covering every PRD Phase 1 exit-criterion attack and abuse cases AC-01, AC-03, AC-04 and AC-13, incl. cycle-4 cases (cross-session PairRequest replay, PairRejected oracle, concurrent candidate, CertificateVerify without key, PSK/ALPN) and pre-auth DoS (slowloris, floods, stalled hellos, idle pairing candidates, E15-20); media-ticket abuse scenarios are owned by E60-05."
      - nmap phone-listener check.
      - "log-audit tool (runtime canary scan of both apps' logs; per-kind canary manifest, canaries matched raw and hex/base64/base64url-encoded)."
      - Fuzz scaffolding, covering a Jazzer target for the Kotlin frame/envelope parser and a
        libFuzzer target for the Swift frame/envelope parser, both wired as short CI smoke runs
        (not full campaigns).
      - JVM test client reusing Android `core/*` modules to run integration tests against the real
        Mac server on macOS CI.
      - Security audit suite runner (one command, one report) (E15-18) with the automatable subset as a required check on core/* PRs (E15-19, UC-25) and the Phase 1 all-steps gate (E15-23).
      - JVM harness halves built in parallel per track (E15-21 Android client, E15-22 Mac app driver), joined by E15-15.
    out_of_scope:
      - Full multi-hour/multi-day fuzz campaigns (E71, Phase 7).
      - The codec, transport, and pairing implementations themselves (E10-E14).
      - External review of SPEC.md (E71).
    exit_criteria:
      - Every Phase 1 exit criterion in `docs/PRD.md` `<implementation-roadmap>` is verifiable by
        running a specific tool or test in this epic —
        pairing+reconnect → E14-16 (on the E15-15 harness); pcap-audit clean + no canary → E15-05/E15-06/E15-07;
        every listed mitm-lab scenario fails closed → E15-09/E15-10/E15-11; no phone listeners →
        E15-12.
      - "`tools/conformance/run.sh` is a required CI check on both the android and macos workflows."
      - Fuzz smoke runs complete in CI within a bounded time budget (documented per-issue) with zero
        crashes on the phase-0 vector corpus.
      - "E15-20 passes against the real Mac app: silent TCP closed within 11 s, missing VersionHello closed with PROTOCOL_TIMEOUT within 6 s, over-cap connections closed on accept, a flooding IP refused for 60 s, while a paired client still reaches Ready."
      - "E15-23: one `tools/audit/run.sh --subset full` run reports every expected Phase 1 step (device-only steps pending with a manual-gate reference)."
    issues:
      - id: E15-01
        title: "[android] Conformance runner: execute protocol/vectors against the Kotlin codec"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: []
        use_cases: [AC-07]
        invariants: []
        depends_on: [E01-16, E10-03, E10-12, E11-11, E14-03, E14-21]
        description: |
          `tools/conformance` gains an Android/JVM entry point that loads every fixture under
          `protocol/vectors/` (SPKI fingerprint, pairing HMAC, frame encoding, Bonjour rotating ID,
          QR payload — all from E01) and asserts the Kotlin codec/crypto implementations (E11,
          E10) produce the expected output for every valid vector and reject every invalid one with
          the expected error. Aggregates the codec-level frame conformance tests (E11-11) with the
          crypto (E10-03, E10-12) and QR parser (E14-03) categories into one runner.
          The runner keeps an explicit category table (category -> handler, or `deferred: <issue>`);
          a category on disk that is not in the table is an error, never skipped.
          Cycle 4: adds the display-string category (E01-24, run against E14-21) and the pairing confirmation-code vectors (E01-18).
        acceptance:
          - Every vector category from `protocol/vectors/` has a corresponding JVM test case; the
            run summary prints executed-vector count, which equals the number of vector entries on
            disk minus those in explicitly deferred categories (listed by name with the owning issue).
          - A vector file with a corrupted expected value fails the runner (exit code != 0) and prints
            the vector id with expected vs. actual bytes (hex), not a silent pass.
          - A vector directory with a category not in the runner's table fails with a message naming
            the category.
        tdd:
          - "conformance: kotlinCodec_spkiVectors_matchExpectedFingerprint"
          - "conformance: kotlinCodec_pairingHmacVectors_matchExpectedProof"
          - "conformance: kotlinCodec_validFrameVectors_decodeToExpectedEnvelope"
          - "conformance: kotlinCodec_invalidFrameVectors_rejectedWithExpectedCloseCode"
          - "conformance: kotlinQrParser_qrPayloadVectors_parseOrRejectAsExpected"
          - "unit: kotlinConformanceRunner_corruptedExpectedValue_failsWithHexDiff"
          - "unit: kotlinConformanceRunner_unknownVectorCategory_failsNamingCategory"
          - "conformance: kotlinSanitizer_displayStringVectors_matchExpected"
        notes: |
          The Bonjour rotating-ID category can only run against the Kotlin implementation once
          E21-05 (Phase 2) lands; until then it is listed as `deferred: E21-05` and validated
          against the reference generator only.
