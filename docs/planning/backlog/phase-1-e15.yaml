      - id: E15-18
        title: "[tools] Security audit suite runner: one command, one report"
        type: task
        platforms: [tools]
        priority: P0
        size: M
        prd: [F-3.1, F-3.2]
        use_cases: [UC-25, AC-01, AC-02, AC-04]
