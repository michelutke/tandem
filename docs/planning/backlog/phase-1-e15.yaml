        tdd:
          - "`nmapPhoneCheck_tandemPortAccidentallyOpened_scriptFailsWithPortListed`"
          - "`nmapPhoneCheck_onlyAllowlistedSystemPorts_scriptPasses`"
        notes: ""
      - id: E15-13
