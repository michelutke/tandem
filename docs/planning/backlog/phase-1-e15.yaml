          driver with CI keychain and trust seeding (E15-22). This issue wires them into one
          `jvm-harness` job on the macOS runner and proves the join: handshake against the real Mac
          listener (E12-01/E12-02) with a seeded trust record, rejection once the record is cleared,
          and a restart of both processes. It removes the need for a physical Android device in CI.
          Concrete scenarios live with the epics that own the behavior: E12-13 (handshake + Hello +
          frame round trip) and E14-16 (QR pairing, restart both processes, reconnect — the Phase 1
          exit criterion). The harness deliberately does not use `InMemoryKeychainStore` (E10-16) or
          `ManualTestClock` (E00-24): those are unit-test fakes, and the harness exercises the real app.
