          - A captured log containing only redacted/length-only representations passes.
        tdd:
          - "`logAudit_canaryPresentInLogcat_failsWithSourceAndLine`"
          - "`logAudit_canaryPresentInUnifiedLog_failsWithSourceAndLine`"
          - "`logAudit_redactedLengthOnlyEntries_passes`"
        notes: ""
      - id: E15-18
        title: "[tools] Security audit suite runner: one command, one report, CI subset on core/* PRs"
        type: task
        platforms: [tools, ci]
        priority: P0
        size: M
        prd: [F-3.1, F-3.2]
        use_cases: [UC-25, AC-01, AC-02, AC-04]
        invariants: [1, 2, 4, 7]
        depends_on: [E15-03, E15-05, E15-06, E15-07, E15-08, E15-12, E15-13, E15-14, E15-15, E15-17]
        description: |
          UC-25 had no owner. `tools/audit/run.sh` runs conformance, pcap-audit (+ canary), mitm-lab,
          nmap, downgrade checks, fuzz smoke, and log-audit, each also invocable alone with one
          command, and writes a single pass/fail report (JSON + Markdown). CI runs the automatable
          subset (conformance, fuzz smoke, mitm-lab and a loopback pcap-audit against the E15-15
          harness server) on every PR touching android/core/** or macos/Packages/Tandem*/**
          (Appendix D). Device-only steps (nmap, live canary) appear in the report as "manual gate:
          pending" and are required at every phase exit from Phase 1 (PRD "required per phase").
        acceptance:
          - One command runs every tool and produces one report; any single failure fails the overall result
          - Each tool is also invocable individually with one documented command
          - A PR touching a core module runs the automatable subset as a required check; other PRs skip it
          - Manual-gate steps are reported as pending, never as passed
        tdd:
          - auditRunner_anyToolFails_overallReportFails
          - auditRunner_eachToolInvocableIndividually
          - auditCi_prTouchingCoreModule_runsAutomatableSubset
          - auditCi_prNotTouchingCore_skipsSubset
          - auditReport_manualGateSteps_listedAsPendingNotPassed
