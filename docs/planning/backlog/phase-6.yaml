          - "`scrcpyInputPath_onPhoneIndicatorHidden_injectionRefused`"
          - "`scrcpyInputPath_gestureSet_parityWithAccessibilityPath`"
        notes: |
          Gated placeholder per PRD F-9.4; do not begin implementation before E61-10 records an
          explicit "authorized" decision.
