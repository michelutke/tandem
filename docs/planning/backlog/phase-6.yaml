        depends_on: [E62-02, E00-20, E00-21]
        description: |
          GlobalAction (BACK/HOME/RECENTS) maps to performGlobalAction; SetText finds the
          currently focused editable AccessibilityNodeInfo and applies ACTION_SET_TEXT with the
          text argument bundle. Both go through an `AccessibilityActions` seam (performGlobalAction,
          findFocus(FOCUS_INPUT)); recording fake in Robolectric tests, real service on the emulator.
          Cycle 4: TextEdit (E62-01) is applied to the focused editable node: insert and deleteBackward compute
          the new text from the node's current text and selection and apply ACTION_SET_TEXT (then restore the
          cursor via ACTION_SET_SELECTION); imeEnter uses ACTION_IME_ENTER.
          Text of password nodes (`isPassword`) is never read into logs.
