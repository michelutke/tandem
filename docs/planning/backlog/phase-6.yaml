      - id: E62-10
        title: "[android] Alternative input path via scrcpy (P2, gated on ADR-006)"
        type: task
        platforms: [android]
        priority: P2
        size: L
        prd: [F-9.4]
        use_cases: [UC-23]
        invariants: [8]
        depends_on: [E61-10]
        description: |
          Only proceeds if E61-10's finalized ADR-006 authorizes the ADB-wireless-debugging +
          bundled scrcpy-server (Apache 2.0) path as an alternative to AccessibilityService, for
          higher-fidelity input without requiring the Accessibility permission. Must
          independently satisfy invariant 8 (a scrcpy-based path does not inherit the
          accessibility session indicator for free); reuses input.proto framing where possible.
        acceptance:
          - Not started unless ADR-006 explicitly authorizes it.
          - "If implemented: reaches gesture-set parity with E62-04/E62-05 and passes an
            equivalent of E62-08's authorization test for its own input path."
        tdd:
