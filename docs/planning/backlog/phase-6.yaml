  - id: E62
    title: Remote input
    labels: [area:input]
    prd: [F-9.3, F-9.4]
    use_cases: [UC-23, AC-06]
    summary: |
      Mac mouse, scroll and keystroke input, mapped to phone screen coordinates (rotation,
      letterboxing) and injected via AccessibilityService gestures, global actions and text edits
      (TextEdit insert/deleteBackward/imeEnter and SetText; no raw key events). Input is accepted only
      while a user-started, bound mirror session is active, within field ranges and a 120 events/s
      token bucket (burst 240), and only while the on-phone indicator (ongoing notification plus a
      TYPE_ACCESSIBILITY_OVERLAY badge above app overlays) is attached (invariant 8); anything else is
      dropped and logged without content, never injected (AC-06, AC-19). Includes the P2,
      ADR-006-gated scrcpy alternative input path.
    scope:
      - "input.proto messages (Tap, Swipe, Scroll, GlobalAction, SetText, TextEdit; no raw key-code message), field ranges and the 120 events/s rate, and SPEC.md section."
      - "Android: AccessibilityService opt-in flow, coordinate mapping, gesture/global-action/text dispatch, session-authorization gate, on-phone indicator, rate limiter, accessibility-overlay indicator."
      - "macOS: mouse/keyboard/scroll capture in the mirror window, keystroke-to-TextEdit mapping and pointer-move coalescing to <= 120 events/s."
      - Security test for input authorization (AC-06) and an end-to-end device test.
    out_of_scope:
      - Mirroring capture/encode/decode itself (E61).
      - The scrcpy alternative path beyond a gated placeholder issue, unless ADR-006 (E61-10)
        authorizes it.
    exit_criteria:
      - INPUT frames arriving without an active, user-started mirror session are ignored and
        logged, never injected (roadmap Phase 6 exit criterion).
      - A scripted device-level sequence of taps, swipes, text entry, and global actions all
        succeed on physical hardware from the Mac mirror window.
      - "A 1000 events/s flood injects at most 240 events in any second, out-of-range coordinates are dropped (never clamped), and frames are dropped while the indicator overlay is detached (E62-06, E62-08)."
    issues:
      - id: E62-01
        title: "[protocol] input.proto: gestures, global actions, text, session binding"
        type: task
        platforms: [protocol]
        priority: P0
        size: M
        prd: [F-9.3]
        use_cases: [UC-23, AC-06, AC-19]
        invariants: [8]
        depends_on: [E60-01, E15-01, E15-02, E01-22]
        description: |
          protocol/proto/tandem/v1/input.proto: InputEvent oneof {Tap{x,y}, Swipe{x1,y1,x2,y2,
          durationMs}, Scroll{x,y,dx,dy}, GlobalAction{action}, SetText{text}}, each carrying the
          bound mirror-session reference required by invariant 8. Write docs/protocol/SPEC.md
          input section. Bounds checking against the display is semantic and done by the
          coordinate mapper (E62-03), not the parser. Vectors run through E15-01/E15-02.
          Cycle 4 decisions: no raw key-event message (an AccessibilityService cannot inject arbitrary KeyEvents,
          and raw key codes would widen the surface); keyboard input is `TextEdit { oneof insert(text),
          deleteBackward(count 1..64), imeEnter }` next to `SetText`. Coordinates are uint32 window-local values
          that must lie inside the reported window size; Swipe durationMs 1..5000; SetText / insert <= 4096
          characters; unknown GlobalAction values are dropped; the sender MUST NOT exceed 120 InputEvents/s
          (E01-22).
        acceptance:
          - buf lint reports zero violations.
          - protocol/vectors/input/*.json cover all six InputEvent variants (incl. TextEdit) and pass conformance
            on both codecs with byte-identical encodings.
          - An InputEvent without the mirror-session reference is rejected by both parsers.
          - "input.proto has no raw key-code message; TextEdit covers insert, deleteBackward and imeEnter; the SPEC input section states the field ranges and the 120 events/s rate."
        tdd:
          - "conformance: inputEventVectors_allSixVariants_roundTripGoldenBytes"
          - "conformance: inputEventVector_missingSessionReference_rejectedByParser"
          - "ci: bufLint_inputProto_zeroViolations"
          - "conformance: textEditVectors_insertDeleteImeEnter_roundTripGoldenBytes"
          - "ci: inputProtoScan_rawKeyCodeMessage_absent"
        notes: ""
      - id: E62-02
        title: "[android] AccessibilityService opt-in with explanation"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-9.3]
        use_cases: [UC-23]
        invariants: [8]
        depends_on: [E62-01, E00-20, E00-21, E00-28]
        description: |
          Settings screen explaining why Accessibility is requested (remote input injection for
          mirroring), deep-linking to the system Accessibility settings; the service's
          accessibility-service-config declares only the capabilities actually used (no
          unrelated event types); disabled by default. Enabled state is read through an
