      - id: E62-11
        title: "[android] Compose mirror, media and remote input into the app"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-9.1, F-9.3]
        use_cases: [UC-22, UC-23]
        invariants: [1, 3, 5, 7, 8]
        depends_on: [E20-24, E60-09, E61-05, E61-11, E61-16, E62-06]
        description: |
          The mirror/input stack is built behind seams but nothing in :app constructs it. Wire per Ready
          session: MediaDialer + MediaConnectionLifecycle (PinSource = the control session's pinned peer),
          MirrorPromptController (stop() bound to session end) whose onUserStart is the only caller of
          MirrorConsent.grantFromUserAction, EncodePipeline + MirrorSessionLifecycle with a real
          MirrorIndicator, a reader that routes KeyframeRequest/RotationChanged on the media stream,
          and InputGate + RemoteInputIndicator inside TandemAccessibilityService (add
          implementation(project(":feature:input")) to :app and the exported-allowlist line for the
          service). PinMismatch on the media dial surfaces the visible fail-closed error.
        acceptance:
          - A MirrorRequest shows the prompt; Start + projection consent opens the media connection, starts encoding and shows the indicator
          - Remote input executes only while the gate is open; session end closes media, encoder, indicator and gate
        tdd:
          - "unit: appMirrorComposition_sessionReady_promptControllerAndGateAttachedOnce"
          - "unit: appMirrorComposition_sessionEnded_mediaEncoderIndicatorAndGateTornDown"
        notes: "Added 2026-10-04: wiring gap collected from E60-02, E60-09, E61-03, E61-11, E61-16, E62-02..E62-06."
