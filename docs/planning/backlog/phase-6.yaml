      - id: E62-06
        title: "[android] Input authorization gate + persistent on-phone indicator"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-9.3]
        use_cases: [UC-23, AC-06]
        invariants: [8]
        depends_on: [E62-04, E62-05, E60-04]
        description: |
          INPUT frames are only processed while a user-started mirror session (E61) is active and
          bound to the current connection; otherwise they are dropped and a log entry is recorded
          without the event's content, per the test-strategy "input authorization" row and AC-06.
          A persistent, non-dismissable-by-remote-input on-phone overlay/notification indicates
          active remote input for the session's duration (invariant 8).
        acceptance:
          - An InputEvent arriving with no active mirror session is dropped, logged, and never
            injected.
          - An InputEvent arriving during an active, bound session is processed normally.
          - The on-phone indicator is visible for the entire session and cannot be dismissed via
            a remote input event.
        tdd:
          - inputHandler_noActiveMirrorSession_dropsEventAndLogsWithoutContent
          - inputHandler_activeBoundSession_processesEvent
          - onPhoneIndicator_duringActiveSession_visibleAndNotRemotelyDismissable
        notes: ""
      - id: E62-07
        title: "[macos] Mouse/keyboard/scroll capture in mirror window"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-9.3]
        use_cases: [UC-23]
        invariants: []
        depends_on: [E62-01, E61-07]
        description: |
          Capture local mouse click/drag/move, keyboard, and scroll events while the mirror
          window is focused; translate to window-local coordinates plus a key-mapping table
          (US/ISO layout) before sending as InputEvent.
        acceptance:
          - Clicking within the mirror window emits an InputEvent with window-local coordinates.
          - Common keys (letters, backspace, enter) map to the expected Android key codes.
        tdd:
          - mirrorWindowInput_click_emitsWindowLocalCoordinateEvent
          - keyMapper_commonKeys_mapToExpectedAndroidKeyCodes
        notes: ""
