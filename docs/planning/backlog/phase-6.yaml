      - id: E62-06
        title: "[android] Input authorization gate + persistent on-phone indicator"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-9.3]
        use_cases: [UC-23, AC-06, AC-19]
        invariants: [8]
        depends_on: [E62-04, E62-05, E60-09, E61-02, E12-11, E00-20, E00-21]
        description: |
          INPUT frames are only processed while a user-started mirror session (E61) is active and
          bound to the current connection; otherwise they are dropped and a log entry is recorded
          without the event's content, per the test-strategy "input authorization" row and AC-06.
          A persistent, non-dismissable-by-remote-input on-phone overlay/notification indicates
          active remote input for the session's duration (invariant 8). `InputGate` reads a
          `MirrorSessionState` source (started locally via E61-02 consent, bound to the current
          `TandemSession`, indicator shown) and forwards to the E62-04 `GestureDispatcher` /
          E62-05 `AccessibilityActions` recording fakes in tests; the indicator uses a
          `NotificationPresenter` seam under Robolectric (E00-20).
          Cycle 4: before dispatch the gate enforces a token bucket of 120 events/s (burst 240; excess dropped
          and counted, one aggregated log line per second with counts only) and the E62-01 field ranges. The
          indicator is the ongoing notification plus a small badge drawn by the AccessibilityService as a
          TYPE_ACCESSIBILITY_OVERLAY, which sits above every app overlay (TYPE_APPLICATION_OVERLAY), so another
          app cannot hide it; input is dropped whenever the overlay is not attached.
        acceptance:
          - An InputEvent arriving with no active mirror session is dropped, never reaches the
            dispatcher, and logs one entry with reason and event type only (no coordinates, no
            text).
          - An InputEvent whose session reference does not match the active mirror session, or
            arriving after the session stopped, or while the indicator is not showing, is dropped.
          - An InputEvent during an active, bound session with the indicator showing reaches the
            dispatcher unchanged.
          - The indicator is an ongoing (non-swipeable) notification posted at session start and
            removed within 1 s of session end; on the emulator a remote swipe over it leaves it posted.
          - "A burst of 1000 events in 1 s dispatches at most 240 and counts the rest as dropped; SetText over 4096 characters and Swipe durationMs outside 1..5000 are dropped."
          - "With the indicator overlay detached, frames are dropped; on the emulator the accessibility overlay stays above another app's SYSTEM_ALERT_WINDOW overlay."
        tdd:
          - "unit: inputGate_noActiveMirrorSession_droppedAndDispatcherNeverCalled"
          - "unit: inputGate_droppedSetTextFrame_logEntryOmitsTextAndCoordinates"
          - "unit: inputGate_sessionReferenceMismatch_frameDropped"
          - "unit: inputGate_indicatorNotShowing_frameDropped"
          - "unit: inputGate_activeBoundSession_forwardsEventToDispatcher"
          - "unit: remoteInputIndicator_sessionActive_ongoingNotificationPosted"
          - "instrumented: remoteInputIndicator_remoteSwipeOverNotification_indicatorStillPosted"
          - "unit: inputGate_burstOf1000Events_atMost240Dispatched"
          - "unit: inputGate_setTextOver4096Chars_dropped"
          - "unit: inputGate_indicatorOverlayDetached_frameDropped"
          - "manual: remoteInputIndicator_otherAppOverlayShown_accessibilityOverlayStaysTopmost"
        notes: ""
      - id: E62-07
