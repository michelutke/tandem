      - id: E62-03
        title: "[android] Coordinate mapping (rotation, letterboxing) pure function"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-9.3]
        use_cases: [UC-23]
        invariants: []
        depends_on: [E62-01]
        description: |
          A pure function mapping a Mac mirror-window coordinate plus window size, reported
          device display size, rotation, and letterbox offsets to a device screen coordinate,
          returning `Mapped(x, y)` or `Dropped(reason)`. The letterbox geometry matches E61-07's
          `LetterboxLayout`. A rotation delta (stream orientation from the last RotationChanged vs.
          current display rotation, e.g. during an in-flight rotation) is applied on a natural
          1080x2400 display as: 90 → (y, W - x), 180 → (W - x, H - y), 270 → (H - y, x).
          Unit-testable without Accessibility or a real device.
        acceptance:
          - Portrait 1080x2400 device in a 540x1200 window maps (270, 600) to (540, 1200).
          - Pillarboxed 1000x1000 window (content x 275..725) maps (275, 0) to (0, 0) and
            (500, 500) to (540, 1200).
          - Letterboxed landscape 2400x1080 stream in a 1000x1000 window (content y 275..725)
            maps (500, 275) to (1200, 0).
          - Points inside a letterbox bar or outside the window return Dropped; they are never
            clamped onto the screen.
          - Rotation delta 90/180/270 maps (100, 200) to (200, 980), (980, 2200), (2200, 100).
          - "Coordinates outside the reported window size, and window or display sizes of 0, return Dropped (no division by zero, no clamping)."
        tdd:
          - "unit: coordinateMapper_portraitWindowMatchingAspect_scalesToDevicePixels"
          - "unit: coordinateMapper_pillarboxedWindow_subtractsHorizontalOffset"
          - "unit: coordinateMapper_letterboxedLandscapeStream_subtractsVerticalOffset"
          - "unit: coordinateMapper_pointInLetterboxBar_returnsDropped"
          - "unit: coordinateMapper_pointOutsideWindow_returnsDropped"
          - "unit: coordinateMapper_rotationDelta90_mapsPoint100x200To200x980"
          - "unit: coordinateMapper_rotationDelta180_mapsPoint100x200To980x2200"
          - "unit: coordinateMapper_rotationDelta270_mapsPoint100x200To2200x100"
          - "unit: coordinateMapper_zeroWindowSize_returnsDropped"
        notes: ""
      - id: E62-04
