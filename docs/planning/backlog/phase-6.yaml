phase: 6
epics:
  - id: E60
    title: Media connection with ticket binding
    labels: [area:transport]
    prd: [F-3.3]
    use_cases: [UC-22, AC-08]
    summary: |
      A second mTLS connection, dedicated to the high-bandwidth, latency-sensitive mirroring
      stream, so a saturated file transfer or SMS backfill on the control connection never
      delays a video frame (ADR-005: two connections vs. one multiplexed connection). The media
      connection is still full mTLS with the same pinned identities as the control connection; a
      single-use, 30 s-expiry mediaTicket issued over the control channel binds it to the
      originating control session so an unauthenticated party cannot open or hijack it (AC-08).
    scope:
      - media.proto ticket messages and SPEC.md media-connection section (extends E01-09's
        media-ticket SPEC section with the wire messages).
      - "Android: ticket request + second mTLS connection dial."
      - "macOS: second mTLS acceptor + ticket binding validation."
      - Lifecycle tying the media connection to its control session; mitm-lab and pcap-audit
        coverage for the media path.
      - "MediaHello 5 s deadline (PROTOCOL_TIMEOUT); MediaHello on a pairing-candidate connection rejected without consulting the ticket table; tickets never logged or persisted, compared in constant time; one media connection per control session (E60-03, E60-04, E60-08)."
    out_of_scope:
      - Mirroring codec, capture, and rendering (E61).
      - Remote input framing and authorization (E62).
    exit_criteria:
      - mitm-lab media-ticket scenarios (missing, reused, expired, other-session, other-client-cert
        ticket) all fail closed.
      - pcap-audit shows only TLS 1.3 records for both the control and the media connection on
        the single Tandem port during a mirror session (no second listener).
      - "With the control connection saturated by a 500 MB FILES transfer, p95 MediaFrame delivery on the E15-15 harness is within 10 ms of baseline and < 120 ms, and mirroring during a 1 GB transfer keeps p95 < 120 ms on 5 GHz Wi-Fi (E60-07)."
      - "A media connection that sends no MediaHello within 5 s is closed with PROTOCOL_TIMEOUT (E60-05)."
    issues:
      - id: E60-01
        title: "[protocol] media.proto: ticket issuance + MediaHello binding"
        type: task
        platforms: [protocol]
        priority: P0
        size: M
        prd: [F-3.3]
        use_cases: [UC-22, AC-08]
        invariants: [6]
        depends_on: [E01-09, E01-12, E01-16, E02-06, E15-01, E15-02]
        description: |
          protocol/proto/tandem/v1/media.proto: RequestMediaTicket{} sent over the control channel, answered
          by the existing `MediaTicketGrant{ticket, expiresAt}` from control.proto (E01-12, reused,
          not redefined); MediaHello{ticket} as the required first frame on the second
          connection. The ticket is a 256-bit (32-byte) random value (PRD F-3.3). Extends
          docs/protocol/SPEC.md's media-ticket section (E01-09) with the concrete message shapes.
          Vectors run through the conformance runners (E15-01 Kotlin, E15-02 Swift).
        acceptance:
          - buf lint reports zero violations for media.proto.
          - protocol/vectors/media/*.json (RequestMediaTicket, MediaTicketGrant, MediaHello) pass
            conformance on both codecs with byte-identical encodings.
          - A MediaHello with no ticket field, or a ticket that is not exactly 32 bytes, is rejected
            by both parsers with a typed error before any further frame is read.
        tdd:
          - "conformance: requestMediaTicketVector_roundTrip_matchesGoldenBytes"
          - "conformance: mediaTicketGrantVector_roundTrip_matchesGoldenBytes"
          - "conformance: mediaHelloVector_missingTicketField_rejectedByParser"
          - "conformance: mediaHelloVector_ticketNot32Bytes_rejectedByParser"
          - "ci: bufLint_mediaProto_zeroViolations"
        notes: ""
      - id: E60-02
        title: "[android] Media ticket request + second mTLS connection dial"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-3.3]
        use_cases: [UC-22]
        invariants: [1]
        depends_on: [E60-01, E60-03, E12-08, E12-11, E00-19, E15-15]
        description: |
          On starting a mirror session, request a MediaTicketGrant over the control channel; open
          a second mTLS connection to the Mac (same pinned peer, reusing the transport
          abstraction from E12-11) and send MediaHello{ticket} as the first frame.
          `MediaDialer` takes the control `TandemSession` (fake: `FakeTandemSession`, E12-11) and a
          `ByteStream` factory (E00-19 `InMemoryDuplexPipe` in unit tests) so first-frame content
          and trust decisions are asserted without a network; the real second mTLS connection is
          exercised against the real Mac server via the E15-15 JVM harness.
        acceptance:
          - Opening a mirror session dials a second TLS connection whose first frame is
            MediaHello carrying the just-issued ticket (no other frame precedes it).
          - The second connection is authenticated against the same pinned peer fingerprint as
            the control connection (E13-02), never a separate or relaxed check; a server presenting
            a different fingerprint aborts the dial before MediaHello is sent.
          - Against the real Mac server (E15-15), the dialed media connection is bound to the
            originating control session and stays open.
        tdd:
          - "unit: mediaDialer_mirrorStart_sendsMediaHelloWithIssuedTicketAsFirstFrame"
          - "unit: mediaDialer_trustEvaluation_usesControlSessionPinnedFingerprint"
          - "unit: mediaDialer_serverFingerprintDiffersFromPin_abortsBeforeMediaHello"
          - "integration: mediaDialer_againstRealMacServer_connectionBoundAfterMediaHello"
        notes: ""
      - id: E60-03
        title: "[macos] Media connection acceptor on the single listener"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.3]
        use_cases: [UC-22, AC-08, AC-13]
        invariants: [1, 5, 6, 2, 3]
        depends_on: [E60-01, E60-08, E12-01, E12-02, E12-12, E00-25, E00-24, E01-22]
        description: |
          The macOS NWListener accepts the second mTLS connection; the first frame must be
          MediaHello. The ticket is checked by `MediaTicketValidator` (E60-08) together with the
          presenting connection's peer SPKI. On success, bind the media connection to the
          originating PeerSession. On any failure, close the connection immediately without
          processing further frames and emit a `mediaTicketRejected(reason)` event that is distinct
          from a handshake failure (E60-05 asserts on it). Unit tests drive the acceptor over
          `InMemoryConnectionPair` (E00-25); the real second mTLS connection is exercised by an
          in-process loopback test (real TLS on localhost, two real sessions).
        acceptance:
          - A valid, unexpired, unused ticket binds the connection to the originating control
            session (loopback mTLS).
          - A reused ticket over real loopback mTLS gets the connection closed with zero MediaFrames
            dispatched.
          - A connection whose first frame is not MediaHello is closed without reading a second
            frame.
          - Any validator rejection closes the connection, dispatches zero MediaFrames, and emits
            exactly one `mediaTicketRejected` event carrying the reason (not a handshake-failure event).
          - The media connection is accepted by the same single NWListener/port as the control connection; exactly one listening socket exists during an active mirror session (PRD goals, invariant 2).
          - "A pairing-candidate connection that sends MediaHello is closed without consulting the validator."
          - "No MediaHello within 5 s of TLS completion closes the connection with PROTOCOL_TIMEOUT (E01-22)."
        tdd:
          - "integration: mediaAcceptor_validTicketOverLoopbackMtls_bindsToOriginatingSession"
          - "integration: mediaAcceptor_reusedTicketOverLoopbackMtls_closedWithZeroFramesDispatched"
          - "unit: mediaAcceptor_firstFrameNotMediaHello_closesWithoutReadingNextFrame"
          - "unit: mediaAcceptor_validatorRejects_emitsTicketRejectedEventNotHandshakeFailure"
          - "integration: mediaAcceptor_duringActiveMirror_exactlyOneListeningSocket"
          - "unit: mediaAcceptor_pairingCandidateSendsMediaHello_closedWithoutValidatorCall"
          - "unit: mediaAcceptor_noMediaHelloWithin5s_closesProtocolTimeout"
        notes: |
          Split in review cycle 3: ticket issuance/validation logic moved to E60-08; this issue
          keeps the acceptor wiring (E60-05, E61-06, E61-12 depend on it).
      - id: E60-04
        title: "[macos] Media connection lifecycle tied to control session"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.3]
        use_cases: [UC-22]
        invariants: [1, 6]
        depends_on: [E60-03, E12-09, E12-12, E00-24]
        description: |
          A control-session-scoped `MediaSessionRegistry` limits each control session to one
          active media connection. When the control session leaves Connected (Closed or Dead in
          the E12-09 state machine, including the heartbeat dead-peer path of F-3.4) the bound
          media connection is closed and all outstanding tickets for that session are revoked.
          Requesting a new ticket while a media connection is active revokes and closes the prior
          media connection first. Tests drive state changes through the E12-12 `TandemSession` fake
          and an injected `Clock` (E00-24 `ManualTestClock`) so the 1 s bound is checked in virtual time.
        acceptance:
          - A control session transition to Closed or Dead closes the bound media connection
            within 1 s.
          - After the control session ends, a previously issued unused ticket for it is rejected
            as revoked.
          - Requesting a new ticket while a media connection is active closes the old connection
            before the new ticket is issued; at most one media connection per control session is
            ever open.
        tdd:
          - "unit: mediaRegistry_controlSessionDead_closesBoundMediaConnectionWithin1s"
          - "unit: mediaRegistry_controlSessionClosed_revokesOutstandingTickets"
          - "unit: mediaRegistry_newTicketRequestedWhileActive_closesPriorBeforeIssuing"
          - "unit: mediaRegistry_perControlSession_atMostOneOpenMediaConnection"
        notes: |
          E60-03 verifier (2026-10-03): when wiring mediaConnectionHandler, a trusted peer whose media
          connection times out or sends a bad first frame is dropped via plain decisionCorrelator.drop
          (ListenerFactory+Media.swift) — route it through dropReportingFailure / the state machine so
          the failure is observable (E15-16 menu reporting). CloseCode.ticketRejected is currently unused.
          Split from [cross] in review cycle 3: this issue keeps the macOS half; the Android half
          is E60-09.
      - id: E60-05
        title: "[tools] Security test: media ticket binding scenarios"
        type: test
        platforms: [tools]
        priority: P0
        size: M
        prd: [F-3.3]
        use_cases: [AC-08]
        invariants: [1, 5, 6]
        depends_on: [E60-03, E60-04, E15-08, E62-12]
        description: |
          Extend tools/mitm-lab with media-connection scenarios per the test-strategy "session
          binding" row. Every scenario completes a valid mTLS handshake first, so a rejection
          proves the ticket check is a separate layer. Scenarios: (1) MediaHello with no ticket;
          (2) a ticket that was already used once; (3) a ticket presented 31 s after issuance;
          (4) a ticket issued in an earlier control session of the same peer that has since ended;
          (5) a ticket issued to paired peer A's control session presented on a media connection
          authenticated with paired peer B's client certificate.
        acceptance:
          - "All five scenarios fail closed: the connection is closed by the Mac and the Mac log
            shows zero MediaFrames processed for it."
          - Each rejection is confirmed by the `mediaTicketRejected(reason)` event (E60-03) with the
            scenario's reason (missing, consumed, expired, revoked, peerMismatch), distinguishing
            "handshake succeeded, ticket rejected" from "handshake failed".
          - "A media connection that completes mTLS but sends no MediaHello for 6 s is closed with PROTOCOL_TIMEOUT."
        tdd:
          - "security: mitmLab_mediaHelloWithoutTicket_rejectedAfterHandshake"
          - "security: mitmLab_mediaReusedTicket_rejectedAfterHandshake"
          - "security: mitmLab_mediaTicketAfter31s_rejectedAfterHandshake"
          - "security: mitmLab_mediaTicketFromEndedSession_rejectedAfterHandshake"
          - "security: mitmLab_mediaTicketOnOtherPeersClientCert_rejectedAfterHandshake"
          - "security: mitmLab_mediaConnectionNoHelloFor6s_closedProtocolTimeout"
        notes: ""
      - id: E60-06
        title: "[tools] pcap-audit coverage for the media connection"
        type: test
        platforms: [tools]
        priority: P0
        size: S
        prd: [F-3.3]
        use_cases: [AC-02]
        invariants: [1, 2]
        depends_on: [E60-04, E60-09, E15-04, E15-05, E62-11, E62-12]
        description: |
          Confirm the media connection independently satisfies the "no plaintext on the wire"
          requirement (test-strategy), noting the media connection terminates on the same single Tandem port (no second listener, PRD goals), so the E15-04/E15-05 capture must classify both connections on that port.
          The flow classification is self-tested against a checked-in fixture pcap with two TLS
          1.3 flows on one port.
        acceptance:
          - A pcap-audit run capturing an active mirror session shows only TLS 1.3 records on
            both the control and the media connection on the single Tandem port, and reports two
            distinct TCP flows (so the pass is not vacuous).
          - Every Tandem TCP flow in the capture targets the single Tandem port; zero flows to any
            other Mac port.
        tdd:
          - "unit: pcapAudit_fixtureTwoTlsFlowsOnOnePort_classifiesBothConnections"
          - "security: pcapAudit_activeMirrorSession_onlyTls13RecordsOnBothConnections"
          - "security: pcapAudit_activeMirrorSession_allTandemFlowsOnSinglePort"
        notes: ""
      - id: E60-07
        title: "[cross] Media connection isolation from control-channel congestion"
        type: test
        platforms: [android, macos]
        priority: P0
        size: M
        prd: [F-3.3]
        use_cases: [UC-22]
        invariants: [1]
        depends_on: [E60-04, E60-09, E11-07, E11-08, E15-15, E00-23, E62-11, E62-12]
        description: |
          Verify the entire reason for ADR-005's two-connection design: with the control
          connection saturated by a large file transfer on the FILES channel (E11-07/E11-08's flow
          control), media-frame delivery on the separate connection is unaffected. Automated
          on the E15-15 harness (JVM client streams timestamped synthetic MediaFrames at 30 fps
          while pushing a 500 MB FILES transfer to the real Mac server on localhost); confirmed on
          real 5 GHz Wi-Fi as a manual gate.
        acceptance:
          - On the E15-15 harness, p95 synthetic MediaFrame delivery delay with the control
            connection saturated is within 10 ms of the unsaturated baseline and under 120 ms.
          - On physical devices over 5 GHz Wi-Fi, mirroring during a 1 GB file transfer keeps p95
            end-to-end latency under 120 ms (E61-08 method).
        tdd:
          - "integration: mediaIsolation_controlSaturatedByFileTransfer_p95DelayWithin10msOfBaseline"
          - "manual: mediaIsolation_mirrorDuring1GbTransferOn5GhzWifi_p95LatencyUnder120ms"
        notes: ""
      - id: E60-08
        title: "[macos] MediaTicket issuer + validator (30 s expiry, single use, session binding)"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.3]
        use_cases: [AC-08]
        invariants: [6, 3]
        depends_on: [E60-01, E10-11, E00-24]
        description: |
          Pure logic behind the acceptor (E60-03). `MediaTicketIssuer` answers RequestMediaTicket
          with a 32-byte ticket from the system CSPRNG, recorded in a per-control-session table with
          the issuing session ID, the peer SPKI fingerprint, and `expiresAt = now + 30 s`.
          `MediaTicketValidator.validate(ticket, presentingSpki)` returns the bound session or a
          typed `MediaTicketError` (missing, unknown, expired, consumed, revoked, peerMismatch),
          marks the ticket consumed on first success, and compares ticket bytes with the
          constant-time helper (E10-11). Both take an injected `Clock<Duration>` (E00-24) so the
          30 s expiry is tested in virtual time with `ManualTestClock`.
        acceptance:
          - Issued tickets are 32 bytes and expire 30 s after issuance.
          - A valid unused ticket presented by the issuing peer within 30 s returns the issuing
            control session; a second presentation returns `consumed`.
          - At 30 s after issuance (virtual time) the ticket returns `expired`.
          - A ticket presented with a different peer SPKI than its issuing session returns
            `peerMismatch`; a ticket whose issuing session has ended returns `revoked`.
          - Ticket comparison goes through the constant-time helper.
          - "Ticket bytes never appear in log output (logger fake) and are never persisted; tickets live only in the in-memory table."
        tdd:
          - "unit: mediaTicketIssuer_issue_returns32ByteTicketExpiringIn30s"
          - "unit: mediaTicketValidator_validUnusedTicketWithin30s_returnsIssuingSession"
          - "unit: mediaTicketValidator_clockAdvanced30s_returnsExpired"
          - "unit: mediaTicketValidator_secondPresentation_returnsConsumed"
          - "unit: mediaTicketValidator_presentingSpkiDiffersFromIssuer_returnsPeerMismatch"
          - "unit: mediaTicketValidator_ticketComparison_usesConstantTimeHelper"
          - "unit: mediaTicketIssuer_issueAndValidate_ticketBytesNeverLogged"
        notes: "Split from E60-03 in review cycle 3."
      - id: E60-09
        title: "[android] Media connection lifecycle tied to control session"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-3.3]
        use_cases: [UC-22]
        invariants: [1]
        depends_on: [E60-02, E12-08, E12-11, E00-18, E15-15]
        description: |
          Android half of the media lifecycle: when the control `TandemSession` (E12-11) leaves
          Connected (Closed or Dead per E12-08, including dead-peer detection), `MediaDialer`
          closes the media connection and reports the mirror session as stopped; starting a new
          mirror session while one is active closes the prior media connection before dialing.
          Uses the injected `Clock`/`TestClock` (E00-18) for the 1 s bound.
        acceptance:
          - A control session transition to Closed or Dead closes the media connection within 1 s.
          - Starting a new mirror session while one is active closes the prior media connection
            before the new dial begins.
          - Against the real Mac server (E15-15), dropping the control connection closes the Android
            media connection within 1 s.
        tdd:
          - "unit: androidMediaLifecycle_controlSessionDead_mediaConnectionClosedWithin1s"
          - "unit: androidMediaLifecycle_newMirrorStartWhileActive_closesPriorBeforeDial"
          - "integration: androidMediaLifecycle_macDropsControlConnection_mediaClosedWithin1s"
        notes: "Split from E60-04 in review cycle 3."

  - id: E61
    title: Screen mirroring (capture, encode, decode, render)
    labels: [area:mirroring]
    prd: [F-9.1, F-9.2, F-4.2]
    use_cases: [UC-22, UC-23, AC-06]
    summary: |
      Android-side capture via MediaProjection and VirtualDisplay, H.264 (HEVC when both sides
      support it) low-latency CBR encoding via MediaCodec, and macOS-side decoding via
      VTDecompressionSession into a resizable AVSampleBufferDisplayLayer window. Includes
      rotation/resolution-change handling on both sides, a performance harness proving the PRD
      success metric (1080p ≥30 fps, end-to-end latency under 120 ms), and canary-based
      pcap-audit coverage during an active mirror session. ADR-006 (mirroring path) is finalized
      here using this phase's real measurements, gating E62's optional scrcpy alternative.
    scope:
      - "MediaFrame/MediaFormat/KeyframeRequest/RotationChanged and MirrorRequest/MirrorDeclined messages (media.proto, extends E60-01) and SPEC.md coverage, incl. the fragmentation rule: access units > 960 KiB split into <= 8 contiguous fragments, <= 8 MiB reassembled, violations MALFORMED_FRAME."
      - Android capture/encode pipeline, HEVC negotiation, rotation/resolution handling, resource
        teardown.
      - macOS decode/render pipeline, resizable mirror window, rotation handling.
      - Performance harness and pcap-audit canary coverage during mirroring.
      - ADR-006 finalization.
      - "Mirror quick action sends MirrorRequest only; the phone start prompt (30 s timeout -> MirrorDeclined) gates MediaProjection consent (E61-12, E61-15, E61-16); FragmentReassembler with an 8 MiB hard cap (E61-14)."
    out_of_scope:
      - Remote input (E62).
      - Media connection/ticket mechanics themselves (E60).
      - Phone-as-webcam, microphone bridging, call audio (PRD non-goals).
    exit_criteria:
      - Mirroring sustains 1080p ≥30 fps with p95 end-to-end latency under 120 ms on 5 GHz
        Wi-Fi (roadmap Phase 6 exit criterion / PRD success metric).
      - pcap-audit with an on-screen canary during mirroring shows zero plaintext occurrences.
      - ADR-006 is marked Accepted with a final decision informed by this phase's measurements.
      - "The fragment rule holds on both sides: a 3-fragment unit is accepted; index gap, count change, count 9, interleaved pts and > 8 MiB are rejected with MALFORMED_FRAME (E61-01, E61-03, E61-14)."
      - "A MirrorRequest alone never starts capture or issues a ticket (E61-12, E61-16)."
    issues:
      - id: E61-01
        title: "[protocol] MediaFrame/MediaFormat/KeyframeRequest/RotationChanged messages"
        type: task
        platforms: [protocol]
        priority: P0
        size: M
        prd: [F-9.1, F-9.2]
        use_cases: [UC-22, AC-07, AC-19]
        invariants: [1]
        depends_on: [E60-01, E15-01, E15-02, E01-22]
        description: |
          media.proto additions: MediaFrame{pts, flags, data}, MediaFormat{codec, width, height,
          fps}, KeyframeRequest{}, RotationChanged{orientation}. Extends docs/protocol/SPEC.md's
          media section with frame semantics (flags include keyframe and codec-config). Vectors run
          through the conformance runners (E15-01, E15-02).
          Cycle 4 (1 MiB frame cap vs. large IDR frames; parser-relevant): MediaFrame gains `fragmentIndex` and
          `fragmentCount`. An encoded access unit larger than 960 KiB is split into fragments of <= 960 KiB sharing
          one pts, `fragmentCount` 1..8 (so a reassembled access unit is <= 7.5 MiB, under the 8 MiB E01-22 cap).
          Fragments of one access unit are contiguous and in index order; a count change, index gap or reorder, a
          count over 8, interleaving with another pts, or a reassembled size over 8 MiB closes the media
          connection with MALFORMED_FRAME. This is the only fragmentation mechanism in the protocol (E01-03).
        acceptance:
          - buf lint reports zero violations.
          - protocol/vectors/media/*.json (frame subset) pass conformance on both codecs with
            byte-identical encodings.
          - A MediaFrame whose encoded frame exceeds the 1 MiB max-frame rule (E01-03) is rejected
            by the framing layer on both codecs.
          - "SPEC.md media section states the fragmentation rule; vectors cover a 3-fragment access unit (accepted) and each rejection case (index gap, count change, count 9, interleaved pts)."
        tdd:
          - "conformance: mediaFrameVector_roundTrip_matchesGoldenBytes"
          - "conformance: mediaFormatVector_roundTrip_matchesGoldenBytes"
          - "conformance: keyframeRequestVector_roundTrip_matchesGoldenBytes"
          - "conformance: rotationChangedVector_roundTrip_matchesGoldenBytes"
          - "conformance: mediaFrame_overMaxFrameSize_rejectedByFraming"
          - "ci: bufLint_mediaFrameMessages_zeroViolations"
          - "conformance: mediaFrameFragmentVectors_threeFragmentAccessUnit_reassembledIdentically"
          - "conformance: mediaFrameFragmentVectors_indexGapOrCountChange_rejectedMalformedFrame"
          - "conformance: mediaFrameFragmentVectors_countNine_rejectedMalformedFrame"
        notes: ""
      - id: E61-02
        title: "[android] MediaProjection consent flow per session"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-9.1]
        use_cases: [UC-22]
        invariants: [8]
        depends_on: [E20-02, E00-20, E00-21]
        description: |
          Request MediaProjection permission for every mirror-session start (Android 14+ does not
          allow silently reusing a prior grant across restarts); the capturing service declares
          foreground service type mediaProjection. The consent dialog is only reachable from a
          phone-side "start mirroring" action, which is the local user action invariant 8's
          on-phone indicator ultimately protects. `MirrorSessionStarter` launches the consent
          through a `ProjectionConsentLauncher` seam (wrapping
          `MediaProjectionManager.createScreenCaptureIntent`, recording fake in tests, Robolectric
          E00-20); the real system dialog is driven with UiAutomator on the emulator (E00-21).
        acceptance:
          - Each of two consecutive mirror-session starts launches the consent intent; a cached
            grant is never reused.
          - Without a phone-side start action, the consent intent is never launched.
          - The capturing foreground service's manifest declares the mediaProjection foreground
            service type.
          - On the emulator, tapping "Start now" yields a MediaProjection; tapping "Cancel" leaves the
            mirror session in state NotStarted with no VirtualDisplay created.
        tdd:
          - "unit: mirrorSessionStarter_secondStart_launchesConsentIntentAgain"
          - "unit: mirrorSessionStarter_noLocalStartAction_neverLaunchesConsent"
          - "ci: mirrorServiceManifest_foregroundServiceType_includesMediaProjection"
          - "instrumented: projectionConsent_uiAutomatorTapsStartNow_projectionGranted"
          - "instrumented: projectionConsent_uiAutomatorTapsCancel_noVirtualDisplayCreated"
        notes: ""
      - id: E61-03
        title: "[android] VirtualDisplay + MediaCodec encode pipeline to MediaFrame"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-9.1]
        use_cases: [UC-22]
        invariants: [1]
        depends_on: [E61-01, E61-02, E61-13, E60-02, E00-21]
        description: |
          Create a VirtualDisplay from the MediaProjection surface; configure a MediaCodec encoder
          from the `EncoderConfig` built by E61-13; emit MediaFrame over the media connection
          (E60-02) on every output buffer, sending the codec-config buffer (SPS/PPS) as a
          config-flagged frame before the first picture. On KeyframeRequest, request a sync frame
          (`PARAMETER_KEY_REQUEST_SYNC_FRAME`). MediaCodec sits behind an `EncoderFactory` seam and
          MediaProjection/VirtualDisplay behind a `CaptureSource` seam (interfaces in
          feature/mirror, recording fakes in test fixtures) so pipeline logic is JVM-unit-tested;
          the real encode runs on the emulator's software AVC encoder (E00-21).
        acceptance:
          - A KeyframeRequest causes exactly one sync-frame request on the encoder (unit), and on
            the emulator software encoder an IDR arrives within the next 2 output frames.
          - Every encoder output buffer becomes one MediaFrame with the buffer's pts and keyframe
            flag; the codec-config buffer is sent first, flagged as config.
          - On the emulator, the software AVC encoder produces an IDR within 1 s of pipeline start.
