      - id: E62-09
        title: "[cross] End-to-end remote input device test"
        type: test
        platforms: [android, macos]
        priority: P0
        size: M
        prd: [F-9.3]
        use_cases: [UC-23]
        invariants: [8]
        depends_on: [E62-04, E62-05, E62-06, E62-07]
        description: |
          Manual device gate: from the Mac mirror window, tap, swipe, enter text, and trigger
          back/home/recents on physical hardware; matches the roadmap Phase 6 exit criterion
          alongside a negative control (input rejected once the session is stopped).
        acceptance:
          - A scripted sequence of taps, swipes, text entry, and global actions all succeed on
            the physical device.
          - After stopping the mirror session, a subsequently sent InputEvent is rejected rather
            than injected.
