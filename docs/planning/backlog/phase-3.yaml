      - id: E30-07
        title: "[macos] UNUserNotificationCenter presentation via NotificationPresenter seam"
        type: story
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-5.1, F-5.2]
        use_cases: [UC-08, UC-09, AC-14, AC-12]
        invariants: []
        depends_on: [E30-01, E22-01, E00-08, E12-12, E00-23, E14-22, E14-13]
        description: |
          Present NotificationPosted as a UNNotificationRequest using MessagingStyle sender names
          in the body. Seam: `NotificationPresenter` protocol in the notifications module
          (`add(request)`, `removeDelivered(identifiers)`, `setCategories`, response stream of
          `NotificationResponseEvent{requestIdentifier, actionIdentifier, userText}` because
          UNNotificationResponse has no public init); `UNNotificationPresenter` is the only type
          touching UNUserNotificationCenter; `RecordingNotificationPresenter` in test fixtures
          records requests so tests need no notification authorization. Incoming posts come from
          the fake TandemSession (E12-12). Category/action registration is E30-17. Real banner
          rendering is a manual gate (E00-23).
        acceptance:
          - A plain notification produces a request with title = notification title, subtitle =
            app name, body = text
          - 'A MessagingStyle notification body lists one line per message as "Sender: text"'
          - The request identifier equals the NotificationPosted key, so an update to the same
            key replaces rather than stacks the delivered notification
          - On a physical Mac with notifications allowed, a posted notification appears as a
            banner with title, app name, and body within 1 s of receipt
          - "Every presented string passes the E14-22 sanitizer and the E01-22 caps (title <= 256, body <= 4096 characters, <= 25 senders); on unpair (PeerDataPurgeRegistry, E14-13) all delivered notifications from that phone are removed."
        tdd:
          - "unit: notificationPresentation_plainPosted_titleSubtitleBodyMapped"
          - "unit: notificationPresentation_messagingStyleTwoSenders_bodyHasSenderPrefixedLines"
          - "unit: notificationPresentation_sameKeyPostedTwice_requestIdentifierReused"
          - "manual: macNotificationBanner_physicalMac_showsTitleAppNameBodyWithin1s"
          - "unit: notificationPresentation_titleWithBidiOverrideOverCap_sanitizedAndTruncated"
          - "unit: notificationPresentation_peerUnpaired_deliveredNotificationsRemoved"
        notes: |
          Split from E30-07 in review cycle 3: category/action/text-input registration moved to
          E30-17; size L → M.
