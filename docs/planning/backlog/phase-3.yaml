      - id: E31-14
        title: "[macos] Origin tag and content-hash loop prevention"
        type: story
        platforms: [macos]
        priority: P0
        size: S
        prd: [F-6.3]
        use_cases: [UC-12, UC-13]
        invariants: []
        depends_on: [E31-04, E31-13, E00-24, E00-25, E12-12]
        description: |
          Swift counterpart of E31-08: record (originTag, contentHash) and the changeCount of each
          write from a received clip (E31-13); the poller (E31-02) skips a detected change that
          matches it. Cleared once a different local change is sent. Unit tests use
          `FakePasteboardSource` and `ManualTestClock` (E00-24); the loopback no-echo test wires
          the real clipboard feature and a real TandemSession over `InMemoryConnectionPair`
          (E00-25) to a test peer.
        acceptance:
          - Re-detecting a just-written received clip sends nothing back
          - A different local change after a receive is sent at the next poll
          - 'Received A, then local B sent, then local A again: A is sent'
          - 'Loopback: a peer that sends one ClipboardText receives 0 CLIPBOARD frames back within 5 s of virtual time'
        tdd:
          - "unit: macLoopGuard_receivedClipRedetected_notSent"
          - "unit: macLoopGuard_newContentAfterReceive_sentAtNextPoll"
          - "unit: macLoopGuard_receivedAThenLocalBThenLocalA_aSent"
          - "integration: clipboardLoopback_peerSendsOneClip_zeroClipboardFramesEchoedIn5s"
