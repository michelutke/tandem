        description: |
          Session-facing `NotificationSink` between the listener (E30-02) and TandemSession.
          While the session is not Connected, hold NotificationPosted in memory only, per the
          SPEC policy (E30-01): at most 50 entries, entries older than 60 s evicted, oldest
          dropped first; flush oldest-first on Connected. A dismiss for a buffered key removes it
