        type: story
        platforms: [android]
        priority: P0
        size: M
        prd: [F-5.4]
        use_cases: [UC-08, UC-11]
        invariants: []
        depends_on: [E30-02, E30-04, E00-20, E00-21, E00-22]
        description: |
          Notifications marked VISIBILITY_SECRET forward only the app name unless the user opts
          in to "Show content of secret notifications on Mac" in phone settings (default off);
          add the opt-in toggle. Redacted form: title replaced by the app name, text empty,
