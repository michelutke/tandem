phase: 3
epics:
  - id: E30
    title: Notification mirroring, actions, replies, dismiss sync
    labels: [area:notifications]
    prd: [F-5.1, F-5.2, F-5.3, F-5.4]
    use_cases: [UC-08, UC-09, UC-10, UC-11]
    summary: |
      Mirror Android notifications to the Mac with app identity, icons, and conversation
      sender names; let the user act on or reply to them from the Mac; keep dismissal and
      lock-screen privacy in sync both ways. Exit test: reply to a WhatsApp and a Signal
      notification from the Mac.
    scope:
      - NOTIFY channel protocol
      - NotificationListenerService capture and default filtering
      - Per-app allow/deny UI
      - Icon extraction, send-once-per-version, Mac cache
      - Mac presentation (categories, actions, text input)
      - Action/reply forwarding via PendingIntent
      - Dismiss sync
      - VISIBILITY_SECRET / lock-screen content hiding
      - Rate limiting and update coalescing
      - "Disconnected buffer: memory only, <= 50 entries, <= 60 s, drop-oldest (E30-16)."
      - "Cycle-4 caps and sanitization: title <= 256, text <= 4096, <= 25 senders of <= 64 chars, icon PNG <= 64 KiB and <= 256 x 256 px, replyText <= 4096; every string through E14-22; RemoteInput fill-in carries only result keys."
      - "Unpair purges cached icons and delivered notifications (PeerDataPurgeRegistry, E14-13)."
      - "Notification latency harness (E30-14)."
    out_of_scope:
      - Clipboard (E31)
      - Any non-notification channel
    exit_criteria:
      - Replying to a WhatsApp notification from the Mac delivers the reply in WhatsApp
      - Replying to a Signal notification from the Mac delivers the reply in Signal
      - Dismissing a notification on either side removes it on the other within 1 s
      - No notification text or secrets appear in release-build logs (invariant 7)
      - "Android-post to Mac-presentation p95 < 500 ms over 200 notifications on the same Wi-Fi (E30-14)."
      - "Phase 3 start: the companion test app (E00-22, lands this phase) builds in CI and is installed on the managed devices before instrumented tests run."
    issues:
      - id: E30-01
        title: "[protocol] notify.proto: posted/action/dismiss/icon messages"
        type: task
        platforms: [protocol]
        priority: P0
        size: M
        prd: [F-5.1, F-5.2, F-5.3, F-5.4]
        use_cases: [UC-08, UC-09, UC-10, AC-14, AC-19]
        invariants: [7]
        depends_on: [E01-05, E01-10, E01-14, E01-16, E15-01, E15-02, E01-22, E01-23]
        description: |
          Define `NotificationPosted{key, packageName, appVersionCode, title, text,
          messagingStyleSenders, visibility, hasIcon}`, `IconData{packageName, versionCode,
          pngBytes}`, `NotificationAction{key, actionIndex, replyText}`,
          `NotificationDismiss{key, origin}` on the NOTIFY channel. Document in SPEC.md,
          including the default filter list and VISIBILITY_SECRET handling. Provide vectors for
          a MessagingStyle-bearing post and an action with a reply. Vectors run through the
          Kotlin and Swift conformance runners (E15-01, E15-02).
          Cycle 4: SPEC.md NOTIFY section restates the E01-22 caps (title <= 256, text <= 4096 characters, <= 25 senders of <= 64 characters, icon PNG <= 64 KiB and <= 256 x 256 px, replyText <= 4096) and the E01-23 display sanitization of every string field.
        acceptance:
          - notify.proto covers posted/icon/action/dismiss/actionResult messages and `buf lint`
            reports zero findings
          - SPEC.md documents NOTIFY channel semantics, the default filter list (E30-03), and
            secret-visibility handling (title = app name, text empty, senders empty; E30-11)
          - Vectors cover a MessagingStyle post with 3 senders, a reply action, a dismiss with
            origin macos, an IconData, and a NotificationActionResult with status GONE
          - "notify.proto also defines NotificationActionResult{key, status: OK|GONE|FAILED} so the Mac can report \"no longer available\" (UC-09 alternate)."
          - "SPEC.md states the disconnected-phone buffer policy: at most 50 notifications, max age 60 s, oldest dropped first, nothing persisted to disk (UC-08 alternate; implemented in E30-16)."
          - "SPEC.md NOTIFY section states the E01-22 caps and E01-23 sanitization for every string field."
        tdd:
          - "ci: notifyProto_bufLint_zeroFindings"
          - "conformance: notificationPostedVector_messagingStyleThreeSenders_roundTripsOnBothCodecs"
          - "conformance: notificationActionVector_withReplyText_roundTripsOnBothCodecs"
          - "conformance: notificationDismissVector_originMacos_roundTripsOnBothCodecs"
          - "conformance: iconDataVector_pngBytes_roundTripsOnBothCodecs"
          - "conformance: notificationActionResultVector_statusGone_roundTripsOnBothCodecs"
      - id: E30-02
        title: "[android] NotificationListenerService capture and mapping"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-5.1]
        use_cases: [UC-08]
        invariants: [7]
        depends_on: [E30-01, E00-20, E00-21, E00-22, E00-28]
        description: |
          Implement NotificationListenerService; on onNotificationPosted/Removed, extract app
          name, package, version, title, text, and MessagingStyle sender names when present, and
          emit NotificationPosted/NotificationDismiss to a `NotificationSink` (session-facing
          sink with disconnected buffering is E30-16). Raw notification text must never be
          written to logcat in release builds (E00-17 lint rule applies to this module).
          The StatusBarNotification → NotificationPosted mapper is a plain function tested under
          Robolectric (E00-20); the real listener binding is tested on the emulator (E00-21)
          against notifications posted by the companion app `dev.tandem.companion` (E00-22,
          kinds `plain` and `messagingGroup`).
        acceptance:
          - A plain notification maps to NotificationPosted with packageName, appVersionCode,
            title, and text equal to the source notification
          - A MessagingStyle notification with 3 senders maps with messagingStyleSenders equal
            to the 3 sender names in message order
          - 'onNotificationRemoved emits NotificationDismiss{key, origin: android} for the same key'
          - With notification access granted on the emulator, a companion-app post is captured
            within 2 s
          - Release build logs never contain notification title or text (static E00-17 lint;
            runtime log-audit in E30-13)
          - "The merged manifest declares the listener service with `android:permission=\"android.permission.BIND_NOTIFICATION_LISTENER_SERVICE\"` (E00-28 allowlist)."
        tdd:
          - "unit: notificationMapper_plainStatusBarNotification_mapsPackageVersionTitleText"
          - "unit: notificationMapper_messagingStyleThreeSenders_preservesSenderNamesInOrder"
          - "unit: notificationMapper_removedCallback_emitsDismissWithOriginAndroid"
          - "instrumented: listenerService_companionPlainPost_capturedWithCompanionPackageWithin2s"
          - "instrumented: listenerService_companionMessagingGroupThreeSenders_capturedWithThreeSenders"
          - "ci: mergedManifest_notificationListener_requiresBindNotificationListenerPermission"
        notes: |
          Buffer-while-disconnected moved to E30-16 in review cycle 3.
      - id: E30-03
        title: "[android] Default notification filter"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-5.1]
        use_cases: [UC-08]
        invariants: []
        depends_on: [E30-02, E00-20]
        description: |
          Apply a default filter before forwarding: exclude Tandem's own notifications and a
          documented system-noise package list (system UI media/volume/USB/foreground-service
          notifications). Filter is evaluated per posted notification. Tests build
          StatusBarNotification instances under Robolectric (E00-20).
        acceptance:
          - Tandem's own notifications are never forwarded
          - Each package on the documented system-noise list is never forwarded by default
          - A notification from any other app is forwarded by default
          - "The system-noise rule set is exactly: (1) Tandem's own package; (2) packages `android` and `com.android.systemui`; (3) notifications with FLAG_FOREGROUND_SERVICE from any app; (4) group-summary notifications (children still forwarded); (5) MediaStyle notifications (media control is F-10.1). The list is checked in as android/feature/notifications/SYSTEM_NOISE.md and referenced from the SPEC NOTIFY section (E30-01)."
        tdd:
          - "unit: defaultFilter_ownPackage_dropped"
          - "unit: defaultFilter_packageComAndroidSystemui_dropped"
          - "unit: defaultFilter_packageAndroid_dropped"
          - "unit: defaultFilter_ordinaryAppPlainPost_forwarded"
          - "unit: defaultFilter_foregroundServiceFlag_dropped"
          - "unit: defaultFilter_groupSummaryWithTwoChildren_summaryDroppedChildrenForwarded"
          - "unit: defaultFilter_mediaStyleTemplate_dropped"
      - id: E30-04
        title: "[android] Per-app allow/deny settings"
        type: story
        platforms: [android]
        priority: P0
        size: M
        prd: [F-5.1]
        use_cases: [UC-11]
        invariants: []
        depends_on: [E30-03, E00-20, E12-11]
        description: |
          Settings screen listing installed apps with a per-app Allow/Deny toggle, persisted in
          DataStore, overriding the default filter. Installed apps come from an
          `InstalledAppsSource` over PackageManager (fake in test fixtures); the reconnect-free
          check uses `FakeTandemSession` (E12-11); the screen is a Compose `ui:` test under
          Robolectric (E00-20).
        acceptance:
          - Toggling an app to Deny drops the next notification from it
          - Toggling to Allow overrides a default-deny (for example re-enabling a system-noise
            package)
          - The setting persists across an app restart
          - A toggle applies to the next notification without a session reconnect (UC-11)
          - The screen lists every app returned by InstalledAppsSource with its current state
        tdd:
          - "unit: perAppFilter_denyToggled_nextNotificationDropped"
          - "unit: perAppFilter_allowOnSystemNoisePackage_nextNotificationForwarded"
          - "unit: perAppFilter_newInstanceOverSameDataStore_denyPersisted"
          - "unit: perAppFilter_denyToggledWhileConnected_appliesWithZeroReconnects"
          - "ui: perAppFilterScreen_threeInstalledApps_rendersThreeRowsWithToggleState"
        notes: |
          Decision: the allow/deny list is managed on the phone only. Android owns the
          notification-access permission and the authoritative installed-app list; the Mac
          does not display or edit the allow list in v1, rather than duplicating editable state
          that could diverge.
      - id: E30-05
        title: "[android] Icon extraction, send once per version"
        type: task
        platforms: [android]
        priority: P1
        size: M
        prd: [F-5.1]
        use_cases: [UC-08]
        invariants: []
        depends_on: [E30-02, E00-20]
        description: |
          Extract the app icon bitmap on the first notification from a package+versionCode not
          yet recorded as sent, encode as PNG, send IconData, and record it locally so later
          notifications from the same package+version omit the icon. PackageManager/Drawable
          access runs under Robolectric (E00-20).
        acceptance:
          - The first notification from a new package+version sends IconData exactly once
          - Subsequent notifications from the same package+version never resend the icon
          - An app update (new versionCode) triggers a fresh icon send
          - The sent-record survives an app restart (no resend after restart)
          - IconData.pngBytes starts with the 8-byte PNG signature
        tdd:
          - "unit: iconSender_firstNotificationForPackageVersion_sendsOneIconData"
          - "unit: iconSender_fiveNotificationsSameVersion_iconDataSentOnce"
          - "unit: iconSender_versionCodeIncremented_sendsNewIconData"
          - "unit: iconSender_recordReloadedAfterRestart_iconNotResent"
          - "unit: iconEncoder_adaptiveIconDrawable_bytesStartWithPngSignature"
