      - id: E30-09
        title: "[android] Fire PendingIntent from received NotificationAction"
        type: story
        platforms: [android]
        priority: P0
        size: M
        prd: [F-5.2]
        use_cases: [UC-09, AC-19]
        invariants: []
        depends_on: [E30-01, E30-02, E20-02, E12-11, E00-20, E00-21, E00-22]
        description: |
          On receiving NotificationAction, look up the original notification's action/
          PendingIntent by key and actionIndex and fire it, attaching a RemoteInput bundle with
          replyText when present. Unit tests run under Robolectric (E00-20; shadowed
          PendingIntent records the fill-in intent) with `FakeTandemSession` (E12-11); the
          emulator test (E00-21) replies to the companion app's `actions` kind (E00-22) and
          reads the recorded reply text back through its ContentProvider.
        acceptance:
          - A received action fires the corresponding PendingIntent
          - A received reply fires the PendingIntent with a fill-in intent whose RemoteInput
            results contain replyText under the action's result key
          - An action referencing an already-dismissed or expired notification key does not
            throw and fires nothing
          - Every received NotificationAction is answered with NotificationActionResult (OK, GONE for an unknown/expired key, FAILED if the PendingIntent throws CanceledException).
          - "The fill-in intent carries only the RemoteInput results for the action result keys (no other extras from the Mac); replyText over 4096 characters is answered FAILED without sending the PendingIntent."
        tdd:
          - "unit: actionExecutor_plainActionIndexZero_sendsPendingIntentOfActionZero"
          - "unit: actionExecutor_replyText_fillInIntentCarriesRemoteInputResult"
          - "unit: actionExecutor_validAction_repliesResultOk"
          - "unit: actionExecutor_unknownKey_repliesResultGoneWithoutThrowing"
          - "unit: actionExecutor_pendingIntentCanceled_repliesResultFailed"
          - "instrumented: actionExecutor_companionActionsKindReply_companionRecordsReplyText"
          - "unit: actionExecutor_replyOver4096Chars_repliesFailedWithoutSending"
          - "unit: actionExecutor_fillInIntent_containsOnlyRemoteInputResults"
      - id: E30-10
        title: "[android] Dismiss sync: forward phone dismissals, apply Mac dismissals"
        type: story
        platforms: [android]
        priority: P0
        size: S
        prd: [F-5.3]
        use_cases: [UC-10]
        invariants: []
        depends_on: [E30-02, E12-11, E00-20, E00-21, E00-22]
        description: |
          Dismissing on Android forwards NotificationDismiss{origin: android}. A received
          NotificationDismiss{origin: macos} cancels the local notification via
          NotificationListenerService.cancelNotification. The resulting onNotificationRemoved
          with reason REASON_LISTENER_CANCEL is not forwarded, preventing an echo loop. Tests use
          Robolectric (E00-20) with `FakeTandemSession` (E12-11); the emulator test cancels a
          companion-app notification (E00-22, kind `cancel`). The Mac half is E30-18; the
          end-to-end < 1 s check is the manual gate in E30-13.
        acceptance:
          - 'A user dismissal on Android sends NotificationDismiss{key, origin: android} with no added delay (no timer between callback and send)'
          - A received macos-origin dismiss calls cancelNotification with the same key
          - A removal with reason REASON_LISTENER_CANCEL sends no NotificationDismiss
        tdd:
          - "unit: androidDismissSync_removedReasonCancel_sendsDismissOriginAndroid"
          - "unit: androidDismissSync_macOriginDismissReceived_callsCancelNotificationWithKey"
          - "unit: androidDismissSync_removedReasonListenerCancel_sendsNoDismiss"
          - "instrumented: androidDismissSync_companionCancelKind_emitsDismissForCompanionKey"
        notes: |
          Split from E30-10 ([cross]) in review cycle 3; the macOS half is E30-18. Size M → S.
