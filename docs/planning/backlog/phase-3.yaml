          - With opt-in enabled, the same notification forwards original title and text
          - Toggling opt-in off redacts the very next notification (no reconnect)
          - The toggle is off by default and labelled "Show content of secret notifications on Mac"
        tdd:
          - "unit: secretVisibility_defaultOptOut_titleIsAppNameAndTextEmpty"
          - "unit: secretVisibility_defaultOptOutMessagingStyle_sendersListEmpty"
          - "unit: secretVisibility_optedIn_forwardsOriginalTitleAndText"
          - "unit: secretVisibility_optInToggledOff_nextPostRedacted"
          - "ui: secretVisibilitySetting_freshInstall_toggleOffWithExactLabel"
          - "instrumented: secretVisibility_companionSecretKind_capturedPayloadHasEmptyText"
      - id: E30-12
        title: "[android] Rate limiting and coalescing of rapid updates"
        type: task
        platforms: [android]
        priority: P1
        size: S
        prd: [F-5.1]
        use_cases: [UC-08]
        invariants: []
        depends_on: [E30-02, E00-18, E00-21, E00-22]
        description: |
          When the same notification key updates rapidly (for example progress notifications),
          coalesce forwarded updates to a bounded rate (at most one per 500 ms per key) on the
          sending side, always delivering the final state. The coalescer takes an injected
          `Clock`/dispatcher (E00-18) so the 500 ms window is tested in virtual time; the Mac
          already replaces same-key updates (E30-07). The emulator test uses the companion
          app's `burst` kind (E00-22).
        acceptance:
          - 10 updates to the same key within 1 s forward at most 3 messages, the last carrying
            update 10's content
          - A single, non-rapid update is forwarded at virtual time 0 (no added latency)
          - Two keys updating concurrently are rate limited independently
          - A pending coalesced update for a key removed before the window elapses is never sent
        tdd:
          - "unit: updateCoalescer_tenUpdatesIn1sSameKey_atMostThreeForwardedEndingWithTenth"
          - "unit: updateCoalescer_singleUpdate_forwardedAtVirtualTimeZero"
          - "unit: updateCoalescer_twoKeysInterleaved_eachKeyLimitedIndependently"
          - "unit: updateCoalescer_pendingUpdateThenRemoved_pendingNeverSent"
          - "instrumented: updateCoalescer_companionBurst50In1000ms_atMostFourForwardedLastIsFinal"
        notes: |
          Review cycle 3: was [cross]; coalescing is sender-side only (Android), so platforms
          reduced to android, E30-07 dependency dropped, size M → S.
      - id: E30-13
        title: "[cross] Phase 3 notification exit test"
        type: test
        platforms: [android, macos]
        priority: P0
        size: M
        prd: [F-5.1, F-5.2, F-5.3, F-5.4]
        use_cases: [UC-08, UC-09, UC-10, AC-02, AC-10]
        invariants: [7]
        depends_on: [E30-08, E30-09, E30-10, E30-18, E30-11, E15-17, E15-07, E00-22, E00-23]
        description: |
          Device-level gate (procedure in docs/testing/manual-gates.md, E00-23): receive a
          message in WhatsApp and in Signal, reply to each from the Mac, confirm delivery in the
          origin app; dismiss from each side and confirm sync. Security run: the companion app
          (E00-22) posts a `canary` kind notification (`TANDEM-CANARY-<nonce>`) during the E15-07
          canary procedure; the capture must not contain it (E15-06) and log-audit (E15-17) over
          logcat and the macOS unified log must find zero hits (invariant 7, AC-10).
        acceptance:
          - 5 of 5 WhatsApp replies sent from the Mac arrive at the WhatsApp contact within 10 s
          - 5 of 5 Signal replies sent from the Mac arrive at the Signal contact within 10 s
          - 10 of 10 dismissals in each direction remove the peer notification within 1 s
          - pcap-audit canary scan of the run finds zero occurrences of the notification canary
          - log-audit over both apps' logs for the run finds zero occurrences of the canary or
            any reply text
        tdd:
          - "manual: whatsAppReplyFromMac_physicalPhone_fiveOfFiveDeliveredWithin10s"
          - "manual: signalReplyFromMac_physicalPhone_fiveOfFiveDeliveredWithin10s"
          - "manual: dismissSyncBothWays_physicalDevices_tenOfTenUnder1s"
          - "security: pcapCanary_companionCanaryNotification_absentFromCapture"
          - "security: logAudit_companionCanaryNotificationSession_zeroHitsInBothLogs"
      - id: E30-14
        title: "[tools] Notification latency harness: Android to Mac p95 < 500 ms"
        type: test
        platforms: [android, macos, tools]
        priority: P0
        size: M
        prd: [F-5.1]
        use_cases: [UC-08]
        invariants: [7]
        depends_on: [E30-02, E30-07, E20-02, E00-22, E00-23, E15-15]
        description: |
          PRD success metric and Phase 3 checklist item "notification p95 latency < 500 ms" had no
          measuring issue. The companion app (E00-22, not Tandem, whose own notifications are
          filtered) posts 200 notifications; latency = Mac presentation time minus
          StatusBarNotification.postTime, corrected by a clock offset measured at session start (same
          method as E61-08). Notification text carries only a sequence number. Manual device gate on
          same Wi-Fi (E00-23); report committed per run. An `integration:` loopback variant uses the
          E15-15 JVM client to send 200 NotificationPosted frames to the real Mac server built with
          the DEBUG `RecordingNotificationPresenter` (E30-07), timestamping each `add` call.
