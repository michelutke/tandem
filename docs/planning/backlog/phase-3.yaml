        type: task
        platforms: [macos]
        priority: P0
        size: S
        prd: [F-6.2]
        use_cases: [UC-13]
        invariants: []
        depends_on: [E31-01, E31-02, E12-12]
        description: |
          UC-13 main flow had no owner: on receiving ClipboardText from the phone, write the text
          to the pasteboard as `public.utf8-plain-text` via `PasteboardSource.setString`
          (E31-02) and hand the resulting changeCount to the loop guard (E31-14). Received text
          over 1,048,576 bytes is rejected, not written. Tests use `FakePasteboardSource` and the
