  - id: E31
    title: Clipboard sync
    labels: [area:clipboard]
    prd: [F-6.1, F-6.2, F-6.3, F-4.2]
    use_cases: [UC-12, UC-13]
    summary: |
      Sync clipboard text Mac to phone by polling NSPasteboard, and phone to Mac through the
      entry points Android 10+ allows in the background. Skip anything the source app marked
      concealed or transient, prevent echo loops, and cap size at 1 MiB.
    scope:
      - CLIPBOARD channel protocol
      - macOS pasteboard polling and concealed/transient skip
      - Android write with sensitive flag
      - Android entry points (share target, QS tile, PROCESS_TEXT, foreground app)
      - macOS write of received text to NSPasteboard
      - Loop prevention and size limit
      - ADR for accessibility-based auto-capture
      - "Sensitive handling: phone clips with EXTRA_IS_SENSITIVE are never auto-sent on focus; received sensitive clips are written on the Mac with ConcealedType + TransientType markers; AutoGeneratedType is also skipped (E31-03, E31-07, E31-13)."
      - "Push Clipboard quick action (E31-11)."
    out_of_scope:
      - Image/file clipboard content (use file transfer, E40)
      - Accessibility auto-capture implementation (only the ADR, off by default)
    exit_criteria:
      - No clipboard echo loops occur across a round trip in either direction
      - A concealed pasteboard item (password manager) never leaves the Mac
      - Clipboard text over 1 MiB is rejected, not silently truncated
      - "A clip sent with sensitive=true is written on the Mac with ConcealedType and TransientType markers (E31-13)."
    issues:
      - id: E31-01
        title: "[protocol] clipboard.proto: ClipboardText message"
        type: task
        platforms: [protocol]
        priority: P0
        size: S
        prd: [F-6.1, F-6.2, F-6.3]
        use_cases: [UC-12, UC-13]
        invariants: []
        depends_on: [E01-05, E01-10, E01-14, E01-16, E15-01, E15-02]
        description: |
          Define `ClipboardText{originTag, contentHash, text, sensitive}` on CLIPBOARD. Document
          the 1 MiB limit (1,048,576 bytes of UTF-8 text), the contentHash definition, the
          origin-tag/hash loop-prevention rule, and sensitive-flag semantics in SPEC.md. Provide
          vectors including an oversized-text rejection case, run by the Kotlin and Swift
          conformance runners (E15-01, E15-02).
        acceptance:
          - clipboard.proto passes `buf lint` with zero findings
          - SPEC.md documents the 1 MiB limit, the contentHash algorithm, loop prevention, and the
            sensitive flag
          - Vectors include a valid sensitive ClipboardText, a text of exactly 1,048,576 bytes
            (accepted), and one of 1,048,577 bytes (rejected)
        tdd:
          - "ci: clipboardProto_bufLint_zeroFindings"
          - "conformance: clipboardTextVector_sensitiveTrue_roundTripsOnBothCodecs"
          - "conformance: clipboardTextVector_exactly1MiB_acceptedByBothCodecs"
          - "conformance: clipboardTextVector_oneByteOver1MiB_rejectedByBothCodecs"
