      - id: E20-10
        title: "[macos] Sleep/wake handling via NSWorkspace"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.4]
        use_cases: [UC-04]
        invariants: []
        depends_on: [E12-01, E12-09, E00-08, E00-24]
        description: |
          Observe NSWorkspace.willSleepNotification / didWakeNotification. On sleep, stop accepting
          on the listener and cancel open connections cleanly (E12-09 state Disconnected, no crash);
          on wake, restart the listener promptly and expect the phone to reconnect.
          Seams: a `SystemPowerEvents` protocol (AsyncStream of willSleep/didWake) with the
          production adapter over an injected `NSWorkspace.shared.notificationCenter` and a
          recording fake; a `ListenerControl` protocol over the E12-01 listener; the 1 s bound is
          measured with `ManualTestClock` (E00-24). E22-08 reuses `SystemPowerEvents`.
        acceptance:
          - willSleep stops the listener and moves every open connection to Disconnected without a crash or leaked connection
          - didWake restarts the listener, reaching ready within 1 s
          - didWake without a prior willSleep does not create a second listener
          - The NSWorkspace adapter emits didWake when didWakeNotification is posted on the injected notification center
        tdd:
          - "unit: sleepWakeController_willSleep_listenerStoppedAndConnectionsDisconnected"
          - "unit: sleepWakeController_didWake_listenerReadyWithin1s"
          - "unit: sleepWakeController_didWakeWithoutSleep_noDuplicateListener"
          - "unit: workspacePowerEvents_didWakeNotificationPosted_emitsDidWake"
