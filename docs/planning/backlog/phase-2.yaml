        invariants: [4]
        depends_on: [E01-08, E00-18, E00-21, E00-23]
        description: |
          Browse for `_tandem._tcp` via NsdManager and resolve service instances to host/port/TXT
          records, retrying transient resolve failures with backoff (API < 34 resolves one service
          at a time; FAILURE_ALREADY_ACTIVE is treated as transient). Browsing opens no listening
