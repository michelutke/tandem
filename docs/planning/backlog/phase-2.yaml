          Seams: a `ServiceDiscovery` interface (Flow of found/resolved/lost) with a scripted fake;
          retry backoff in virtual time via `TestClock` (E00-18); the NsdManager adapter runs on
          the emulator (E00-21) against a service the test registers itself; a real Mac on Wi-Fi is
          a manual gate (E00-23).
        acceptance:
          - A found service is resolved to host, port and TXT and emitted as a candidate
          - Two transient resolve failures followed by success emit the resolved service after the backoff waits; exhausting retries leaves the browse session active
          - A lost service is removed from the candidate set
          - "Manual gate: a real Mac on the same Wi-Fi is resolved within 3 s of browse start"
        tdd:
          - "unit: nsdBrowser_resolveFailsTwiceThenSucceeds_emitsResolvedAfterBackoff"
          - "unit: nsdBrowser_resolveRetriesExhausted_browseSessionStaysActive"
          - "unit: nsdBrowser_serviceLost_removedFromCandidates"
          - "instrumented: nsdManager_selfRegisteredTandemService_resolvedWithTxt"
          - "manual: nsdBrowse_realMacSameWifi_resolvedWithin3s"
      - id: E21-05
        title: "[android] Recognize paired Macs from rotating id"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-3.5]
        use_cases: [UC-04, AC-05]
        invariants: [3]
        depends_on: [E21-04, E13-02, E01-20, E00-18, E15-01]
        description: |
          For each resolved service, compute the expected rotating id (dayIndex-1..+1) for every
          paired Mac's stored SPKI fingerprint and match against the advertised id. Unmatched or
          malformed services are ignored. A match only yields a candidate address for E20-06; an
          attacker replaying a paired Mac's current id does match, which is why E21-06 relies on the
          pin check, not on recognition.
          Seams: the Kotlin rotating-id function is checked against the E01-20 vectors by the
          Kotlin conformance runner (E15-01); the matcher takes an injected `java.time.Clock`
          (E00-18) so UTC day boundary, device time zone and +/-1 day skew are tested with
          `TestClock`.
        acceptance:
          - The Kotlin rotating-id implementation matches every E01-20 vector
          - Ids for dayIndex-1, dayIndex and dayIndex+1 match; dayIndex+/-2 do not
          - An unpaired Mac's id or a random id never matches; a malformed id (wrong length, non-hex) is ignored without an exception
          - dayIndex is computed in UTC regardless of device time zone
        tdd:
          - "conformance: rotatingIdVectors_kotlinCodec_matchesExpectedIds"
          - "unit: pairedMacMatcher_idForDayMinus1_matched"
          - "unit: pairedMacMatcher_idForDayPlus2_notMatched"
          - "unit: pairedMacMatcher_unpairedMacId_notMatched"
          - "unit: pairedMacMatcher_malformedId_ignoredWithoutException"
          - "unit: pairedMacMatcher_timeZoneUtcPlus14_usesUtcDayIndex"
      - id: E21-06
        title: "[cross] Discovery is a hint, never a trust decision"
        type: test
        platforms: [android]
        priority: P0
        size: S
        prd: [F-3.1, F-3.5]
        use_cases: [AC-04, UC-04]
        invariants: [1, 3]
        depends_on: [E21-05, E20-06, E15-08, E15-10, E15-15]
        description: |
          Enforce and test that a discovery match only supplies a candidate address to the
          reconnect strategy (E20-06); the mTLS handshake and fingerprint pin check always run
          independently, and discovery data can never mark a peer trusted or skip verification.
          Harnesses: mitm-lab (E15-08/E15-10) runs an impostor that replays the paired Mac's
          current TXT id with a different certificate; the E15-15 harness runs the JVM client
          against a localhost server with a wrong key at a resolved address; a lint rule forbids
          the discovery module from calling trust-store write or verifier APIs. Only the Android
          side consumes discovery, so the Mac has no work here (title kept for external references).
        acceptance:
          - A spoofed advertisement carrying the paired Mac's valid rotating id but a different key fails the pin check, and pcap shows zero application bytes sent to it
          - A discovery candidate pointing at a server with an unknown certificate fails the handshake with PinMismatch
          - A lint fixture in which the discovery module calls a trust-store write or verifier-bypass API is reported as a violation
        tdd:
          - "security: spoofedAdvertisement_validIdWrongKey_pinCheckFailsNoAppData"
          - "integration: discoveryCandidate_serverWithUnknownCert_handshakeFailsPinMismatch"
          - "ci: discoveryTrustBoundaryLint_fixtureCallingTrustStoreWrite_reportsViolation"
        notes: |
          Review cycle 3: platforms narrowed to [android] (the Mac only advertises). The old
          acceptance "spoofed TXT never treated as a match" was not achievable for a replayed
          current id; E21-05 now states that such a replay matches and this issue proves the pin
          check still fails closed.
      - id: E21-07
        title: "[cross] Rotating id recognition across day boundary and skew"
        type: test
        platforms: [android, macos]
        priority: P1
        size: S
        prd: [F-3.5]
        use_cases: [AC-05]
        invariants: [3]
        depends_on: [E01-20, E21-02, E21-05, E15-03, E15-15]
        description: |
          Cross-platform test asserting a Mac advertising near midnight UTC and a phone with a
          clock a few minutes off in either direction still recognize each other, and that
          recognition stops outside the +/-1 day window. Vectors run on both codecs via
          tools/conformance (E15-03); the cross-platform case runs on the E15-15 harness with the
          Mac server's `DateProvider` pinned (DEBUG harness hook) and the JVM matcher on a
          `TestClock`.
        acceptance:
          - Skew vectors for dayIndex+/-1 are recognized and dayIndex+/-2 rejected on both codecs
          - Mac at 23:59:59 UTC and phone at 00:05:00 UTC the next day recognize each other
          - Phone clock 2 days ahead of the Mac does not recognize it
        tdd:
          - "conformance: rotatingIdSkewVectors_plusMinusOneDay_recognizedOnBothCodecs"
          - "conformance: rotatingIdSkewVectors_plusMinusTwoDays_rejectedOnBothCodecs"
          - "integration: rotatingIdCrossPlatform_macAt235959PhonePlus5min_recognized"
          - "integration: rotatingIdCrossPlatform_phoneClockPlus2Days_notRecognized"

