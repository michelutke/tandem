          - "manual: reconnectMacWake_twentyTrials_p95Under5s"
          - "manual: overnightDoze8h_fgsUnrestrictedBattery_reconnectWithin5sOfWake"
          - "manual: adbForceIdle10min_unforceAndScreenOn_connectedWithin5s"
      - id: E20-13
        title: "[docs] ADR: Mac-initiated reconnect hint (PRD Appendix C.3)"
        type: adr
        platforms: [docs]
        priority: P1
        size: S
        prd: [F-3.4, F-4.1]
        use_cases: [UC-04]
        invariants: [1, 4]
        depends_on: [E20-12, E02-03, E20-03]
        description: |
          Resolves Appendix C.3: should the Mac be able to trigger a reconnect (e.g. via Bluetooth LE)?
          Options: (a) no, rely on the FGS, network callbacks (E20-07), Mac-driven heartbeats and
          backoff (plus CDM presence only if the E20-03 spike is go); (b) the Mac emits a BLE
          advertisement (rotating, unlinkable across days like F-3.5) that the phone observes via
          CDM/BLE scan and answers by dialing the Mac itself — the phone stays the only dialer;
          (c) any phone-side GATT server or other inbound channel — rejected up front as equivalent
          to a phone listener (invariant 4). BLE never carries application data or keys
          (invariant 1). Decision is data-driven: if E20-12 meets reconnect < 5 s p95 after Mac wake
          and the overnight Doze gate passes, v1 ships (a) and (b) is recorded as a v2 option. The
          E20-03 findings on BLE cost/privacy feed option (b).
        acceptance:
          - ADR in docs/adr/ records options (a)-(c), rejects (c) citing invariant 4, and states that BLE carries no application data or stable identifiers
          - The decision cites E20-12's measured Mac-wake reconnect p95 and overnight Doze result, and the E20-03 go/no-go
          - If (b) is accepted, follow-up issues are filed in E72 before Phase 7 starts
