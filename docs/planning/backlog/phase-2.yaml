phase: 2
epics:
  - id: E20
    title: Android connection lifecycle (foreground service, heartbeat, reconnect)
    labels: [area:lifecycle]
    prd: [F-3.4, F-4.1]
    use_cases: [UC-02, UC-04, UC-05]
    summary: |
      Keep the phone's control connection alive across app kills, OEM battery policies, Doze,
      reboots, and network changes, and keep the Mac side resilient to sleep/wake and interface
      changes. Done means the phone reconnects to a woken or roaming Mac in under 5 s p95
      without user action, survives an overnight Doze cycle, and always shows accurate
      connection state.
    scope:
      - Android foreground service (connectedDevice type) hosting the control connection
      - CompanionDeviceManager feasibility spike (E20-03) and conditional association/presence (E20-16)
      - Unrestricted battery onboarding and OEM-specific guidance
      - "Heartbeat per E01-07: Mac drives liveness (E20-05), phone answers and detects a dead peer on elapsedRealtime (E20-15)"
      - Reconnect address strategy and exponential backoff, network-change triggered
      - BOOT_COMPLETED restart
      - macOS sleep/wake and network-change listener handling
      - Reconnect latency measurement harness and overnight Doze gate
      - Onboarding flow with skip paths (E20-14); ADR for a Mac-initiated reconnect hint (E20-13, Appendix C.3)
    out_of_scope:
      - Bonjour advertise/browse mechanics (E21)
      - Menu bar UI presentation of connection state (E22)
      - STATUS channel payloads (E23)
      - CDM presence as a phase-exit requirement (restart after kill is covered by FGS + BOOT_COMPLETED + reconnect; E20-16 is conditional on the E20-03 spike)
    exit_criteria:
      - Phone reconnects to Mac within 5 s p95 over >= 20 Wi-Fi switch trials (E20-12 manual gate reconnectWifiSwitch_twentyTrials_p95Under5s)
      - Phone reconnects within 5 s p95 over >= 20 Mac sleep/wake trials (E20-12 manual gate reconnectMacWake_twentyTrials_p95Under5s)
      - Over >= 8 h of Doze with the foreground service running, battery unrestricted and zero user interaction, every Mac-declared-dead episode is followed by a reconnect within 5 s of the next Doze maintenance window or screen-on (E20-12 manual gate overnightDoze8h_fgsUnrestrictedBattery_reconnectWithin5sOfWake)
      - Mac sends Heartbeat after 15 s without sending and marks the connection Dead after 45 s without receiving (E20-05); the phone answers every Heartbeat within 1 s, including under adb-forced idle (E20-15)
      - Foreground service is restarted by the system after process death (E20-02) and starts after reboot (E20-08), without relying on CompanionDeviceManager
    issues:
      - id: E20-01
        title: "[protocol] Heartbeat conformance vectors"
        type: task
        platforms: [protocol]
        priority: P0
        size: S
        prd: [F-3.4]
        use_cases: []
        invariants: []
        depends_on: [E01-12, E01-16, E15-01, E15-02]
        description: |
          The heartbeat timing contract (Mac drives liveness: Mac sends after 15 s without sending,
          dead after 45 s without receiving; phone replies within 1 s) is owned by the SPEC.md
          heartbeat section (E01-07) and the `Heartbeat` message by control.proto (E01-12); this
          issue does not redefine either. It adds encode/decode and malformed-input vectors for the
          heartbeat message under protocol/vectors/ so tools/conformance (E15-01 Kotlin, E15-02
          Swift) exercises it on both codecs before the lifecycle work (E20-05, E20-15) depends on it.
        acceptance:
          - No new message or SPEC timing text is introduced (E01-07/E01-12 remain the owners)
          - protocol/vectors/ includes at least one Heartbeat encode/decode vector and one truncated-frame vector
          - Both codecs produce byte-identical encodings for the encode vector and both reject the truncated vector with a decode error
        tdd:
          - "conformance: heartbeatVector_roundTrip_byteIdenticalOnBothCodecs"
          - "conformance: heartbeatVector_truncatedFrame_rejectedOnBothCodecs"
      - id: E20-02
        title: "[android] Foreground service (connectedDevice type)"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-4.1]
        use_cases: [UC-02, UC-04]
        invariants: [4]
        depends_on: [E12-08, E12-11, E13-02, E00-20, E00-21, E00-23]
        description: |
          Implement a foreground service with type `connectedDevice` (Android 14+ requirement),
          declaring `FOREGROUND_SERVICE_CONNECTED_DEVICE` and `CHANGE_NETWORK_STATE` (the Android 14
          runtime prerequisite for connectedDevice that does not require a CDM association) in the
          manifest. The service owns the control-connection lifecycle (E12-08 state machine, E12-11
          session) start/stop, returns START_STICKY, shows the mandatory ongoing notification, and
          starts only when a paired Mac exists (trust store, E13-02).
          Seams: the start/stop decision lives in a `ServiceStarter` that reads a paired-peer
          repository (E13-02 fake) so it is plain unit-tested; `onStartCommand` and the merged
          manifest are checked under Robolectric (E00-20); restart after process death runs on the
          emulator (E00-21); aggressive-OEM survival is a manual gate (E00-23).
        acceptance:
          - Merged manifest declares the service with foregroundServiceType="connectedDevice" and the FOREGROUND_SERVICE_CONNECTED_DEVICE and CHANGE_NETWORK_STATE permissions
          - With a paired Mac, app launch starts the service in the foreground with its ongoing notification; with no paired Mac the service is not started
          - Unpairing the last Mac stops the service and removes its notification
          - onStartCommand returns START_STICKY
          - After the app process is killed on the emulator (adb shell am kill after moving to background, or kill -9 under adb root), the system restarts the service within 15 s
          - "Manual gate: on the aggressive-battery OEM device from the device matrix with battery unrestricted, the service is still running and connected after 60 min screen-off"
        tdd:
          - "ci: mergedManifest_tandemService_declaresConnectedDeviceTypeAndPermissions"
          - "unit: serviceStarter_pairedMacExists_startsForegroundService"
          - "unit: serviceStarter_noPairedMac_doesNotStartService"
          - "unit: tandemService_lastMacUnpaired_stopsAndRemovesNotification"
          - "unit: tandemService_onStartCommand_returnsStartSticky"
          - "instrumented: tandemService_processKilled_restartedWithin15s"
          - "manual: oemBatteryKiller_screenOff60minUnrestricted_serviceStillConnected"
      - id: E20-03
        title: "Spike: CompanionDeviceManager association/presence feasibility for a Wi-Fi-only Mac peer"
        type: spike
        platforms: [android]
        priority: P0
        size: M
        prd: [F-4.1]
        use_cases: [UC-02, UC-04]
        invariants: [3, 4]
        depends_on: []
        description: |
          PRD F-4.1 assumes CDM presence observation can restart the service after a kill. That is
          not known to work for Tandem: presence observation (`startObservingDevicePresence`)
          targets BLE / associated devices in radio range, and self-managed associations (API 33+)
          require the app itself to report presence, so they cannot restart a killed app. The Mac
          is a Wi-Fi-only peer. This spike uses a throwaway prototype (not production code) on
          physical devices to decide whether CDM is worth building (E20-16).
        acceptance:
          - Findings doc docs/spikes/cdm-presence.md exists and answers each question below with evidence (device, API level, logs)
          - (a) Can presence observation restart the killed foreground service without the Mac advertising BLE, on API 31, 33, 34, 35 and 36?
          - (b) Does a (self-managed) association on its own grant useful exemptions (FGS start from background, REQUEST_COMPANION_RUN_IN_BACKGROUND / USE_DATA_IN_BACKGROUND, Doze allowlisting), and are they needed given unrestricted battery?
          - (c) Cost and privacy of Mac BLE advertising (new radio surface, trackability, battery) — flagged for the threat model (E02-01)
          - (d) Confirms a CDM association id/MAC address is never used as a trust input (invariant 3) and adds no phone-side listener (invariant 4)
          - Explicit go/no-go for E20-16 recorded at the top of the doc; no-go closes E20-16 as won't-do
        tdd: []
        notes: |
          Converted from a task to a spike in review cycle 3; the original implementation work
          (association, presence restart, disassociate on unpair) moved to E20-16. Phase exit does
          not require CDM presence.
