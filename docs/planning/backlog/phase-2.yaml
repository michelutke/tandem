  - id: E21
    title: Bonjour discovery with rotating ID
    labels: [area:discovery]
    prd: [F-3.5]
    use_cases: [UC-03, UC-04, AC-05]
    summary: |
      Let phones find a Mac on the local network without leaking a stable identifier to
      observers. The Mac advertises a rotating pseudonymous id derived from its long-term key;
      paired phones recognize it, strangers cannot correlate it across days. Discovery only
      supplies candidate addresses; it never substitutes for the mTLS fingerprint check.
    scope:
      - Platform implementations of the rotating discovery id (algorithm, TXT format and vectors are
        owned by SPEC E01-08 and vectors E01-20)
      - macOS Bonjour advertise (_tandem._tcp, TXT v=1 + rotating id)
      - macOS Local Network privacy entries
      - Android NsdManager browse/resolve and paired-Mac recognition
      - Enforcement that discovery never bypasses pinning
    out_of_scope:
      - Reconnect address ordering / backoff (E20)
      - Pairing address delivery via QR (earlier phase, E14)
    exit_criteria:
      - Both codecs match every E01-20 rotating-id vector, and the advertised TXT id and instance name change at the UTC day boundary (E21-02, E21-05)
      - Android recognizes a paired Mac's rotating id for dayIndex-1..+1 only, and a spoofed advertisement with the right id but wrong key fails the pin check with zero application bytes (E21-06)
      - macOS shows the Local Network permission prompt and advertises once granted; denial shows the in-app explanation (E21-03)
    issues:
      - id: E21-02
        title: "[macos] Advertise _tandem._tcp with rotating TXT id"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.5]
        use_cases: [UC-03, AC-05]
        invariants: [3]
        depends_on: [E01-08, E01-20, E12-01, E00-24, E15-02, E00-23, E20-10]
        description: |
          Advertise the control-connection port with TXT record `v=1` plus the rotating id computed
          per SPEC E01-08 (vectors E01-20), recomputed and re-advertised at each UTC day boundary
          without disrupting existing connections. The service instance name is derived from the
          rotating id. After Mac wake (E20-10) the advertisement is re-published with the id for the
          current UTC day (a Mac asleep across midnight must not advertise yesterday's id).
          Seams: the rotating-id function is checked against the E01-20 vectors by the Swift
          conformance runner (E15-02); the advertiser takes a `DateProvider` + `Clock<Duration>`
          (E00-24) so the 23:59:59 → 00:00:00 UTC boundary and non-UTC time zones are tested in
          virtual time; publication goes through a `BonjourPublisher` protocol (recording fake)
          over the NWListener service.
        acceptance:
          - The Swift rotating-id implementation matches every E01-20 vector
          - TXT contains exactly the keys v (value 1) and the rotating id, nothing else (AC-05)
          - Crossing 00:00:00 UTC republishes the new id within 1 s, and no open connection is cancelled by the refresh
          - dayIndex is computed in UTC regardless of the Mac's time zone
          - The instance name is derived from the rotating id and contains no Mac name, user name or other stable identifier (AC-05)
          - "Manual gate: dns-sd -B/-L before and after UTC midnight shows a changed TXT id and instance name"
        tdd:
          - "conformance: rotatingIdVectors_swiftCodec_matchesExpectedIds"
          - "unit: bonjourAdvertiser_start_txtHasOnlyVersionAndIdKeys"
          - "unit: bonjourAdvertiser_utcMidnightCrossed_republishesNewIdWithin1s"
          - "unit: bonjourAdvertiser_dayRefresh_existingConnectionsNotCancelled"
          - "unit: bonjourAdvertiser_timeZoneUtcPlus14_usesUtcDayIndex"
          - "unit: bonjourAdvertiser_instanceName_derivedFromRotatingIdOnly"
          - "manual: dnsSdBrowse_acrossUtcMidnight_txtIdAndInstanceNameChanged"
        notes: |
          Residual risk: the mDNS SRV/A records carry the Mac's OS hostname, which Tandem does not
          control. Record it in the threat model (E02-01) with the mitigation "rename the Mac's local
          hostname" documented in the README.
