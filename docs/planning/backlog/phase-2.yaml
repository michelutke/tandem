  - id: E23
    title: Device status and find my phone
    labels: [area:status]
    prd: [F-4.3, F-4.4]
    use_cases: [UC-05, UC-06]
    summary: |
      The phone reports battery, charging, network type, and signal on the STATUS channel so
      the Mac can show it at a glance, and the Mac can ring the phone at max volume (overriding
      DND) to help find it, with dismiss/stop from either side.
    scope:
      - status.proto messages and SPEC.md STATUS channel section
      - Android status observers and throttled publish
      - macOS status display
      - Ring/RingStop flow including DND override
    out_of_scope:
      - Menu bar scaffold itself (E22)
      - Reconnect/lifecycle mechanics (E20)
    exit_criteria:
      - A battery/network change outside the 60 s throttle window is shown on the Mac within 2 s (E23-08)
      - Ring is audible at max volume on a physical phone in silent mode with DND on, and stops within 1 s of Stop from the Mac or dismissal on the phone (E23-05, E23-08 manual gates)
    issues:
      - id: E23-01
        title: "[protocol] status.proto extension: RingStop, STATUS SPEC section, vectors"
        type: task
        platforms: [protocol]
        priority: P0
        size: S
        prd: [F-4.3, F-4.4]
        use_cases: [UC-05, UC-06]
        invariants: []
        depends_on: [E01-13, E01-16, E15-01, E15-02]
        description: |
          `DeviceStatus` and `Ring` already exist (E01-13); do not redefine them. Add
          `RingStop{origin}` (origin = mac | phone) on the STATUS channel. Document in SPEC.md:
          publish on change, at most one DeviceStatus per 60 s (leading send, latest values
          coalesced into one trailing send), no periodic send, one immediate DeviceStatus on
          session Ready. Provide encode/decode vectors run by the conformance runners
          (E15-01/E15-02).
        acceptance:
          - buf lint and buf breaking pass on status.proto (RingStop is additive)
          - SPEC.md documents the STATUS publish/throttle rule above and the Ring/RingStop flow in both directions
          - Vectors cover a full DeviceStatus and a Ring/RingStop pair; both codecs produce byte-identical encodings
        tdd:
          - "ci: statusProto_bufLintAndBreaking_exitZero"
          - "conformance: deviceStatusVector_roundTrip_byteIdenticalOnBothCodecs"
          - "conformance: ringStopVector_roundTrip_byteIdenticalOnBothCodecs"
      - id: E23-02
        title: "[android] Battery/network/signal observers"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-4.3]
        use_cases: [UC-05]
        invariants: []
        depends_on: [E23-01, E20-02, E20-07, E00-04, E00-20]
        description: |
          Produce DeviceStatus updates from battery (ACTION_BATTERY_CHANGED), network type
          (ConnectivityManager capabilities: Wi-Fi / cellular / none) and signal level
          (TelephonyManager callback, no READ_PHONE_STATE; field unset when unavailable).
          Seams: a `StatusAggregator` combining `BatteryStatusSource`, the E20-07 `NetworkMonitor`
          and a `SignalStrengthSource` (feature-local interfaces with fakes), tested with Turbine
          (E00-04); the BatteryManager adapter is tested under Robolectric (E00-20).
        acceptance:
          - A battery level or charging change emits a DeviceStatus with the new values
          - A Wi-Fi to cellular change emits a DeviceStatus with network type cellular
          - A signal level change emits a DeviceStatus with the new level
          - Identical consecutive values emit nothing
        tdd:
          - "unit: statusAggregator_batteryLevelChanged_emitsDeviceStatusWithNewLevel"
          - "unit: statusAggregator_wifiToCellular_emitsNetworkTypeCellular"
          - "unit: statusAggregator_signalLevelChanged_emitsDeviceStatusWithNewLevel"
          - "unit: statusAggregator_identicalValues_noEmission"
          - "unit: batteryStatusSource_batteryChangedIntent_emitsLevelAndCharging"
      - id: E23-03
        title: "[android] Publish-on-change with 60 s throttle"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-4.3]
        use_cases: [UC-05]
        invariants: []
        depends_on: [E23-02, E12-11, E00-18]
        description: |
          Throttle per the E23-01 SPEC rule: a change is sent immediately if no DeviceStatus was
          sent in the last 60 s; otherwise changes are coalesced and the latest values are sent
          at last-send + 60 s. No periodic send without a change. On session Ready the current
          status is sent immediately.
          Seam: runs in the injected scope with `TestClock` (E00-18) so the 60 s window is tested
          in virtual time; sends go to the E12-11 `FakeTandemSession`.
        acceptance:
          - The first change is sent at t=0
          - A second change at t=10 s is sent once at t=60 s with the latest values; nothing is sent between
          - No change for 10 min produces zero sends
          - A change 61 s after the last send is sent immediately
          - Session Ready sends the current status immediately
        tdd:
          - "unit: statusThrottle_firstChange_sentImmediately"
          - "unit: statusThrottle_secondChangeAt10s_sentAt60sWithLatestValues"
          - "unit: statusThrottle_noChangeFor10min_zeroSends"
          - "unit: statusThrottle_changeAt61sAfterLastSend_sentImmediately"
          - "unit: statusThrottle_sessionReady_currentStatusSentImmediately"
      - id: E23-04
        title: "[macos] STATUS channel display"
        type: story
        platforms: [macos]
        priority: P0
        size: S
        prd: [F-4.3]
        use_cases: [UC-05]
        invariants: []
        depends_on: [E23-01, E22-01, E12-12, E00-26]
        description: |
          Receive DeviceStatus and render battery/charging/network/signal in the menu bar dropdown
          and paired-devices list.
          Seams: a `DeviceStatusViewModel` fed by the E12-12 session fake; rendered values via an
          XCUITest `pairedConnected` scenario seeded with a DeviceStatus (E00-26).
          UI strings (exact): "Battery 82%" plus " · Charging" when charging; network "Wi-Fi",
          "Cellular" or "No network"; signal as 0–4 bars (accessibility value "<n> of 4 bars").
        acceptance:
          - A received DeviceStatus sets battery %, charging suffix, network label and signal bars to the exact formats above
          - A second DeviceStatus replaces the displayed values without a UI restart
          - The paired-devices row shows the same battery %
        tdd:
          - "unit: deviceStatusViewModel_statusReceived_formatsBatteryChargingNetworkSignal"
          - "unit: deviceStatusViewModel_secondStatus_replacesDisplayedValues"
          - "ui: menuBarExtra_seededDeviceStatus_showsBatteryPercentAndNetworkLabel"
      - id: E23-05
        title: "[android] Ring handler: max volume overriding DND"
        type: story
        platforms: [android]
        priority: P0
        size: M
        prd: [F-4.4]
        use_cases: [UC-06]
        invariants: []
        depends_on: [E23-01, E20-02, E00-20, E00-21, E00-23]
        description: |
          On receiving Ring, play a looping alarm-usage sound with STREAM_ALARM at max volume,
          restoring the previous volume on stop. Request Notification Policy Access
          (`ACCESS_NOTIFICATION_POLICY`) with an explanation before first use; with access, if the
          interruption filter is NONE (total silence), switch to ALARMS for the ring and restore it
          on stop.
          Seams: an `AlarmPlayer` (MediaPlayer/AudioManager) and `NotificationPolicyAccess`
          (NotificationManager) interface pair with recording fakes for `unit:`; the explanation
          screen is a Compose `ui:` test (E00-20); real alarm-stream playback under DND runs on the
          emulator (E00-21, DND via `cmd notification set_dnd`, access via
          `cmd notification allow_dnd`); a physical phone in silent + DND is a manual gate (E00-23).
          UI string (exact): "To ring even when Do Not Disturb is on, Tandem needs Do Not Disturb
          access. It is only used while your Mac is ringing this phone." with button "Open settings".
        acceptance:
          - Ring sets STREAM_ALARM to its max and starts looping playback; stop restores the previous alarm volume
          - With policy access and filter NONE, the filter becomes ALARMS during the ring and is restored after
          - Without policy access, the exact explanation is shown before the policy settings screen is opened
          - On the emulator with DND priority mode and policy access, the alarm stream is active at max volume within 1 s of Ring
          - "Manual gate: a physical phone in silent mode with DND on rings audibly at max volume (UC-06)"
        tdd:
          - "unit: ringHandler_ringReceived_alarmStreamMaxAndPlaybackStarted"
          - "unit: ringHandler_ringStopped_restoresPreviousAlarmVolume"
          - "unit: ringHandler_totalSilenceFilter_switchesToAlarmsAndRestoresOnStop"
          - "unit: ringHandler_policyAccessMissing_showsExplanationBeforeSettings"
          - "ui: ringPolicyExplanationScreen_rendered_showsExactExplanationText"
          - "instrumented: ringHandler_dndPriorityWithPolicyAccess_alarmActiveAtMaxWithin1s"
          - "manual: ringPhysicalPhone_silentAndDnd_audibleAtMaxVolume"
      - id: E23-06
        title: "[android] Ring dismiss/stop from phone and Mac"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-4.4]
        use_cases: [UC-06]
        invariants: []
        depends_on: [E23-05, E12-11, E00-21]
        description: |
          Stop the ring on phone-side user dismissal (ongoing ring notification with a "Stop"
          action) and on receiving RingStop from the Mac. A phone-side dismissal sends
          RingStop{origin=phone} so the Mac can revert its menu item (E23-07); a Mac-originated
          RingStop is not echoed back.
          Seams: `RingController` over the E23-05 `AlarmPlayer` fake and E12-11
          `FakeTandemSession`; the notification action runs on the emulator (E00-21).
        acceptance:
          - Phone dismissal stops playback and sends exactly one RingStop with origin phone
          - A received RingStop from the Mac stops playback and sends no RingStop
          - Tapping "Stop" on the ring notification on the emulator makes the alarm stream inactive within 1 s
        tdd:
          - "unit: ringController_phoneDismiss_stopsPlaybackAndSendsRingStopFromPhone"
          - "unit: ringController_macRingStopReceived_stopsPlaybackWithoutEcho"
          - "instrumented: ringNotification_stopActionTapped_alarmInactiveWithin1s"
      - id: E23-07
        title: "[macos] Find my phone quick action wired to Ring/RingStop"
        type: story
        platforms: [macos]
        priority: P0
        size: S
        prd: [F-4.4]
