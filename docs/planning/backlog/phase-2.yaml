      - id: E20-15
        title: "[android] Heartbeat responder, Doze-aware unsolicited timer, sleep-inclusive dead-peer detection"
        type: task
        platforms: [android]
        priority: P0
        size: L
        prd: [F-3.4]
        use_cases: [UC-04]
        invariants: []
        depends_on: [E20-01, E12-08, E12-11, E00-18, E00-19, E00-20, E00-23]
        description: |
          Android half of the E01-07 liveness contract.
          - Responder: reply with one `Heartbeat` to every received `Heartbeat` within 1 s.
          - Unsolicited timer: while the device is interactive and not in Doze, send a Heartbeat
            after 15 s without sending; while `isDeviceIdleMode` is true, schedule nothing (no wake
            locks, no AlarmManager alarms) — incoming Mac heartbeats wake the phone.
          - Dead-peer detector: silence is measured on `ElapsedRealtimeSource` (sleep-inclusive,
            E00-18), never on wall clock; > 45 s without any received frame emits PeerDead to the
            E12-08 state machine, which starts the E20-06 reconnect. Evaluated on the detector
            timer, on Doze exit and on screen-on. Any received frame resets silence.
          Seams: `ElapsedRealtimeSource` + `TestClock` + injected scope (E00-18); frames over
          `InMemoryDuplexPipe` (E00-19); a `DeviceIdleSource` interface (StateFlow idle mode +
          screen-on events) defined in core/transport, production adapter over
          `PowerManager.isDeviceIdleMode` + `ACTION_DEVICE_IDLE_MODE_CHANGED` + `ACTION_SCREEN_ON`,
          tested under Robolectric (E00-20). Real Doze is a manual gate (E00-23) and E20-12.
        acceptance:
          - Every received Heartbeat is answered with exactly one Heartbeat within 1 s; non-Heartbeat frames get no reply
          - While interactive and not idle, a Heartbeat is sent after 15 s without sending; while idle, no Heartbeat, wake lock or alarm is scheduled
          - 46 s of elapsedRealtime silence (including device sleep, with wall clock unchanged) emits PeerDead
          - A Doze-exit or screen-on event after > 45 s of silence emits PeerDead immediately, before the detector timer fires
          - A 1 h forward wall-clock jump with frames still arriving does not emit PeerDead
          - The DeviceIdleSource adapter emits the new idle state on ACTION_DEVICE_IDLE_MODE_CHANGED
          - "Manual gate: under adb force-idle for 30 min, every Mac Heartbeat is answered within 1 s (Mac-side log)"
        tdd:
          - "unit: heartbeatResponder_macHeartbeatReceived_repliesWithin1s"
          - "unit: heartbeatResponder_nonHeartbeatFrame_noReplySent"
          - "unit: unsolicitedTimer_interactive15sWithoutSend_sendsHeartbeat"
          - "unit: unsolicitedTimer_deviceIdleMode_noHeartbeatScheduled"
          - "unit: deadPeerDetector_silence46sIncludingSleep_marksDead"
          - "unit: deadPeerDetector_dozeExitAfterLongSilence_triggersReconnect"
          - "unit: deadPeerDetector_screenOnAfterLongSilence_triggersReconnect"
          - "unit: deadPeerDetector_wallClockJumpForward1h_staysConnected"
          - "unit: deviceIdleSource_idleModeChangedBroadcast_emitsNewIdleState"
          - "manual: forceIdle30min_macHeartbeats_everyHeartbeatAnsweredWithin1s"
        notes: |
          Split from E20-05 in review cycle 3 (Mac half stays E20-05).
          Decision (E01-07, review cycle 3): the Mac drives liveness. Mac sends Heartbeat after 15 s
          without sending and declares dead after 45 s without receiving; the phone replies to
          every Heartbeat within 1 s; the Mac never replies. The phone's unsolicited timer is
          suspended in Doze (no wake locks / alarms) and it measures silence on elapsedRealtime
          (sleep-inclusive), treating > 45 s as dead on timer, Doze exit and screen-on, then
          reconnecting (E20-06). If E20-12 shows incoming packets do not wake some OEM devices,
          revisit per E01-07 notes.
