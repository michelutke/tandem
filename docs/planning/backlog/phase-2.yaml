      - id: E20-05
        title: "[macos] Heartbeat sender and dead-peer detection (Mac drives liveness)"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-3.4]
        use_cases: [UC-04]
        invariants: []
        depends_on: [E20-01, E12-09, E00-24, E00-25]
        description: |
          Mac half of the E01-07 liveness contract. Per connection: after 15 s without sending any
          frame on CONTROL, send one `Heartbeat`; after 45 s without receiving any frame, move the
          E12-09 state machine to Dead and cancel the connection. Any received frame (not only
          Heartbeat) resets the receive timer; any sent frame resets the send timer. The Mac never
          replies to a received Heartbeat (no ping-pong loop).
          Seams: timers take an injected `Clock<Duration>` (E00-24) so 15 s / 45 s are tested with
          `ManualTestClock`; frames flow over `InMemoryConnectionPair` (E00-25).
        acceptance:
          - After 15 s without sending any frame, exactly one Heartbeat is sent; a frame sent at t=10 s delays the next Heartbeat to t=25 s
          - A received Heartbeat never causes a Heartbeat to be sent in reply
          - 45 s without receiving any frame sets the E12-09 state to Dead and cancels the connection
          - A non-Heartbeat frame received at t=44 s keeps the connection up past t=45 s
          - Timers are per connection; one connection going Dead does not affect another
        tdd:
          - "unit: macHeartbeat_idle15sWithoutSend_sendsHeartbeat"
          - "unit: macHeartbeat_frameSentAt10s_noHeartbeatBefore25s"
          - "unit: macHeartbeat_heartbeatReceived_noReplySent"
          - "unit: macDeadPeer_silent45sWithoutReceive_stateDead"
          - "unit: macDeadPeer_nonHeartbeatFrameAt44s_staysConnected"
          - "unit: macDeadPeer_oneConnectionDead_otherConnectionUnaffected"
        notes: |
          Split from E20-05 ([cross]) in review cycle 3; Android half is E20-15.
          Decision (E01-07, review cycle 3): the Mac drives liveness. Mac sends Heartbeat after 15 s
          without sending and declares dead after 45 s without receiving; the phone replies to
          every Heartbeat within 1 s; the Mac never replies. The phone's unsolicited timer is
          suspended in Doze (no wake locks / alarms) and it measures silence on elapsedRealtime
          (sleep-inclusive), treating > 45 s as dead on timer, Doze exit and screen-on, then
          reconnecting (E20-06). Overnight behaviour is gated by E20-12.
      - id: E20-06
        title: "[android] Reconnect address strategy and exponential backoff"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-3.4]
        use_cases: [UC-04]
        invariants: [3, 1]
        depends_on: [E20-15, E21-05, E12-08, E00-18, E15-15]
        description: |
          Reconnect address-selection state machine, started when E20-15 (or the E12-08 state
          machine) reports the peer dead or disconnected: try the last-working address first, then
          Bonjour-resolved addresses of recognized paired Macs (E21-05), then addresses recorded at
          pairing time. Exponential backoff from 1 s, doubling, capped at 30 s between full cycles.
          Every candidate still goes through the full mTLS handshake and pin check;
          discovery/pairing addresses are hints only (invariant 3).
          Seams: backoff waits use `delay` in the injected scope with `TestClock` (E00-18) so the
          1-2-4-...-30 s sequence runs in virtual time; dialing goes through a `Connector` interface
          with a recording fake returning success / PinMismatch / unreachable per address. The
          impostor case also runs as an integration test against a second server identity on the
          E15-15 harness.
        acceptance:
          - Address order within a cycle is last-working, then Bonjour-resolved, then pairing-time addresses, with duplicates tried once
          - Waits between failed full cycles are 1, 2, 4, 8, 16, 30, 30 s
          - A successful connection resets backoff to 1 s and records that address as last-working
          - A host now answering on the last-working address with a different key fails the pin check, receives zero application bytes, and the strategy moves to the next candidate (UC-04)
        tdd:
          - "unit: reconnectStrategy_allCandidateKinds_triesLastWorkingThenBonjourThenPairing"
          - "unit: reconnectBackoff_consecutiveFailedCycles_waits1s2s4s8s16s30s30s"
          - "unit: reconnectStrategy_success_resetsBackoffTo1sAndRecordsAddress"
          - "unit: reconnectStrategy_lastWorkingAddressPinMismatch_triesNextCandidate"
          - "integration: reconnect_impostorOnLastWorkingAddress_zeroApplicationBytesSent"
      - id: E20-07
        title: "[android] Reconnect on ConnectivityManager network callback"
        type: task
        platforms: [android]
        priority: P0
        size: S
        prd: [F-3.4]
        use_cases: [UC-04]
        invariants: []
        depends_on: [E20-06, E00-18, E00-20]
        description: |
          Register a ConnectivityManager.NetworkCallback; on network available/changed, cancel any
          pending backoff wait, reset backoff to 1 s and trigger an immediate reconnect attempt,
          falling back to normal backoff if it fails.
          Seam: a `NetworkMonitor` interface (Flow of network-available/lost events) in core/transport
          with a fake in test fixtures; the ConnectivityManager adapter is tested under Robolectric
          (E00-20). Debounce uses the injected scope and `TestClock` (E00-18). E23-02 reuses
          `NetworkMonitor` for network type.
        acceptance:
          - A network-available event while a backoff wait is pending starts a reconnect attempt immediately (0 s virtual time) and resets backoff to 1 s (UC-04)
          - Network events arriving within a 500 ms window collapse into one immediate attempt
          - If the immediate attempt fails, the next wait is 1 s
          - No attempt is triggered while the connection is already Connected
        tdd:
          - "unit: networkReconnectTrigger_networkAvailable_connectsImmediatelyAndResetsBackoff"
          - "unit: networkReconnectTrigger_fiveEventsWithin500ms_oneImmediateAttempt"
          - "unit: networkReconnectTrigger_immediateAttemptFails_nextWaitIs1s"
          - "unit: networkReconnectTrigger_alreadyConnected_noAttempt"
          - "unit: connectivityNetworkMonitor_onAvailableCallback_emitsNetworkAvailable"
