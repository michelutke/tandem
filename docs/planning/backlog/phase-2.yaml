          Seams: `FindPhoneViewModel` over the E12-12 session fake; rendered toggle via XCUITest
          `pairedConnected` scenario (E00-26).
        acceptance:
          - Selecting "Find Phone" sends one Ring and the item label becomes "Stop Ringing"
          - Selecting "Stop Ringing" sends one RingStop with origin mac and the label reverts to "Find Phone"
          - A RingStop with origin phone reverts the label to "Find Phone"
        tdd:
          - "unit: findPhoneViewModel_findPhoneSelected_sendsRingAndLabelStopRinging"
          - "unit: findPhoneViewModel_stopRingingSelected_sendsRingStopAndLabelReverts"
          - "unit: findPhoneViewModel_ringStopFromPhone_labelRevertsToFindPhone"
          - "ui: menuBarExtra_findPhoneSelected_itemShowsStopRinging"
      - id: E23-08
        title: "[cross] Status throttle and ring round-trip tests"
        type: test
        platforms: [android, macos]
        priority: P1
        size: S
        prd: [F-4.3, F-4.4]
        use_cases: [UC-05, UC-06]
        invariants: []
        depends_on: [E23-03, E23-04, E23-06, E23-07, E15-15, E00-23]
        description: |
          End-to-end checks on the E15-15 harness (JVM Android core against the real Mac server):
