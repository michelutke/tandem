          connections still function sandboxed and that no unrelated entitlement is added.
          Checks: a CI step dumps the Release entitlements with codesign and launches the sandboxed
          build on the macOS runner (identity generated in a CI keychain) to confirm the listener
          binds; a paired physical phone connecting to the sandboxed Release build is a manual gate.
          Cycle 4: the Release app is signed with the hardened runtime (`--options runtime`) and carries no
          `com.apple.security.cs.*` exception (allow-jit, allow-unsigned-executable-memory,
          disable-library-validation, allow-dyld-environment-variables, disable-executable-page-protection) and no
          `get-task-allow`; keychain access is limited to the app's own group (E10-05); `application-groups`
          appears only once E40-22 lands; Info.plist has no ATS exception keys (Tandem makes no URL-loading
          connections).
        acceptance:
          - codesign --display --entitlements on the Release build shows exactly app-sandbox, network.server and network.client at this stage
          - The sandboxed build launched on the macOS CI runner has its single listening port bound within 10 s (lsof)
          - "Manual gate: a paired phone reaches session Ready with the sandboxed Release build within 5 s"
          - "`codesign -d --verbose` shows the runtime flag on the Release app and no com.apple.security.cs.* or get-task-allow entitlement."
