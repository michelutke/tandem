        depends_on: [E20-05, E20-15, E20-06, E20-07, E20-10, E20-11, E15-15, E00-23]
        description: |
          tools/reconnect-harness: drives scenarios on real hardware (Wi-Fi switch via
          `adb shell cmd wifi connect-network`, Mac sleep via `pmset sleepnow` + scheduled wake) and
          computes reconnect latency (disconnect/dead event to session Ready) from timestamped
          logcat and macOS unified-log markers, reporting p95 and exiting non-zero above 5 s.
          Emulator CI cannot reach a Mac, so the scenario runs are `manual:` gates (E00-23); the
