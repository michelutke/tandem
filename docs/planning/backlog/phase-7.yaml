        type: adr
        platforms: [docs]
        priority: P1
        size: M
        prd: [F-2.2]
        use_cases: [UC-03]
        invariants: [3, 5, 6]
        depends_on: [E14-16, E02-05]
        description: |
          Design a commitment-based short authentication string scheme: both sides generate a
          nonce and first exchange SHA-256 commitments to (nonce || context), only then reveal
          the nonces; the SAS is a truncation of HMAC(nonceA||nonceB, "tandem-manual-pair-v1") to
          at least 6 digits, displayed on both screens for the user to compare. The ADR must
          cover replay resistance, downgrade resistance (no silent fallback from QR pairing to a
          weaker check), and the UX of the compare step, and must explicitly reject any
          fingerprint-prefix-only comparison per PRD ADR-004.
        acceptance:
