        description: |
          Mirrors E70-02 for macOS: generate a new Keychain-backed P-256 keypair per F-1.1's
          storage policy, sign the E70-01 transcript with the current and the new private key, send
          only over an authenticated control session. Two-phase switch (D-34, several paired phones):
          KeyRotation is sent to each paired phone as it connects; the listener identity switches to the
          new key and the old key item is deleted only after every paired phone has acked. After 7 days
          with phones still pending, the Settings UI (E70-11) offers Finish (unpair the pending phones,
          then switch) or Cancel (delete the pending key).
          Key storage goes through `KeychainStore` (E10-16) so unit tests use
          `InMemoryKeychainStore`; session state comes from `TandemSession` (E12-12 fake). Real
          Keychain behaviour is covered by one hosted integration test on the macOS runner.
          Cycle 4: signs the E70-01 transcript (both SPKIs and this session channel binding) with the old and the new key; never initiates while the Mac pairing window is open.
        acceptance:
          - Over a session that is not fully authenticated (no pinned peer, Hello not complete,
            or pairing window session) no KeyRotation frame is written.
          - Over an authenticated session sigOldKey verifies with the old public key over the E70-01
            transcript.
          - The old key remains in the Keychain and is the active identity until every paired phone
            has sent RotationAck.
          - With two paired phones, one ack leaves the listener on the old identity; the second ack
            switches the listener to newSpki and deletes the old key item.
          - "Finish after 7 days with one phone pending unpairs that phone, then switches; Cancel deletes the pending key and keeps the old identity."
          - The new key item is stored with the same accessibility class as the original
            identity.
          - "Both signatures cover the transcript including this session channel binding; no rotation starts while the pairing window is open."
