      - id: E70-04
        title: "[android] Receive + verify KeyRotation, pin new key with grace period"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-1.3]
        use_cases: [UC-24, AC-15]
        invariants: [1, 3, 6]
        depends_on: [E70-01, E13-02, E12-11, E13-03, E00-18]
        description: |
          Verify the signature against the SPKI of the peer authenticated in this session (its
          current primary pin), never against a key named in the message. On success, pin newSpki
          in the trust store while retaining the old SPKI flagged grace-only per SPEC's
          grace-session rule (E70-01), then purge it. An invalid signature, an unauthenticated
          session or a non-primary signing key leaves the trust store unchanged, returns
          RotationReject with the matching reason, and logs a redacted `rotation_rejected` event
          (reason only, no key material). A re-sent KeyRotation for the already-pinned newSpki
          returns RotationAck without a trust-store change. Lives in core/crypto (JVM-testable,
          linked by the E15-15 harness); tests use `FakeTandemSession` (E12-11).
          Cycle 4: verifies both signatures against this session's channel binding; rejects DUPLICATE_KEY when
          newSpki equals any existing primary or grace pin. The peer record gains `graceSpkiSha256` and
          `graceExpiresAt` via a trust-store migration (E13-03) so the pin swap is one atomic record write; lookup
          by fingerprint matches the primary pin or an unexpired grace pin. The grace pin is purged after the
          grace session or 7 days (injected Clock, E00-18), whichever comes first.
          Cycle 5 (D-34): a rotation of the Mac's key is stored as a pending Mac pin; the old pin stays primary
          until a handshake presents the pending key, which promotes it and starts the grace rule; a pending pin
          never presented within 30 days is purged.
        acceptance:
          - A valid rotation pins newSpki as primary and retains the old SPKI flagged grace-only.
          - "A valid Mac rotation stores newSpki as pending: the old Mac pin stays primary across any number of sessions until a handshake presents newSpki, which promotes it and starts the grace rule."
          - "A pending Mac pin never presented within 30 days is purged and the old pin stays primary."
          - The old pin is purged when the grace session closes or when a session authenticated
            with newSpki completes Hello, whichever comes first.
          - An invalid signature returns RotationReject(INVALID_SIGNATURE) and the trust store
            is byte-identical to before.
          - KeyRotation on an unauthenticated or pairing-in-progress session returns
            RotationReject(UNAUTHENTICATED_SESSION) with no trust-store change.
          - A KeyRotation signed by a grace-only key for a different newSpki returns
            RotationReject(NOT_PRIMARY_PIN).
          - Every rejection emits exactly one `rotation_rejected` log event containing the reason
            and no SPKI or signature bytes.
          - "A KeyRotation replayed from another session is rejected INVALID_SIGNATURE; a newSpki equal to an existing pin is rejected DUPLICATE_KEY."
          - "With a fault-injecting store, an interrupted pin swap leaves the record in either the old or the new state, never partially updated."
          - "A grace pin older than 7 days is purged even if no further session happens."
        tdd:
          - "unit: androidRotationReceiver_validSignature_pinsNewKeyAndFlagsOldGraceOnly"
          - "unit: androidRotationReceiver_newKeySessionCompletesHello_oldPinPurged"
          - "unit: androidRotationReceiver_graceSessionClosed_oldPinPurged"
          - "unit: androidRotationReceiver_invalidSignature_rejectInvalidSignatureTrustStoreUnchanged"
          - "unit: androidRotationReceiver_unauthenticatedSession_rejectUnauthenticatedTrustStoreUnchanged"
          - "unit: androidRotationReceiver_graceOnlyKeySignsDifferentSpki_rejectNotPrimaryPin"
          - "unit: androidRotationReceiver_resendSameNewSpki_acksWithoutTrustStoreChange"
          - "unit: androidRotationReceiver_rejection_logsReasonWithoutKeyBytes"
          - "unit: androidRotationReceiver_replayedFromOtherSession_rejectInvalidSignature"
          - "unit: androidRotationReceiver_newSpkiEqualsExistingPin_rejectDuplicateKey"
          - "unit: androidRotationReceiver_faultInjectedPinSwap_stateOldOrNewNeverPartial"
          - "unit: androidRotationReceiver_gracePinOlderThan7Days_purgedWithoutSession"
          - "unit: androidRotationReceiver_macRotationAcked_oldMacPinPrimaryUntilNewKeyPresented"
          - "unit: androidRotationReceiver_pendingMacPinUnseen30Days_purgedOldPinKept"
        notes: ""
