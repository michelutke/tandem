phase: 7
epics:
  - id: E70
    title: Key rotation
    labels: [area:crypto]
    prd: [F-1.3]
    use_cases: [UC-24]
    summary: |
      Replace a device's long-term identity key without re-pairing, as key hygiene, not compromise
      recovery (a suspected compromise is unpair + re-pair). Over an authenticated control session a
      device sends KeyRotation{newSpkiDer, sigOldKey, sigNewKey}, both ECDSA P-256 signatures over
      "tandem-rotate-v1" || LP(oldSpkiDer) || LP(newSpkiDer) || LP(cb), bound to the session channel
      binding (the new-key signature is proof of possession). The peer verifies against its current
      primary pin, rejects DUPLICATE_KEY and (while the Mac pairing window is open or a rotation is
      pending) ROTATION_UNAVAILABLE, swaps pins atomically in one trust-store record (grace fields added
      by migration), and keeps the old key as a grace pin until the grace session ends or 7 days pass.
      The initiator keeps its old key until RotationAck and retries with the pending key. A Mac
      rotation is two-phase (decision D-34): the listener switches only after every paired phone has
      acked, and each phone keeps the old Mac pin until a handshake presents the new one. Covers
      user-initiated and scheduled rotation, failure/rollback, an end-to-end harness test and mitm-lab
      scenarios (unauthenticated channel, cross-session replay, duplicate key).
    scope:
      - rotation.proto messages and SPEC.md section.
      - "Android and macOS: initiate rotation (generate, sign with old and new key over the channel-bound transcript), receive + verify + atomic single-record pin swap with grace pin (grace session or 7 days); two-phase Mac switch across several paired phones (D-34)."
      - User-initiated rotation UI, scheduled rotation, failure/rollback handling.
      - End-to-end rotation over the E15-15 JVM client to real Mac server harness.
      - "mitm-lab coverage for rotation over an unauthenticated channel, cross-session replay and duplicate key."
    out_of_scope:
      - Initial device identity generation and the first pairing (E10, E14).
      - Manual pairing (E73) -- unrelated mechanism.
      - "Compromise recovery with a stolen old key -- unpair and re-pair (E14, AC-15)."
    exit_criteria:
      - "A user-triggered rotation on either platform completes; both peers pin the new fingerprint via an atomic single-record swap, and the old pin is purged after one grace session or 7 days, whichever comes first."
      - A scheduled rotation fires automatically only over an authenticated session and defers
        cleanly when offline.
      - mitm-lab confirms rotation attempted outside an authenticated session is rejected with
        no trust-store change.
      - "A KeyRotation replayed from another session is rejected INVALID_SIGNATURE, a newSpki equal to any existing pin DUPLICATE_KEY, and any rotation while the Mac pairing window is open ROTATION_UNAVAILABLE, trust stores unchanged (E70-04, E70-05, E70-09)."
      - "With two paired phones, a Mac rotation switches the listener only after both acked, and neither phone is ever locked out (E70-03, E70-04)."
    issues:
      - id: E70-01
        title: "[protocol] rotation.proto: KeyRotation, RotationAck, RotationReject"
        type: task
        platforms: [protocol]
        priority: P0
        size: M
        prd: [F-1.3]
        use_cases: [UC-24, AC-15]
        invariants: [1, 3, 6]
        depends_on: [E01-10, E01-14, E01-16, E15-01, E15-02, E01-01, E01-02, E03-04]
        description: |
          protocol/proto/tandem/v1/rotation.proto: KeyRotation{newSpkiDer,
          sigOldKey, sigNewKey} (cycle-4 transcript below), RotationAck{}, RotationReject{reason}. Write
          docs/protocol/SPEC.md rotation section covering the grace-session semantics: the old
          SPKI stays accepted for at most one subsequent session and is purged as soon as either
          that session closes or a session authenticated with the new SPKI completes Hello; a
          re-sent KeyRotation for an already-pinned newSpki is acknowledged idempotently; only
          the peer's current primary pin may authorize a rotation. SPEC also fixes the
          initiator's ack timeout (30 s) and the scheduled-rotation interval setting.
          Rotation vectors under protocol/vectors/rotation/ (run by the E15-01/E15-02 conformance
          runners): an ECDSA P-256 signature by the old key over the cycle-4 rotation transcript that verifies, a
          tampered newSpki that fails, a signature by the new key instead of the old one that
          fails, and a truncated DER signature that fails. Replay/idempotency is receiver state,
          tested in E70-04/E70-05.
          Cycle 4 decisions (supersede PRD F-1.3's `sigOldKey(newSpki||nonce)`):
          - `transcript = ASCII("tandem-rotate-v1") || LP(oldSpkiDer) || LP(newSpkiDer) || LP(cb)` with `LP` and
            `cb` as in E01-01 / E01-02. `sigOldKey` and `sigNewKey` are ECDSA P-256 / SHA-256 over the transcript
            by the old and the new key (the new-key signature is proof of possession, so a device cannot claim
            someone else's public key). The channel binding replaces the nonce: a KeyRotation captured on one
            session fails on any other.
          - RotationReject.reason adds DUPLICATE_KEY (newSpki equals any existing primary or grace pin in the
            receiver's trust store) and ROTATION_UNAVAILABLE (the Mac has a pairing window open, or a rotation for
            this peer is already pending).
          - The grace pin expires at the earlier of the E70-01 grace-session rule and 7 days after the swap, so a
            lost RotationAck or a peer that never reconnects cannot keep the old key alive.
          - Rotation is key hygiene, not compromise recovery: a holder of a stolen old key can itself rotate. A
            suspected key compromise is handled by unpair and re-pair (AC-15, E02-01).
        acceptance:
          - buf lint exits 0 on rotation.proto.
          - RotationReject.reason enumerates at least INVALID_SIGNATURE, UNAUTHENTICATED_SESSION
            and NOT_PRIMARY_PIN.
          - protocol/vectors/rotation/*.json contains the four signature vectors above (old-key
            signature over new SPKI, tampered newSpki, new-key signature, truncated signature)
            and all pass conformance on both codecs.
          - SPEC.md rotation section states the grace-session purge triggers, idempotent re-send
            rule and 30 s ack timeout.
          - "RotationReject.reason also enumerates DUPLICATE_KEY and ROTATION_UNAVAILABLE, and SPEC.md states the transcript, both signatures, the 7-day grace TTL and that rotation is not a compromise-recovery mechanism."
          - "SPEC.md states the two-phase Mac-initiated rule (D-34): pending Mac pin on the phone, Mac switches only after every paired phone acked, phone grace timer starts at the first handshake presenting the new key, 30-day purge of a never-presented pending pin, 7-day Finish/Cancel prompt."
          - "Vectors additionally cover a signature made with another session channel binding and an invalid new-key signature, both failing verification."
        tdd:
          - "ci: rotationProto_bufLint_exitsZero"
          - "conformance: keyRotationVector_oldKeySignatureOverNewSpki_verifies"
          - "conformance: keyRotationVector_tamperedNewSpki_signatureVerificationFails"
          - "conformance: keyRotationVector_signedByNewKeyInsteadOfOld_verificationFails"
          - "conformance: keyRotationVector_truncatedDerSignature_verificationFails"
          - "conformance: keyRotationVector_roundTrip_matchesGoldenBytes"
          - "conformance: keyRotationVector_otherSessionChannelBinding_verificationFails"
          - "conformance: keyRotationVector_invalidNewKeyProofOfPossession_verificationFails"
        notes: |
          Cycle 5: depends on E03-04 (channel-binding outcome); if it is "fallback", `cb` is the in-band
          `RotationChallenge` from the rotation receiver (E01-01 notes).
          Cycle 5 decision D-34 (Mac-initiated rotation with several paired phones): the listener presents one
          identity before it knows which phone connects (no SNI in the TLS profile, fixed ALPN), so SPEC defines
          a two-phase Mac rotation: (1) the Mac sends KeyRotation to each paired phone as it connects; the phone
          stores newSpki as a *pending* Mac pin and acks, keeping the old pin primary; (2) the Mac switches its
          listener identity only after every paired phone has acked; the phone promotes the pending pin when a
          handshake presents it and only then starts the grace rule (grace session or 7 days). A pending pin
          never presented within 30 days is purged. If not every phone acks within 7 days the Mac offers
          Finish (non-acked phones are unpaired and must re-pair) or Cancel (pending key deleted).
          Rejected: per-connection certificate selection from an SNI/ALPN hint (contradicts the no-SNI profile,
          leaks a key-epoch hint in the cleartext ClientHello, and NWListener has one identity per listener);
          single-phone-only Mac rotation (the two-phase rule already reduces to it).
      - id: E70-02
        title: "[android] Initiate rotation: generate new key + sign with old key"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-1.3]
        use_cases: [UC-24, AC-15]
        invariants: [1, 3]
        depends_on: [E70-01, E10-01, E10-02, E10-03, E10-15, E12-11, E00-21]
        description: |
          Generate a new P-256 keypair under a new alias with the same StrongBox/TEE preference as
          the original identity (F-1.1); sign the E70-01 transcript (old SPKI, new SPKI, session channel
          binding) with the current private key and with the new key; send KeyRotation only over an
          authenticated control session (mTLS with pinned peer and Hello completed, not a
          pairing-in-progress session), refusing to send otherwise. On RotationAck the new alias
          becomes the active identity (new self-signed cert via E10-02) and the old key is
          deleted.
          Key generation goes through `IdentityKeyStore` (E10-15) so JVM unit tests use
          `SoftwareIdentityKeyStore`; the initiator lives in core/crypto so the E15-15 harness
          links it. Session state comes from `TandemSession` (E12-11, `FakeTandemSession` in
          tests). Real AndroidKeyStore properties are asserted only in the instrumented test.
          Cycle 4: signs the E70-01 transcript (both SPKIs and this session channel binding) with the old key and with the new key (proof of possession); never initiates while a pairing attempt is in progress.
        acceptance:
          - Over a session that is not fully authenticated (no pinned peer, Hello not complete,
            or pairing in progress) no KeyRotation frame is written.
          - Over an authenticated session sigOldKey verifies with the old public key over the E70-01
            transcript.
          - The old key remains in the IdentityKeyStore and is the active identity until
            RotationAck arrives.
          - After RotationAck the next handshake's certificate carries newSpki and the old alias
            is absent from the store.
          - On the emulator the new key is non-exportable and stored under the new alias.
          - "Both signatures cover the transcript including this session channel binding, and sigNewKey verifies with newSpki."
        tdd:
          - "unit: androidRotationInitiator_unauthenticatedSession_noKeyRotationFrameSent"
          - "unit: androidRotationInitiator_pairingInProgressSession_noKeyRotationFrameSent"
          - "unit: androidRotationInitiator_authenticatedSession_signatureVerifiesWithOldPublicKey"
          - "unit: androidRotationInitiator_beforeAck_oldKeyRemainsActiveIdentity"
          - "unit: androidRotationInitiator_ackReceived_newKeyActiveAndOldAliasDeleted"
          - "instrumented: androidRotationInitiator_realKeyStore_newKeyNonExportableUnderNewAlias"
          - "unit: androidRotationInitiator_sentFrame_bothSignaturesCoverSessionChannelBinding"
        notes: ""
      - id: E70-03
        title: "[macos] Initiate rotation: generate new key + sign with old key"
        type: task
