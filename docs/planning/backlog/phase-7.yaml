      - id: E70-08
        title: "[android] Rotation failure and rollback handling"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-1.3]
        use_cases: [UC-24]
        invariants: [1, 3]
        depends_on: [E70-02, E00-18, E12-11]
        description: |
          The initiator must not delete its old key until it receives an explicit RotationAck.
          On ack timeout (30 s, SPEC E70-01) or a session drop before ack, retry on the next
          authenticated session using the still-valid old key with the same pending newSpki
          rather than assuming success. An explicit RotationReject aborts the rotation, deletes
          the pending new key, and keeps the old key as the sole identity. The pending rotation
          is persisted so it survives process death. The timeout uses the injected `Clock` and
          dispatcher (E00-18); tests use `FakeTandemSession` (E12-11).
        acceptance:
          - No ack within 30 s (virtual time) leaves the old key as the active identity.
          - The next authenticated session re-sends KeyRotation with the same pending newSpki.
          - RotationReject deletes the pending new key and keeps the old key as sole identity.
          - A session dropped before ack leaves the old key active and the rotation pending.
          - A pending rotation survives process restart and is re-sent on the next session.
          - "While a rotation is pending, a handshake rejected with the old key is retried once with the pending new key; success commits the rotation locally."
        tdd:
          - "unit: androidRotationRollback_noAckWithin30s_oldKeyRemainsActiveIdentity"
          - "unit: androidRotationRollback_nextSessionAfterTimeout_resendsSamePendingNewSpki"
          - "unit: androidRotationRollback_rotationRejectReceived_pendingKeyDeletedOldKeySole"
          - "unit: androidRotationRollback_sessionDropBeforeAck_rotationStaysPending"
          - "unit: androidRotationRollback_processRestart_pendingRotationResent"
          - "unit: androidRotationRollback_oldKeyRejectedWhilePending_retriesOnceWithPendingKey"
        notes: "Split from E70-08 in review cycle 3 (macOS half is E70-13)."
      - id: E70-09
        title: "[tools] mitm-lab: rotation over unauthenticated channel rejected"
        type: test
        platforms: [tools]
        priority: P0
