          sms.proto, contacts.proto, calls.proto, media.proto, input.proto, and rotation.proto, each seeded from its own protocol/vectors set.
        acceptance:
          - Each domain decoder completes an independent 24-hour run with zero uncaught crashes
            or hangs.
        tdd:
          - fuzzDomainDecoders_allDomainTargets_seedCorporaRunCleanly
        notes: ""
      - id: E71-05
        title: "[docs] Fix-found-crashes triage process"
        type: doc
        platforms: [docs]
        priority: P0
        size: S
        prd: []
        use_cases: []
        invariants: []
