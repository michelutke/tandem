        depends_on: [E15-09, E15-10, E15-11, E15-12, E60-05, E62-08, E70-09]
        description: |
          Run nmap against the phone across every feature phase, and the complete accumulated
          mitm-lab scenario suite from Phases 1 through 7 in one pass.
        acceptance:
          - "nmap -p- against the phone shows zero open ports."
          - Every mitm-lab scenario across all phases passes.
        tdd:
          - nmap_phoneFullPortScan_noOpenPorts
        notes: ""
      - id: E71-09
        title: "[tools] Release security audit: entitlement + manifest review"
        type: test
        platforms: [tools]
        priority: P0
        size: S
        prd: []
        use_cases: []
        invariants: [2, 4]
        depends_on: []
        description: |
          Review AndroidManifest.xml (no cleartextTrafficPermitted, no exported component without
          a permission) and the macOS entitlements/Info.plist (no NSAllowsLocalNetworking,
