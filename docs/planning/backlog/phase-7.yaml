        description: |
          Automate the review as CI checks over the release artifacts, per invariant 2 and
          invariant 4. Android (merged release manifest + network security config):
          declared permissions must equal `tools/release-audit/android-permissions.allowlist`
          (each line carries the issue ID that justifies it); every exported component must be in
          `android-exported.allowlist` and guarded by a permission unless it is the launcher or
          share-target activity; cleartext traffic is not permitted. macOS (`codesign -d
          --entitlements` on the release .app + Info.plist): entitlements must equal
          `mac-entitlements.allowlist` (app-sandbox, network.server, network.client, plus
          entries later phases justify); Info.plist has no NSAllowsLocalNetworking /
          NSAllowsArbitraryLoads. Each check has a failing fixture. AC-11: debug and release
          builds embed byte-identical generated protocol descriptors, and the proto schema scan
          (`tools/protocol/proto-schema-scan.sh`, E01-15; also run by E15-07) finds no debug/echo/test
          message or channel.
          Cycle 4 additions to the release audit: Android — allowBackup false and dataExtractionRules excluding
          all domains, network security config without user anchors or debug-overrides, the E00-28 exported
          allowlist (each service guarded by its BIND_* permission) and denied-permission list, PendingIntent lint
          clean; macOS — hardened runtime, no com.apple.security.cs.* or get-task-allow, share extension
          entitlements exactly app-sandbox + application-groups, no ATS exception keys; both — the E00-30
          test-code scan re-run on the signed artifacts.
        acceptance:
          - A fixture manifest declaring one permission not in the allowlist fails CI naming the
            permission.
          - A fixture manifest with an exported component that is neither allowlisted nor
            permission-guarded fails CI naming the component.
          - A fixture with cleartextTrafficPermitted="true" or usesCleartextTraffic="true" fails
            CI.
          - The set difference between the release app's entitlements and the allowlist is empty
            in both directions; a fixture with an extra entitlement fails CI.
          - A fixture Info.plist containing NSAllowsLocalNetworking fails CI.
          - Release and debug builds ship identical generated protocol descriptors, and no
            debug/echo/test message or channel exists (AC-11).
          - "Fixtures with allowBackup=\"true\", user trust anchors, a denied permission, a com.apple.security.cs.* entitlement, or a network entitlement on the share extension each fail the release audit."
          - "The E00-30 test-code scan passes on the signed release APK and .app."
        tdd:
