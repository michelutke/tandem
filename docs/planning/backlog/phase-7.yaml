  - id: E73
    title: Manual pairing ADR (F-2.2)
    labels: [area:pairing]
    prd: [F-2.2]
    use_cases: [UC-03]
    summary: |
      Pairing without a camera, deferred to v2+ per the PRD. Gated entirely on an accepted ADR
      that specifies a commitment-based short authentication string (SAS) of at least 6 digits,
      compared on both screens -- explicitly never a raw fingerprint-prefix check, which is the
      exact 32-bit-prefix weakness observed in the LinkMyMac reference (PRD Appendix A).
      Implementation issues are P2 and do not start before the ADR is accepted.
    scope:
      - ADR for the commitment-based SAS scheme.
      - manual-pairing.proto messages, gated on ADR acceptance.
      - Android and macOS implementation, gated on ADR acceptance.
      - mitm-lab coverage for brute-force and downgrade resistance.
    out_of_scope:
      - Any implementation work before the ADR is accepted.
      - Changes to QR pairing (F-2.1, E14) -- manual pairing is a separate, additional method.
    exit_criteria:
      - The ADR is accepted, specifying SAS length, commit-then-reveal ordering, and explicit
        rejection of fingerprint-prefix comparison.
      - If implemented, brute-force and downgrade mitm-lab scenarios both fail closed.
    issues:
      - id: E73-01
        title: "[docs] ADR: manual pairing with commitment-based SAS"
        type: adr
        platforms: [docs]
        priority: P1
        size: M
        prd: [F-2.2]
        use_cases: [UC-03]
        invariants: [3, 5, 6]
        depends_on: [E14-16, E02-05]
        description: |
          Design a commitment-based short authentication string scheme: both sides generate a
          nonce and first exchange SHA-256 commitments to (nonce || context), only then reveal
          the nonces; the SAS is a truncation of HMAC(nonceA||nonceB, "tandem-manual-pair-v1") to
          at least 6 digits, displayed on both screens for the user to compare. The ADR must
          cover replay resistance, downgrade resistance (no silent fallback from QR pairing to a
          weaker check), and the UX of the compare step, and must explicitly reject any
          fingerprint-prefix-only comparison per PRD ADR-004.
        acceptance:
          - The ADR is accepted, specifying an SAS length of at least 6 digits, commit-then-
            reveal ordering, and explicit rejection of fingerprint-prefix comparison as a
            substitute.
          - The ADR states that the commitment context binds both handshake SPKIs, and that
            manual pairing reuses the UC-03 pairing window (120 s, 3 attempts).
        tdd: []
        notes: ""
      - id: E73-02
        title: "[protocol] manual-pairing.proto (P2, gated on E73-01)"
        type: task
        platforms: [protocol]
        priority: P2
        size: M
        prd: [F-2.2]
        use_cases: [UC-03]
        invariants: [3, 6]
        depends_on: [E73-01, E15-01, E15-02]
        description: |
          Commitment{hash}, Reveal{nonce}, ManualPairResult{accepted} messages, implemented only
          if E73-01 is accepted. Vectors: round trip for all three messages; a known nonce pair
          plus SPKIs derives a fixed 6-digit SAS; a Reveal whose nonce does not match its
          Commitment fails verification. Ordering (Reveal before both Commitments) is state
          machine behaviour tested in E73-03/E73-04.
        acceptance:
          - Not started unless E73-01 is accepted.
          - buf lint exits 0 on manual-pairing.proto.
          - protocol/vectors/manual-pairing/*.json pass conformance on both codecs.
        tdd:
          - "ci: manualPairingProto_bufLint_exitsZero"
          - "conformance: manualPairingVector_roundTrip_matchesGoldenBytes"
          - "conformance: manualPairingSasVector_knownNoncesAndSpkis_derivesExpectedSixDigits"
          - "conformance: manualPairingCommitmentVector_revealNotMatchingCommitment_verificationFails"
        notes: ""
      - id: E73-03
        title: "[android] Manual pairing implementation (P2, gated on E73-01)"
        type: task
        platforms: [android]
        priority: P2
        size: L
        prd: [F-2.2]
        use_cases: [UC-03]
        invariants: [3, 5, 6]
        depends_on: [E73-02, E13-02, E12-11]
        description: |
          UI and state machine implementing commit, reveal, SAS compare, and confirm, reusing the
          pairing state-machine patterns from F-2.1 (E14). Not started unless E73-01 is accepted.
          The state machine is tested against `FakeTandemSession` (E12-11); it has no code path
          that compares fingerprints or fingerprint prefixes as a substitute for the SAS.
        acceptance:
          - Pairing completes and pins the peer only after the user confirms the SAS matches on
            both screens.
          - The user reporting a mismatch aborts the pairing without pinning anything.
          - A Reveal received before the peer's Commitment aborts without pinning.
          - A peer Reveal that does not match its Commitment aborts without pinning.
          - A peer offering only a matching fingerprint prefix (no completed commit/reveal) is
            rejected without pinning.
          - Trust store holds exactly one new record with the peer's full SPKI fingerprint after
            success (UC-03).
        tdd:
          - "unit: manualPairing_userConfirmsMatchingSas_pinsExactlyOnePeerRecord"
          - "unit: manualPairing_userReportsMismatch_abortsWithoutPinning"
          - "unit: manualPairing_revealBeforePeerCommitment_abortsWithoutPinning"
          - "unit: manualPairing_revealMismatchesCommitment_abortsWithoutPinning"
          - "unit: manualPairingVerifier_fingerprintPrefixMatchOnly_rejected"
        notes: ""
      - id: E73-04
        title: "[macos] Manual pairing implementation (P2, gated on E73-01)"
        type: task
        platforms: [macos]
        priority: P2
        size: L
        prd: [F-2.2]
        use_cases: [UC-03]
        invariants: [3, 5, 6]
        depends_on: [E73-02, E13-06, E12-12, E14-02]
        description: |
          Mirrors E73-03 for macOS, running inside the E14-02 pairing window (120 s, 3 attempts).
          Not started unless E73-01 is accepted. Tested against the `TandemSession` fake (E12-12).
        acceptance:
          - Pairing completes and pins the peer only after the user confirms the SAS matches on
            both screens.
          - The user reporting a mismatch aborts the pairing without pinning anything and burns
            one window attempt.
          - A Reveal received before the peer's Commitment aborts without pinning.
          - A peer Reveal that does not match its Commitment aborts without pinning.
          - A peer offering only a matching fingerprint prefix is rejected without pinning.
          - Trust store holds exactly one new record with the peer's full SPKI fingerprint after
            success (UC-03).
        tdd:
          - "unit: manualPairing_userConfirmsMatchingSas_pinsExactlyOnePeerRecord"
          - "unit: manualPairing_userReportsMismatch_abortsAndBurnsOneAttempt"
          - "unit: manualPairing_revealBeforePeerCommitment_abortsWithoutPinning"
          - "unit: manualPairing_revealMismatchesCommitment_abortsWithoutPinning"
          - "unit: manualPairingVerifier_fingerprintPrefixMatchOnly_rejected"
        notes: ""
      - id: E73-05
        title: "[tools] mitm-lab: manual pairing brute-force + downgrade scenarios (P2, gated)"
        type: test
        platforms: [tools]
        priority: P2
        size: M
        prd: [F-2.2]
        use_cases: [UC-03, AC-03]
        invariants: [3, 5, 6]
        depends_on: [E73-03, E73-04, E15-08]
        description: |
          mitm-lab scenarios (E15-08 runner) against the real Mac listener: a 6-digit SAS resists
          brute force within the pairing window's 3-attempt limit; a peer that skips the commit
          phase or offers only a fingerprint prefix (the LinkMyMac weakness this ADR exists to
          avoid) is rejected; a QR pairing attempt cannot be downgraded into manual pairing.
        acceptance:
          - After 3 failed attempts the window closes and a 4th attempt is rejected (AC-03).
          - A peer sending Reveal without a prior Commitment is rejected with no pin added.
          - A peer presenting only a matching fingerprint prefix is rejected with no pin added.
          - A manual-pairing message injected into a QR pairing session closes the connection.
        tdd:
          - "security: mitmLabManualPairingBruteForce_fourthAttempt_rejected"
          - "security: mitmLabManualPairing_commitPhaseSkipped_rejectedNoPin"
          - "security: mitmLabManualPairing_fingerprintPrefixOnly_rejectedNoPin"
          - "security: mitmLabManualPairing_messageInQrPairingSession_connectionClosed"
        notes: ""
