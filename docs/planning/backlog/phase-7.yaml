phase: 7
epics:
  - id: E70
    title: Key rotation
    labels: [area:crypto]
    prd: [F-1.3]
    use_cases: [UC-24]
    summary: |
      Replace a device's long-term identity key without re-pairing: over an already-authenticated
      control session, a device sends KeyRotation{newSpki, sigOldKey(newSpki||nonce)}; the peer
      verifies the signature against the currently pinned key, pins the new key, and keeps the
      old one valid for exactly one grace session before purging it. Covers both user-initiated
      and scheduled rotation, failure/rollback handling, and a mitm-lab scenario proving rotation
      over an unauthenticated channel is rejected.
    scope:
      - rotation.proto messages and SPEC.md section.
      - "Android and macOS: initiate rotation (generate + sign), receive + verify + pin with
        grace period."
      - User-initiated rotation UI, scheduled rotation, failure/rollback handling.
      - mitm-lab coverage for rotation over an unauthenticated channel.
    out_of_scope:
      - Initial device identity generation and the first pairing (E10, E14).
      - Manual pairing (E73) -- unrelated mechanism.
    exit_criteria:
      - A user-triggered rotation on either platform completes and both peers pin the new
        fingerprint while the old one is purged after one grace session.
      - A scheduled rotation fires automatically only over an authenticated session and defers
        cleanly when offline.
      - mitm-lab confirms rotation attempted outside an authenticated session is rejected with
        no trust-store change.
    issues:
      - id: E70-01
        title: "[protocol] rotation.proto: KeyRotation, RotationAck, RotationReject"
        type: task
        platforms: [protocol]
        priority: P0
        size: M
        prd: [F-1.3]
        use_cases: [UC-24]
        invariants: [1, 3, 6]
        depends_on: [E01-10, E01-14, E01-16]
        description: |
          protocol/proto/tandem/v1/rotation.proto: KeyRotation{newSpki, nonce,
          sigOldKey(newSpki||nonce)}, RotationAck{}, RotationReject{reason}. Write
          docs/protocol/SPEC.md rotation section covering the grace-session semantics. Vectors: a
          valid rotation signature verifies, a tampered newSpki fails signature verification, a
          replay of an already-applied rotation is rejected.
        acceptance:
          - buf lint passes.
          - protocol/vectors/rotation/*.json pass conformance on both platforms.
        tdd:
          - keyRotationVector_validSignature_verifies
          - keyRotationVector_tamperedNewSpki_signatureVerificationFails
          - keyRotation_replayedAfterAlreadyApplied_rejected
        notes: ""
      - id: E70-02
        title: "[android] Initiate rotation: generate new key + sign with old key"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-1.3]
        use_cases: [UC-24]
        invariants: [1, 3]
        depends_on: [E70-01, E10-01, E10-02, E10-03, E12-11]
        description: |
          Generate a new P-256 keypair in AndroidKeyStore under the same StrongBox/TEE policy as
          the original identity (F-1.1); compute the signature over newSpki||nonce with the
          current private key; send KeyRotation only over an authenticated control session,
          refusing to send otherwise.
        acceptance:
          - Rotation refuses to send when the control session is not a fully authenticated mTLS
            session.
          - A rotation attempt over an authenticated session sends a correctly signed newSpki and
            leaves the old key fully usable until an ack is received.
        tdd:
          - androidRotationInitiator_unauthenticatedSession_refusesToSend
          - androidRotationInitiator_authenticatedSession_sendsSignedNewSpkiKeepsOldKeyUsable
        notes: ""
      - id: E70-03
        title: "[macos] Initiate rotation: generate new key + sign with old key"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-1.3]
        use_cases: [UC-24]
        invariants: [1, 3]
        depends_on: [E70-01, E10-05, E10-06, E10-08, E12-12]
        description: |
          Mirrors E70-02 for macOS: generate a new Keychain-backed P-256 keypair per F-1.1's
          storage policy, sign newSpki||nonce with the current private key, and send only over
          an authenticated control session.
        acceptance:
          - Rotation refuses to send when the control session is not a fully authenticated mTLS
            session.
          - A rotation attempt over an authenticated session sends a correctly signed newSpki and
            leaves the old key fully usable until an ack is received.
        tdd:
          - macRotationInitiator_unauthenticatedSession_refusesToSend
          - macRotationInitiator_authenticatedSession_sendsSignedNewSpkiKeepsOldKeyUsable
        notes: ""
      - id: E70-04
        title: "[android] Receive + verify KeyRotation, pin new key with grace period"
        type: task
        platforms: [android]
        priority: P0
        size: M
        prd: [F-1.3]
        use_cases: [UC-24]
        invariants: [1, 3, 6]
        depends_on: [E70-01, E13-02, E12-11]
        description: |
          Verify the signature against the currently pinned old SPKI; on success, pin newSpki in
          the trust store while retaining the old SPKI flagged grace-only for exactly one
          subsequent session, then purge it. An invalid signature leaves the trust store
          unchanged and returns RotationReject.
        acceptance:
          - A valid rotation pins the new key and retains the old key flagged as grace-only.
          - After one full session completes using either key, the old pin is purged.
          - An invalid signature leaves the trust store completely unchanged.
        tdd:
          - androidRotationReceiver_validSignature_pinsNewKeyKeepsOldAsGrace
          - androidRotationReceiver_afterGraceSessionElapsed_oldPinPurged
          - androidRotationReceiver_invalidSignature_trustStoreUnchanged
        notes: ""
      - id: E70-05
        title: "[macos] Receive + verify KeyRotation, pin new key with grace period"
        type: task
        platforms: [macos]
        priority: P0
        size: M
        prd: [F-1.3]
        use_cases: [UC-24]
        invariants: [1, 3, 6]
        depends_on: [E70-01, E13-06, E12-12]
        description: |
          Mirrors E70-04 for macOS against TandemStore's trust store (E13-06).
        acceptance:
          - A valid rotation pins the new key and retains the old key flagged as grace-only.
          - After one full session completes using either key, the old pin is purged.
          - An invalid signature leaves the trust store completely unchanged.
        tdd:
          - macRotationReceiver_validSignature_pinsNewKeyKeepsOldAsGrace
          - macRotationReceiver_afterGraceSessionElapsed_oldPinPurged
          - macRotationReceiver_invalidSignature_trustStoreUnchanged
        notes: ""
      - id: E70-06
        title: "[cross] User-initiated rotation UI"
        type: story
        platforms: [android, macos]
        priority: P1
        size: M
        prd: [F-1.3]
        use_cases: [UC-24]
        invariants: []
        depends_on: [E70-02, E70-03]
        description: |
          A "rotate this device's key" settings action on both platforms with confirmation,
          progress, and success/failure feedback.
        acceptance:
          - Confirming the action completes a rotation; both peers show the new fingerprint as
            pinned.
        tdd:
          - rotationSettingsViewModel_userConfirms_triggersRotationAndShowsResult
        notes: ""
      - id: E70-07
        title: "[cross] Scheduled rotation"
        type: task
        platforms: [android, macos]
        priority: P1
        size: M
        prd: [F-1.3]
        use_cases: [UC-24]
        invariants: [1]
        depends_on: [E70-02, E70-03]
        description: |
          Periodic rotation on a configurable interval, triggered only while an authenticated
          session is active; deferred when offline past the due date and retried on next
          connect.
        acceptance:
          - A rotation due while offline is deferred and fires automatically on the next
            authenticated session.
          - A rotation due while connected fires automatically without user action.
        tdd:
          - scheduledRotation_dueWhileOffline_deferredUntilNextAuthenticatedSession
          - scheduledRotation_dueWhileConnected_firesAutomatically
        notes: ""
      - id: E70-08
        title: "[cross] Rotation failure and rollback handling"
        type: task
        platforms: [android, macos]
        priority: P0
        size: M
        prd: [F-1.3]
        use_cases: [UC-24]
        invariants: [1, 3]
        depends_on: [E70-04, E70-05]
        description: |
          The initiator must not delete its old key until it receives an explicit RotationAck.
          On ack timeout, retry on the next session using the still-valid old key rather than
          assuming success. An explicit RotationReject aborts the rotation and keeps the old key
          as the sole pin.
        acceptance:
          - A simulated ack timeout leaves the old key fully usable and the rotation is retried
            on the next session.
          - An explicit RotationReject aborts the rotation attempt and keeps the old key as the
            sole pin.
        tdd:
          - rotation_ackTimeout_oldKeyRemainsSolePinAndRetriedNextSession
          - rotation_explicitReject_abortsAndKeepsOldKeyAsSolePin
        notes: ""
      - id: E70-09
        title: "[tools] mitm-lab: rotation over unauthenticated channel rejected"
        type: test
        platforms: [tools]
        priority: P0
        size: S
        prd: [F-1.3]
        use_cases: []
        invariants: [1, 3]
        depends_on: [E70-04, E70-05, E15-08]
        description: |
          Per PRD F-1.3 ("no rotation over unauthenticated channels"), a mitm-lab scenario sends
          KeyRotation before the handshake/pairing completes, or on a connection with no valid
          peer pin.
        acceptance:
          - The scenario confirms a rotation attempted outside an authenticated session is
            rejected and leaves the trust store unchanged.
        tdd:
          - mitmLab_rotationOverUnauthenticatedChannel_rejectedNoTrustStoreChange
        notes: ""

  - id: E71
    title: "Hardening: fuzz campaigns, external SPEC review, release audit"
    labels: [area:security]
    prd: []
    use_cases: [AC-01, AC-02, AC-03, AC-04, AC-05, AC-07]
    summary: |
      Final security hardening pass before release: 24-hour fuzz campaigns per parser target
      with a fix-found-crashes process, an external review of docs/protocol/SPEC.md, and the
      full release security audit -- a full-feature canary pcap-audit run, nmap plus the
      complete mitm-lab suite, an entitlement/manifest review, a dependency/SBOM scan, and
      signed release builds.
    scope:
      - "Fuzz targets: frame parser, Envelope decoder, QR payload parser, and each domain message
        decoder (sms, contacts, calls, media, input, rotation), each run for 24 hours."
      - Fix-found-crashes triage process.
      - External SPEC.md review.
      - "Full release audit: pcap-audit, nmap + mitm-lab, entitlement/manifest review,
        dependency/SBOM scan, release build signing."
    out_of_scope:
      - New feature work of any kind -- this epic only hardens what already exists.
    exit_criteria:
      - Every fuzz target completes a clean 24-hour run with zero unresolved crashes.
      - The full-feature pcap-audit canary run and the complete mitm-lab suite both pass.
      - nmap against the phone shows zero open ports.
      - Release builds are signed for both platforms.
    issues:
      - id: E71-01
        title: "[tools] Fuzz target: frame length-prefix parser (24 h campaign)"
        type: test
        platforms: [tools]
        priority: P0
        size: M
        prd: [F-3.2]
        use_cases: [AC-07]
        invariants: []
        depends_on: [E15-13, E15-14]
        description: |
          Run Jazzer (Kotlin) and libFuzzer (Swift) continuously for 24 hours against the
          length-prefix framing decoder, seeded from protocol/vectors' valid and invalid frame
          cases.
        acceptance:
          - A 24-hour run completes with zero uncaught crashes or hangs.
        tdd:
          - fuzzFrameParser_seedCorpus_harnessRunsCleanly
        notes: ""
      - id: E71-02
        title: "[tools] Fuzz target: Envelope protobuf decoder (24 h campaign)"
        type: test
        platforms: [tools]
        priority: P0
        size: M
        prd: [F-3.2]
        use_cases: [AC-07]
        invariants: []
        depends_on: [E15-13, E15-14]
        description: |
          24-hour Jazzer/libFuzzer campaign against the Envelope decoder, seeded from
          protocol/vectors.
        acceptance:
          - A 24-hour run completes with zero uncaught crashes or hangs.
        tdd:
          - fuzzEnvelopeDecoder_seedCorpus_harnessRunsCleanly
        notes: ""
      - id: E71-03
        title: "[tools] Fuzz target: QR pairing payload parser (24 h campaign)"
        type: test
        platforms: [tools]
        priority: P0
        size: M
        prd: [F-2.1]
        use_cases: [AC-03]
        invariants: [3, 6]
        depends_on: [E15-13, E14-03]
        description: |
          24-hour Jazzer campaign against the Android QR payload parser (E14-03; macOS never parses QR)
          (tandem://pair?v=1&fp=...&s=...&a=...&p=...&n=...), seeded from the base64url QR
          payload vectors.
        acceptance:
          - A 24-hour run completes with zero uncaught crashes or hangs.
        tdd:
          - fuzzQrPayloadParser_seedCorpus_harnessRunsCleanly
        notes: ""
      - id: E71-04
        title: "[tools] Fuzz targets: per-domain message decoders (24 h each)"
        type: test
        platforms: [tools]
        priority: P0
        size: L
        prd: []
        use_cases: [AC-07]
        invariants: []
        depends_on: [E15-13, E15-14, E23-01, E30-01, E31-01, E40-01, E41-01, E50-01, E51-01, E52-01, E60-01, E61-01, E62-01, E70-01]
        description: |
          24-hour Jazzer/libFuzzer campaigns against each domain message decoder introduced after
