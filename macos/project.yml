name: Tandem
options:
  bundleIdPrefix: dev.tandem
  deploymentTarget:
    macOS: "15.0"

packages:
  # E10-07b: identity Keychain access (FileKeychain/KeychainTarget/SecItemKeychainStore) for
  # TandemApp's Debug composition root.
  TandemCrypto:
    path: Packages/TandemCrypto

targets:
  TandemApp:
    type: application
    platform: macOS
    sources:
      - TandemApp
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.tandem.app
    info:
      path: TandemApp/Info.plist
      properties:
        LSUIElement: true
    entitlements:
      path: TandemApp/TandemApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
    dependencies:
      - target: TandemShare
        embed: true
        codeSign: true
      - package: TandemCrypto

  TandemShare:
    type: app-extension
    platform: macOS
    sources:
      - TandemShare
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.tandem.app.Share
    info:
      path: TandemShare/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: TRUEPREDICATE
    entitlements:
      path: TandemShare/TandemShare.entitlements
      properties:
        com.apple.security.app-sandbox: true

  # E00-26: runner for macOS `ui:` tdd entries. Drives TandemApp through its accessibility
  # identifiers; the app under test reads `-UITestScenario <name>` only under `#if DEBUG`.
  TandemUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - TandemUITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.tandem.app.UITests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: TandemApp

schemes:
  Tandem:
    build:
      targets:
        TandemApp: all
        TandemShare: all

  TandemUITests:
    build:
      targets:
        TandemApp: all
        TandemUITests: all
    test:
      targets:
        - TandemUITests
