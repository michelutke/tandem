name: Tandem
options:
  bundleIdPrefix: dev.tandem
  deploymentTarget:
    macOS: "15.0"

packages:
  # E10-07b: identity Keychain access (FileKeychain/KeychainTarget/SecItemKeychainStore) for
  # TandemApp's Debug composition root.
  TandemCrypto:
    path: Packages/TandemCrypto
  # E15-22: DEBUG harness hooks (listener port, trust seeding/clearing).
  TandemTransport:
    path: Packages/TandemTransport
  TandemStore:
    path: Packages/TandemStore
  # E12-13: server session wiring (TandemSession, VersionHandshake) used by the harness hooks.
  # E22-01: MenuBarViewModel maps ConnectionStateMachine.ConnectionState (E12-09); the DEBUG-only
  # scenario seeding also reaches FakeTandemSession (E12-12) via @testable import.
  TandemProtocol:
    path: Packages/TandemProtocol
  # E14-16: PairingCoordinator/PairingWindow/PairConfirmationViewModel, used by the harness hooks.
  TandemPairing:
    path: Packages/TandemPairing
  # E14-26: PairedDevicesViewModel (E14-14), composed here with the real UnpairAction so the
  # Devices screen can actually revoke a phone in production.
  TandemDevices:
    path: Packages/TandemDevices
  # E30-14: NotificationPresentationCoordinator/startNotificationPresentationReader, used by the
  # DEBUG-only notification-latency loopback harness hooks.
  FeatureNotifications:
    path: Packages/FeatureNotifications
  # E41-05: PhotoGridView, composed here under the DEBUG-only photo grid scenario.
  FeatureFiles:
    path: Packages/FeatureFiles

targets:
  TandemApp:
    type: application
    platform: macOS
    sources:
      - TandemApp
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.tandem.app
    info:
      path: TandemApp/Info.plist
      properties:
        LSUIElement: true
        # E21-03: Local Network privacy prompt copy and the Bonjour service this app advertises
        # (_tandem._tcp, E21-02) -- both required for the Local Network permission prompt to show
        # the right copy and for NetService/NWListener publish to succeed once granted.
        NSLocalNetworkUsageDescription: "Tandem needs Local Network access so your phone can find this Mac."
        NSBonjourServices:
          - _tandem._tcp
    entitlements:
      path: TandemApp/TandemApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.dev.tandem]
    dependencies:
      - target: TandemShare
        embed: true
        codeSign: true
      - package: TandemCrypto
      - package: TandemTransport
      - package: TandemStore
      - package: TandemProtocol
      - package: TandemPairing
      - package: TandemDevices
      - package: FeatureNotifications
      - package: FeatureFiles

  TandemShare:
    type: app-extension
    platform: macOS
    sources:
      - TandemShare
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.tandem.app.Share
    info:
      path: TandemShare/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
    entitlements:
      path: TandemShare/TandemShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.dev.tandem]
    dependencies:
      - package: FeatureFiles

  # Hosted unit-test bundle for TandemApp's own types (ErrorPresenter, MenuBarViewModel): Swift
  # Testing (`import Testing`) cannot be imported from a `bundle.ui-testing` target at all
  # (confirmed against this toolchain -- "_Testing_Unavailable"; matches the Swift Forums report
  # that UI test bundles and Swift Testing are currently incompatible), so `unit:` tdd entries for
  # TandemApp-hosted types live here, never in `TandemUITests`.
  TandemAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TandemAppTests
      # E22-07: ManualTestClock (E00-24) as a single source file, not a `package: TandemTestSupport`
      # dependency -- that package's own graph (TandemTransport -> TandemCrypto -> swift-certificates
      # X509, whose target also references swift-crypto's Linux-only `Crypto` product via
      # `condition: .when(platforms: [.linux])`) hits a reproducible Xcode SwiftPM-integration eager-
      # linking bug once pulled into this *test bundle's* own PackageFrameworks build (confirmed:
      # baseline `TandemAppTests` scheme passes; adding `package: TandemTestSupport` here alone makes
      # `xcodebuild test` fail linking X509 against a `Crypto_..._PackageProduct.framework` that was
      # never built for macOS). This is the exact same file `ManualTestClock.swift` every other
      # `unit:` test in this repo imports via `TandemTestSupport` -- never copied or reimplemented.
      - path: Packages/TandemTestSupport/Sources/TandemTestSupport/ManualTestClock.swift
        group: TandemAppTests
      # E22-08: same `package: TandemTestSupport` linking-bug workaround as ManualTestClock above --
      # FakeSystemPowerEvents/FakeNetworkPathSource (E20-10/E20-11's own seams, shared with
      # SleepWakeControllerTests/PathChangeControllerTests via TandemTestSupport) compiled directly
      # from their canonical TandemTestSupport source file rather than via the package dependency.
      - path: Packages/TandemTestSupport/Sources/TandemTestSupport/SystemPowerEventsAndNetworkPathFakes.swift
        group: TandemAppTests
      # E15-16: same `package: TandemTestSupport` linking-bug workaround -- the in-memory byte-stream
      # pair (E00-25) the real-session version-mismatch test drives, compiled from its canonical file.
      - path: Packages/TandemTestSupport/Sources/TandemTestSupport/InMemoryConnectionPair.swift
        group: TandemAppTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.tandem.app.Tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: TandemApp

  # E00-26: runner for macOS `ui:` tdd entries. Drives TandemApp through its accessibility
  # identifiers; the app under test reads `-UITestScenario <name>` only under `#if DEBUG`.
  TandemUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - TandemUITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.tandem.app.UITests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: TandemApp
      - package: TandemProtocol

schemes:
  Tandem:
    build:
      targets:
        TandemApp: all
        TandemShare: all

  TandemAppTests:
    build:
      targets:
        TandemApp: all
        TandemAppTests: all
    test:
      targets:
        - TandemAppTests

  TandemUITests:
    build:
      targets:
        TandemApp: all
        TandemUITests: all
    test:
      targets:
        - TandemUITests
