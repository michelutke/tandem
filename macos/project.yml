name: Tandem
options:
  bundleIdPrefix: dev.tandem
  deploymentTarget:
    macOS: "15.0"

packages:
  # E10-07b: identity Keychain access (FileKeychain/KeychainTarget/SecItemKeychainStore) for
  # TandemApp's Debug composition root.
  TandemCrypto:
    path: Packages/TandemCrypto
  # E15-22: DEBUG harness hooks (listener port, trust seeding/clearing).
  TandemTransport:
    path: Packages/TandemTransport
  TandemStore:
    path: Packages/TandemStore
  # E12-13: server session wiring (TandemSession, VersionHandshake) used by the harness hooks.
  # E22-01: MenuBarViewModel maps ConnectionStateMachine.ConnectionState (E12-09); the DEBUG-only
  # scenario seeding also reaches FakeTandemSession (E12-12) via @testable import.
  TandemProtocol:
    path: Packages/TandemProtocol

targets:
  TandemApp:
    type: application
    platform: macOS
    sources:
      - TandemApp
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.tandem.app
    info:
      path: TandemApp/Info.plist
      properties:
        LSUIElement: true
    entitlements:
      path: TandemApp/TandemApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
    dependencies:
      - target: TandemShare
        embed: true
        codeSign: true
      - package: TandemCrypto
      - package: TandemTransport
      - package: TandemStore
      - package: TandemProtocol

  TandemShare:
    type: app-extension
    platform: macOS
    sources:
      - TandemShare
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.tandem.app.Share
    info:
      path: TandemShare/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: TRUEPREDICATE
    entitlements:
      path: TandemShare/TandemShare.entitlements
      properties:
        com.apple.security.app-sandbox: true

  # Hosted unit-test bundle for TandemApp's own types (ErrorPresenter, MenuBarViewModel): Swift
  # Testing (`import Testing`) cannot be imported from a `bundle.ui-testing` target at all
  # (confirmed against this toolchain -- "_Testing_Unavailable"; matches the Swift Forums report
  # that UI test bundles and Swift Testing are currently incompatible), so `unit:` tdd entries for
  # TandemApp-hosted types live here, never in `TandemUITests`.
  TandemAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TandemAppTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.tandem.app.Tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: TandemApp

  # E00-26: runner for macOS `ui:` tdd entries. Drives TandemApp through its accessibility
  # identifiers; the app under test reads `-UITestScenario <name>` only under `#if DEBUG`.
  TandemUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - TandemUITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.tandem.app.UITests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: TandemApp
      - package: TandemProtocol

schemes:
  Tandem:
    build:
      targets:
        TandemApp: all
        TandemShare: all

  TandemAppTests:
    build:
      targets:
        TandemApp: all
        TandemAppTests: all
    test:
      targets:
        - TandemAppTests

  TandemUITests:
    build:
      targets:
        TandemApp: all
        TandemUITests: all
    test:
      targets:
        - TandemUITests
