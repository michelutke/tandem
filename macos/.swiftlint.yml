excluded:
  - Packages/*/.build
  - .build
  - DerivedData
  - "**/*.pb.swift"

opt_in_rules:
  - force_unwrapping

custom_rules:
  injected_clock_only:
    included: ".*\\.swift"
    excluded: ".*/Packages/TandemTestSupport/.*|.*/TandemApp/.*"
    name: "Injected Clock Only"
    message: "Take an injected `any Clock<Duration>` and `DateProvider` via init instead of calling Date()/Date.now/Task.sleep directly (E00-24)."
    regex: "(\\bDate\\(\\)|\\bDate\\.now\\b|\\bTask\\.sleep\\()"
    severity: error
  key_material_only_in_crypto:
    included: ".*\\.swift"
    excluded: ".*/Packages/TandemCrypto/.*|.*/Packages/TandemTestSupport/.*"
    name: "Key Material Only In Crypto"
    message: "Only TandemCrypto (and its TandemTestSupport fakes) may reference SecKey*/SecItem* or compute HMAC-SHA256 directly -- reach the Keychain through the KeychainStore protocol instead (E10-14)."
    regex: "(\\bSecKey\\w*|\\bSecItem\\w*|HMAC<SHA256>)"
    severity: error

reporter: "xcode"
